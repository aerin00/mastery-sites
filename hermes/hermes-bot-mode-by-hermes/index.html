    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem(SITE.key+'-theme',next); }catch(e){}
  });
})();

/* ---- chrome built from SITE ---- */
document.title = SITE.title;
$('#brandname').textContent = SITE.title;
$('#brandtag').textContent  = SITE.tag;
if(typeof AUDIT === 'undefined') $('.modes button[data-mode="audit"]').remove();
$('#legend').innerHTML = '<h4>'+SITE.spine+'</h4>' + SITE.layers.map(l =>
  '<div class="row"><span class="swatch" style="background:var(--'+l.token+')"></span>'+l.label+'</div>').join('');

/* ---- routing ---- */
let mode='learn', current=PHASES[0].id;

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  render();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{ $('#q').value=''; setMode(b.dataset.mode); }));
$('#reset').addEventListener('click',()=>{
  if(!confirm('Clear all phase progress?')) return;
  state={}; store.set(state); render(); buildRail();
});

/* ---- rail ---- */
function buildRail(){
  const nav=$('#pnav'); nav.innerHTML='';
  PHASES.forEach(p=>{
    const a=el('a',p.id===current&&mode==='learn'?'on':'');
    a.href='#'+p.id;
    const cls = phaseDone(p)?'tick done':(phasePart(p)?'tick part':'tick');
    a.innerHTML='<span class="n">'+p.n+'</span><span>'+p.title+'</span><span class="'+cls+'">✓</span>';
    a.addEventListener('click',e=>{ e.preventDefault(); current=p.id; if(mode!=='learn') setMode('learn'); else render(); buildRail(); window.scrollTo({top:0,behavior:'smooth'}); });
    nav.appendChild(a);
  });
}

/* ---- render pieces ---- */
function codeBlock(src){
  const w=el('div','codewrap');
  const pre=el('pre','',  '<code>'+esc(src)+'</code>');
  const btn=el('button','copy','copy');
  btn.addEventListener('click',()=>{
    navigator.clipboard.writeText(src).then(()=>{
      btn.textContent='copied'; btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('done'); },1400);
    }).catch(()=>{ btn.textContent='select it'; });
  });
  w.appendChild(pre); w.appendChild(btn);
  return w;
}
function tableBlock(t){
  const w=el('div','tablewrap');
  let h='<table><thead><tr>'+t.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  h+=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  h+='</tbody></table>';
  w.innerHTML=h;
  return w;
}
function sec(label,count){
  const h=el('h2','sec',label+(count!=null?' <span class="cnt">'+count+'</span>':''));
  return h;
}

/* ---- learn view ---- */
function renderPhase(p){
  const v=$('#view'); v.innerHTML='';

  // progress strip
  const totalUnits = PHASES.reduce((a,x)=>a+1+x.quiz.length,0);
  const doneUnits  = PHASES.reduce((a,x)=>a+(doneLab(x.id)?1:0)+x.quiz.filter((_,i)=>doneQ(x.id,i)).length,0);
  const pct = Math.round(doneUnits/totalUnits*100);
  const pr=el('div','prog');
  pr.innerHTML='<div class="top"><span class="lbl">Path progress</span><span class="pct">'+pct+'%</span></div>'+
    '<div class="bar">'+PHASES.map(x=>'<i class="'+(phaseDone(x)?'done':(phasePart(x)?'part':''))+'"></i>').join('')+'</div>';
  v.appendChild(pr);

  const head=el('div');
  head.innerHTML='<div class="eyebrow">Phase '+p.n+' · '+p.layerLabel+' layer</div><h1 class="ptitle">'+p.title+'</h1>'+
    '<div class="meta"><span class="chip '+p.layer+'">'+p.layerLabel+'</span>'+
    '<span class="chip">'+p.time+'</span><span class="chip">prereq: '+p.pre+'</span></div>';
  v.appendChild(head);
  v.appendChild(el('div','objective',p.objective));

  v.appendChild(sec('Concepts',p.concepts.length));
  p.concepts.forEach(c=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',c.h));
    if(c.p) d.insertAdjacentHTML('beforeend',c.p);
    if(c.table) d.appendChild(tableBlock(c.table));
    if(c.code) d.appendChild(codeBlock(c.code));
    if(c.p2) d.insertAdjacentHTML('beforeend',c.p2);
    if(c.code2) d.appendChild(codeBlock(c.code2));
    v.appendChild(d);
  });

  v.appendChild(sec('Lab'));
  const lab=el('div','lab');
  lab.innerHTML='<h3>'+p.lab.title+'</h3><ol>'+p.lab.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
    '<p style="margin:14px 0 0"><b>Done when:</b> '+p.lab.verify+'</p>';
  const dl=el('div','done-line');
  const cb=el('input'); cb.type='checkbox'; cb.id='lab-'+p.id; cb.checked=doneLab(p.id);
  cb.addEventListener('change',()=>{ state['lab:'+p.id]=cb.checked; store.set(state); buildRail(); renderPhase(p); });
  const lb=el('label'); lb.htmlFor=cb.id; lb.appendChild(cb); lb.appendChild(document.createTextNode('Lab complete'));
  dl.appendChild(lb); lab.appendChild(dl);
  v.appendChild(lab);

  v.appendChild(sec('Gotchas',p.gotchas.length));
  p.gotchas.forEach(g=>{
    const d=el('div','gotcha');
    d.innerHTML='<span class="sev '+g.s+'">'+g.s+'</span><span><b>'+g.t+'</b>'+g.d+'</span>';
    v.appendChild(d);
  });

  v.appendChild(sec('Checkpoint',p.quiz.length));
  p.quiz.forEach((q,i)=>{
    const d=el('details','qa');
    d.innerHTML='<summary>'+q.q+'</summary><div class="ans">'+q.a+
      '<div class="done-line" style="border-top-color:var(--line)"><label style="color:var(--muted)">'+
      '<input type="checkbox" '+(doneQ(p.id,i)?'checked':'')+'> I could answer this without looking</label></div></div>';
    d.querySelector('input').addEventListener('change',e=>{
      state['q:'+p.id+':'+i]=e.target.checked; store.set(state); buildRail();
      const strip=$('.prog'); if(strip) renderPhase(p);
    });
    v.appendChild(d);
  });

  if(p.docs&&p.docs.length){
    v.appendChild(sec('Source docs'));
    const dd=el('div','docs');
    dd.innerHTML=p.docs.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' ↗</a>').join('');
    v.appendChild(dd);
  }

  const idx=PHASES.indexOf(p);
  const navd=el('div','done-line'); navd.style.borderTop='1px solid var(--line)'; navd.style.marginTop='40px';
  if(idx>0){ const b=el('button','btn','← '+PHASES[idx-1].title); b.onclick=()=>{current=PHASES[idx-1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  if(idx<PHASES.length-1){ const b=el('button','btn prime',PHASES[idx+1].title+' →'); b.onclick=()=>{current=PHASES[idx+1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  v.appendChild(navd);
}

/* ---- reference view ---- */
function renderRef(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Reference</div><h1 class="ptitle">Lookup and decisions</h1>'+
    '<p class="lede">'+SITE.refLede+'</p>';

  v.appendChild(sec('Decision trees',TREES.length));
  TREES.forEach(t=>{
    v.appendChild(el('h3','',t.title));
    const wrap=el('div','tree');
    t.rows.forEach(r=>{
      const b=el('div','branch');
      b.innerHTML='<span class="cond">'+r[0]+'</span><span class="arr">→</span><span class="res">'+r[1]+'<em>'+r[2]+'</em></span>';
      wrap.appendChild(b);
    });
    v.appendChild(wrap);
  });

  v.appendChild(sec('Tables',REF.length));
  REF.forEach(r=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',r.title));
    if(r.note) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin:2px 0 0">'+r.note+'</p>');
    d.appendChild(tableBlock(r));
    if(r.foot) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:8px">'+r.foot+'</p>');
    v.appendChild(d);
  });
}

/* ---- drill view ---- */
let deck=[], di=0, revealed=false;
function buildDeck(){
  deck=[];
  PHASES.forEach(p=>p.quiz.forEach(q=>deck.push({q:q.q,a:q.a,src:'Phase '+p.n+' · '+p.title,pid:p.id})));
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  di=0; revealed=false;
}
function renderDrill(){
  const v=$('#view'); v.innerHTML='';
  if(!deck.length) buildDeck();
  v.innerHTML='<div class="eyebrow">Drill</div><h1 class="ptitle">Recall, not recognition</h1>'+
    '<p class="lede">'+deck.length+' cards drawn from every phase checkpoint. Answer out loud before you flip; the gap between "that looks familiar" and "I can state it" is the entire point.</p>';
  const c=deck[di];
  const card=el('div','flash');
  card.innerHTML='<div class="fsrc">'+c.src+'</div><div class="fq">'+c.q+'</div>'+
    '<div class="fa'+(revealed?'':' hide')+'">'+c.a+'</div>';
  v.appendChild(card);
  const btns=el('div','fbtns');
  const flip=el('button','btn prime',revealed?'Hide answer':'Reveal answer');
  flip.onclick=()=>{ revealed=!revealed; renderDrill(); };
  const next=el('button','btn','Next card →');
  next.onclick=()=>{ di=(di+1)%deck.length; revealed=false; renderDrill(); };
  const goto=el('button','btn','Go to phase');
  goto.onclick=()=>{ current=c.pid; setMode('learn'); buildRail(); scrollTo({top:0}); };
  const shuf=el('button','btn','Shuffle');
  shuf.onclick=()=>{ buildDeck(); renderDrill(); };
  btns.appendChild(flip); btns.appendChild(next); btns.appendChild(goto); btns.appendChild(shuf);
  btns.appendChild(el('span','counter',(di+1)+' / '+deck.length));
  v.appendChild(btns);
  v.appendChild(el('p','cap','Keyboard: <kbd>space</kbd> flip · <kbd>→</kbd> next'));
}

/* ---- audit view ---- */
function renderAudit(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Audit</div><h1 class="ptitle">'+SITE.auditTitle+'</h1>'+
    '<p class="lede">'+AUDIT.intro+'</p>';
  AUDIT.groups.forEach(g=>{
    v.appendChild(sec(g.label,g.items.length));
    g.items.forEach(it=>{
      const d=el('div','verdict');
      d.innerHTML='<span class="vtag '+g.tag+'">'+g.tag+'</span><span><span class="claim">'+it.c+'</span><span class="fix">'+it.f+'</span></span>';
      v.appendChild(d);
    });
  });
  v.insertAdjacentHTML('beforeend','<hr class="hr"><p class="cap" style="margin-top:18px">'+SITE.verifiedAgainst+' Claims I could not confirm are marked <span class="unv">unverified</span> rather than restated as fact.</p>');
}

/* ---- search ---- */
function buildIndex(){
  const ix=[];
  PHASES.forEach(p=>{
    ix.push({t:'Phase '+p.n+': '+p.title,k:'phase',body:p.objective+' '+p.concepts.map(c=>c.h).join(' '),go:()=>{current=p.id;setMode('learn');buildRail();}});
    p.concepts.forEach(c=>ix.push({t:c.h,k:'Phase '+p.n,body:(c.p||'')+(c.p2||'')+(c.code||'')+(c.code2||''),go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.gotchas.forEach(g=>ix.push({t:g.t,k:'gotcha · Phase '+p.n,body:g.d,go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.quiz.forEach(q=>ix.push({t:q.q,k:'checkpoint · Phase '+p.n,body:q.a,go:()=>{current=p.id;setMode('learn');buildRail();}}));
  });
  REF.forEach(r=>ix.push({t:r.title,k:'reference table',body:(r.note||'')+' '+r.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  TREES.forEach(t=>ix.push({t:t.title,k:'decision tree',body:t.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  if(typeof AUDIT!=='undefined') AUDIT.groups.forEach(g=>g.items.forEach(i=>ix.push({t:i.c.replace(/<[^>]+>/g,''),k:'audit · '+g.label,body:i.f,go:()=>setMode('audit')})));
  return ix;
}
let INDEX=[];
function renderSearch(term){
  const v=$('#view'); v.innerHTML='';
  const t=term.toLowerCase();
  const hits=INDEX.filter(x=>(x.t+' '+x.body).toLowerCase().replace(/<[^>]+>/g,'').includes(t)).slice(0,40);
  v.innerHTML='<div class="eyebrow">Search</div><h1 class="ptitle">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(term)+'”</h1>';
  if(!hits.length){ v.appendChild(el('p','empty','Nothing matched. Try a config key, a command, or a frontmatter field.')); return; }
  const w=el('div','hits');
  hits.forEach(h=>{
    const a=el('a','hit'); a.href='#';
    a.innerHTML='<small>'+h.k+'</small><b>'+h.t+'</b>';
    a.addEventListener('click',e=>{ e.preventDefault(); $('#q').value=''; h.go(); scrollTo({top:0}); });
    w.appendChild(a);
  });
  v.appendChild(w);
}

/* ---- main render ---- */
function render(){
  const term=$('#q').value.trim();
  if(term.length>1){ renderSearch(term); return; }
  if(mode==='learn') renderPhase(PHASES.find(p=>p.id===current));
  else if(mode==='ref') renderRef();
  else if(mode==='drill') renderDrill();
  else if(typeof AUDIT!=='undefined') renderAudit(); else renderRef();
}

$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'&&document.activeElement===$('#q')){ $('#q').value=''; $('#q').blur(); render(); }
  if(mode==='drill'&&document.activeElement!==$('#q')){
    if(e.key===' '){ e.preventDefault(); revealed=!revealed; renderDrill(); }
    if(e.key==='ArrowRight'){ di=(di+1)%deck.length; revealed=false; renderDrill(); }
  }
});

INDEX=buildIndex();
buildRail();
render();

</script>
</body>
</html>
