<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes Creates Bot Fleet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- three type roles. Google Fonts is the only external request this page
     makes; every face has a real fallback stack so it renders offline too. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<style>
/* =====================================================================
   TOKENS: light palette lives on the bare :root.
   Palette chosen per subject below.
   Derive them from the subject's own world. Keep neutrals biased
   toward the accent hue. Everything else in this file is structural
   and should carry over unchanged.
   ===================================================================== */
:root{
  /* grounds: warm-grey paper biased toward the circuit-violet accent */
  --bg:#EFEDF4; --paper:#FAF9FC; --raise:#FFFFFF;
  --ink:#16141F; --body:#292637; --muted:#5F5A72; --faint:#88809B;
  --line:#D9D5E3; --line-2:#C3BDD3;
  /* structural accent: PCB trace violet */
  --accent:#5A3FB0; --accent-soft:#E9E3F8; --accent-ink:#46308B;
  /* signal: hermes-brand orange */
  --signal:#C75A11; --signal-soft:#F9E6D8;
  --ok:#3E7C2C; --ok-soft:#E3EFDD;
  --warn:#96690A; --warn-soft:#F6EBD2;
  --stop:#A62D24; --stop-soft:#F7DFDC;
  --code-bg:#151221; --code-ink:#DED9EC; --code-line:#2A2540;
  --shadow:0 1px 2px rgba(22,20,31,.05), 0 8px 24px -12px rgba(22,20,31,.15);
  --rail:264px;
  /* type: control-panel techno display, legible body, terminal mono */
  --f-disp:'Chakra Petch','Helvetica Neue',Arial,sans-serif;
  --f-body:'Atkinson Hyperlegible','Iowan Old Style',Georgia,serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#100E18; --paper:#171522; --raise:#1E1B2C;
    --ink:#EAE7F2; --body:#CFCADB; --muted:#9A93AE; --faint:#78718D;
    --line:#272336; --line-2:#353048;
    --accent:#9D86EC; --accent-soft:#251E42; --accent-ink:#BCABF2;
    --signal:#F09352; --signal-soft:#3A2113;
    --ok:#7EC566; --ok-soft:#1B2E16;
    --warn:#E0AE4B; --warn-soft:#332713;
    --stop:#E8776B; --stop-soft:#371815;
    --code-bg:#0B0913; --code-ink:#D4CFE4; --code-line:#1E1A2E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#100E18; --paper:#171522; --raise:#1E1B2C;
  --ink:#EAE7F2; --body:#CFCADB; --muted:#9A93AE; --faint:#78718D;
  --line:#272336; --line-2:#353048;
  --accent:#9D86EC; --accent-soft:#251E42; --accent-ink:#BCABF2;
  --signal:#F09352; --signal-soft:#3A2113;
  --ok:#7EC566; --ok-soft:#1B2E16;
  --warn:#E0AE4B; --warn-soft:#332713;
  --stop:#E8776B; --stop-soft:#371815;
  --code-bg:#0B0913; --code-ink:#D4CFE4; --code-line:#1E1A2E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); color:var(--ink); text-wrap:balance; margin:0; letter-spacing:-.015em}
a{color:var(--accent-ink); text-underline-offset:3px}
code,kbd{font-family:var(--f-mono); font-size:.855em}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:9px 18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--f-disp); font-weight:700;
  font-size:15px; color:var(--ink); letter-spacing:-.02em; white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--signal);display:inline-block;transform:translateY(-1px)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.modes{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:2px}
.modes button{
  font-family:var(--f-disp); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  border:0; background:transparent; color:var(--muted); padding:5px 11px; border-radius:5px; cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{flex:1}
#q{
  font-family:var(--f-mono); font-size:12.5px; padding:6px 10px; width:min(300px,42vw);
  border:1px solid var(--line-2); border-radius:7px; background:var(--raise); color:var(--ink);
}
#q::placeholder{color:var(--faint)}
.iconbtn{border:1px solid var(--line-2); background:var(--raise); color:var(--muted); border-radius:7px;
  padding:5px 9px; cursor:pointer; font-family:var(--f-mono); font-size:12px}
.iconbtn:hover{color:var(--ink); border-color:var(--accent)}

.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:1fr} }

/* ---------- rail ---------- */
.rail{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--paper); padding:16px 12px 40px;
}
@media (max-width:900px){
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; scrollbar-width:thin}
  .railhead,.legend{display:none}
}
.railhead{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 8px}
.pnav{display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .pnav{flex-direction:row; gap:6px} }
.pnav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  text-decoration:none; color:var(--body); font-family:var(--f-disp); font-size:13.5px;
  font-weight:500; line-height:1.25; border:1px solid transparent; white-space:nowrap;
}
.pnav a:hover{background:var(--bg)}
.pnav a.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.pnav .n{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); width:16px; flex:none}
.pnav a.on .n{color:var(--accent)}
.pnav .tick{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-left:auto;
  display:grid;place-items:center;font-size:8px;color:transparent}
.pnav .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pnav .tick.part{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}

.legend{margin-top:22px; padding:11px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg)}
.legend h4{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin-bottom:8px}
.legend .row{display:flex; align-items:center; gap:8px; font-size:12px; font-family:var(--f-disp); padding:2.5px 0; color:var(--muted)}
.swatch{width:16px;height:4px;border-radius:2px;flex:none}

/* ---------- main ---------- */
main{padding:28px 30px 96px; max-width:1080px; min-width:0}
@media (max-width:640px){ main{padding:22px 16px 72px} }
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--signal)}
.ptitle{font-size:clamp(28px,4.4vw,40px); font-weight:700; line-height:1.06; margin:7px 0 0}
.meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px}
.chip{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; padding:3px 8px; border-radius:20px;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper); text-transform:uppercase}
.chip.l2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.l3{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}
.chip.l1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.l4{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}

.objective{
  margin:24px 0 0; padding:16px 18px; border-left:3px solid var(--signal);
  background:var(--paper); border-radius:0 9px 9px 0; font-size:17.5px; line-height:1.5; color:var(--ink);
}
.objective b{font-weight:600}

h2.sec{
  font-size:12px; font-family:var(--f-mono); font-weight:500; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); margin:42px 0 0; padding-bottom:7px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px;
}
h2.sec .cnt{color:var(--line-2); font-size:11px}

.concept{padding:19px 0; border-bottom:1px solid var(--line)}
.concept:last-child{border-bottom:0}
.concept h3{font-size:18.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.01em}
.concept p{margin:0 0 9px; max-width:66ch}
.concept p:last-child{margin-bottom:0}
.concept ul{margin:9px 0; padding-left:19px; max-width:66ch}
.concept li{margin:4px 0}
.concept .k{font-family:var(--f-mono); font-size:.85em; background:var(--accent-soft); color:var(--accent-ink);
  padding:1px 5px; border-radius:4px; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}

pre{
  margin:12px 0; background:var(--code-bg); color:var(--code-ink); border:1px solid var(--code-line);
  border-radius:9px; padding:13px 15px; overflow-x:auto; font-family:var(--f-mono);
  font-size:12.6px; line-height:1.65; position:relative;
}
pre code{font-size:inherit; color:inherit; background:none}
.codewrap{position:relative}
.copy{position:absolute; top:8px; right:8px; z-index:2; font-family:var(--f-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:5px; cursor:pointer;
  background:rgba(255,255,255,.07); color:#9FB5B0; border:1px solid rgba(255,255,255,.13)}
.copy:hover{background:rgba(255,255,255,.15); color:#fff}
.copy.done{background:var(--ok); color:#fff; border-color:var(--ok)}
.cap{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin:-4px 0 0}

.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
table{border-collapse:collapse; width:100%; font-family:var(--f-disp); font-size:13.4px; min-width:480px}
th{text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; padding:9px 13px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
td code{background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--line)}
td.num{font-variant-numeric:tabular-nums}

.gotcha{display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; padding:13px 0; border-bottom:1px solid var(--line)}
.gotcha:last-child{border-bottom:0}
.sev{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; height:fit-content; white-space:nowrap; margin-top:2px}
.sev.trap{background:var(--stop-soft); color:var(--stop)}
.sev.cost{background:var(--warn-soft); color:var(--warn)}
.sev.stale{background:var(--signal-soft); color:var(--signal)}
.sev.ok{background:var(--ok-soft); color:var(--ok)}
.gotcha b{font-family:var(--f-disp); font-weight:600; color:var(--ink); display:block; font-size:14.5px; margin-bottom:2px}
.gotcha span{font-size:15px}

.lab{margin:14px 0 0; padding:18px 20px; border:1px solid var(--accent); border-radius:11px;
  background:var(--accent-soft)}
.lab h3{font-size:17px; margin-bottom:4px; color:var(--accent-ink)}
.lab ol{margin:11px 0 0; padding-left:20px}
.lab li{margin:6px 0}
.lab .pre-in-lab pre{background:var(--code-bg)}
.done-line{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:14px; border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.done-line label{font-family:var(--f-disp); font-size:14px; font-weight:600; color:var(--accent-ink); cursor:pointer;
  display:flex; align-items:center; gap:8px}
.done-line input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

details.qa{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:var(--paper); overflow:hidden}
details.qa summary{padding:11px 15px; cursor:pointer; font-family:var(--f-disp); font-weight:600; font-size:14.5px;
  color:var(--ink); list-style:none; display:flex; gap:9px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:'?'; font-family:var(--f-mono); color:var(--signal); font-size:12px; flex:none}
details.qa[open] summary::before{content:'!'}
details.qa .ans{padding:0 15px 13px 33px; font-size:15px; color:var(--body); border-top:1px solid var(--line); padding-top:11px}

.tree{margin:14px 0; display:flex; flex-direction:column; gap:0}
.branch{display:grid; grid-template-columns:minmax(140px,.9fr) auto minmax(0,1.4fr); gap:12px; align-items:center;
  padding:11px 14px; border:1px solid var(--line); border-top:0; background:var(--paper)}
.branch:first-child{border-top:1px solid var(--line); border-radius:9px 9px 0 0}
.branch:last-child{border-radius:0 0 9px 9px}
.branch .cond{font-family:var(--f-body); font-size:14.5px; color:var(--body)}
.branch .arr{font-family:var(--f-mono); color:var(--line-2); font-size:13px}
.branch .res{font-family:var(--f-disp); font-weight:600; font-size:14px; color:var(--ink)}
.branch .res em{display:block; font-family:var(--f-body); font-weight:400; font-style:normal; font-size:13.5px; color:var(--muted)}
@media (max-width:640px){ .branch{grid-template-columns:1fr; gap:5px} .branch .arr{display:none} }

.docs{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.docs a{font-family:var(--f-mono); font-size:11.5px; padding:4px 10px; border-radius:20px; text-decoration:none;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper)}
.docs a:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}

/* progress header */
.prog{margin:0 0 26px; padding:15px 18px; border:1px solid var(--line); border-radius:11px; background:var(--paper)}
.prog .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.prog .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.prog .pct{font-family:var(--f-disp); font-size:26px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.bar{display:flex; gap:3px; margin-top:11px}
.bar i{height:7px; flex:1; border-radius:2px; background:var(--line); transition:background .25s}
.bar i.done{background:var(--ok)}
.bar i.part{background:var(--signal)}

/* reference / drill / audit */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:14px 0}
.card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--paper)}
.card h4{font-size:15px; font-weight:600; margin-bottom:5px}
.card p{margin:0; font-size:14.5px; color:var(--muted)}

#drill .flash{
  border:1px solid var(--line-2); border-radius:14px; background:var(--paper); padding:34px 30px;
  min-height:220px; display:flex; flex-direction:column; justify-content:center; gap:16px; box-shadow:var(--shadow);
}
#drill .fq{font-family:var(--f-disp); font-size:clamp(19px,2.6vw,25px); font-weight:600; color:var(--ink); line-height:1.3}
#drill .fa{font-size:16.5px; color:var(--body); border-top:1px solid var(--line); padding-top:15px}
#drill .fa.hide{display:none}
#drill .fsrc{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
#drill .fbtns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font-family:var(--f-disp); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink)}
.btn.prime{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.prime:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--accent)}
.counter{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); align-self:center; margin-left:auto}

.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; padding:15px 0; border-bottom:1px solid var(--line)}
.verdict:last-child{border-bottom:0}
.vtag{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:4px 8px;
  border-radius:5px; height:fit-content; white-space:nowrap; margin-top:2px; font-weight:700}
.vtag.holds{background:var(--ok-soft); color:var(--ok)}
.vtag.stale{background:var(--warn-soft); color:var(--warn)}
.vtag.wrong{background:var(--stop-soft); color:var(--stop)}
.vtag.gap{background:var(--signal-soft); color:var(--signal)}
.vtag.unver{background:var(--bg); color:var(--muted); border:1px solid var(--line-2)}
.verdict .claim{font-family:var(--f-disp); font-weight:600; font-size:15px; color:var(--ink); margin-bottom:4px}
.verdict .fix{font-size:15px}

.hits{margin-top:6px}
.hit{display:block; padding:11px 14px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px;
  background:var(--paper); text-decoration:none; color:var(--body)}
.hit:hover{border-color:var(--accent); background:var(--accent-soft)}
.hit b{display:block; font-family:var(--f-disp); color:var(--ink); font-size:14.5px}
.hit small{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.empty{color:var(--muted); font-style:italic; padding:20px 0}
.lede{font-size:17.5px; max-width:66ch; color:var(--body); margin:14px 0 0}
.hr{height:1px;background:var(--line);margin:38px 0 0;border:0}
.unv{font-family:var(--f-mono);font-size:.86em;color:var(--muted);background:var(--bg);
  border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px;white-space:normal}
kbd{background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-size:.82em;color:var(--muted)}
.lede a{color:var(--accent-ink)}
.verdict .claim{display:block}
#view > h3{margin-top:28px; font-size:19px}


</style>
</head>
<body>

<!-- ============================ SHELL ============================
     Structural. Carries over unchanged between sites; SITE fills it in.
     ============================================================== -->
<div class="topbar">
  <div class="brand"><span class="dot"></span><span id="brandname"></span><small id="brandtag"></small></div>
  <div class="modes" role="group" aria-label="View">
    <button data-mode="learn" aria-pressed="true">Path</button>
    <button data-mode="ref" aria-pressed="false">Reference</button>
    <button data-mode="drill" aria-pressed="false">Drill</button>
    <button data-mode="audit" aria-pressed="false">Audit</button>
  </div>
  <div class="spacer"></div>
  <input id="q" type="search" placeholder="search &middot; / to focus" autocomplete="off">
  <button class="iconbtn" id="theme" title="Toggle theme">&#9686;</button>
  <button class="iconbtn" id="reset" title="Reset progress">reset</button>
</div>

<div class="shell">
  <nav class="rail">
    <div class="railhead">Phases</div>
    <div class="pnav" id="pnav"></div>
    <div class="legend" id="legend"></div>
  </nav>
  <main id="view"></main>
</div>


<script>
/* =====================================================================
   CONTENT: replace everything below this banner.
   Three example phases show every field. Delete them and write yours.

{

  time:'1–1.5 h', pre:'Phase 00',
  objective:'You can <b>create a working specialist Bot through the three-field quick path and verify it from the CLI</b>, without touching any advanced configuration yet.',
  concepts:[
    {h:'The quick path: three fields to a teammate',
     p:'<p>Click <b>New Agent</b> in the roster. Name, Title, Description: the bot exists in seconds and introduces itself as the first message of its new Bot Chat. Resist the Advanced disclosure for now; the discipline of this phase is operating the default loop before configuring it.</p><p>The three fields are not decoration: Title becomes the bot\'s mention tag later, Description feeds its self-concept, and the name keys the deterministic blob avatar.</p>'},
    {h:'What creation actually did',
     p:'<p>Under the hood, the plugin called the standard '+K('profiles.create')+' gateway RPC: a new directory tree, a pinned Bot Chat session, and a roster row. Verifying this from the terminal cements that nothing magical happened.</p>',
     code:C('hermes profile list            # your new bot appears here',
            'ls ~/.hermes/profiles/scout/   # config, soul, memory, sessions'),
     p2:'<p>That symmetry is the whole design: create from the pane, inspect from the shell, break nothing.</p>'},
    {h:'Talk to it both ways',
     p:'<p>Open the bot\'s Bot Chat and give it a real task. Then close the pane and continue the same conversation from the terminal with <code>hermes -p scout chat</code>: same agent, same sessions, same memory. If a guide ever tells you the desktop and CLI are different agents, you now have first-hand evidence otherwise.</p>'},
    {h:'Right-click is the operating surface',
     p:'<p>Three verbs live on every roster row: <b>Edit Profile</b> (reopen the full creation surface on the live profile), <b>Duplicate</b> (full clone of config, skills, SOUL.md, memory, and look), and <b>Delete Profile</b> (permanent, behind the destructive confirmation; the default profile cannot be deleted). Learn them before you need them.</p>'}
  ],

      'From a terminal: <code>hermes profile list</code>, then <code>ls ~/.hermes/profiles/scout/</code>. Confirm both surfaces agree the bot exists.',
      'Give scout one small real task in the Bot Chat (a 3-source summary on a topic you actually care about).',

{
  id:'p2', n:'02', title:'Identity shaping', layer:'l2', layerLabel:'Shaped',
  time:'2–3 h', pre:'Phase 01',
  objective:'You can <b>give each Bot a distinct persona, model pin, and capability surface</b> (SOUL.md, per-skill, per-toolset, per-MCP) and explain what each layer does and does not enforce.',
  concepts:[
    {h:'SOUL.md is personality, not enforcement',
     p:'<p>The SOUL.md file holds a bot\'s persona and standing instructions: tone, mandate, refusal style, how it approaches work. It shapes every session the bot runs. What it does <b>not</b> do is enforce: a SOUL that says "never touch the terminal" is a request, not a boundary. Enforcement lives in toolset enablement, which physically removes the tool schema.</p>',
     table:{head:['Layer','What it does','What it feels like'],rows:[
       ['<code>SOUL.md</code>','Persona and standing instructions in every prompt','Soft: guidance the model weighs'],
       ['Skill enablement','Which procedural documents can load','Medium: knowledge the bot may consult'],
       ['Toolset enablement','Which tool schemas exist for the bot at all','<b>Hard: absent tools cannot be called</b>'],
       ['MCP server enablement','Which external servers appear as tools','Hard: same mechanism, external surface']]}},
    {h:'Model and provider pins',
     p:'<p>In the Advanced disclosure, pin any provider/model pair Hermes knows: a researcher on a reasoning model beside a writer on a cheap fast one, in the same roster. Leave it unset to inherit from the launch profile. The pin is per-bot and survives your main model changing, which inheritance does not.</p>'},
    {h:'The avatar system, or: identity is storage too',
     p:'<p>Five looks: deterministic blob faces (same name, same face, forever; Randomize re-rolls, Lock keeps, six silhouettes), geometric faces (7 shapes &times; 10 colors, eyes scan while working), uploaded images, AI-generated portraits via the '+K('image.generate')+' RPC, and pixel pets from the petdex gallery (<code>hermes pets</code>). Looks, titles, and descriptions are stored in profile metadata on the backend, so the same bot renders identically on every desktop connected to that gateway.</p>'},
    {h:'Rename, and the tag that follows',
     p:'<p>The pencil in a bot\'s chat header (or <code>hermes profile rename</code>) changes the display name, and the mention tag tracks it: a bot titled <i>Research Buddy</i> answers to '+K('@research-buddy')+' and '+K('@researchbuddy')+', in regular chats and group rooms alike. The old profile name keeps resolving too, and the composer\'s @ autocomplete matches both. Rename freely; tags do not dangle.</p>'},
    {h:'Clone-from: standing on teammates',
     p:'<p>The New Agent dialog\'s clone source starts from another bot\'s config, skills, SOUL, and memory. On remote machines the clone source is that machine\'s profiles (its <code>default</code>): a remote box does not have your local profiles. "Create empty" skips bundled skills entirely for a minimal profile.</p>'}
  ],
  lab:{title:'Two specialists, deliberately different',
    steps:[
      'Open scout\'s Edit Profile &rarr; Advanced. Pin a cheap model explicitly. Save.',
      'Write scout a SOUL.md: skeptical researcher, cite sources, no speculation. Apply and start a fresh session so it takes effect cleanly.',
      'Create a second bot <code>scribe</code>, Title "Writer". Give it a warm, concise-editor SOUL.md and a different model pin.',
      'In scribe\'s Advanced, disable the web toolset and any skill scout has that scribe does not need. Save.',
      'Ask both bots the same question that tempts web search. Confirm: scout reaches for the web, scribe answers from itself or says it cannot look things up.',
      '<b>Break it deliberately:</b> ask scribe, in plain language, to "search the web anyway." Watch the soft SOUL/instruction layer get argued with, then confirm the tool call is impossible because the toolset is gone: the hard layer held.',
      'Rename scribe to "Wordsmith". Confirm <code>@wordsmith</code> now resolves in autocomplete and the old name still matches.'],
    verify:'Two bots with different model pins, different SOULs, and demonstrably different capability surfaces: one tool call succeeded, one was impossible, and the rename updated the mention tag live.'},
  gotchas:[
    {s:'trap',t:'SOUL.md edits do not reach sessions already running',d:'Existing sessions keep the prompt state they started with; new sessions pick up the change cleanly. Test persona edits in a fresh session or you will conclude SOUL.md is being ignored.'},
    {s:'trap',t:'A profile is not a sandbox',d:'Toolset disablement removes the tool schema, but on the default local terminal backend the bot\'s shell access is still your user account. SOUL and skills are advisory. Never confuse "I told it not to" with "it cannot."'},
    {s:'stale',t:'Beta-era advice: paste the bot-messaging protocol into every SOUL.md',d:'The standalone beta taught each bot the messaging protocol via its SOUL.md. The bundled version injects it into the system prompt at build time ('+K('agent.bot_mode_protocol')+', default on), into canonical Bot Chats only, leaving your SOUL.md untouched. Following old advice duplicates the protocol and invites drift.'},
    {s:'cost',t:'Every enabled skill is prompt surface',d:'A bot with 40 enabled skills carries their index in context whether or not it uses them. Per-skill enablement is not fussiness; it is the difference between a specialist and a generalist with a costume.'}
  ],
  quiz:[
    {q:'Rank the four identity layers by enforcement strength, strongest first.',a:'Toolset and MCP enablement (hard: the schema is gone, the call is impossible), then skill enablement (medium: knowledge may load), then SOUL.md (soft: persona and standing instructions the model weighs but can be argued with).'},
    {q:'What happens to an unpinned bot when you switch your main model?',a:'It silently changes with the launch profile it inherits from. Pinning per-bot, in Advanced, is the only way to freeze a specialist\'s model.'},
    {q:'Where is a bot\'s look stored, and what follows from that?',a:'In the profile metadata on the backend. The same bot appears the same way on every desktop connected to that backend; looks travel with the profile, not the desktop.'},
    {q:'After renaming a bot to "Research Buddy", which mention tags resolve?',a:'<code>@research-buddy</code> and <code>@researchbuddy</code>, plus the original profile name, which keeps resolving. Autocomplete offers the renamed tag and matches the old name.'}
  ],
  docs:[['Personality & SOUL.md','https://hermes-agent.nousresearch.com/docs/user-guide/features/personality'],['Tools reference','https://hermes-agent.nousresearch.com/docs/reference/tools-reference']]

{
  id:'p3', n:'03', title:'Bot-to-bot messaging', layer:'l3', layerLabel:'Team',
  time:'2–3 h', pre:'Phase 02',
  objective:'You can <b>hand work from one Bot to another with @mentions, explain the transport underneath, and diagnose a failed or silent handoff</b> instead of shrugging at it.',
  concepts:[
    {h:'@mention is the handoff verb',
     p:'<p>Type '+K('@researcher have a look at this')+' in any chat and the active bot hands the message off, waits for the reply, and reports back with attribution. Mention names are validated against the live roster: an email address or an unknown @ passes through untouched rather than bouncing. This validation is your first diagnostic: if the mention did not resolve, the roster did not know the name.</p>'},
    {h:'What actually travels: a temp file and a CLI call',
     p:'<p>Under the UI, a bot reaches a teammate\'s Bot Chat through the standard CLI: it writes the message to a temp file (opening with a <code>Message from &lt;bot&gt;</code> prefix), then runs one headless turn in the recipient\'s canonical chat with <code>--query-file</code>. The file transport means quotes, <code>$(...)</code>, and backticks arrive verbatim: nothing is shell-interpreted. The receiving bot sees the message the <b>next time it runs</b> and knows how to reply because the protocol is in its prompt.</p>',
     code:C('# the shape of a bot-initiated DM (run by the bot, not you)',
            'hermes -p researcher chat --in <you> -c "Bot Chat" \\',
            '  --create-if-missing -Q --query-file /tmp/msg.txt')},
    {h:'The protocol injection: automatic, scoped, cheap',
     p:'<p>The backend teaches each canonical Bot Chat the messaging protocol at prompt-build time, including headless CLI runs. Only canonical Bot Chats get it; your regular sessions and SOUL.md stay untouched. It is controlled by '+K('agent.bot_mode_protocol')+' in config.yaml, default on. The bundled implementation measured roughly 916 bytes added to the system prompt, only while enabled: coordination is nearly free.</p>',
     code:C('agent:',
            '  bot_mode_protocol: true   # inject the bot-to-bot messaging protocol')},
    {h:'Per-invocation, not a message bus',
     p:'<p>Delivery is per-invocation: the receiving bot picks the message up when it next runs. A bot already mid-conversation will not be interrupted; live interrupt is explicitly future work. There is no queue guarantee, no retry, no delivery receipt. Handoffs are real but best-effort; anything needing retries, dependencies, or deterministic routing is an orchestration problem Bot Mode deliberately does not solve.</p>'}
  ],
  lab:{title:'A handoff chain, watched closely',
    steps:[
      'In scout\'s Bot Chat, send: "Find three sources on &lt;real topic&gt; and @scribe have it turned into a one-page brief." Watch the handoff attribution in the transcript.',
      'Open scribe\'s Bot Chat. Find the incoming message with its <code>Message from</code> attribution: the delivery trail is inspectable, not invisible.',
      'Ask scribe what it knows about the messaging protocol. Its answer demonstrates the injected protocol section.',
      'Send a mention that cannot resolve: "@nonexistentbot summarize this". Confirm it passes through as plain text, no error, no handoff.',
      '<b>Break it deliberately:</b> temporarily set <code>agent.bot_mode_protocol: false</code> in config.yaml (or comment it out and restart the gateway if you are testing the flag\'s effect on a fresh chat), then ask a bot to message a teammate. Observe the degradation: it may still attempt a CLI call, but the taught protocol, including how to reply, is gone from new canonical chats.',
      'Restore the flag to true. Confirm a new handoff works again.',
      'Note in your baseline file: one successful handoff, one passthrough mention, one protocol-off degradation.'],
    verify:'A transcript trail showing one attributed handoff, one silent passthrough of an unknown mention, and one observed degradation when the protocol flag is off.'},
  gotchas:[
    {s:'trap',t:'A failed handoff fails quietly',d:'The sending bot reports what it can, but there is no delivery receipt. If the recipient never ran (model error, missing key), the message sits unseen. The dev.to author hit exactly this: a critic finished its review and the handoff to the editor never landed; the fix was telling the sender to retry. Watch transcripts, not vibes.'},
    {s:'trap',t:'Mention validation means typos pass through, not fail',d:'An unknown @mention is deliberately untouched: no error, no bounce. If you typo a tag, the message just... goes nowhere, silently. Check autocomplete, and treat "the teammate never answered" as a possible naming miss.'},
    {s:'stale',t:'"Agent Inbox" is beta vocabulary',d:'Launch coverage (and the archived repo) called the persistent conversation an Agent Inbox. The bundled docs call it the canonical Bot Chat, and the protocol is injected automatically. Same mechanism, newer names: read old tutorials with that translation table in mind.'},
    {s:'cost',t:'Every handoff is a full agent turn',d:'The recipient runs one complete agent turn per delivery (and <code>bot-chat</code> cron delivery costs the target a turn too). A six-bot room where everyone mentions everyone is six-plus turns per round. Chain with intent.'}
  ],
  quiz:[
    {q:'Describe the transport a bot-initiated DM uses, end to end.',a:'The sender writes the message to a temp file (with a <code>Message from &lt;sender&gt;</code> prefix), then runs one headless turn in the recipient\'s canonical Bot Chat via <code>hermes -p &lt;name&gt; chat --query-file</code>. File transport means nothing is shell-interpreted. The recipient processes it next time it runs.'},
    {q:'Which conversations receive the messaging protocol, and what controls it?',a:'Only canonical Bot Chats, injected at prompt-build time (including headless runs). Controlled by <code>agent.bot_mode_protocol</code> in config.yaml, default on. Regular sessions and SOUL.md are untouched.'},
    {q:'An unknown @mention does what, and why is that a trap?',a:'It passes through as plain text, untouched, because names are validated against the live roster and unknown ones are assumed to be literal text (emails, handles). The trap: a typo\'d teammate name produces no error anywhere.'},
    {q:'Name three guarantees Bot Mode does NOT give bot-to-bot messaging.',a:'No retries, no dependency ordering, no parallelism or deterministic routing (and no live interrupt of a mid-conversation bot). It is per-invocation, best-effort handoff; orchestration is a different tool\'s job.'}
  ],
  docs:[['Bot Mode: messaging','https://hermes-agent.nousresearch.com/docs/user-guide/bot-mode'],['hermes-agent commit 2b39e92 (teammate protocol)','https://github.com/NousResearch/hermes-agent/commit/366d8814b87662a1c3d3503654ae8c60d0d883dd']]
},

{
  id:'p4', n:'04', title:'Group rooms', layer:'l3', layerLabel:'Team',
  time:'2 h', pre:'Phase 03',
  objective:'You can <b>run a 2–6 Bot group room to completion inside the turn caps, escalate to yourself with @user, and trace each member\'s persistent room session</b>.',
  concepts:[
    {h:'Rooms: shared spaces with hard rails',
     p:'<p>A group chat is a standalone roster row holding 2 to 6 bots. Your message triggers up to <b>three serial rounds</b> of member turns; hard caps of 10 messages per send and 3 rounds keep rooms from spinning. Each member keeps its own persistent <code>Group: &lt;room&gt;</code> session, so room context survives like any conversation. The caps are the product: deliberation without runaway.</p>'},
    {h:'Who speaks: mentions scope, silence settles',
     p:'<p>@mentioned bots respond; when nobody is mentioned, everyone takes a turn. But speaking is each member\'s own choice: a bot replies only when it has something to add and passes otherwise. Expect the members you addressed to speak and the rest to stay quiet; a room settling silent for a full round means it is done. Bots also pull each other in with '+K('@name')+' mid-round.</p>'},
    {h:'Escalation: @user and the needs-you badge',
     p:'<p>Bots escalate real judgment calls to you with '+K('@user')+', and the group row grows a <b>needs you</b> badge. This is the pressure valve that makes capped rooms safe: when a decision genuinely exceeds the room\'s mandate, it stops and asks. Watch the badge; it is the room raising its hand.</p>'},
    {h:'Membership and where rooms live',
     p:'<p>Right-click a local bot &rarr; <b>Manage groups</b> to add or remove it from any number of rooms; local membership lives in backend-synced profile metadata and follows the bot across desktops. Rooms themselves follow gateways, not one desktop: recent transcript, members, picture, and name are mirrored into shared profile metadata on every connected gateway with per-gateway versioning, so two desktops writing at once merge instead of clobbering. Rooms carry durable internal identity: renaming changes display name only; disbanding removes the room permanently everywhere, even for clients that were offline; recreating a same-name group starts a genuinely fresh room. If a gateway dies, every connected desktop keeps the full room locally and re-seeds on reconnect.</p>'}
  ],
  lab:{title:'A reviewed-decision room',
    steps:[
      'Create a group "review" with scout and scribe (2 bots is a legal room).',
      'Send one substantive request that needs both: research and a written summary of a decision you actually face.',
      'Watch one full cycle: turns proceed, bots pass or reply briefly, the room settles when a round stays silent.',
      'Send a request that deliberately exceeds their mandate: something requiring a judgment call only you can make (spending, publishing, a commitment). Confirm the '+K('@user')+' escalation and the needs-you badge on the row.',
      'Open each member\'s transcripts and find its <code>Group: review</code> session: room context is per-member and persistent.',
      '<b>Break it deliberately:</b> send a message that mentions both bots and demands an unbounded task ("rewrite this until perfect"). Watch the caps engage: the room stops at its limits rather than spinning. Note where it stopped.',
      'Disband the room. Recreate a same-name group. Confirm in the transcript that the new room is genuinely fresh: no old context.'],
    verify:'One settled deliberation, one @user escalation with badge observed, per-member Group: sessions found, caps engaged and observed, and a disbanded-then-recreated room verified fresh.'},
  gotchas:[
    {s:'trap',t:'Silence looks like failure',d:'A room where every member passes is a room working as designed: bots speak when they have something to add. New operators poke the room with "anyone?" messages, burning turns. A full silent round means done.'},
    {s:'trap',t:'Disband is forever, everywhere',d:'Removing a room deletes it on every client, including offline ones at the time. The transcript mirror is gone; only per-member Group: sessions persist. If you want history, export before disbanding.'},
    {s:'trap',t:'Renaming a room does not reset it',d:'Rename changes the display name only; durable internal identity persists. The inverse trap from disband: expect old context after a rename, and fresh context only in a recreated same-name room.'},
    {s:'cost',t:'Every round is every mentioned member\'s turn',d:'A 6-bot room with no mentions runs all six per round, up to 3 rounds: potentially 18 turns per message. Rooms are for genuine deliberation; broadcast announcements do not need a room.'},
    {s:'ok',t:'The caps are load-bearing design',d:'10 messages per send, 3 rounds: not arbitrary limits but the boundary between a deliberation instrument and an infinite loop. Work with them: scope messages, mention the bots you need.'}
  ],
  quiz:[
    {q:'State the room limits and what each prevents.',a:'2–6 members per room. Up to 3 serial rounds per message, 10 messages per send. Together they bound worst-case cost and guarantee a room settles instead of spinning.'},
    {q:'When nobody is @mentioned, who responds, and when does the room stop?',a:'Every member takes a turn (each choosing to reply briefly or pass). The room settles when a full round passes with nobody speaking.'},
    {q:'How does a bot escalate, and where do you see it?',a:'It writes '+K('@user')+' in the room; the group row shows a <b>needs you</b> badge. Escalation is for genuine judgment calls that exceed the room\'s mandate.'},
    {q:'Where does a member\'s room context live, and what survives a disband?',a:'Each member keeps its own persistent <code>Group: &lt;room&gt;</code> session on its machine. Disbanding removes the shared room everywhere, but per-member sessions persist; a recreated same-name room starts genuinely fresh.'}
  ],
  docs:[['Bot Mode: groups','https://hermes-agent.nousresearch.com/docs/user-guide/bot-mode']]
},

{
  id:'p5', n:'05', title:'Routines', layer:'l3', layerLabel:'Team',
  time:'2 h', pre:'Phase 03',
  objective:'You can <b>attach scheduled recurring work to the Bot that owns it, read it as cron from the CLI, and survive the failure states</b> (blocked config, drift guard, silent skips) instead of discovering them weeks later.',
  concepts:[
    {h:'A routine is a cron job wearing a badge',
     p:'<p>The Routines pane attaches recurring tasks to the bot that does them: "summarize my inbox every morning" lives next to the bot responsible. Structured schedule picker (frequency first, then only the detail that matters) with an Advanced field exposing the raw Hermes schedule string. Underneath they are plain Hermes cron jobs namespaced <code>[bot:] </code>, visible in <code>hermes cron list</code> and the core Cron page. Runs land in the bot\'s own chat history.</p>',
     code:C('hermes cron list',
            '# [bot:] Morning inbox digest   0 9 * * *   deliver: bot-chat')},
    {h:'Cron fundamentals you inherit',
     p:'<p>Because routines are cron, they inherit the whole cron execution model: the gateway ticks every 60 seconds; each due job runs in a <b>fresh agent session</b>; the scheduler validates configuration before dispatch; and prompts must be self-contained (a fresh session has no memory of your chat context). Model resolution at fire time: per-job pin, then <code>cron.model</code> in config, then the global default with a drift guard.</p>',
     table:{head:['You write','Cron hears'],rows:[
       ['"every morning at 9"','<code>0 9 * * *</code> via the picker'],
       ['Advanced schedule field','Raw Hermes schedule string, taken verbatim'],
       ['Runs land in the bot\'s chat','Delivery target <code>bot-chat</code> semantics'],
       ['"Check on that thing"','A fresh session with zero context: fails quietly']]}},
    {h:'bot-chat delivery: when output should be processed, not posted',
     p:'<p>Every cron target other than <code>bot-chat</code> delivers to a human reading a channel. <code>bot-chat</code> delivers into a profile\'s canonical Bot Chat as a real incoming message: the recipient bot reads it, acts, and responds, costing the target one full agent turn. Bare <code>bot-chat</code> targets the job\'s own profile; <code>bot-chat:research</code> targets another local profile (validated at create time; never a remote machine). It composes with other targets (<code>bot-chat,telegram</code>) but is never part of <code>all</code>.</p>'},
    {h:'The failure states that skip silently',
     p:'<p>Three states matter. <b>blocked_config</b>: pre-dispatch validation (provider key resolves, skills ready, delivery targets known) fails, one alert fires, no LLM call is made, and the job stays blocked-silent until fixed. <b>Drift guard</b>: an unpinned job whose global default model changed fails closed, skips, alerts once, then stays silently skipped until you act. <b>Failure streak</b>: consecutive failed runs accumulate; at the threshold (default 3) the failure message gains a review nudge. A routine that "stopped working" is usually in one of these states, and the alert fired once, days ago.</p>'}
  ],
  lab:{title:'A morning digest, hardened',
    steps:[
      'Pick scout. In its Routines pane, create "Morning scan": every day at a time 10 minutes from now, one clear self-contained prompt ("Search &lt;3 named sources&gt; for &lt;topic&gt;; write a 5-bullet digest to &lt;path&gt;").',
      'Verify equivalence: <code>hermes cron list</code> shows the <code>[bot:] Morning scan</code> job with the schedule you picked.',
      'Wait for the fire (or trigger with <code>hermes cron run</code>). Read the run in scout\'s Bot Chat history: results land where you would talk to it anyway.',
      'Add a second delivery: edit the job so the digest also lands in your messaging channel (e.g. <code>bot-chat,telegram</code>).',
      '<b>Break it deliberately:</b> edit the job\'s prompt to reference a skill you then disable (or set an invalid delivery target). Watch preflight produce <code>blocked_config</code> with its single alert, then silence. Fix it and confirm the next healthy run clears the block.',
      'Check <code>hermes cron list</code> for failure-streak columns; read <code>hermes cron runs</code> (alias <code>history</code>) for the execution ledger.',
      'Pin the job\'s model explicitly. Note in your baseline: pinned, delivered twice, one blocked_config round trip.' ],
    verify:'One routine firing on schedule into a bot chat plus one external channel, one observed blocked_config cycle (alert, silence, fix, clear), and a pinned model so the drift guard can never bite this job.'},
  gotchas:[
    {s:'trap',t:'blocked_config alerts exactly once',d:'Preflight failure makes no LLM call, delivers one alert, then goes quiet while the job stays blocked. Weeks later you notice the digest never comes. Grep <code>hermes cron list</code> for status when output stops; do not wait for a second warning that will never arrive.'},
    {s:'trap',t:'The drift guard skips silently after one alert',d:'Change your global model and every unpinned, snapshot-following job skips: one alert at change time, then silence, indefinitely. Pin routine models (per-job or <code>cron.model</code>) or this will eventually happen to you.'},
    {s:'trap',t:'"Check on that server issue" is not a routine prompt',d:'Routines run in fresh sessions with no chat context. A prompt that depends on "that thing we discussed" runs blind and produces confident nonsense. Self-contained: names, paths, IPs, commands, expected outcomes.'},
    {s:'cost',t:'bot-chat delivery bills a full agent turn',d:'The target bot reads and acts on every delivery. A 15-minute digest into a chatty bot is 96 turns a day before your own conversations. Schedule frequency is a budget decision.'},
    {s:'stale',t:'Routine prompts cannot spawn more cron jobs by default',d:'Scheduled agents are denied the cronjob tool unless <code>cron.allow_agent_scheduling: true</code>. A routine that "should set up a follow-up job" silently cannot, by design, unless you opted in.'}
  ],
  quiz:[
    {q:'What is a routine, physically, and where do you audit all of them?',a:'A plain Hermes cron job namespaced <code>[bot:] </code>, created and displayed beside the owning bot. <code>hermes cron list</code> and the core Cron page show the same jobs; runs land in the owning bot\'s chat history.'},
    {q:'Why must a routine prompt be self-contained, and what does that mean?',a:'Cron runs in a completely fresh agent session with none of your chat context. Self-contained means every name, path, command, and expected outcome is in the prompt itself, because there is nothing else.'},
    {q:'Explain bot-chat delivery semantics including the cost.',a:'<code>bot-chat</code> delivers output into a canonical Bot Chat as a real incoming message the bot processes and acts on (not just reads). Bare form targets the job\'s own profile; <code>bot-chat:&lt;name&gt;</code> another local profile, validated at create time. Each delivery costs the target one full agent turn; it composes with other targets but is never in <code>all</code>.'},
    {q:'A routine silently stopped two weeks ago. Name the three states to check and where.',a:'<code>blocked_config</code> (preflight validation failed; one alert, then silent), the model drift guard (unpinned job skipped after a global model change; one alert, then silent skips), and the failure streak (repeated run failures, review nudge at threshold 3). All visible in <code>hermes cron list</code> / <code>hermes cron runs</code>.'}
  ],
  docs:[['Cron docs','https://hermes-agent.nousresearch.com/docs/user-guide/features/cron'],['Bot Mode: routines','https://hermes-agent.nousresearch.com/docs/user-guide/bot-mode']]
},

{
  id:'p6', n:'06', title:'Fleet across machines', layer:'l4', layerLabel:'Fleet',
  time:'2–3 h', pre:'Phase 05',
  objective:'You can <b>register a second backend, create a Bot on it without leaving your window, and exchange work across machines</b> with disambiguated handles and peer DMs.',
  concepts:[
    {h:'The connections registry',
     p:'<p>Settings &rarr; Connections registers every backend you own: the local runtime (app-managed, irremovable), remote gateways over HTTP(S) (a running <code>hermes serve</code> backend), SSH hosts (app opens the tunnel on demand), and Hermes Cloud instances. Every connection gets a unique device name; duplicates by normalized URL or host are rejected. The roster then shows bots from <b>every</b> connected source, persistently: unreachable machines keep last-known rows; SSH sources are inventoried without spawning anything.</p>',
     table:{head:['Kind','What it is','Auth'],rows:[
       ['Local','The runtime this app manages','Automatic'],
       ['Remote gateway','A <code>hermes serve</code> backend over HTTP(S): LAN, Tailscale, internet','Session token or OAuth'],
       ['SSH','A Hermes install over SSH; app opens the tunnel and dashboard on demand','SSH key + adopted token'],
       ['Hermes Cloud','A hosted instance from your cloud account','Portal sign-in']]}},
    {h:'Handles disambiguate, never confuse',
     p:'<p>When the same profile name exists on several sources, handles disambiguate as '+K('@name-device')+': <code>research</code> on your homelab renders and mentions as '+K('@research-homelab')+'. Cross-machine members carry a device badge in rooms and transcripts. A bot\'s chats, sessions, memory, and routines live on the machine that owns the profile: opening a Connections bot routes to its machine; your window\'s gateway never switches.</p>'},
    {h:'Create on: birthplace is a choice',
     p:'<p>With multiple connections registered, the New Agent dialog grows a <b>Create on</b> picker: the profile is created on the target machine\'s backend, and the live Capabilities tab pins to that machine\'s catalog, so skills and MCP configured during creation land where the bot will live. Caveats: the clone source is a profile of the <b>target</b> machine (its <code>default</code>), and cancelling discards the draft on whichever machine it was created.</p>'},
    {h:'Peer DMs: bots messaging across machines, no desktop',
     p:'<p>Register another gateway as a peer (its API server URL and a strong <code>API_SERVER_KEY</code>) and bots on one machine can message bots on the other with no desktop in the loop. The key lives in <code>~/.hermes/.env</code>; peers and URLs in <code>config.yaml</code> under <code>bot_peers</code>. Once registered, the injected protocol automatically includes the peer roster, so bots learn teammates exist elsewhere and how to reach them.</p>',
     code:C('hermes peer add spark --url http://spark.lan:8377 --key $API_SERVER_KEY',
            'hermes peer list',
            'hermes peer dm spark < /tmp/dm.txt          # default profile',
            'hermes peer dm spark/researcher < /tmp/dm.txt  # named profile')},
    {h:'Rooms can span machines',
     p:'<p>The New Group Chat picker seats bots from any registered connection; each member\'s turns run on its own machine in its own <code>Group:</code> session there, with the <code>@name-device</code> handle working in room mentions. Same-named agents on two machines never blur: the device badge and qualified handle keep them distinct in room and transcript.</p>'}
  ],
  lab:{title:'Two machines, one roster',
    steps:[
      'If you have a second machine (or a VPS): run <code>hermes serve</code> there, then register it in Settings &rarr; Connections with a device name like "homelab". No second machine: register nothing, and instead read your default gateway\'s connection row and skip to step 6.',
      'Confirm the roster now shows bots from both sources, and that clicking a homelab bot opens its chat routed there (status bar shows it) without switching your window\'s gateway.',
      'Use New Agent &rarr; Create on: homelab to birth a bot on the remote machine. Confirm its handle renders with the device suffix.',
      'From your main chat, @mention the remote bot by its qualified handle. Confirm the reply returns attributed to it.',
      'Run <code>hermes peer add</code> against the remote gateway; then <code>hermes peer dm</code> a short question from a file and read the reply on stdout.',
      '<b>Break it deliberately:</b> stop the remote <code>hermes serve</code> (or disconnect the network). Refresh the roster: the homelab rows keep their last-known state instead of vanishing, with the error visible. Restart the backend and confirm recovery.',
      'Note in your baseline: connections registered, remote bot created, one cross-machine mention, one peer DM, one outage survived.'],
    verify:'Either a working second connection (roster union, remote-created bot, one qualified-handle mention, one peer DM, one observed outage with last-known rows) or, single-machine, a documented connection-row audit plus peer-dm dry run against localhost.'},
  gotchas:[
    {s:'trap',t:'The app never starts the remote backend for you',d:'Remote gateway means a running <code>hermes serve</code> process on the other machine; the app attaches, it does not launch. A "connection test failed" almost always means nothing is listening there, not a desktop bug. (SSH connections are the exception: the app starts the dashboard over the tunnel on demand.)'},
    {s:'trap',t:'Remote-created bots clone from the target, not from you',d:'Create on: homelab offers homelab\'s profiles as clone sources (its default). Expecting your local specialist to be cloneable onto a remote box fails silently: you get a clone of whatever exists there.'},
    {s:'trap',t:'Unreachable does not mean gone',d:'Machines that are down keep last-known roster rows. Fine for presence, but do not mistake a stale row for a live bot: check the per-row error before sending work. SSH connections show connect-on-demand by design until first opened.'},
    {s:'stale',t:'"Settings → Connections" is now "Settings → Gateways"',d:'Bot Mode docs still say Settings &rarr; Connections; the multi-connection guide says the unified Settings &rarr; Gateways page (older builds split Gateway and Connections; legacy deep links redirect). Same registry, newest name. Treat the docs\' page names as one minor release behind the app.'}
  ],
  quiz:[
    {q:'Name the four connection kinds and the one that cannot be removed.',a:'Local (app-managed, irremovable), Remote gateway (running <code>hermes serve</code> backend over HTTP(S)), SSH host (tunnel + dashboard on demand), Hermes Cloud instance.'},
    {q:'How do same-named profiles on different machines stay distinct?',a:'Handles disambiguate as <code>@name-device</code> (e.g. <code>@research-homelab</code>); cross-machine room members carry a device badge in rooms and transcripts, and the qualified handle works in mentions.'},
    {q:'What does Create on change, and what are its two caveats?',a:'The new profile is created on the target machine\'s backend, with the Capabilities tab pinned to that machine\'s catalog. Caveats: clone source is a profile of the target machine (its default); cancelling discards the draft on whichever machine it was created.'},
    {q:'Write the peer DM command to message a named profile on a registered peer.',a:'<code>hermes peer dm spark/researcher &lt; /tmp/dm.txt</code>, where <code>spark</code> is the registered peer name, <code>researcher</code> the profile on it, and the message body comes from a file so nothing is shell-interpreted.'}
  ],
  docs:[['Multi-connection desktop','https://hermes-agent.nousresearch.com/docs/user-guide/multi-connection-desktop'],['Bot Mode: across machines','https://hermes-agent.nousresearch.com/docs/user-guide/bot-mode']]
},

{
  id:'p7', n:'07', title:'Failure and safety', layer:'l4', layerLabel:'Fleet',
  time:'1.5–2 h', pre:'Phase 06',
  objective:'You can <b>supervise a fleet with real system access honestly: know what Bot Mode does not protect you from, diagnose the known failure modes, and turn the whole thing off without losing data</b>.',
  concepts:[
    {h:'No new safety model arrives with the roster',
     p:'<p>Bot Mode adds identity and coordination, not enforcement. Every bot is a standard Hermes agent with the same real system access and the same need for supervision as before. There is no added sandboxing, no permission scoping, no central audit log, no admin console. The honest posture: a fleet of bots is a fleet of agents with your user account, and the controls that exist (approvals, toolset disablement, container backends) are the ones Hermes always had.</p>'},
    {h:'Known failure modes, by symptom',
     p:'<p>The bundled release had real bugs in its first days, and knowing them makes you faster than the issue tracker.</p>',
     table:{head:['Symptom','Likely cause','Fix path'],rows:[
       ['Roster row duplicates on click','Post-bundling dedup bug on remote-gateway desktops (#88436)','Update past the fix (PR #88523); dedupe keys on (connection, profile)'],
       ['Handoff never lands','Per-invocation delivery; recipient never ran','Tell sender to retry; check recipient transcript and its model/key'],
       ['Routine silent for days','blocked_config or drift guard, one alert then silence','<code>hermes cron list</code> status; fix config; pin model'],
       ['Bot answers with stale persona','SOUL edit did not reach running sessions','Fresh session; edits apply cleanly to new sessions'],
       ['Mention passes through untouched','Name not in live roster (typo, or bot on unreachable machine)','Autocomplete; qualified <code>@name-device</code> handle']]}},
    {h:'Retry patterns: the human is the orchestrator',
     p:'<p>When a handoff fails, the recovery is conversational: tell the sending bot the delegation failed and ask it to retry (the dev.to author did exactly this). There is no automatic retry, so chains of length N fail at any link with probability you should assume is nonzero. For work that must complete, either supervise the chain, or reach for the tool whose job that is (Phase 08: Kanban for durable, retryable, multi-agent work).</p>'},
    {h:'Turning it off is safe because it owns nothing',
     p:'<p>Settings &rarr; Plugins &rarr; Bots: the roster, Routines pane, and composer middleware unregister live, no restart. Profiles, sessions, and cron jobs are untouched: Bot Mode renders data, it does not own it. A preference also hides canonical Bot Chats from the regular sidebar so they only appear in the Bots pane (uses the core hidden-session flag; older gateways simply keep them visible).</p>'},
    {h:'The audit trail that does exist',
     p:'<p>No central log, but rich per-surface trails: every handoff lands in transcripts with attribution; every routine run lands in the bot\'s chat history and <code>hermes cron runs</code>; rooms persist per-member sessions; the profile directory holds memory and config. Supervision means reading these surfaces, not trusting that someone else read them for you.</p>'}
  ],
  lab:{title:'Supervise and shut down',
    steps:[
      'Write a one-page fleet audit for your machine: every profile, its model pin, its enabled toolsets, its <code>[bot:]</code> routines with schedules and delivery targets. Sources: <code>hermes profile list</code>, profile dirs, <code>hermes cron list</code>.',
      'For each routine, note its failure posture: pinned model? self-contained prompt? reachable delivery target? Fix the two weakest.',
      'Run one deliberate handoff chain of three bots on a task that does not matter. Log every link: which landed, how long, where the trail lives.',
      '<b>Break it deliberately:</b> disable the middle bot\'s provider key (or point it at an invalid model) and re-run the chain. Watch where the chain stops and what the sender reports. Restore the key.',
      'Toggle Settings &rarr; Plugins &rarr; Bots off. Confirm the tab vanishes, then run <code>hermes cron list</code>: every <code>[bot:]</code> routine still exists. Toggle back on.',
      'Update your baseline file with the audit page path.'],
    verify:'A written fleet audit (profiles, pins, toolsets, routines with failure posture), a logged three-link chain including one deliberate break, and proof that disabling Bot Mode leaves every profile, session, and cron job intact.'},
  gotchas:[
    {s:'trap',t:'Fleet size hides credential sprawl',d:'Each profile can carry its own credential surface. Two bots with terminal access and stale keys is a audit finding; twelve is an incident you have not discovered yet. The Phase 07 audit exists because nothing else will tell you.'},
    {s:'trap',t:'Supervision by vibe, not by trail',d:'Everything you need to supervise is recorded (transcripts, chat history, cron runs) but nothing surfaces it proactively. "Seems fine" is not a check; open the bot\'s chat and the cron ledger.'},
    {s:'ok',t:'Bot Mode never owns your data',d:'The plugin renders profiles, sessions, and cron; it persists none of them. That is why turning it off is lossless, and why every diagnostic path bottoms out in files you can read.'},
    {s:'stale',t:'Live interrupt of a mid-conversation bot is not here yet',d:'Explicitly listed as future work in the official docs, and a real limit when a bot is off the rails mid-turn: your options are waiting or killing the process, not interjecting.'}
  ],
  quiz:[
    {q:'What safety guarantees does Bot Mode add, exactly?',a:'None new. Every bot is a standard Hermes agent with the same real system access and supervision needs as before Bot Mode. Existing Hermes controls (approvals, toolset enablement, container backends) still apply; there is no added sandbox, policy layer, or central audit log.'},
    {q:'A roster row duplicates when clicked. What is it, and what fixes it?',a:'The post-bundling dedup bug on remote-gateway desktops (issue #88436): active-gateway union rows were misclassified and appended as duplicates. Fixed by PR #88523 (dedupe on (connection, profile), source-qualified row keys): update past it.'},
    {q:'Describe the recovery when a handoff fails mid-chain.',a:'Conversational: tell the sending bot the delegation failed and ask it to retry, then check the recipient\'s transcript for whether the message arrived. There is no automatic retry; for must-complete chains, supervise or use a durable orchestration tool (Kanban).'},
    {q:'What survives disabling the Bot Mode plugin?',a:'Everything: profiles, sessions, memory, and all <code>[bot:]</code> cron jobs continue untouched. The plugin unregisters its UI surfaces live and owns no data.'}
  ],
  docs:[['Bot Mode: turning it off','https://hermes-agent.nousresearch.com/docs/user-guide/bot-mode'],['Security','https://hermes-agent.nousresearch.com/docs/user-guide/security']]
},

{
  id:'p8', n:'08', title:'Choosing the tool', layer:'l4', layerLabel:'Fleet',
  time:'1–1.5 h', pre:'Phase 07',
  objective:'You can <b>pick correctly between Profiles, Bot Mode, Kanban, delegate_task, and peer messaging for any given job</b>, and say when Bot Mode is the wrong answer.',
  concepts:[
    {h:'The decision spine: what shape is the work?',
     p:'<p>Hermes gives you five coordination mechanisms. They are not competitors; they have shapes. Choosing by shape, not by enthusiasm, is the whole skill.</p>',
     table:{head:['Mechanism','Shape','Use when'],rows:[
       ['Bare profiles','Isolated specialists, no coordination','You need separation of memory/context, that is all'],
       ['Bot Mode','Persistent teammates with faces, handoffs, rooms, routines','You want identity, visibility, and light coordination'],
       ['<code>delegate_task</code>','RPC: fork &rarr; join, parent blocks','Parent needs a short reasoning answer before continuing'],
       ['Kanban','Durable queue + state machine, named workers, human-in-loop','Work crosses agents, survives restarts, needs retry/review'],
       ['Peer DMs','Cross-machine one-shot question/answer','A teammate on another box has context you need']]}},
    {h:'Bot Mode is not a workflow engine',
     p:'<p>The handoffs are real but per-invocation and best-effort: no retries, no dependency graph, no parallelism guarantees, no deterministic routing. The dev.to reviewer\'s verdict holds after bundling: treat Bot Mode as a team interface, not an orchestration system. A three-stage pipeline that must complete unattended is Kanban\'s shape (block &rarr; unblock &rarr; re-run, crash &rarr; reclaim, durable rows forever); the same pipeline supervised by you at the keyboard is a lovely Bot Mode demo.</p>'},
    {h:'When Bot Mode is the wrong answer',
     p:'<p>Three honest cases. One-shot parallel fan-out where the parent immediately consumes results: <code>delegate_task</code>, cheaper and bounded. Unattended production pipeline with failure recovery: Kanban. Single assistant, no identity needs: a bare profile, without the roster. If none of your work involves returning to the same specialist with accumulated context, the roster is decoration.</p>'},
    {h:'They compose, and that is the real pattern',
