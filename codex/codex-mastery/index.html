*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;

h1,h2,h3,h4{font-family:var(--f-disp); color:var(--ink); text-wrap:balance; margin:0; letter-spacing:-.01em}
a{color:var(--accent-ink); text-underline-offset:3px}

:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:3px}

.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);

}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--f-disp); font-weight:700;

}
.modes button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{flex:1}
#q{

}

.iconbtn:hover{color:var(--ink); border-color:var(--accent)}

.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:1fr} }

.rail{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--paper); padding:16px 12px 40px;
}
@media (max-width:900px){
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; scrollbar-width:thin}
  .railhead,.legend{display:none}
}
.railhead{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 8px}
.pnav{display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .pnav{flex-direction:row; gap:6px} }
.pnav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  text-decoration:none; color:var(--body); font-family:var(--f-disp); font-size:14px;
  font-weight:500; line-height:1.25; border:1px solid transparent; white-space:nowrap;
}
.pnav a:hover{background:var(--bg)}
.pnav a.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.pnav .n{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); width:18px; flex:none}
.pnav a.on .n{color:var(--accent)}
.pnav .tick{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-left:auto;
  display:grid;place-items:center;font-size:8px;color:transparent}
.pnav .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pnav .tick.part{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}

.legend{margin-top:22px; padding:11px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg)}

main{padding:28px 30px 96px; max-width:1080px; min-width:0}

.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--signal)}

.meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px}

.chip.l2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

h2.sec{

pre{

.copy.done{background:var(--ok); color:#fff; border-color:var(--ok)}
.cap{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin:-4px 0 0}

.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
table{border-collapse:collapse; width:100%; font-family:var(--f-body); font-size:14px; min-width:480px}
th{text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; padding:9px 13px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}

.gotcha{display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; padding:13px 0; border-bottom:1px solid var(--line)}
.gotcha:last-child{border-bottom:0}
.sev{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; height:fit-content; white-space:nowrap; margin-top:2px}
.sev.trap{background:var(--stop-soft); color:var(--stop)}
.sev.wrong{background:var(--stop-soft); color:var(--stop)}
.sev.cost{background:var(--warn-soft); color:var(--warn)}
.sev.stale{background:var(--signal-soft); color:var(--signal)}
.sev.ok{background:var(--ok-soft); color:var(--ok)}
.gotcha b{font-family:var(--f-disp); font-weight:600; color:var(--ink); display:block; font-size:15px; margin-bottom:2px}
.gotcha span{font-size:15px}

.lab{margin:14px 0 0; padding:18px 20px; border:1px solid var(--accent); border-radius:11px;

.done-line label{font-family:var(--f-disp); font-size:14px; font-weight:600; color:var(--accent-ink); cursor:pointer;

details.qa{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:var(--paper); overflow:hidden}

details.qa[open] summary::before{content:'!'}
details.qa .ans{padding:0 15px 13px 33px; font-size:15px; color:var(--body); border-top:1px solid var(--line); padding-top:11px}

.tree{margin:14px 0; display:flex; flex-direction:column; gap:0}
.branch{display:grid; grid-template-columns:minmax(140px,.9fr) auto minmax(0,1.4fr); gap:12px; align-items:center;

.branch:first-child{border-top:1px solid var(--line); border-radius:9px 9px 0 0}

.branch .arr{font-family:var(--f-mono); color:var(--line-2); font-size:13px}

.docs{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.docs a{font-family:var(--f-mono); font-size:11.5px; padding:4px 10px; border-radius:20px; text-decoration:none;

.docs a:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}

.card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--paper)}

.vtag.holds{background:var(--ok-soft); color:var(--ok)}
.vtag.stale{background:var(--warn-soft); color:var(--warn)}

.empty{color:var(--muted); font-style:italic; padding:20px 0}
.lede{font-size:17.5px; max-width:68ch; color:var(--body); margin:14px 0 0}

.hr{height:1px;background:var(--line);margin:38px 0 0;border:0}
.unv{font-family:var(--f-mono);font-size:.86em;color:var(--muted);background:var(--bg);

    verify:'A concrete decision &mdash; &ldquo;fast for X, careful for Y&rdquo; &mdash; backed by at least one timed comparison, not intuition.'},
  gotchas:[
    {s:'trap',t:'Retiring models do not retire loudly ahead of time',d:'gpt-5.4 and gpt-5.4-mini keep working right up until Aug 31, 2026, then stop. A hardcoded model = "gpt-5.4" in a profile or CI script is a silent time bomb, not a warning you will see today.'},
    {s:'cost',t:'Ultra reasoning runs subagents &mdash; it is not just &ldquo;think longer&rdquo;',d:'The highest tier reportedly parallelizes via subagents rather than single-threading a longer chain of thought, changing the cost shape. <span class="unv">Unverified in detail</span> &mdash; test it as a cost multiplier before scripting it into a default.'},
    {s:'stale',t:'gpt-5.2-codex and gpt-5.1-codex-mini are gone, not just old',d:'Both were shut down for ChatGPT-authenticated Codex usage. A guide or note from before mid-2026 recommending either is stale, not just suboptimal.'},
    {s:'trap',t:'The web_search feature flag being &ldquo;on&rdquo; is not what you think',d:'It is the deprecated path. Check the top-level web_search config value (cached/indexed/live/disabled) for what is actually controlling search behavior now.'},
    {s:'ok',t:'A profile is disposable; edit it like one',d:'Because a profile sits below project config, experimenting with an aggressive profile cannot override anything a trusted project has locked down at the project-config layer &mdash; that is what makes trying profiles cheap.'}
  ],
  quiz:[
    {q:'Which two models retire from Codex on August 31, 2026, and what replaces each?',a:'gpt-5.4 &rarr; gpt-5.6-terra; gpt-5.4-mini &rarr; gpt-5.6-luna.'},
    {q:'Name the three current-generation 5.6 models and one thing each is for.',a:'Sol (flagship &mdash; complex coding, computer use, research); Terra (everyday work, general-purpose default); Luna (fast/cheap &mdash; extraction, classification, transformation).'},
    {q:'What does a profile file override, and what still overrides the profile?',a:'It overrides your user-level ~/.codex/config.toml. A project .codex/config.toml still wins over the profile, and CLI flags win over everything.'},
    {q:'Which web_search setting should you actually configure, and why?',a:'The top-level web_search = "cached"|"indexed"|"live"|"disabled" key &mdash; the older [features] web_search flag is deprecated.'}
  ],
  docs:[['Config basics','https://learn.chatgpt.com/docs/config-file/config-basic'],['Models','https://learn.chatgpt.com/docs/models']]
},

{
  id:'p5', n:'05', title:'Skills &amp; Plugins', layer:'l2', layerLabel:'Soft',
  time:'1&ndash;2 h', pre:'Phase 04',
  objective:'You can extend Codex with reusable, on-demand packages of expertise or tooling instead of re-explaining the same domain knowledge in every prompt.',
  concepts:[
    {h:'Skills load on demand, not always-on',
     p:'<p>Skills package reusable workflows &mdash; language packages (Python, Go, Rust), framework packages (React, Django), domain packages (GCP, GitHub) &mdash; stored under <code>~/.codex/skills/</code> or a remote registry, invoked via <code>/skills</code> or by name. Unlike AGENTS.md, which is always in context, a skill loads only when relevant.</p>'},
    {h:'Plugins extend the CLI itself',
     p:'<p><code>/plugins</code> browses installed and discoverable plugins from local, personal, workspace, or remote catalogs. Portable Agent Plugins (v0.147.0) use a manifest searchable across all four catalog types, and workspace-level plugin sharing (v0.129.0) lets a team standardize on one set.</p>'},
    {h:'/import migrates setup from other tools',
     p:'<p><code>/import</code> brings in Claude Code project files and recent chats (v0.140.0+), and Cursor-managed skills with sync so re-running it does not create duplicates (v0.145.0+). The fastest path if you are moving an existing setup rather than starting from zero.</p>'},
    {h:'Skills and AGENTS.md solve different problems',
     p:'<p>AGENTS.md is standing, project-scoped instruction that is always in the prompt. A skill is optional, reusable across projects, and loaded only when the task matches &mdash; reach for a skill when the knowledge is domain-general and AGENTS.md when it is project-specific.</p>'}
  ],
  lab:{title:'Import or build one real skill',
    steps:[
      'If you have an existing Claude Code or Cursor setup, run <code>/import</code> in a shared project and check what it migrated.',
      'Otherwise: pick one piece of domain knowledge you re-explain to Codex constantly, and check <code>~/.codex/skills/</code> or <code>/plugins</code> for an existing package before writing your own.',
      'Run a task that should trigger it and confirm &mdash; by checking what context Codex actually used &mdash; that it loaded, rather than assuming silence means success.',
      '<b>Break it deliberately:</b> rename or move the skill directory so discovery fails, rerun the task, and observe whether Codex quietly falls back to generic behavior or tells you the skill is missing.'],
    verify:'You know, for one concrete skill, exactly what triggers it and what happens when it is absent &mdash; not just that it exists.'},
  gotchas:[
    {s:'trap',t:'A missing skill can fail silently into generic behavior',d:'If discovery breaks, Codex does not necessarily surface an error &mdash; it may just answer without the domain knowledge you expected, and a plausible-but-generic answer is the hardest kind of gap to notice.'},
    {s:'cost',t:'Remote plugin catalogs add a network dependency',d:'Remote plugin enablement (default since v0.143.0) means a task that used to be fully offline may now hit the network for catalog discovery.'},
    {s:'trap',t:'/import duplicating on re-run was a real bug class',d:'v0.145.0 specifically called out avoiding duplicates when re-importing Cursor conversations &mdash; a sign this failure mode existed. Re-running /import on an older version is worth a duplicate-check afterward.'},
    {s:'ok',t:'Workspace plugin sharing standardizes a team, not just you',d:'Configuring plugins at the workspace level (v0.129.0+) means teammates get the same extension set without individually managing it &mdash; the payoff scales with team size.'}
  ],
  quiz:[
    {q:'What is the practical difference between putting knowledge in AGENTS.md versus building it as a skill?',a:'AGENTS.md is always-in-context and project-scoped; a skill loads on demand and can be reused across projects &mdash; use AGENTS.md for this-repo specifics, a skill for domain-general knowledge.'},
    {q:'Which tools can /import migrate settings and history from, and since which versions?',a:'Claude Code (project files, recent chats &mdash; v0.140.0+) and Cursor (managed skills, with sync to avoid duplicates &mdash; v0.145.0+).'},
    {q:'Where do local skills live on disk by default?',a:'~/.codex/skills/.'}
  ],
  docs:[['CLI features','https://developers.openai.com/codex/cli/features'],['Slash commands','https://developers.openai.com/codex/cli/slash-commands']]
},

{
  id:'p6', n:'06', title:'Sandbox Mode', layer:'l3', layerLabel:'Hard',
  time:'1&ndash;2 h', pre:'Phase 02',
  objective:'You can state, for any command Codex is about to run, exactly what the active sandbox mode <b>physically permits</b> &mdash; independent of whether it will be asked or not.',
  concepts:[
    {h:'The three sandbox modes',
     table:{head:['Mode','File access','Network'],rows:[
       ['read-only','Read only','Blocked'],
       ['workspace-write (default)','Read/write inside the workspace + /tmp','Blocked by default'],
       ['danger-full-access','Full machine','Enabled']]}},
    {h:'Enforcement is OS-level, not a polite request',
     table:{head:['Platform','Mechanism'],rows:[
       ['macOS','Apple Seatbelt via sandbox-exec, mode-specific profiles'],
       ['Linux','Landlock + seccomp + a vendored Bubblewrap (bwrap)'],
       ['Windows','Native restricted tokens; WSL2 inherits Linux sandbox semantics when configured']]}},
    {h:'Protected paths stay read-only even in workspace-write',
     p:'<p><code>.git</code>, <code>.agents</code>, and <code>.codex</code> remain read-only regardless of sandbox mode short of danger-full-access &mdash; the sandbox specifically protects the agent&rsquo;s own config and your version-control history from the agent itself.</p>'},
    {h:'v0.148.0 changed the failure direction',
     p:'<p>As of v0.148.0, denied or unreadable paths <b>fail closed</b> (blocked) on Linux and Windows instead of the previous behavior &mdash; a permissions edge case that used to quietly let something through now blocks it.</p>'},
    {h:'Windows has its own sandbox dial',
     code:C('[windows]',
            'sandbox = "elevated"    # recommended',
            '# sandbox = "unelevated" # fallback'),
     p2:'<p>This sits alongside, not instead of, sandbox_mode &mdash; it configures how the Windows-native enforcement itself runs.</p>'}
  ],
  lab:{title:'Prove the boundary, do not assume it',
    steps:[
      'In a scratch repo, set <code>sandbox_mode = "read-only"</code> and ask Codex to make a trivial edit.',
      'Confirm it refuses or requests approval &mdash; read the exact message it gives you.',
      'Switch to workspace-write and repeat; also ask it to fetch a URL and confirm network stays blocked.',
      'Try to have it edit a file inside .git directly while in workspace-write, and confirm the protected-path restriction holds anyway.',
      '<b>Break it deliberately:</b> switch to danger-full-access for one throwaway task in a disposable directory, watch it succeed at something workspace-write blocked, then switch back immediately.'],
    verify:'Three first-hand observations &mdash; blocked in read-only, allowed in workspace-write, protected-path holds anyway &mdash; instead of trusting the docs table.'},
  gotchas:[
    {s:'trap',t:'Containers can look broken when it is the sandbox fighting the container',d:'Docker and similar environments may need danger-full-access if the sandbox&rsquo;s own namespace operations are blocked by the container runtime &mdash; a workspace-write failure inside a container is not automatically a Codex bug.'},
    {s:'trap',t:'workspace-write means &ldquo;scoped,&rdquo; not &ldquo;safe&rdquo;',d:'It still lets Codex execute arbitrary commands inside the workspace and /tmp &mdash; a bad instruction can still damage your project, just not the rest of your machine or the network by default.'},
    {s:'cost',t:'danger-full-access removes the sandbox and the safety net for mistakes',d:'There is no scoped version. Reach for it only when the sandbox itself, not the task, is the actual blocker.'},
    {s:'stale',t:'&ldquo;Network is available if I need it&rdquo; was never the workspace-write default',d:'Network access is blocked by default even in workspace-write and needs explicit configuration &mdash; a common first surprise for a package install or API call.'},
    {s:'ok',t:'Fail-closed (v0.148.0) is strictly safer than what it replaced',d:'A denied/unreadable-path edge case that used to potentially let an operation through now blocks it &mdash; loudly, which is the point.'}
  ],
  quiz:[
    {q:'Name the three sandbox modes and what each permits for network access.',a:'read-only (blocked), workspace-write (blocked by default), danger-full-access (enabled).'},
    {q:'What stays read-only in workspace-write mode no matter what, and why does that matter?',a:'.git, .agents, and .codex &mdash; protecting the agent&rsquo;s own config and your version control history from the agent operating on them.'},
    {q:'What changed about denied/unreadable paths in v0.148.0?',a:'They now fail closed (blocked) on Linux and Windows, instead of the previous behavior &mdash; a hardening of the default failure direction.'},
    {q:'What enforces the sandbox on macOS versus Linux?',a:'macOS: Apple Seatbelt via sandbox-exec. Linux: Landlock + seccomp + a vendored Bubblewrap (bwrap).'}
  ],
  docs:[['Agent approvals &amp; security','https://developers.openai.com/codex/agent-approvals-security'],['Changelog','https://developers.openai.com/codex/changelog']]
},

{
  id:'p7', n:'07', title:'Approval Policy', layer:'l3', layerLabel:'Hard',
  time:'2 h', pre:'Phase 06',
  objective:'You can choose <b>when</b> Codex pauses for your permission, as a decision independent from what the sandbox permits, and reduce prompt fatigue without disabling judgment entirely.',
  concepts:[
    {h:'The three approval policies',
     table:{head:['Policy','Behavior'],rows:[
       ['untrusted','Safe reads auto-run; anything else prompts &mdash; highest barrier'],
       ['on-request (default)','Approves within the sandbox boundary automatically; prompts only when a command would cross it'],
       ['never','No prompts at all &mdash; respects sandbox constraints only']]}},
    {h:'--approve-for-me reduces fatigue without going to never',
     p:'<p>Introduced in v0.147.0, this flag has an automatic review process adjudicate approval prompts instead of interrupting you for each one &mdash; a middle ground between answering every prompt and turning approval off entirely.</p>'},
    {h:'Guardian review is a persistent second opinion',
     p:'<p>Guardian subagent review mode keeps a reviewer active across a session&rsquo;s approvals rather than evaluating each one in isolation &mdash; and it deliberately disables hooks during a guardian review session to prevent interference with its judgment.</p>'},
    {h:'request_permissions lets the model ask for more, at runtime',
     p:'<p>Rather than only you deciding sandbox/approval up front, the model can invoke a <code>request_permissions</code> tool mid-task to ask for elevated access when it hits something the current policy blocks &mdash; you still approve or deny, but the ask originates from the run itself.</p>'},
    {h:'untrusted may be on its way out',
     p:'<p><span class="unv">Per third-party release tracking, an alpha release (v0.149.0) marks untrusted for retirement</span> &mdash; I could not confirm this directly against an official OpenAI source. If accurate, build new automation around on-request or never rather than depending on untrusted staying available long-term.</p>'}
  ],
  lab:{title:'Feel the difference approval policy makes, sandbox held constant',
    steps:[
      'Fix <code>sandbox_mode = "workspace-write"</code> for this whole lab so only approval_policy changes.',
      'Run a real multi-step task under untrusted and count every prompt you had to answer.',
      'Run the same task under on-request and count again.',
      'Run it a third time with --approve-for-me and compare what got auto-approved versus what still stopped for you.',
      '<b>Break it deliberately:</b> under never, ask it to do something that would cross the sandbox boundary (write outside the workspace) and confirm it fails rather than silently succeeding.'],
    verify:'A prompt-count comparison across at least two policies on the identical task, plus confirmation that never still respects sandbox limits.'},
  gotchas:[
    {s:'trap',t:'never disables approval, not capability',d:'It removes every prompt but still operates strictly inside whatever sandbox_mode allows. never + workspace-write cannot touch the network any more than the same sandbox with prompts on could &mdash; the two settings are independent axes.'},
    {s:'trap',t:'Approving without reading defeats the entire mechanism',d:'The system&rsquo;s value is a human, or the guardian reviewer, actually evaluating the boundary crossing. Reflexively approving every prompt is functionally the same as never, minus the honesty of admitting it.'},
    {s:'cost',t:'--approve-for-me still has a review cost, just not yours',d:'Automatic review adjudicates instead of interrupting you &mdash; it is a trust delegation, not a performance optimization.'},
    {s:'stale',t:'Guardian sessions and hooks do not both run',d:'Guardian review disables hooks specifically for that session. A hook you are counting on will not fire while guardian review is active.'},
    {s:'ok',t:'request_permissions makes the ask legible, at least',d:'When the model requests elevated access mid-task rather than failing silently or working around the restriction, you get a specific, attributable ask to evaluate.'}
  ],
  quiz:[
    {q:'What is the actual difference between never and danger-full-access?',a:'never is an approval policy &mdash; no prompts, but sandbox limits still apply. danger-full-access is a sandbox mode &mdash; no restrictions at all, independent of whether prompts are on. sandbox=workspace-write + approval=never is not the same as danger-full-access.'},
    {q:'What does --approve-for-me do differently from never?',a:'It routes approval decisions through an automatic review process instead of removing them &mdash; boundary crossings are still evaluated, just not by interrupting you personally.'},
    {q:'Why does guardian review disable hooks?',a:'To prevent hooks from interfering with the guardian subagent&rsquo;s independent judgment during that review session.'},
    {q:'What does the request_permissions tool let the model do?',a:'Ask, at runtime, for elevated access beyond the current policy when it hits something blocked &mdash; you still approve or deny, but the model can surface the ask itself instead of silently failing.'}
  ],
  docs:[['Agent approvals &amp; security','https://developers.openai.com/codex/agent-approvals-security'],['CLI 0.147.0 release (--approve-for-me)','https://github.com/openai/codex/releases/tag/rust-v0.147.0']]
},

{
  id:'p8', n:'08', title:'Hooks', layer:'l3', layerLabel:'Hard',
  time:'2&ndash;3 h', pre:'Phase 07',
  objective:'You can wire a real script into Codex&rsquo;s lifecycle at the correct, actual event name &mdash; not the one you would guess from another tool&rsquo;s hook system.',
  concepts:[
    {h:'The real lifecycle events',
     table:{head:['Stage','Events'],rows:[
       ['Session bracket','SessionStart, SessionEnd'],
       ['Sub-agents','SubagentStart, SubagentStop'],
       ['Around a tool call','PreToolUse, PermissionRequest, PostToolUse'],
       ['Around compaction','PreCompact, PostCompact'],
       ['Prompt &amp; stop','UserPromptSubmit, Stop']]}},
    {h:'Config syntax',
     code:C('[[hooks.PreToolUse]]',
            'matcher = "^Bash$"',
            '',
            '[[hooks.PreToolUse.hooks]]',
            'type = "command"',
            'command = \'/usr/bin/python3 "$(git rev-parse --show-toplevel)/.codex/hooks/pre_tool_use_policy.py"\'',
            'timeout = 30',
            'statusMessage = "Checking Bash command"'),
     p2:'<p>Hooks live in <code>hooks.json</code> or inline in <code>config.toml</code> under a <code>[hooks]</code> table, at any of <code>~/.codex/hooks.json</code>, <code>~/.codex/config.toml</code>, <code>&lt;repo&gt;/.codex/hooks.json</code>, or <code>&lt;repo&gt;/.codex/config.toml</code>. <code>matcher</code> filters which tool the hook fires for; a command hook can block or rewrite the call it wraps.</p>'},
    {h:'Trust is required before a hook can run',
     p:'<p>Before a non-managed command hook executes, Codex requires you to review and explicitly trust the exact hook definition. Use <code>/hooks</code> to inspect, review, and approve them &mdash; a hook added by editing a shared config file does not get to run without that step.</p>'},
    {h:'Async execution and MCP calls (v0.147.0)',
     p:'<p>Hooks gained the ability to run asynchronously and invoke MCP tools directly, rather than only shelling out to a local command &mdash; meaningfully expanding what a hook can do without leaving the hook system.</p>'},
    {h:'Admins can force managed-only hooks &mdash; but only from one file',
     p:'<p><code>allow_managed_hooks_only = true</code> in <code>requirements.toml</code> makes Codex ignore user, project, and session hook configs entirely, keeping only managed hooks. The same setting in <code>config.toml</code> does nothing &mdash; it is deliberately not user-settable.</p>'}
  ],
  lab:{title:'Wire and then defeat one hook',
    steps:[
      'Write a trivial PreToolUse hook that logs every Bash tool call to a local file, using the [[hooks.PreToolUse]] / [[hooks.PreToolUse.hooks]] structure above.',
      'Trigger it and run <code>/hooks</code> to review and trust the definition before it fires for real.',
      'Confirm the log file grows on the next Bash call.',
      'Change the hook to actually block a dangerous pattern and confirm Codex surfaces that block rather than silently retrying around it.',
      '<b>Break it deliberately:</b> enter a guardian review session and confirm your hook does not fire during it &mdash; direct proof of the guardian/hooks interaction from Phase 07.'],
    verify:'A hook you wrote fires on the correct real event name, was explicitly trusted through /hooks, and you have directly observed it going silent under guardian review.'},
  gotchas:[
    {s:'wrong',t:'The generic &ldquo;before/after shell or tool execute&rdquo; names are not the real event list',d:'The actual events are SessionStart, SessionEnd, SubagentStart, PreToolUse, PermissionRequest, PostToolUse, PreCompact, PostCompact, UserPromptSubmit, SubagentStop, and Stop &mdash; a PascalCase, tool-call-and-lifecycle-centric scheme, not a snake_case pre/post-shell pair. A hook config written against the wrong names simply never fires, with no error telling you why.'},
    {s:'trap',t:'An untrusted hook silently does not run',d:'If you edit a hook definition and forget to re-approve it via /hooks, it stops firing. The symptom looks identical to a typo in the matcher or a wrong event name &mdash; check trust status before you debug the config.'},
    {s:'cost',t:'Every PreToolUse hook adds latency to every matching tool call',d:'A slow or network-bound hook command runs synchronously in the tool-call path unless you are using v0.147.0+ async hooks &mdash; a heavyweight policy check can make an otherwise-fast tool feel sluggish across the whole session.'},
    {s:'stale',t:'&ldquo;Hooks are always local shell commands&rdquo; stopped being true in v0.147.0',d:'They can now invoke MCP tools directly and run asynchronously &mdash; a hook system designed around only local, synchronous execution is working from an outdated model of what is possible.'},
    {s:'ok',t:'requirements.toml, not config.toml, is the only place admin lockdown works',d:'allow_managed_hooks_only = true is deliberately inert in config.toml &mdash; the design forces that control into the admin-managed file so a user cannot grant themselves the lockdown, or accidentally break it, from their own config.'}
  ],
  quiz:[
    {q:'List the real Codex hook lifecycle events, grouped by what they bracket.',a:'Session: SessionStart, SessionEnd. Subagents: SubagentStart, SubagentStop. Tool calls: PreToolUse, PermissionRequest, PostToolUse. Compaction: PreCompact, PostCompact. Prompt/stop: UserPromptSubmit, Stop.'},
    {q:'Why might a correctly-written hook simply never fire?',a:'Either the event name is wrong (a common mistake if assuming another tool&rsquo;s pre/post-shell naming), or the hook definition changed and has not been re-approved via /hooks since &mdash; both fail silently with no error.'},
    {q:'Where must allow_managed_hooks_only = true be set to actually take effect, and why does the other location not work?',a:'requirements.toml only &mdash; the same key in config.toml is deliberately a no-op, so a user cannot grant or defeat the admin lockdown from their own file.'},
    {q:'What does guardian review mode do to your hooks during that session?',a:'Disables them, specifically to prevent hooks from interfering with the guardian subagent&rsquo;s independent review judgment.'}
  ],
  docs:[['Hooks','https://learn.chatgpt.com/docs/hooks']]
},

{
  id:'p9', n:'09', title:'MCP Servers', layer:'l3', layerLabel:'Hard',
  time:'1&ndash;2 h', pre:'Phase 07',
  objective:'You can add an external tool server to Codex with the correct table syntax, and control exactly which of its tools run automatically versus need approval.',
  concepts:[
    {h:'Servers are keyed tables, not an array',
     code:C('[mcp_servers.context7]',
            'command = "npx"',
            'args = ["-y", "@upstash/context7-mcp"]',
            'env_vars = ["LOCAL_TOKEN"]',
            '',
            '[mcp_servers.figma]',
            'url = "https://mcp.figma.com/mcp"',
            'bearer_token_env_var = "FIGMA_OAUTH_TOKEN"',
            'enabled_tools = ["read", "write"]',
            'default_tools_approval_mode = "prompt"'),
     p2:'<p>Each server gets its own <code>[mcp_servers.&lt;name&gt;]</code> table &mdash; the name is the table key itself, not a separate <code>name = "..."</code> field inside an array of tables.</p>'},
    {h:'STDIO vs HTTP servers',
     table:{head:['Kind','Required key','Notable optional keys'],rows:[
       ['Local process (STDIO)','command','args, env, env_vars, cwd'],
       ['Remote (HTTP)','url','bearer_token_env_var, http_headers, env_http_headers']]}},
    {h:'Per-server tool restriction',
     p:'<p><code>enabled_tools</code> acts as an allow-list; <code>disabled_tools</code> as a deny-list applied after it. <code>default_tools_approval_mode</code> sets the server-wide default, and <code>tools.&lt;tool&gt;.approval_mode</code> overrides it per tool &mdash; values are <code>auto</code>, <code>prompt</code>, or <code>approve</code>.</p>'},
    {h:'/mcp lists what is actually configured',
     p:'<p>Run <code>/mcp</code> in the TUI to see active servers rather than re-reading config.toml to reconstruct the current state by hand.</p>'},
    {h:'The protocol itself moved in v0.147.0',
     p:'<p>Support for MCP protocol version 2026-07-28 added paginated discovery, multi-round requests, and non-blocking server startup &mdash; a slow or unresponsive MCP server used to be able to stall Codex&rsquo;s own startup; non-blocking startup specifically addresses that.</p>'}
  ],
  lab:{title:'Add a real server and restrict it',
    steps:[
      'Pick one MCP server you actually want and add it under its own [mcp_servers.&lt;name&gt;] table.',
      'Run /mcp and confirm it shows as configured.',
      'Set default_tools_approval_mode = "prompt" first, run a task that uses it, and read exactly what it asks permission for.',
      'Once you have seen the real tool calls it makes, narrow enabled_tools to only what you actually want available.',
      '<b>Break it deliberately:</b> misname the table using the old [[mcp_servers]] + name = "..." array-of-tables shape and confirm Codex either ignores it or errors, proving which syntax is actually load-bearing.'],
    verify:'A working MCP server whose tool surface you have deliberately narrowed based on what you observed it actually call, not what it advertises.'},
  gotchas:[
    {s:'wrong',t:'The old array-of-tables-with-a-name-field shape is not what current Codex reads',d:'Current config uses [mcp_servers.&lt;server-name&gt;] &mdash; a table keyed by name. Copying an older [[mcp_servers]] + name = "github" example is a common source of &ldquo;I configured it and it does not show up in /mcp.&rdquo;'},
    {s:'trap',t:'A stalled MCP server used to be able to stall you too',d:'Before non-blocking startup (v0.147.0, MCP protocol 2026-07-28), a slow-to-respond server could hold up Codex&rsquo;s own startup. Add a slow server with caution on an older version.'},
    {s:'cost',t:'default_tools_approval_mode = "auto" trades review for speed at the whole-server level',d:'Setting it broadly instead of scoping per-tool means every tool the server exposes &mdash; including ones you never intended to use &mdash; inherits the same low-friction default.'},
    {s:'ok',t:'enabled_tools and disabled_tools compose, they do not just override',d:'disabled_tools is applied after the allow-list &mdash; think of it as a carve-out from whatever enabled_tools already permits, not a competing, independent list.'}
  ],
  quiz:[
    {q:'What is wrong with configuring an MCP server as [[mcp_servers]] with a name = "..." field?',a:'It is outdated syntax &mdash; current Codex reads servers as [mcp_servers.&lt;server-name&gt;], a table keyed by the server&rsquo;s own name, not an array of tables with a name field inside each.'},
    {q:'What changed about MCP server startup in v0.147.0, and why did it matter?',a:'Startup became non-blocking under the MCP 2026-07-28 protocol &mdash; previously a slow or unresponsive server could stall Codex&rsquo;s own startup.'},
    {q:'How do you restrict an MCP server to only the tools you actually want available?',a:'enabled_tools as an allow-list, optionally narrowed with disabled_tools, and per-tool approval_mode for anything needing its own friction level.'}
  ],
  docs:[['Model Context Protocol','https://developers.openai.com/codex/mcp']]
},

   {c:'Not mentioned: requirements.toml&rsquo;s allow_managed_hooks_only setting and that it is inert in config.toml.',f:'A specific, easy-to-get-wrong admin control the source&rsquo;s enterprise section does not cover at all.'},
   {c:'Not mentioned: guardian review mode disables hooks for that session.',f:'A real interaction between two features the source documents separately (guardian review, hooks) without noting they affect each other.'},
   {c:'Not mentioned: MCP&rsquo;s per-server and per-tool approval-mode granularity (enabled_tools, disabled_tools, tools.&lt;tool&gt;.approval_mode).',f:'The source treats MCP config as a single disabled/enabled toggle rather than the tool-level access control it actually offers.'},
   {c:'Not mentioned: /debug-config, /init, /agent, and /ps &mdash; commands this guide&rsquo;s own workflows depend on.',f:'A gap in the source&rsquo;s command coverage that is not just incompleteness &mdash; these are specifically the commands a power user configuring sandbox/approval/hooks/parallel work would reach for.'}
 ]}
 ]
};

const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(SITE.key)||'{}'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem(SITE.key,JSON.stringify(v)); }catch(e){} }
};
let mem = {};
try { mem = JSON.parse(localStorage.getItem(SITE.key)||'{}'); } catch(e){ mem = {}; }
let state = mem;

const doneLab  = id => !!state['lab:'+id];
const doneQ    = (id,i) => !!state['q:'+id+':'+i];
const phaseDone = p => doneLab(p.id) && p.quiz.every((_,i)=>doneQ(p.id,i));
const phasePart = p => doneLab(p.id) || p.quiz.some((_,i)=>doneQ(p.id,i));

(function(){
  let t=null; try{ t=localStorage.getItem(SITE.key+'-theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme',t);
  $('#theme').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem(SITE.key+'-theme',next); }catch(e){}
  });
})();

document.title = SITE.title;
$('#brandname').textContent = SITE.title;
$('#brandtag').textContent  = SITE.tag;
if(typeof AUDIT === 'undefined') $('.modes button[data-mode="audit"]').remove();
$('#legend').innerHTML = '<h4>'+SITE.spine+'</h4>' + SITE.layers.map(l =>
  '<div class="row"><span class="swatch" style="background:var(--'+l.token+')"></span>'+l.label+'</div>').join('');

let mode='learn', current=PHASES[0].id;

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  render();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{ $('#q').value=''; setMode(b.dataset.mode); }));
$('#reset').addEventListener('click',()=>{
  if(!confirm('Clear all phase progress?')) return;
  state={}; store.set(state); render(); buildRail();
});

function buildRail(){
  const nav=$('#pnav'); nav.innerHTML='';
  PHASES.forEach(p=>{
    const a=el('a',p.id===current&&mode==='learn'?'on':'');
    a.href='#'+p.id;
    const cls = phaseDone(p)?'tick done':(phasePart(p)?'tick part':'tick');
    a.innerHTML='<span class="n">'+p.n+'</span><span>'+p.title+'</span><span class="'+cls+'">&#10003;</span>';
    a.addEventListener('click',e=>{ e.preventDefault(); current=p.id; if(mode!=='learn') setMode('learn'); else render(); buildRail(); window.scrollTo({top:0,behavior:'smooth'}); });
    nav.appendChild(a);
  });
}

function codeBlock(src){
  const w=el('div','codewrap');
  const pre=el('pre','',  '<code>'+esc(src)+'</code>');
  const btn=el('button','copy','copy');
  btn.addEventListener('click',()=>{
    navigator.clipboard.writeText(src).then(()=>{
      btn.textContent='copied'; btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('done'); },1400);
    }).catch(()=>{ btn.textContent='select it'; });
  });
  w.appendChild(pre); w.appendChild(btn);
  return w;
}
function tableBlock(t){
  const w=el('div','tablewrap');
  let h='<table><thead><tr>'+t.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  h+=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  h+='</tbody></table>';
  w.innerHTML=h;
  return w;
}
function sec(label,count){
  const h=el('h2','sec',label+(count!=null?' <span class="cnt">'+count+'</span>':''));
  return h;
}

function renderPhase(p){
  const v=$('#view'); v.innerHTML='';

  const totalUnits = PHASES.reduce((a,x)=>a+1+x.quiz.length,0);
  const doneUnits  = PHASES.reduce((a,x)=>a+(doneLab(x.id)?1:0)+x.quiz.filter((_,i)=>doneQ(x.id,i)).length,0);
  const pct = Math.round(doneUnits/totalUnits*100);
  const pr=el('div','prog');
  pr.innerHTML='<div class="top"><span class="lbl">Path progress</span><span class="pct">'+pct+'%</span></div>'+
    '<div class="bar">'+PHASES.map(x=>'<i class="'+(phaseDone(x)?'done':(phasePart(x)?'part':''))+'"></i>').join('')+'</div>';
  v.appendChild(pr);

  const head=el('div');
  head.innerHTML='<div class="eyebrow">Phase '+p.n+' &middot; '+p.layerLabel+' layer</div><h1 class="ptitle">'+p.title+'</h1>'+
    '<div class="meta"><span class="chip '+p.layer+'">'+p.layerLabel+'</span>'+
    '<span class="chip">'+p.time+'</span><span class="chip">prereq: '+p.pre+'</span></div>';
  v.appendChild(head);
  v.appendChild(el('div','objective',p.objective));

  v.appendChild(sec('Concepts',p.concepts.length));
  p.concepts.forEach(c=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',c.h));
    if(c.p) d.insertAdjacentHTML('beforeend',c.p);
    if(c.table) d.appendChild(tableBlock(c.table));
    if(c.code) d.appendChild(codeBlock(c.code));
    if(c.p2) d.insertAdjacentHTML('beforeend',c.p2);
    if(c.code2) d.appendChild(codeBlock(c.code2));
    v.appendChild(d);
  });

  v.appendChild(sec('Lab'));
  const lab=el('div','lab');
  lab.innerHTML='<h3>'+p.lab.title+'</h3><ol>'+p.lab.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
    '<p style="margin:14px 0 0"><b>Done when:</b> '+p.lab.verify+'</p>';
  const dl=el('div','done-line');
  const cb=el('input'); cb.type='checkbox'; cb.id='lab-'+p.id; cb.checked=doneLab(p.id);
  cb.addEventListener('change',()=>{ state['lab:'+p.id]=cb.checked; store.set(state); buildRail(); renderPhase(p); });
  const lb=el('label'); lb.htmlFor=cb.id; lb.appendChild(cb); lb.appendChild(document.createTextNode('Lab complete'));
  dl.appendChild(lb); lab.appendChild(dl);
  v.appendChild(lab);

  v.appendChild(sec('Gotchas',p.gotchas.length));
  p.gotchas.forEach(g=>{
    const d=el('div','gotcha');
    d.innerHTML='<span class="sev '+g.s+'">'+g.s+'</span><span><b>'+g.t+'</b>'+g.d+'</span>';
    v.appendChild(d);
  });

  v.appendChild(sec('Checkpoint',p.quiz.length));
  p.quiz.forEach((q,i)=>{
    const d=el('details','qa');
    d.innerHTML='<summary>'+q.q+'</summary><div class="ans">'+q.a+
      '<div class="done-line" style="border-top-color:var(--line)"><label style="color:var(--muted)">'+
      '<input type="checkbox" '+(doneQ(p.id,i)?'checked':'')+'> I could answer this without looking</label></div></div>';
    d.querySelector('input').addEventListener('change',e=>{
      state['q:'+p.id+':'+i]=e.target.checked; store.set(state); buildRail();
      const strip=$('.prog'); if(strip) renderPhase(p);
    });
    v.appendChild(d);
  });

  if(p.docs&&p.docs.length){
    v.appendChild(sec('Source docs'));
    const dd=el('div','docs');
    dd.innerHTML=p.docs.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' &#8599;</a>').join('');
    v.appendChild(dd);
  }

  const idx=PHASES.indexOf(p);
  const navd=el('div','done-line'); navd.style.borderTop='1px solid var(--line)'; navd.style.marginTop='40px';
  if(idx>0){ const b=el('button','btn','&larr; '+PHASES[idx-1].title); b.onclick=()=>{current=PHASES[idx-1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  if(idx<PHASES.length-1){ const b=el('button','btn prime',PHASES[idx+1].title+' &rarr;'); b.onclick=()=>{current=PHASES[idx+1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  v.appendChild(navd);
}

function renderRef(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Reference</div><h1 class="ptitle">Lookup and decisions</h1>'+
    '<p class="lede">'+SITE.refLede+'</p>';

  v.appendChild(sec('Decision trees',TREES.length));
  TREES.forEach(t=>{
    v.appendChild(el('h3','',t.title));
    const wrap=el('div','tree');
    t.rows.forEach(r=>{
      const b=el('div','branch');
      b.innerHTML='<span class="cond">'+r[0]+'</span><span class="arr">&rarr;</span><span class="res">'+r[1]+'<em>'+r[2]+'</em></span>';
      wrap.appendChild(b);
    });
    v.appendChild(wrap);
  });

  v.appendChild(sec('Tables',REF.length));
  REF.forEach(r=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',r.title));
    if(r.note) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin:2px 0 0">'+r.note+'</p>');
    d.appendChild(tableBlock(r));
    if(r.foot) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:8px">'+r.foot+'</p>');
    v.appendChild(d);
  });
}

let deck=[], di=0, revealed=false;
function buildDeck(){
  deck=[];
  PHASES.forEach(p=>p.quiz.forEach(q=>deck.push({q:q.q,a:q.a,src:'Phase '+p.n+' &middot; '+p.title,pid:p.id})));
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  di=0; revealed=false;
}
function renderDrill(){
  const v=$('#view'); v.innerHTML='';
  if(!deck.length) buildDeck();
  v.innerHTML='<div class="eyebrow">Drill</div><h1 class="ptitle">Recall, not recognition</h1>'+
    '<p class="lede">'+deck.length+' cards drawn from every phase checkpoint. Answer out loud before you flip &mdash; the gap between &ldquo;that looks familiar&rdquo; and &ldquo;I can state it&rdquo; is the entire point.</p>';
  const c=deck[di];
  const card=el('div','flash');
  card.innerHTML='<div class="fsrc">'+c.src+'</div><div class="fq">'+c.q+'</div>'+
    '<div class="fa'+(revealed?'':' hide')+'">'+c.a+'</div>';
  v.appendChild(card);
  const btns=el('div','fbtns');
  const flip=el('button','btn prime',revealed?'Hide answer':'Reveal answer');
  flip.onclick=()=>{ revealed=!revealed; renderDrill(); };
  const next=el('button','btn','Next card &rarr;');
  next.onclick=()=>{ di=(di+1)%deck.length; revealed=false; renderDrill(); };
  const goto=el('button','btn','Go to phase');
  goto.onclick=()=>{ current=c.pid; setMode('learn'); buildRail(); scrollTo({top:0}); };
  const shuf=el('button','btn','Shuffle');
  shuf.onclick=()=>{ buildDeck(); renderDrill(); };
  btns.appendChild(flip); btns.appendChild(next); btns.appendChild(goto); btns.appendChild(shuf);
  btns.appendChild(el('span','counter',(di+1)+' / '+deck.length));
  v.appendChild(btns);
  v.appendChild(el('p','cap','Keyboard: <kbd>space</kbd> flip &middot; <kbd>&rarr;</kbd> next'));
}

function renderAudit(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Audit</div><h1 class="ptitle">'+SITE.auditTitle+'</h1>'+
    '<p class="lede">'+AUDIT.intro+'</p>';
  AUDIT.groups.forEach(g=>{
    v.appendChild(sec(g.label,g.items.length));
    g.items.forEach(it=>{
      const d=el('div','verdict');
      d.innerHTML='<span class="vtag '+g.tag+'">'+g.tag+'</span><span><span class="claim">'+it.c+'</span><span class="fix">'+it.f+'</span></span>';
      v.appendChild(d);
    });
  });
  v.insertAdjacentHTML('beforeend','<hr class="hr"><p class="cap" style="margin-top:18px">'+SITE.verifiedAgainst+' Claims I could not confirm are marked <span class="unv">unverified</span> rather than restated as fact.</p>');
}

function buildIndex(){
  const ix=[];
  PHASES.forEach(p=>{
    ix.push({t:'Phase '+p.n+': '+p.title,k:'phase',body:p.objective+' '+p.concepts.map(c=>c.h).join(' '),go:()=>{current=p.id;setMode('learn');buildRail();}});
    p.concepts.forEach(c=>ix.push({t:c.h,k:'Phase '+p.n,body:(c.p||'')+(c.p2||'')+(c.code||'')+(c.code2||''),go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.gotchas.forEach(g=>ix.push({t:g.t,k:'gotcha &middot; Phase '+p.n,body:g.d,go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.quiz.forEach(q=>ix.push({t:q.q,k:'checkpoint &middot; Phase '+p.n,body:q.a,go:()=>{current=p.id;setMode('learn');buildRail();}}));
  });
  REF.forEach(r=>ix.push({t:r.title,k:'reference table',body:(r.note||'')+' '+r.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  TREES.forEach(t=>ix.push({t:t.title,k:'decision tree',body:t.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  if(typeof AUDIT!=='undefined') AUDIT.groups.forEach(g=>g.items.forEach(i=>ix.push({t:i.c.replace(/<[^>]+>/g,''),k:'audit &middot; '+g.label,body:i.f,go:()=>setMode('audit')})));
  return ix;
}
let INDEX=[];
function renderSearch(term){
  const v=$('#view'); v.innerHTML='';
  const t=term.toLowerCase();
  const hits=INDEX.filter(x=>(x.t+' '+x.body).toLowerCase().replace(/<[^>]+>/g,'').includes(t)).slice(0,40);
  v.innerHTML='<div class="eyebrow">Search</div><h1 class="ptitle">'+hits.length+' result'+(hits.length===1?'':'s')+' for &ldquo;'+esc(term)+'&rdquo;</h1>';
  if(!hits.length){ v.appendChild(el('p','empty','Nothing matched. Try a config key, a command, or a slash command.')); return; }
  const w=el('div','hits');
  hits.forEach(h=>{
    const a=el('a','hit'); a.href='#';
    a.innerHTML='<small>'+h.k+'</small><b>'+h.t+'</b>';
    a.addEventListener('click',e=>{ e.preventDefault(); $('#q').value=''; h.go(); scrollTo({top:0}); });
    w.appendChild(a);
  });
  v.appendChild(w);
}

function render(){
  const term=$('#q').value.trim();
  if(term.length>1){ renderSearch(term); return; }
  if(mode==='learn') renderPhase(PHASES.find(p=>p.id===current));
  else if(mode==='ref') renderRef();
  else if(mode==='drill') renderDrill();
  else if(typeof AUDIT!=='undefined') renderAudit(); else renderRef();
}

$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'&&document.activeElement===$('#q')){ $('#q').value=''; $('#q').blur(); render(); }
  if(mode==='drill'&&document.activeElement!==$('#q')){
    if(e.key===' '){ e.preventDefault(); revealed=!revealed; renderDrill(); }
    if(e.key==='ArrowRight'){ di=(di+1)%deck.length; revealed=false; renderDrill(); }
  }
});

INDEX=buildIndex();
buildRail();
render();
</script>
</body>
</html>
