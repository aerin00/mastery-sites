,344 590,330 620,308 650,290 680,278\" fill=\"none\" stroke=\"#ff9800\" stroke-width=\"2.5\"><\u002Fpolyline>\n  <circle cx=\"530\" cy=\"374\" r=\"6\" fill=\"#26a69a\"><\u002Fcircle><text x=\"530\" y=\"394\" font-size=\"11\" fill=\"#26a69a\" text-anchor=\"middle\">S<\u002Ftext>\n  <polygon points=\"560,368 553,380 567,380\" fill=\"#9ccc65\"><\u002Fpolygon><text x=\"560\" y=\"394\" font-size=\"11\" fill=\"#9ccc65\" text-anchor=\"middle\">T<\u002Ftext>\n  <line x1=\"530\" y1=\"346\" x2=\"530\" y2=\"366\" stroke=\"#9aa3b2\" stroke-width=\"1\" marker-end=\"url(#ar2)\"><\u002Fline>\n  <text x=\"430\" y=\"392\" font-size=\"11\" fill=\"#9aa3b2\" text-anchor=\"end\">leg dipped below 50 → aqua crosses above orange inside window<\u002Ftext>\n\n    <\u002Fsvg>\n    <ol>\n      <li><b>DTM.<\u002Fb> Panel reads <em>Next LOW? | #361 · State: Upcoming · Nearest remaining 09-24 to 09-28 (4.1)<\u002Fem>. Label on chart says <b>Confirmed H<\u002Fb>. The map wants a bottom; the countdown is your alarm.<\u002Fli>\n      <li><b>DTF ribbon.<\u002Fb> Teal, table says <em>Bullish · Middle<\u002Fem>. Longs permitted. A low inside the window would be a Table 2.2 row-1 continuation entry.<\u002Fli>\n      <li><b>Pullback.<\u002Fb> Aqua and orange fall below the dotted 50 while price drifts toward the window. Midpoint requirement met. No action.<\u002Fli>\n      <li><b>Setup.<\u002Fb> On 09-25, inside the orange DTM band and the teal TRZ overlap, aqua crosses above orange. A teal <b>S<\u002Fb> prints at the bottom of the pane and the orange invalidation line appears on price one tick under the leg low. Stop level is now known.<\u002Fli>\n      <li><b>Trigger.<\u002Fb> Next bar closes above the prior close. Lime <b>▲ DTF<\u002Fb> under the bar, <b>T<\u002Fb> in the pane. Enter long at that close.<\u002Fli>\n      <li><b>Manage.<\u002Fb> Yellow <b>2U<\u002Fb>; aqua U1 and purple U2 both at the invalidation. Scale half on <b>U1 ✕<\u002Fb> after the trail tightens; let U2 ride the cycle stop until the ribbon turns orange and a bearish daily cross arms it.<\u002Fli>\n      <li><b>Resolve.<\u002Fb> When the low confirms, DTM scores #361 as a hit.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;border-left:4px solid var(--red)\">\n    <h3 style=\"margin-top:0;color:var(--red)\">Example 2: Short, top inside a window<\u002Fh3>\n\n    <svg sc-camel-view-box=\"0 0 900 400\" width=\"100%\" role=\"img\" aria-label=\"Short example\">\n      <defs><marker id=\"ar2\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#9aa3b2\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n      <rect x=\"0\" y=\"0\" width=\"900\" height=\"400\" fill=\"#0b0d12\"><\u002Frect>\n      <rect x=\"40\" y=\"16\" width=\"820\" height=\"200\" fill=\"#12151d\" stroke=\"#2a3040\"><\u002Frect>\n      <rect x=\"40\" y=\"244\" width=\"820\" height=\"140\" fill=\"#12151d\" stroke=\"#2a3040\"><\u002Frect>\n      <text x=\"46\" y=\"30\" font-size=\"11\" fill=\"#9aa3b2\">Price (daily)<\u002Ftext>\n      <text x=\"46\" y=\"258\" font-size=\"11\" fill=\"#9aa3b2\">DTF pane<\u002Ftext>\n      <line x1=\"40\" y1=\"272\" x2=\"860\" y2=\"272\" stroke=\"#ef5350\" stroke-dasharray=\"4 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"276\" font-size=\"10\" fill=\"#ef5350\">80<\u002Ftext>\n      <line x1=\"40\" y1=\"314\" x2=\"860\" y2=\"314\" stroke=\"#787b86\" stroke-dasharray=\"2 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"318\" font-size=\"10\" fill=\"#9aa3b2\">50<\u002Ftext>\n      <line x1=\"40\" y1=\"356\" x2=\"860\" y2=\"356\" stroke=\"#26a69a\" stroke-dasharray=\"4 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"360\" font-size=\"10\" fill=\"#26a69a\">20<\u002Ftext>\n      \n  <rect x=\"395\" y=\"16\" width=\"120\" height=\"200\" fill=\"#ff9800\" opacity=\".18\"><\u002Frect>\n  <rect x=\"43 -width=\"1.5\"><\u002Fline><rect x=\"76\" y=\"142\" width=\"8\" height=\"8\" fill=\"#26a69a\"><\u002Frect><line x1=\"140\" y1=\"130\" x2=\"140\" y2=\"150\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"136\" y=\"132\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"200\" y1=\"120\" x2=\"200\" y2=\"140\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"196\" y=\"124\" width=\"8\" height=\"8\" fill=\"#26a69a\"><\u002Frect><line x1=\"260\" y1=\"112\" x2=\"260\" y2=\"134\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"256\" y=\"116\" width=\"8\" height=\"8\" fill=\"#26a69a\"><\u002Frect><line x1=\"320\" y1=\"120\" x2=\"320\" y2=\"140\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"316\" y=\"116\" width=\"8\" height=\"20\" fill=\"#ef5350\"><\u002Frect><line x1=\"380\" y1=\"130\" x2=\"380\" y2=\"158\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"376\" y=\"136\" width=\"8\" height=\"16\" fill=\"#ef5350\"><\u002Frect><line x1=\"440\" y1=\"146\" x2=\"440\" y2=\"164\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"436\" y=\"148\" width=\"8\" height=\"4\" fill=\"#26a69a\"><\u002Frect><line x1=\"500\" y1=\"140\" x2=\"500\" y2=\"176\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"496\" y=\"148\" width=\"8\" height=\"12\" fill=\"#ef5350\"><\u002Frect><line x1=\"560\" y1=\"150\" x2=\"560\" y2=\"170\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"556\" y=\"154\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect><line x1=\"620\" y1=\"144\" x2=\"620\" y2=\"162\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"616\" y=\"148\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect><line x1=\"680\" y1=\"138\" x2=\"680\" y2=\"156\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"676\" y=\"142\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect>\n  <line x1=\"440\" y1=\"167\" x2=\"530\" y2=\"167\" stroke=\"#ff9800\" stroke-width=\"2\"><\u002Fline><text x=\"534\" y=\"171\" font-size=\"11\" fill=\"#ff9800\" text-anchor=\"start\">invalidation (leg low − 1 tick)<\u002Ftext>\n  <circle cx=\"500\" cy=\"176\" r=\"10\" fill=\"none\" stroke=\"#ef5350\" stroke-width=\"2\"><\u002Fcircle><text x=\"500\" y=\"196\" font-size=\"11\" fill=\"#ef5350\" text-anchor=\"middle\">wick through<\u002Ftext>\n  <rect x=\"40\" y=\"228\" width=\"820\" height=\"8\" fill=\"#26a69a\"><\u002Frect>\n  <polyline points=\"80,270 140,290 200,310 260,330 320,346 380,352 440,344 500,336 560,342 620,350 680,356\" fill=\"none\" stroke=\"#26c6da\" stroke-width=\"2.5\"><\u002Fpolyline>\n  <polyline points=\"80,274 140,292 200,308 260,326 320,340 380,350 440,348 500,342 560,340 620,344 680,350\" fill=\"none\" stroke=\"#ff9800\" stroke-width=\"2.5\"><\u002Fpolyline>\n  <circle cx=\"440\" cy=\"374\" r=\"6\" fill=\"#26a69a\"><\u002Fcircle><text x=\"440\" y=\"394\" font-size=\"11\" fill=\"#26a69a\" text-anchor=\"middle\">S<\u002Ftext>\n  <text x=\"500\" y=\"320\" font-size=\"18\" fill=\"#787b86\" text-anchor=\"middle\">✕<\u002Ftext><text x=\"500\" y=\"300\" font-size=\"11\" fill=\"#9aa3b2\" text-anchor=\"middle\">Cancelled: invalidation breached<\u002Ftext>\n  <text x=\"700\" y=\"392\" font-size=\"11\" fill=\"#9aa3b2\" text-anchor=\"end\">C. Setup that fails: S printed, next bar breached the orange line, grey X, no trigger<\u002Ftext>\n\n    <\u002Fsvg>\n    <div style=\"overflow-x:auto\"><sc-raw-table>\n      <sc-raw-tr><sc-raw-th style=\"width:26%\">Situation<\u002Fsc-raw-th><sc-raw-th>What you see<\u002Fsc-raw-th><sc-raw-th>Why you do nothing<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td><b>Window with no setup<\u002Fb><\u002Fsc-raw-td>\n        <sc-raw-td>DTM band is <em>Active<\u002Fem>, then the countdown passes and State reads <em>Elapsed: confirmation pending<\u002Fem>. In the DTF pane aqua and orange are tangled mid-range around 50 with no cross.<\u002Fsc-raw-td>\n        <sc-raw-td>Timing without momentum confirmation is a forecast, not a signal. Wait for the next confirmed pivot; DTM will issue a fresh version.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td><b>Setup without permission<\u002Fb><\u002Fsc-raw-td>\n        <sc-raw-td>Aqua crosses above orange from below 20, a textbook daily bullish reversal, but no <b>S<\u002Fb> prints. Ribbon is red, table says <em>Context blocks new entries<\u002Fem>.<\u002Fsc-raw-td>\n        <sc-raw-td>The weekly is bearish. Table 2.2 row 3 territory: the only permitted trade is a short after a bearish daily cross. A tempting long here is exactly what the filter exists to refuse.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td><b>Setup that fails<\u002Fb><\u002Fsc-raw-td>\n        <sc-raw-td>Teal <b>S<\u002Fb> prints inside a DTM window; orange invalidation line appears. Next bar wicks below that line. Grey <b>✕<\u002Fb> at 50 in the pane; table says <em>Cancelled: invalidation breached<\u002Fem>. Orange line disappears.<\u002Fsc-raw-td>\n        <sc-raw-td>The setup retired before any trigger, so there was never an entry to take. If a fresh cross prints later inside the window, it is a new setup with a new invalidation.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n      <sc-raw-tr>\n        <sc-raw-td><b>Trigger with no window<\u002Fb><\u002Fsc-raw-td>\n        <sc-raw-td>Lime <b>▲ DTF<\u002Fb> fires in mid-July. DTM shows no orange band for three weeks in either direction; State is <em>Upcoming<\u002Fem> with a long countdown.<\u002Fsc-raw-td>\n        <sc-raw-td>Valid DTF signal, but outside the timing filter. Either skip it or take it at reduced size and log it separately, so the Scorecard comparison stays honest.<\u002Fsc-raw-td>\n      <\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0\">\n    <b>The short version:<\u002Fb> DTM says <em>when<\u002Fem>, the ribbon says <em>which way<\u002Fem>, <b>S<\u002Fb> says <em>ready<\u002Fem>, <b>T<\u002Fb> says <em>go<\u002Fem>, the orange line says <em>out<\u002Fem>. Any step missing means no trade.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"walkthrough\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Trade walkthrough<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Executing a high-probability trade, start to finish<\u002Fdiv>\n        <\u002Fheader>\n<p>A single pass, start to finish, through one trade using both indicators. It assumes a daily chart with the weekly as the DTF higher time frame, DTM loaded on the same chart, and DTF management (2U / U1 / U2) switched on. Nothing here places orders; every step is a check you make by eye, then an action you take at your broker.<\u002Fp>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <svg sc-camel-view-box=\"0 0 900 120\" width=\"100%\" role=\"img\" aria-label=\"Trade walkthrough steps\">\n      <defs><marker id=\"ar3\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#9aa3b2\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n      <g font-size=\"12\" fill=\"#e6e8ee\" text-anchor=\"middle\">\n        <rect x=\"10\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect><text x=\"75\" y=\"55\">1. Window<\u002Ftext><text x=\"75\" y=\"73\" fill=\"#9aa3b2\" font-size=\"11\">DTM Active<\u002Ftext>\n        <line x1=\"140\" y1=\"60\" x2=\"182\" y2=\"60\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fline>\n        <rect x=\"185\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ff9800\"><\u002Frect><text x=\"250\" y=\"55\">2. Permission<\u002Ftext><text x=\"250\" y=\"73\" fill=\"#9aa3b2\" font-size=\"11\">ribbon agrees<\u002Ftext>\n        <line x1=\"315\" y1=\"60\" x2=\"357\" y2=\"60\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fline>\n        <rect x=\"360\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect><text x=\"425\" y=\"55\">3. Setup<\u002Ftext><text x=\"425\" y=\"73\" fill=\"#9aa3b2\" font-size=\"11\">S + invalidation<\u002Ftext>\n        <line x1=\"490\" y1=\"60\" x2=\"532\" y2=\"60\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fline>\n        <rect x=\"535\" y=\"30\" width=\"130\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#9ccc65\"><\u002Frect><text x=\"600\" y=\"55\">4. Trigger<\u002Ftext><text x=\"600\" y=\"73\" fill=\"#9aa3b2\" font-size=\"11\">T: place order<\u002Ftext>\n        <line x1=\"665\" y1=\"60\" x2=\"707\" y2=\"60\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#ar3)\"><\u002Fline>\n        <rect x=\"710\" y=\"30\" width=\"180\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ab47bc\"><\u002Frect><text x=\"800\" y=\"55\">5. Manage and exit<\u002Ftext><text x=\"800\" y=\"73\" fill=\"#9aa3b2\" font-size=\"11\">U1 / U2, then score<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"wt-tree\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Decision tree &amp; checklist<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Five ordered gates, then size and manage<\u002Fdiv>\n        <\u002Fheader>\n\n  <p style=\"color:var(--muted);font-size:13px\">Every gate is a yes/no read off one panel row. \"No\" always means the same thing: do nothing and wait for the next event. There is no discretionary branch until the position is on.<\u002Fp>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <svg sc-camel-view-box=\"0 0 900 640\" width=\"100%\" role=\"img\" aria-label=\"DTF and DTM trade decision tree\">\n      <defs><marker id=\"ar4\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#9aa3b2\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n      <g font-size=\"12\" fill=\"#e6e8ee\" text-anchor=\"middle\">\n        \n        <rect x=\"250\" y=\"10\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"450\" y=\"32\" font-weight=\"700\">1. DTM State reads Active (or Upcoming, Countdown ≤ 3)?<\u002Ftext>\n        <text x=\"450\" y=\"50\" fill=\"#9aa3b2\" font-size=\"11\">DTM Compact · State, Countdown · note Next HIGH? or LOW?<\u002Ftext>\n        <line x1=\"650\" y1=\"38\" x2=\"760\" y2=\"38\" stroke=\"#ef5350\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"705\" y=\"30\" fill=\"#ef5350\" font-size=\"11\">no<\u002Ftext>\n        <rect x=\"765\" y=\"20\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1d1414\" stroke=\"#ef5350\"><\u002Frect><text x=\"827\" y=\"43\">Wait: no window<\u002Ftext>\n        <line x1=\"450\" y1=\"66\" x2=\"450\" y2=\"94\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"465\" y=\"84\" fill=\"#9ccc65\" font-size=\"11\">yes<\u002Ftext>\n        \n        <rect x=\"250\" y=\"98\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"450\" y=\"120\" font-weight=\"700\">2. Window grade passes?<\u002Ftext>\n        <text x=\"450\" y=\"138\" fill=\"#9aa3b2\" font-size=\"11\">Score ≥ 2 · ≥ 2 unique intervals · not Broad range · Range support YES<\u002Ftext>\n        <line x1=\"650\" y1=\"126\" x2=\"760\" y2=\"126\" stroke=\"#ef5350\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"705\" y=\"118\" fill=\"#ef5350\" font-size=\"11\">no<\u002Ftext>\n        <rect x=\"765\" y=\"108\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1d1414\" stroke=\"#ef5350\"><\u002Frect><text x=\"827\" y=\"131\">Watch only<\u002Ftext>\n        <line x1=\"450\" y1=\"154\" x2=\"450\" y2=\"182\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"465\" y=\"172\" fill=\"#9ccc65\" font-size=\"11\">yes<\u002Ftext>\n        \n        <rect x=\"250\" y=\"186\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ff9800\"><\u002Frect>\n        <text x=\"450\" y=\"208\" font-weight=\"700\">3. DTF HTF permission in the window's direction?<\u002Ftext>\n        <text x=\"450\" y=\"226\" fill=\"#9aa3b2\" font-size=\"11\">DTF table · Confirmed context · Status not \"Context blocks new entries\"<\u002Ftext>\n        <line x1=\"650\" y1=\"214\" x2=\"760\" y2=\"214\" stroke=\"#ef5350\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"705\" y=\"206\" fill=\"#ef5350\" font-size=\"11\">no<\u002Ftext>\n        <rect x=\"765\" y=\"196\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1d1414\" stroke=\"#ef5350\"><\u002Frect><text x=\"827\" y=\"219\">Skip: weekly disagrees<\u002Ftext>\n        <line x1=\"450\" y1=\"242\" x2=\"450\" y2=\"270\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"465\" y=\"260\" fill=\"#9ccc65\" font-size=\"11\">yes<\u002Ftext>\n        \n        <rect x=\"250\" y=\"274\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"450\" y=\"296\" font-weight=\"700\">4. DTF S printed inside the window, same direction?<\u002Ftext>\n        <text x=\"450\" y=\"314\" fill=\"#9aa3b2\" font-size=\"11\">DTF pane · S mark + orange invalidation line · Status \"Armed\"<\u002Ftext>\n        <line x1=\"650\" y1=\"302\" x2=\"760\" y2=\"302\" stroke=\"#ef5350\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"705\" y=\"294\" fill=\"#ef5350\" font-size=\"11\">no<\u002Ftext>\n        <rect x=\"765\" y=\"284\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1d1414\" stroke=\"#ef5350\"><\u002Frect><text x=\"827\" y=\"307\">Wait for S<\u002Ftext>\n        <line x1=\"450\" y1=\"330\" x2=\"450\" y2=\"358\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"465\" y=\"348\" fill=\"#9ccc65\" font-size=\"11\">yes → size off orange line<\u002Ftext>\n        \n        <rect x=\"250\" y=\"362\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#9ccc65\"><\u002Frect>\n        <text x=\"450\" y=\"384\" font-weight=\"700\">5. Closed-bar T within 3 bars, before any breach?<\u002Ftext>\n        <text x=\"450\" y=\"402\" fill=\"#9aa3b2\" font-size=\"11\">DTF pane · ▲/▼ DTF marker · Last event \"Price trigger\"<\u002Ftext>\n        <line x1=\"650\" y1=\"390\" x2=\"760\" y2=\"390\" stroke=\"#ef5350\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"705\" y=\"382\" fill=\"#ef5350\" font-size=\"11\">no (grey ✕)<\u002Ftext>\n        <rect x=\"765\" y=\"372\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1d1414\" stroke=\"#ef5350\"><\u002Frect><text x=\"827\" y=\"395\">Retired: back to 4<\u002Ftext>\n        <line x1=\"450\" y1=\"418\" x2=\"450\" y2=\"446\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline><text x=\"465\" y=\"436\" fill=\"#9ccc65\" font-size=\"11\">yes<\u002Ftext>\n        \n        <rect x=\"250\" y=\"450\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#14201a\" stroke=\"#9ccc65\"><\u002Frect>\n        <text x=\"450\" y=\"472\" font-weight=\"700\" fill=\"#9ccc65\">ENTER: two halves (U1, U2), stop at table invalidation<\u002Ftext>\n        <text x=\"450\" y=\"490\" fill=\"#9aa3b2\" font-size=\"11\">Size so entry-to-stop = one risk unit · never widen the stop<\u002Ftext>\n        <line x1=\"450\" y1=\"506\" x2=\"450\" y2=\"534\" stroke=\"#ab47bc\" stroke-width=\"2\" marker-end=\"url(#ar4)\"><\u002Fline>\n        \n        <rect x=\"250\" y=\"538\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ab47bc\"><\u002Frect>\n        <text x=\"450\" y=\"560\" font-weight=\"700\">MANAGE: move stops to U1 / U2 next protection daily<\u002Ftext>\n        <text x=\"450\" y=\"578\" fill=\"#9aa3b2\" font-size=\"11\">Flat on U1 → half out · Flat on U2 → done · opposite DTM window Active → tighten U2<\u002Ftext>\n        <line x1=\"650\" y1=\"566\" x2=\"760\" y2=\"566\" stroke=\"#9aa3b2\" stroke-width=\"1.5\" marker-end=\"url(#ar4)\"><\u002Fline>\n        <rect x=\"765\" y=\"548\" width=\"125\" height=\"36\" rx=\"6\" fill=\"#1e2230\" stroke=\"#787b86\"><\u002Frect><text x=\"827\" y=\"571\">Log · Scorecard<\u002Ftext>\n        \n        <rect x=\"10\" y=\"98\" width=\"220\" height=\"132\" rx=\"8\" fill=\"#12191c\" stroke=\"#26c6da\"><\u002Frect>\n        <text x=\"120\" y=\"118\" fill=\"#26c6da\" font-weight=\"700\">Size modifiers (gate 2)<\u002Ftext>\n        <text x=\"120\" y=\"140\" font-size=\"11\">Score ≥ 4, both overlaps: full<\u002Ftext>\n        <text x=\"120\" y=\"158\" font-size=\"11\">Score 2–4 or one overlap: half<\u002Ftext>\n        <text x=\"120\" y=\"176\" font-size=\"11\">◆ level or ● mom on label: +<\u002Ftext>\n        <text x=\"120\" y=\"194\" font-size=\"11\">Coverage &gt; 40 units: half<\u002Ftext>\n        <text x=\"120\" y=\"212\" font-size=\"11\" fill=\"#9aa3b2\">Modifiers never turn a no into a yes<\u002Ftext>\n        <rect x=\"10\" y=\"362\" width=\"220\" height=\"74\" rx=\"8\" fill=\"#1c1a14\" stroke=\"#ff9800\"><\u002Frect>\n        <text x=\"120\" y=\"382\" fill=\"#ff9800\" font-weight=\"700\">Cancel at any time if<\u002Ftext>\n        <text x=\"120\" y=\"402\" font-size=\"11\">Orange line breached (grey ✕)<\u002Ftext>\n        <text x=\"120\" y=\"420\" font-size=\"11\">Status → \"Context blocks new entries\"<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <h3>The same tree as a checklist<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <p style=\"color:var(--muted);font-size:13px\">Tick top to bottom. The first unticked box is where you stop. Copy this into your journal for each trade.<\u002Fp>\n    <div style=\"overflow-x:auto\"><sc-raw-table>\n      <sc-raw-tr><sc-raw-th style=\"width:36px\">☐<\u002Fsc-raw-th><sc-raw-th>Gate<\u002Fsc-raw-th><sc-raw-th>Where to look<\u002Fsc-raw-th><sc-raw-th>Pass condition<\u002Fsc-raw-th><sc-raw-th>If it fails<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>1. Timing<\u002Fsc-raw-td><sc-raw-td>DTM Compact · State, Countdown<\u002Fsc-raw-td><sc-raw-td>Active, or Upcoming with Countdown ≤ 3<\u002Fsc-raw-td><sc-raw-td>Wait<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>2. Window quality<\u002Fsc-raw-td><sc-raw-td>DTM Window evidence · Score components, unique counts, Range support<\u002Fsc-raw-td><sc-raw-td>Score ≥ 2, ≥ 2 unique intervals, Range support YES, not Broad range<\u002Fsc-raw-td><sc-raw-td>Watch only<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>3. Permission<\u002Fsc-raw-td><sc-raw-td>DTF table · Confirmed context, Status<\u002Fsc-raw-td><sc-raw-td>HTF direction allows the window's direction; Status is not \"Context blocks new entries\"<\u002Fsc-raw-td><sc-raw-td>Skip<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>4. Setup<\u002Fsc-raw-td><sc-raw-td>DTF pane · S mark, orange line<\u002Fsc-raw-td><sc-raw-td>S in the window's direction, printed inside the window; Status \"Armed\"<\u002Fsc-raw-td><sc-raw-td>Wait for S<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>Size<\u002Fsc-raw-td><sc-raw-td>Orange invalidation line<\u002Fsc-raw-td><sc-raw-td>Shares = risk unit ÷ (expected entry − invalidation), then apply gate-2 modifiers<\u002Fsc-raw-td><sc-raw-td>Reduce size, never move the stop<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>5. Trigger<\u002Fsc-raw-td><sc-raw-td>DTF pane · ▲ / ▼ DTF, Last event<\u002Fsc-raw-td><sc-raw-td>Closed-bar T within 3 bars of S with no breach<\u002Fsc-raw-td><sc-raw-td>Grey ✕: back to gate 4<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>Enter<\u002Fsc-raw-td><sc-raw-td>Broker<\u002Fsc-raw-td><sc-raw-td>Two halves, stop for both at Last trigger / invalidation<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>Manage<\u002Fsc-raw-td><sc-raw-td>DTF table · U1 / U2 next protection, daily after close<\u002Fsc-raw-td><sc-raw-td>Stops moved to the shown levels; Flat means that half is out<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>☐<\u002Fsc-raw-td><sc-raw-td>Review<\u002Fsc-raw-td><sc-raw-td>DTM Scorecard, Journal<\u002Fsc-raw-td><sc-raw-td>Note window score, flags, outcome; log \"inside window: yes\"<\u002Fsc-raw-td><sc-raw-td><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0\">\n      <b>Two rules that make the tree work:<\u002Fb> gates 1 to 5 are strictly ordered and none can be skipped or satisfied later out of order; and size modifiers scale a trade you have already qualified, they never rescue one that failed a gate.\n    <\u002Fdiv>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"wt-panels\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Which panel at each step<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Where to look, and which rows matter<\u002Fdiv>\n        <\u002Fheader>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <div style=\"overflow-x:auto\"><sc-raw-table>\n      <sc-raw-tr><sc-raw-th>Step<\u002Fsc-raw-th><sc-raw-th>Panel and view<\u002Fsc-raw-th><sc-raw-th>Rows that matter<\u002Fsc-raw-th><sc-raw-th>Reading guide<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>1. Window<\u002Fsc-raw-td><sc-raw-td>DTM, <b>Compact<\u002Fb> (default), then <b>Window evidence<\u002Fb> for the window you intend to trade<\u002Fsc-raw-td><sc-raw-td>Next HIGH?/LOW?, State, Nearest remaining, Countdown, Coverage; then Score components, Directional / cycle unique, Range support at peak<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtm-dash\">DTM dashboard views<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>2. Permission<\u002Fsc-raw-td><sc-raw-td>DTF status table<\u002Fsc-raw-td><sc-raw-td>Confirmed context, HTF close (UTC), Status<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtf-table\">DTF table<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>3. Setup<\u002Fsc-raw-td><sc-raw-td>DTF status table; DTM Compact<\u002Fsc-raw-td><sc-raw-td>DTF: Status (Armed), Last event. DTM: Momentum (\"in window: YES\"), Price levels (\"at level\")<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtf-table\">DTF table<\u002Fa>, <a href=\"#dtm-ext\">DTM extensions<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>4. Trigger<\u002Fsc-raw-td><sc-raw-td>DTF status table<\u002Fsc-raw-td><sc-raw-td>Last event (Price trigger), Last trigger / invalidation<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtf-table\">DTF table<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>5. Manage<\u002Fsc-raw-td><sc-raw-td>DTF status table, daily after the close<\u002Fsc-raw-td><sc-raw-td>U1 / U2 next protection<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtf-lifecycle\">Setup lifecycle<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>After<\u002Fsc-raw-td><sc-raw-td>DTM <b>Scorecard<\u002Fb>, then <b>Journal<\u002Fb><\u002Fsc-raw-td><sc-raw-td>Model hit rate, Paired model minus baseline, Hits with time+price+momentum; Journal line for this forecast<\u002Fsc-raw-td><sc-raw-td><a href=\"#dtm-dash\">DTM dashboard views<\u002Fa><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <p style=\"color:var(--muted);font-size:13px\">Switch views under <b>Inputs › 7. Dashboard and review › Dashboard view<\u002Fb>. Changing the view never changes the forecast.<\u002Fp>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"wt-window\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">How to read a window<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Label, Compact rows, Window evidence<\u002Fdiv>\n        <\u002Fheader>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <p>A window is one orange vertical band plus its label. Three places describe the same window at increasing depth, and you should read them in this order before committing to Step 1.<\u002Fp>\n    <h4>1. The chart label<\u002Fh4>\n    <p>Reads <b>Next LOW?<\u002Fb> (or HIGH?) on line one and a number such as <b>4.97<\u002Fb> on line two, optionally followed by <b>◆ level<\u002Fb> and <b>● mom<\u002Fb>. The number is the support score: roughly how many independent historical intervals pointed at this window, plus bonuses. It is not a probability and it does not say how far price will move. Hover the label for a tooltip with the issue date, the full window text, the state, and the outcome once resolved.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px\">\n      <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--aqua);background:#12191c;margin:0\"><b>Score 4 or higher, inside the darkest overlaps:<\u002Fb> a strong window. Full size if Steps 2 to 4 pass.<\u002Fdiv>\n      <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;margin:0\"><b>Score 2 to 4, or outside one of the overlaps:<\u002Fb> ordinary. Take the trade at reduced size, or require ◆ level or ● mom before Step 4.<\u002Fdiv>\n      <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--red);background:#1d1414;margin:0\"><b>Score under 2, or \"Broad range\":<\u002Fb> a range with no point-supported peak. Treat it as a heads-up, not a trade window.<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"color:var(--muted);font-size:13px\">Thresholds are rules of thumb for a daily chart with default inputs; calibrate them against this symbol's Scorecard, not against these numbers.<\u002Fp>\n\n    <h4>2. The Compact rows<\u002Fh4>\n    <ul>\n      <li><b>Nearest remaining<\u002Fb> reads <code>2026-08-05 to 2026-08-07 | 2.50<\u002Fcode>: first day, last day, score. In Bars mode the dates become \"bar N\".<\u002Fli>\n      <li><b>Strongest at issuance<\u002Fb> uses the same format for the top-scored window. If the nearest and strongest differ, the nearest is where you start watching and the strongest is where the evidence concentrates. Trading the nearest at half size and the strongest at full size is a reasonable default.<\u002Fli>\n      <li><b>State<\u002Fb>: <em>Upcoming<\u002Fem> means no window has opened, <em>Active<\u002Fem> means you are inside one now, <em>Window elapsed: confirmation pending<\u002Fem> means all windows passed and DTM is waiting to see whether the pivot lands. Only <em>Active<\u002Fem>, or <em>Upcoming<\u002Fem> with a short Countdown, justifies moving to Step 2.<\u002Fli>\n      <li><b>Coverage / continuous span<\u002Fb>: total units the windows cover and the longest unbroken run. Around 15 units in a 90-unit horizon is specific; 40 or more is vague and deserves smaller size.<\u002Fli>\n    <\u002Ful>\n\n    <h4>3. Window evidence view<\u002Fh4>\n    <p>Set <b>Window to inspect<\u002Fb> to the window you intend to trade. Then check three rows:<\u002Fp>\n    <ul>\n      <li><b>Score components at peak<\u002Fb>: <code>Points 3.00 + range 1 + max* 1 + theory 0<\u002Fcode>. Points come from historical intervals landing on this day; range and max are bonuses. A window whose score is mostly bonuses with under 2 points is weaker than the headline number suggests.<\u002Fli>\n      <li><b>Directional unique / cycle unique<\u002Fb>: how many <em>different<\u002Fem> historical swings voted. Three uniques from three swings beats five votes from anchor variants of one swing. Under 2 total uniques is thin.<\u002Fli>\n      <li><b>Range support at peak<\u002Fb>: <em>TRZ YES<\u002Fem> and <em>Time Band YES<\u002Fem> means the peak sits inside both classic ranges. \"Broad empirical overlap, no point-supported peak\" means there is no peak at all; downgrade the window.<\u002Fli>\n    <\u002Ful>\n    <p>The <b>Supporting sample IDs and anchor dates<\u002Fb> rows name the historical swings behind the votes. Glance at them on the chart: if they are all from one unusual period, the window inherits that period's character.<\u002Fp>\n\n    <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0\">\n      <b>Window checklist for Step 1:<\u002Fb> State Active or about to be · score in the ordinary or strong band · at least two unique intervals · Range support YES on both · not a Broad range. A window that fails two of these is a watch item, not a trade.\n    <\u002Fdiv>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"wt-steps\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">The five steps, in order<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">From live window to scored outcome<\u002Fdiv>\n        <\u002Fheader>\n<h3>Step 1: Confirm a timing window is live<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ul>\n      <li>Open the DTM dashboard. <b>State<\u002Fb> must read <em>Active<\u002Fem>, or <em>Upcoming<\u002Fem> with a Countdown of a few bars, and the next pivot type (HIGH or LOW) tells you the direction you are allowed to look for.<\u002Fli>\n      <li>Prefer windows that sit inside both overlaps (the darker teal band). A single-model window is a weaker forecast; either skip it or plan half size. Grade the window with the checklist in \"How to read a window\" above.<\u002Fli>\n      <li><b>Action:<\u002Fb> write down the direction (long for a LOW forecast, short for a HIGH forecast) and the window end date. If the window is not live, stop here.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <h3>Step 2: Check higher-time-frame permission<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ul>\n      <li>Look at the DTF ribbon and the <b>Confirmed context<\u002Fb> row of the DTF table. For a long you want the HTF Bullish, or Bearish but at the Lower extreme (the reversal case). For a short, the mirror.<\u002Fli>\n      <li>If the table reads <em>Context blocks new entries<\u002Fem> in your direction, the weekly disagrees with the timing model. That is a skip, not a discount.<\u002Fli>\n      <li>Check the <b>HTF close (UTC)<\u002Fb> row lags the chart by one weekly bar. If it matches the current bar the context is provisional and can change at the weekly close.<\u002Fli>\n      <li><b>Action:<\u002Fb> proceed only when direction from Step 1 and permission from Step 2 match.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <h3>Step 3: Wait for the setup mark<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ul>\n      <li>Watch the DTF pane for the daily stochastic cross in your direction. When it qualifies, a teal <b>S<\u002Fb> (long) or red <b>S<\u002Fb> (short) prints and an orange invalidation line appears at the setup bar's extreme.<\u002Fli>\n      <li>The table Status changes to <em>Armed long<\u002Fem> or <em>Armed short<\u002Fem>. The setup has three bars to trigger before it retires with a grey ✕.<\u002Fli>\n      <li><b>Action:<\u002Fb> pre-compute your size now. Risk per share is the distance from the likely entry (a close beyond the setup bar) to the orange line. Size so that distance equals your fixed risk unit. Do not enter on the S.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <h3>Step 4: Enter on the trigger<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ul>\n      <li>Wait for a bar to <em>close<\u002Fem> beyond the setup bar's high (long) or low (short). The lime <b>▲ DTF<\u002Fb> or red <b>▼ DTF<\u002Fb> marker prints, the table shows <em>Last event: Price trigger<\u002Fem>, and <b>Last trigger / invalidation<\u002Fb> fills in.<\u002Fli>\n      <li>Because DTF commits on closed bars only, the marker is final. Enter at the next open or with a stop-entry just beyond the trigger bar; either is consistent with the model.<\u002Fli>\n      <li><b>Action:<\u002Fb> place the entry in two equal halves (U1 and U2), and place the protective stop for both at the invalidation shown in the table. That stop is the trade's definition; if it is too wide for your risk unit, reduce size, never move the stop.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <h3>Step 5: Manage with U1 / U2, then score the window<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ul>\n      <li>Read the <b>U1 / U2 next protection<\u002Fb> rows each day after the close and move your broker stops to those levels. The aqua U1 line tightens after two opposing daily crosses and then trails the prior bar; the purple U2 line stays at the cycle stop until the HTF reaches its extreme, then tightens.<\u002Fli>\n      <li>When U1 shows <em>Flat<\u002Fem>, that half is out; the trade continues on U2 alone. When U2 shows <em>Flat<\u002Fem>, the campaign is over and DTF is back to <em>Waiting for qualifying crossover<\u002Fem>.<\u002Fli>\n      <li>Optional discretionary exit: if DTM's next forecast is a pivot against you and the window goes <em>Active<\u002Fem> while you are still in, tighten U2 to the prior bar rather than waiting for the cycle stop.<\u002Fli>\n      <li><b>Action:<\u002Fb> after the pivot confirms, note whether the DTM Scorecard resolved the window as a hit. Log the trade with a flag for \"inside window\" so your own results can be split the same way the Scorecard splits them.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--aqua);background:#12191c\">\n    <b>Checklist before any order:<\u002Fb> DTM window live in the trade direction · HTF permission granted · S printed with an orange invalidation · closed-bar T printed · stop at the table's invalidation · size fixed from that stop. Six ticks or no trade.\n  <\u002Fdiv>\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--red);background:#1d1414\">\n    <b>Common failure modes:<\u002Fb> entering on S instead of T; taking a trigger the table says is blocked by context; widening the stop past the invalidation to fit size; ignoring a grey ✕ and treating the retired setup as still armed; trading a mid-range cross with no DTM window because it \"looks right\".\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"journal\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);font-weight:700\">Operate<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Trade journal template<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">One record per setup, including the ones you skipped<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>Fill one row per setup that reaches gate 1, even when you stand down. Skipped setups are the only way to learn whether your gates are too tight. Fields marked <span class=\"pill\" style=\"background:#1e2230;color:var(--yellow)\">SC<\u002Fspan> are the ones you compare against the DTM Scorecard later.<\u002Fp>\n  <div class=\"card\">\n    <div class=\"wrap\"><table>\n      <tr><th style=\"width:190px\">Field<\u002Fth><th>Where it comes from<\u002Fth><th>Example<\u002Fth><\u002Ftr>\n      <tr><td>Date opened<\u002Ftd><td>Bar date of gate 1<\u002Ftd><td>2026-08-04<\u002Ftd><\u002Ftr>\n      <tr><td>Symbol / TF / HTF pair<\u002Ftd><td>DTF table · Pair, Feed<\u002Ftd><td>COINBASE:BTCUSD · 1D / 1W<\u002Ftd><\u002Ftr>\n      <tr><td>DTM forecast #id and kind<\u002Ftd><td>DTM Compact · first row<\u002Ftd><td>#42 · Next LOW?<\u002Ftd><\u002Ftr>\n      <tr><td>Window traded <span class=\"pill\" style=\"background:#1e2230;color:var(--yellow)\">SC<\u002Fspan><\u002Ftd><td>Compact · Nearest remaining or Strongest<\u002Ftd><td>2026-08-05 to 2026-08-07 · score 2.50<\u002Ftd><\u002Ftr>\n      <tr><td>Window grade<\u002Ftd><td>Window evidence · points, uniques, range support<\u002Ftd><td>Points 1.5 · 2 uniques · TRZ YES / TB YES · ordinary<\u002Ftd><\u002Ftr>\n      <tr><td>Label flags <span class=\"pill\" style=\"background:#1e2230;color:var(--yellow)\">SC<\u002Fspan><\u002Ftd><td>Chart label<\u002Ftd><td>◆ level (Ret 0.618) · ● mom<\u002Ftd><\u002Ftr>\n      <tr><td>HTF context<\u002Ftd><td>DTF table · Confirmed context<\u002Ftd><td>Bullish · Middle<\u002Ftd><\u002Ftr>\n      <tr><td>S date and invalidation<\u002Ftd><td>DTF pane, orange line<\u002Ftd><td>2026-08-05 · 60,900<\u002Ftd><\u002Ftr>\n      <tr><td>T date and close<\u002Ftd><td>DTF table · Last trigger<\u002Ftd><td>2026-08-06 · 62,400<\u002Ftd><\u002Ftr>\n      <tr><td>Risk unit, modifier, size<\u002Ftd><td>Sizing page<\u002Ftd><td>$1,000 · ×0.5 · 0.333 BTC<\u002Ftd><\u002Ftr>\n      <tr><td>Entry fill, initial stop<\u002Ftd><td>Broker<\u002Ftd><td>62,450 · 60,900<\u002Ftd><\u002Ftr>\n      <tr><td>U1 exit date / price / reason<\u002Ftd><td>DTF table · U1 next protection<\u002Ftd><td>2026-08-14 · 65,100 · trailing 1-bar<\u002Ftd><\u002Ftr>\n      <tr><td>U2 exit date / price / reason<\u002Ftd><td>DTF table · U2 next protection<\u002Ftd><td>2026-08-27 · 66,800 · cycle stop<\u002Ftd><\u002Ftr>\n      <tr><td>Result in R<\u002Ftd><td>(exit − entry) ÷ (entry − stop), per half, averaged<\u002Ftd><td>+1.7R U1 · +2.8R U2 · +2.25R<\u002Ftd><\u002Ftr>\n      <tr><td>DTM outcome <span class=\"pill\" style=\"background:#1e2230;color:var(--yellow)\">SC<\u002Fspan><\u002Ftd><td>Journal view, once resolved<\u002Ftd><td>HIT · dist 0 · L1 M1 B1<\u002Ftd><\u002Ftr>\n      <tr><td>Gate that stopped you<\u002Ftd><td>Decision tree<\u002Ftd><td>none · or \"3: Context blocks new entries\"<\u002Ftd><\u002Ftr>\n      <tr><td>Deviation from system<\u002Ftd><td>Honest note<\u002Ftd><td>Entered on S, not T<\u002Ftd><\u002Ftr>\n      <tr><td>Notes<\u002Ftd><td><\u002Ftd><td>Weekly bar closed 3 h after entry; context unchanged<\u002Ftd><\u002Ftr>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <h3>Copy-paste header<\u002Fh3>\n  <p class=\"small\">One line, pipe-delimited, matching the DTM JOURNAL export delimiter so the two files can be joined on forecast id.<\u002Fp>\n  <pre style=\"background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;overflow-x:auto;color:var(--text)\">opened|symbol|tf|htf|dtm_id|kind|win_start|win_end|win_score|points|uniques|trz|tb|level|mom|htf_ctx|s_date|invalidation|t_date|t_close|risk_usd|modifier|size|fill|stop|u1_date|u1_px|u1_reason|u2_date|u2_px|u2_reason|r_u1|r_u2|r_avg|dtm_outcome|dist|gate_failed|deviation|notes<\u002Fpre>\n  <div class=\"callout blue\">\n    <b>Monthly read:<\u002Fb> sort by <em>gate_failed<\u002Fem>. If most skips are gate 3 (permission) and the skipped windows went on to HIT, the weekly filter is costing more than it saves on this symbol. If most skips are gate 2 and those windows were MISS, gate 2 is earning its place.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"routine\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);font-weight:700\">Operate<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Daily and weekly routine<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Five rows in two minutes, once a day<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>The system only needs attention at bar closes. Everything else is noise. Set a fixed time a few minutes after the daily close of your instrument and keep to it.<\u002Fp>\n  <div class=\"two\">\n    <div class=\"card\">\n      <h3 style=\"margin-top:0\">Daily, after the chart-TF close<\u002Fh3>\n      <ol>\n        <li><b>DTM Compact · State and Countdown.<\u002Fb> Active or Upcoming ≤ 3 means the system is live today. Anything else: stop here unless you hold a position.<\u002Fli>\n        <li><b>DTF table · Status.<\u002Fb> Armed long / short means a setup is pending; note the orange invalidation. \"Context blocks new entries\" means no new trades in that direction.<\u002Fli>\n        <li><b>DTF table · Last event.<\u002Fb> A Price trigger since yesterday is an entry to place now. A cancellation clears the pending setup.<\u002Fli>\n        <li><b>If in a position: DTF table · U1 / U2 next protection.<\u002Fb> Move both broker stops to the shown levels. This is the only order change you make on a normal day.<\u002Fli>\n        <li><b>Journal.<\u002Fb> One line if anything changed. Nothing changed is also a line worth a tick mark.<\u002Fli>\n      <\u002Fol>\n      <p class=\"small\">Two minutes. If it takes longer you are reading rows that are not on this list.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h3 style=\"margin-top:0\">Weekly, after the HTF close<\u002Fh3>\n      <ol>\n        <li><b>DTF table · Confirmed context and HTF close (UTC).<\u002Fb> The context can only change here. A direction flip against an open position is your cue to tighten U2 to the prior bar.<\u002Fli>\n        <li><b>DTM Compact · Next HIGH? / LOW? and Nearest remaining.<\u002Fb> Refresh your mental picture of the coming window and its direction.<\u002Fli>\n        <li><b>DTM Window evidence<\u002Fb> for the nearest window: grade it once, write the grade in the journal, do not re-grade it daily.<\u002Fli>\n        <li><b>Alerts.<\u002Fb> Confirm the DTM and DTF alerts are still active in TradingView; alerts expire and get muted.<\u002Fli>\n      <\u002Fol>\n      <h3>Monthly<\u002Fh3>\n      <ol>\n        <li><b>DTM Scorecard.<\u002Fb> Note hit rate, paired model minus baseline, and hits with time+price+momentum in the calibration log.<\u002Fli>\n        <li><b>Journal review.<\u002Fb> Count skips by gate. Count deviations. One deviation a month is a habit forming.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <b>Do not<\u002Fb> open the chart intrabar to \"see how it's going\". Every structural decision in both scripts commits on the closed bar. Intrabar readings are display-only and will tempt you into acting on an S that has not confirmed.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"sizing\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);font-weight:700\">Operate<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Position sizing<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">From invalidation to order quantity, with numbers<\u002Fdiv>\n        <\u002Fheader>\n\n  <div class=\"card\">\n    <h3 style=\"margin-top:0\">Account convention<\u002Fh3>\n    <ul>\n      <li>All examples are a long or short in a single instrument.<\u002Fli>\n      <li>Risk is measured in account currency, USD. The risk unit is <b>$1,000<\u002Fb> per trade before modifiers.<\u002Fli>\n      <li>Size is computed from entry price to invalidation price, then reduced by any system modifier. It is never increased above the base.<\u002Fli>\n      <li>Fees, spread, slippage and gaps are additional costs and are not in the arithmetic below. Expect real risk to exceed the nominal figure.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <h3>The formula<\u002Fh3>\n  <div class=\"card\">\n    <pre style=\"background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;overflow-x:auto;color:var(--text)\">distance   = |expected entry − invalidation|          (price units)\nbase size  = risk unit ÷ distance                      (units of the instrument)\nsize       = base size × modifier                      (round DOWN to the tradable increment)\nU1 = U2    = size ÷ 2                                  (round DOWN each; leftover stays flat)\nactual risk = size × distance                          (should be ≤ risk unit × modifier)<\u002Fpre>\n    <p>Expected entry is the setup bar's high (long) or low (short) plus a tick, because the trigger is a close beyond it and you enter at or after that close. If your actual fill is worse, recompute; do not keep the planned quantity.<\u002Fp>\n  <\u002Fdiv>\n  <h3>Modifiers<\u002Fh3>\n  <div class=\"card\">\n    <div class=\"wrap\"><table>\n      <tr><th>Condition (from gate 2 and the window grade)<\u002Fth><th>Modifier<\u002Fth><\u002Ftr>\n      <tr><td>Score ≥ 4 and window inside both TRZ and Time Band overlaps<\u002Ftd><td>×1.0<\u002Ftd><\u002Ftr>\n      <tr><td>Score 2 to 4, or inside only one overlap<\u002Ftd><td>×0.5<\u002Ftd><\u002Ftr>\n      <tr><td>Coverage / continuous span above 40 units in the horizon<\u002Ftd><td>×0.5 (stacks: two halves = ×0.25)<\u002Ftd><\u002Ftr>\n      <tr><td>◆ level or ● mom on the label<\u002Ftd><td>Removes one ×0.5 if one was applied; never exceeds ×1.0<\u002Ftd><\u002Ftr>\n      <tr><td>HTF context is Transition (not full Bullish / Bearish agreement)<\u002Ftd><td>×0.5<\u002Ftd><\u002Ftr>\n    <\u002Ftable><\u002Fdiv>\n    <p class=\"small\">Modifiers apply only to a trade that passed all five gates. They cannot rescue a failed gate.<\u002Fp>\n  <\u002Fdiv>\n  <h3>Worked example 1: crypto, fractional size<\u002Fh3>\n  <div class=\"card\">\n    <p>Long BTC. Setup bar high 61,950, invalidation (setup bar low) 60,900. Window score 2.50 inside both overlaps, with ● mom, HTF Bullish.<\u002Fp>\n    <pre style=\"background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;overflow-x:auto;color:var(--text)\">expected entry = 61,960\ndistance       = 61,960 − 60,900 = 1,060\nbase size      = 1,000 ÷ 1,060 = 0.943 BTC\nmodifier       = score 2–4 → ×0.5, ● mom removes it → ×1.0\nsize           = 0.943 BTC  →  U1 0.471, U2 0.471\nactual risk    = 0.943 × 1,060 ≈ $1,000<\u002Fpre>\n    <p>Trigger prints, next open is 62,400. Recompute: distance 1,500, base 0.667 BTC, U1 0.333 / U2 0.333. The stop stays at 60,900; the size shrinks.<\u002Fp>\n  <\u002Fdiv>\n  <h3>Worked example 2: stock, whole shares<\u002Fh3>\n  <div class=\"card\">\n    <p>Short a stock. Setup bar low 184.20, invalidation (setup bar high) 191.60. Score 1.9 in one overlap only, HTF Bearish, no flags.<\u002Fp>\n    <pre style=\"background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;overflow-x:auto;color:var(--text)\">expected entry = 184.19\ndistance       = 191.60 − 184.19 = 7.41\nbase size      = 1,000 ÷ 7.41 = 134.9 → 134 shares\nmodifier       = score &lt; 2 → this window fails gate 2. No trade.<\u002Fpre>\n    <p>Had the score been 2.4: modifier ×0.5, size 67 shares, U1 33 / U2 33, one share flat. Actual risk 66 × 7.41 = $489.<\u002Fp>\n  <\u002Fdiv>\n  <h3>Worked example 3: futures, minimum increment too large<\u002Fh3>\n  <div class=\"card\">\n    <p>Long ES. Distance 28 points at $50 per point = $1,400 per contract. Base size 1,000 ÷ 1,400 = 0.71 contracts, rounds down to zero.<\u002Fp>\n    <p><b>Options, in order of preference:<\u002Fb> switch to the micro (MES at $5 per point: 1,000 ÷ 140 = 7 contracts, U1 3 / U2 4); or skip the trade. Do not take one ES contract at $1,400 risk, and do not move the stop closer to make it fit. A stop inside the invalidation is not the system.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"callout red\">\n    <b>Three sizing errors that undo the edge:<\u002Fb> widening the stop to fit a preferred size; adding to U2 after U1 exits at a profit; and recomputing size from the planned entry instead of the actual fill when the open gaps through the trigger.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"alerts\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);font-weight:700\">Operate<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Alert setup<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Phone and webhook, so the system does not depend on you watching<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>Both scripts emit alerts on closed bars only, so nothing here repaints. DTF uses named alert conditions; DTM uses a single <code>alert()<\u002Fcode> stream plus the JOURNAL export lines. Set them up once per symbol and check they are still active in the weekly routine.<\u002Fp>\n  <h3>What each script can send<\u002Fh3>\n  <div class=\"two\">\n    <div class=\"card\">\n      <h4 style=\"margin-top:0\">DTF alert conditions<\u002Fh4>\n      <div class=\"wrap\"><table>\n        <tr><th>Condition<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n        <tr><td>Long setup / Short setup<\u002Ftd><td>Gate 4. Tells you an S printed; open the chart and check the window and permission.<\u002Ftd><\u002Ftr>\n        <tr><td>Long price trigger / Short price trigger<\u002Ftd><td>Gate 5. The entry event. Message includes the close.<\u002Ftd><\u002Ftr>\n        <tr><td>Setup cancelled or expired<\u002Ftd><td>Clears a pending setup. Cancel any resting entry order.<\u002Ftd><\u002Ftr>\n        <tr><td>Confirmed context reversal<\u002Ftd><td>Weekly. Permission changed; tighten U2 if it flipped against you.<\u002Ftd><\u002Ftr>\n        <tr><td>Confirmed context zone change<\u002Ftd><td>Weekly. Extreme reached; U2 begins tightening.<\u002Ftd><\u002Ftr>\n      <\u002Ftable><\u002Fdiv>\n      <p class=\"small\">The script also emits a combined <code>alert()<\u002Fcode> line with pair, engine, close and reference level on each event, for webhooks.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\">\n      <h4 style=\"margin-top:0\">DTM alert() stream<\u002Fh4>\n      <div class=\"wrap\"><table>\n        <tr><th>Event text<\u002Fth><th>Use<\u002Fth><\u002Ftr>\n        <tr><td>New next HIGH / LOW forecast #id<\u002Ftd><td>A pivot confirmed and a new forecast issued. Grade the new window this week.<\u002Ftd><\u002Ftr>\n        <tr><td>Approaching window<\u002Ftd><td>Gate 1 is about to pass. Start the daily routine tomorrow.<\u002Ftd><\u002Ftr>\n        <tr><td>Entered window<\u002Ftd><td>Gate 1 passes. Now watch DTF for S.<\u002Ftd><\u002Ftr>\n        <tr><td>Time+price confluence at …<\u002Ftd><td>◆ level set on the window. Size modifier may improve.<\u002Ftd><\u002Ftr>\n        <tr><td>Momentum confirmation inside window<\u002Ftd><td>● mom set. Usually coincides with a DTF S on the same bar.<\u002Ftd><\u002Ftr>\n        <tr><td>Opposite HIGH / LOW confirmed<\u002Ftd><td>The forecast resolved. Read the Journal view and fill the journal row.<\u002Ftd><\u002Ftr>\n        <tr><td>Maximum probable time exceeded<\u002Ftd><td>The window family is late. Reduce expectations for this forecast.<\u002Ftd><\u002Ftr>\n        <tr><td>JOURNAL …<\u002Ftd><td>Export line. Webhook only; mute on phone.<\u002Ftd><\u002Ftr>\n      <\u002Ftable><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <h3>Setup steps in TradingView<\u002Fh3>\n  <div class=\"card\">\n    <ol>\n      <li>Open the chart with both scripts loaded and inputs set the way you trade. Alerts freeze the inputs at creation; change an input and you must recreate the alert.<\u002Fli>\n      <li><b>DTF, one alert:<\u002Fb> Alert dialog → Condition: <em>Dynamic Momentum DTF<\u002Fem> → choose <em>Any alert() function call<\u002Fem>. Options: <em>Once per bar close<\u002Fem>. Expiration: open-ended. Notifications: <em>Notify on app<\u002Fem> ticked, <em>Webhook URL<\u002Fem> filled. Name it <code>DTF · SYMBOL · 1D<\u002Fcode>. This single alert carries setups, triggers, cancellations and context changes in one stream.<\u002Fli>\n      <li><b>DTF, phone-only extras (optional):<\u002Fb> two more alerts using the named conditions <em>Long price trigger<\u002Fem> and <em>Short price trigger<\u002Fem> with a distinct sound, so an entry event is audibly different from a setup.<\u002Fli>\n      <li><b>DTM, one alert:<\u002Fb> Condition: <em>DTM V1.3<\u002Fem> → <em>Any alert() function call<\u002Fem>, <em>Once per bar close<\u002Fem>, app notification plus the same webhook. Name it <code>DTM · SYMBOL · 1D<\u002Fcode>. Both the event stream and the JOURNAL lines arrive through this alert.<\u002Fli>\n      <li><b>Webhook side:<\u002Fb> route on the first token. Lines starting <code>JOURNAL<\u002Fcode> go to the journal store; lines containing <code>Price trigger<\u002Fcode> or <code>Entered window<\u002Fcode> go to your phone channel; everything else is logged only.<\u002Fli>\n      <li>Test by temporarily setting the DTM input <em>Enable bar close alert events<\u002Fem> off and on; the next closed bar with an event will fire. Do not judge the setup by the absence of an alert on a quiet day.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <b>Phone hygiene:<\u002Fb> the DTF combined stream and the DTM stream are enough. If you add the named conditions as well, you will receive every event twice and start ignoring them. Two alerts per symbol, distinct sounds, webhook carries the detail.\n  <\u002Fdiv>\n  <div class=\"callout blue\">\n    <b>Alert limits:<\u002Fb> TradingView caps active alerts by plan. At two per symbol a basic plan covers a handful of symbols. Prefer fewer symbols with both alerts over more symbols with one.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"gallery\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);font-weight:700\">Operate<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Screenshot gallery<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Your own charts, one per pattern, replacing the prose over time<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>Words describe the patterns; your own screenshots teach them. This page is a set of labelled slots. Capture each from your chart when it occurs, crop to the DTF pane plus the price panel with the DTM label visible, and drop the image in place. Until then each slot lists exactly what the capture must show so you know it when you see it.<\u002Fp>\n  <p class=\"small\">No screenshots are included yet. The captions below are specifications, not descriptions of existing images.<\u002Fp>\n  <div class=\"grid\">\n    <div class=\"card\" style=\"border-left:4px solid var(--lime)\">\n      <h3 style=\"margin-top:0;color:var(--lime)\">1. Clean long: S then T inside a window<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> orange DTM band with \"Next LOW?\" label; teal S under a bar inside the band; orange invalidation line; lime ▲ DTF one to three bars later; DTF table reading Armed long then Price trigger. Ribbon teal or orange at Lower extreme.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--red)\">\n      <h3 style=\"margin-top:0;color:var(--red)\">2. Clean short: S then T at a HIGH window<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> \"Next HIGH?\" band, red S above a bar inside it, red ▼ DTF, ribbon orange (Upper extreme or Transition). Ideally ◆ level on the label at an APP or retracement.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--grey)\">\n      <h3 style=\"margin-top:0;color:var(--muted)\">3. Window with no setup<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> band passing with State \"Window elapsed: confirmation pending\"; DTF pane lines tangled around 50 with no S. The reminder that timing alone is not a signal.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--orange)\">\n      <h3 style=\"margin-top:0;color:var(--orange)\">4. Setup without permission<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> a textbook bullish cross from below 20 in the DTF pane with no S printed; ribbon red; table \"Context blocks new entries\". The trade the filter exists to refuse.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--grey)\">\n      <h3 style=\"margin-top:0;color:var(--muted)\">5. Setup that fails: grey ✕<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> S with orange line, next bar wicking through it, grey ✕ at 50 in the pane, table \"Cancelled: invalidation breached\". No entry was ever due.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--yellow)\">\n      <h3 style=\"margin-top:0;color:var(--yellow)\">6. Trigger with no window<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> ▲ or ▼ DTF with the nearest orange band weeks away and State \"Upcoming\" with a long Countdown. Valid momentum, no timing.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--purple)\">\n      <h3 style=\"margin-top:0;color:var(--purple)\">7. U1 / U2 management through a trend<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> aqua U1 line stepping up bar by bar after two opposing crosses, purple U2 line flat at the cycle stop then tightening after the HTF extreme, and the table row reading Flat for U1 first.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"border-left:4px solid var(--aqua)\">\n      <h3 style=\"margin-top:0;color:var(--aqua)\">8. Lime label: time, price and momentum agree<\u002Fh3>\n      <div style=\"height:150px;border:1px dashed var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px\">image slot<\u002Fdiv>\n      <p class=\"small\"><b>Must show:<\u002Fb> a window label with both ◆ level and ● mom and a lime border, a teal APP or grey retracement segment touching price inside the band. The strongest read the system produces.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"callout blue\">\n    <b>Capture rule:<\u002Fb> screenshot on the bar close that completes the pattern, not later. Later screenshots show the outcome and teach hindsight instead of recognition.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"workflow\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Reference<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Workflow map<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Which page to open at each moment while actively looking for a trade<\u002Fdiv>\n        <\u002Fheader>\n  <p>One trading day, top to bottom. Each step names the panel row to read and links to the page that explains it. Grey chips are exits; every exit still gets a journal line.<\u002Fp>\n  <h3 style=\"margin-top:22px\">The flow at a glance<\u002Fh3>\n  <div class=\"card\" style=\"padding:14px 10px;max-width:900px;margin:10px auto 26px\"><svg viewBox=\"0 0 900 1126\" width=\"100%\" role=\"img\" aria-label=\"Decision flow while looking for a trade\" style=\"font-family:system-ui,sans-serif;display:block\"><defs><marker id=\"wfa\" markerWidth=\"9\" markerHeight=\"9\" refX=\"7\" refY=\"4.5\" orient=\"auto\"><path d=\"M0,0 L9,4.5 L0,9 z\" fill=\"#9aa3b2\"/><\u002Fmarker><\u002Fdefs><rect x=\"290\" y=\"20\" width=\"240\" height=\"48\" rx=\"24\" fill=\"#12191c\" stroke=\"#7aa2c7\"/><text x=\"410.0\" y=\"50\" font-size=\"16\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Chart-TF bar closes<\u002Ftext><path d=\"M410.0,68 L410.0,106\" stroke=\"#9aa3b2\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"200\" y=\"110\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"120\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#8a94a6\"/><circle cx=\"234\" cy=\"145.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#8a94a6\" stroke-width=\"2\"/><text x=\"234\" y=\"150.5\" font-size=\"15\" font-weight=\"700\" fill=\"#8a94a6\" text-anchor=\"middle\">1<\u002Ftext><text x=\"436.0\" y=\"142.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Scan: State and Status<\u002Ftext><text x=\"436.0\" y=\"163.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">DTM Compact · DTF table<\u002Ftext><path d=\"M620,145.0 L690,145.0\" stroke=\"#8a94a6\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"694\" y=\"127.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"150.0\" font-size=\"14\" fill=\"#8a94a6\" text-anchor=\"middle\">quiet · next symbol<\u002Ftext><path d=\"M410.0,180 L410.0,218\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"343.2\" y=\"188.0\" width=\"133.60000000000002\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"203.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">something live<\u002Ftext><rect x=\"200\" y=\"222\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"232\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#7aa2c7\"/><circle cx=\"234\" cy=\"257.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#7aa2c7\" stroke-width=\"2\"/><text x=\"234\" y=\"262.5\" font-size=\"15\" font-weight=\"700\" fill=\"#7aa2c7\" text-anchor=\"middle\">2<\u002Ftext><text x=\"436.0\" y=\"254.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Is a window live?<\u002Ftext><text x=\"436.0\" y=\"275.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">State Active, or Upcoming ≤ 3<\u002Ftext><path d=\"M620,257.0 L690,257.0\" stroke=\"#c98a8a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"638.6\" y=\"230.0\" width=\"32.8\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"655\" y=\"245.0\" font-size=\"13\" fill=\"#c98a8a\" text-anchor=\"middle\">no<\u002Ftext><rect x=\"694\" y=\"239.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"262.0\" font-size=\"14\" fill=\"#c98a8a\" text-anchor=\"middle\">wait<\u002Ftext><path d=\"M410.0,292 L410.0,330\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"389.4\" y=\"300.0\" width=\"41.2\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"315.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">yes<\u002Ftext><rect x=\"200\" y=\"334\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"344\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#7aa2c7\"/><circle cx=\"234\" cy=\"369.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#7aa2c7\" stroke-width=\"2\"/><text x=\"234\" y=\"374.5\" font-size=\"15\" font-weight=\"700\" fill=\"#7aa2c7\" text-anchor=\"middle\">3<\u002Ftext><text x=\"436.0\" y=\"366.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Does the window grade?<\u002Ftext><text x=\"436.0\" y=\"387.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">score ≥ 2 · 2 uniques · range YES<\u002Ftext><path d=\"M620,369.0 L690,369.0\" stroke=\"#c98a8a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"638.6\" y=\"342.0\" width=\"32.8\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"655\" y=\"357.0\" font-size=\"13\" fill=\"#c98a8a\" text-anchor=\"middle\">no<\u002Ftext><rect x=\"694\" y=\"351.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"374.0\" font-size=\"14\" fill=\"#c98a8a\" text-anchor=\"middle\">watch only<\u002Ftext><path d=\"M410.0,404 L410.0,442\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"322.2\" y=\"412.0\" width=\"175.6\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"427.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">yes · note modifier<\u002Ftext><rect x=\"200\" y=\"446\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"456\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#7aa2c7\"/><circle cx=\"234\" cy=\"481.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#7aa2c7\" stroke-width=\"2\"/><text x=\"234\" y=\"486.5\" font-size=\"15\" font-weight=\"700\" fill=\"#7aa2c7\" text-anchor=\"middle\">4<\u002Ftext><text x=\"436.0\" y=\"478.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Weekly permission?<\u002Ftext><text x=\"436.0\" y=\"499.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">DTF Confirmed context agrees<\u002Ftext><path d=\"M620,481.0 L690,481.0\" stroke=\"#c98a8a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"638.6\" y=\"454.0\" width=\"32.8\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"655\" y=\"469.0\" font-size=\"13\" fill=\"#c98a8a\" text-anchor=\"middle\">no<\u002Ftext><rect x=\"694\" y=\"463.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"486.0\" font-size=\"14\" fill=\"#c98a8a\" text-anchor=\"middle\">skip · log gate 3<\u002Ftext><path d=\"M410.0,516 L410.0,554\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"389.4\" y=\"524.0\" width=\"41.2\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"539.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">yes<\u002Ftext><rect x=\"200\" y=\"558\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"568\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#a89a7a\"/><circle cx=\"234\" cy=\"593.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#a89a7a\" stroke-width=\"2\"/><text x=\"234\" y=\"598.5\" font-size=\"15\" font-weight=\"700\" fill=\"#a89a7a\" text-anchor=\"middle\">5<\u002Ftext><text x=\"436.0\" y=\"590.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">S printed inside window?<\u002Ftext><text x=\"436.0\" y=\"611.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">right direction · orange line appears<\u002Ftext><path d=\"M620,593.0 L690,593.0\" stroke=\"#a89a7a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"617.6\" y=\"566.0\" width=\"74.80000000000001\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"655\" y=\"581.0\" font-size=\"13\" fill=\"#a89a7a\" text-anchor=\"middle\">not yet<\u002Ftext><rect x=\"694\" y=\"575.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"598.0\" font-size=\"14\" fill=\"#a89a7a\" text-anchor=\"middle\">keep scanning daily<\u002Ftext><path d=\"M410.0,628 L410.0,666\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"288.6\" y=\"636.0\" width=\"242.8\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"651.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">yes · size from orange line<\u002Ftext><rect x=\"200\" y=\"670\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"680\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#7aa2c7\"/><circle cx=\"234\" cy=\"705.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#7aa2c7\" stroke-width=\"2\"/><text x=\"234\" y=\"710.5\" font-size=\"15\" font-weight=\"700\" fill=\"#7aa2c7\" text-anchor=\"middle\">6<\u002Ftext><text x=\"436.0\" y=\"702.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Closed-bar T within 3 bars?<\u002Ftext><text x=\"436.0\" y=\"723.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">no breach of the orange line first<\u002Ftext><path d=\"M620,705.0 L690,705.0\" stroke=\"#c98a8a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"638.6\" y=\"678.0\" width=\"32.8\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"655\" y=\"693.0\" font-size=\"13\" fill=\"#c98a8a\" text-anchor=\"middle\">no<\u002Ftext><rect x=\"694\" y=\"687.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"710.0\" font-size=\"14\" fill=\"#c98a8a\" text-anchor=\"middle\">grey ✕ · back to 5<\u002Ftext><path d=\"M200,705.0 L140,705.0 L140,650 L240,650\" stroke=\"#a89a7a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"10\" y=\"687.0\" width=\"128\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"74\" y=\"710.0\" font-size=\"14\" fill=\"#a89a7a\" text-anchor=\"middle\">no T yet: hold<\u002Ftext><path d=\"M410.0,740 L410.0,778\" stroke=\"#8fb58a\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"389.4\" y=\"748.0\" width=\"41.2\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"763.0\" font-size=\"13\" fill=\"#8fb58a\" text-anchor=\"middle\">yes<\u002Ftext><rect x=\"200\" y=\"782\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#151f1a\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"792\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#8fb58a\"/><circle cx=\"234\" cy=\"817.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#8fb58a\" stroke-width=\"2\"/><text x=\"234\" y=\"822.5\" font-size=\"15\" font-weight=\"700\" fill=\"#8fb58a\" text-anchor=\"middle\">7<\u002Ftext><text x=\"436.0\" y=\"814.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Enter two halves<\u002Ftext><text x=\"436.0\" y=\"835.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">stop for both at the invalidation<\u002Ftext><path d=\"M410.0,852 L410.0,890\" stroke=\"#9aa3b2\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"200\" y=\"894\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"904\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#a58fb8\"/><circle cx=\"234\" cy=\"929.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#a58fb8\" stroke-width=\"2\"/><text x=\"234\" y=\"934.5\" font-size=\"15\" font-weight=\"700\" fill=\"#a58fb8\" text-anchor=\"middle\">8<\u002Ftext><text x=\"436.0\" y=\"926.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Manage daily<\u002Ftext><text x=\"436.0\" y=\"947.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">stops → U1 / U2 next protection<\u002Ftext><path d=\"M620,929.0 L690,929.0\" stroke=\"#a58fb8\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"694\" y=\"911.0\" width=\"190\" height=\"36\" rx=\"18\" fill=\"#1e2230\" stroke=\"#3a4256\"/><text x=\"789.0\" y=\"934.0\" font-size=\"14\" fill=\"#a58fb8\" text-anchor=\"middle\">Flat on U1 · half out<\u002Ftext><path d=\"M410.0,964 L410.0,1002\" stroke=\"#9aa3b2\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#wfa)\"/><rect x=\"360.0\" y=\"972.0\" width=\"100.0\" height=\"20\" rx=\"10\" fill=\"#0f1116\"/><text x=\"410.0\" y=\"987.0\" font-size=\"13\" fill=\"#9aa3b2\" text-anchor=\"middle\">Flat on U2<\u002Ftext><rect x=\"200\" y=\"1006\" width=\"420\" height=\"70\" rx=\"12\" fill=\"#1a1e29\" stroke=\"#3a4256\" stroke-width=\"1.5\"/><rect x=\"200\" y=\"1016\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#8a94a6\"/><circle cx=\"234\" cy=\"1041.0\" r=\"15\" fill=\"#0f1116\" stroke=\"#8a94a6\" stroke-width=\"2\"/><text x=\"234\" y=\"1046.5\" font-size=\"15\" font-weight=\"700\" fill=\"#8a94a6\" text-anchor=\"middle\">9<\u002Ftext><text x=\"436.0\" y=\"1038.0\" font-size=\"17\" font-weight=\"700\" fill=\"#e6e8ee\" text-anchor=\"middle\">Review<\u002Ftext><text x=\"436.0\" y=\"1059.0\" font-size=\"14\" fill=\"#9aa3b2\" text-anchor=\"middle\">Journal view → journal row → Scorecard<\u002Ftext><text x=\"10\" y=\"1104\" font-size=\"13\" fill=\"#9aa3b2\">Left rail: qualify one gate per closed bar.   Right pills: exits, each still gets a journal line.<\u002Ftext><\u002Fsvg><\u002Fdiv>\n  <h3>Step by step, with the page to open<\u002Fh3>\n\n  <style>\n.wf{--wf-ink:#e6e8ee;--wf-dim:#9aa3b2;--wf-line:#2a3040;--wf-card:#171a22;--wf-accent:#7aa2c7;position:relative;max-width:760px;margin:0 auto;padding:4px 0 8px}\n.wf::before{content:\"\";position:absolute;left:27px;top:24px;bottom:24px;width:2px;background:var(--wf-line)}\n.wf-step{position:relative;display:grid;grid-template-columns:56px 1fr;gap:0 18px;margin:0 0 18px}\n.wf-num{width:56px;height:56px;border-radius:50%;background:#0f1116;border:2px solid var(--wf-accent);color:var(--wf-accent);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;z-index:1}\n.wf-card{background:var(--wf-card);border:1px s
