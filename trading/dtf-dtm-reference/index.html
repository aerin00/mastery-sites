"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"e5c317e8-ce17-47f0-8150-6b31b0081880\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>DTF and DTM Reference<\u002Ftitle>\n<style>\n  :root{\n    --bg:#0f1116; --panel:#171a22; --panel2:#1e2230; --text:#e6e8ee; --muted:#9aa3b2;\n    --line:#2a3040; --aqua:#26c6da; --orange:#ff9800; --purple:#ab47bc; --teal:#26a69a;\n    --red:#ef5350; --lime:#9ccc65; --fuchsia:#e040fb; --yellow:#ffd54f; --grey:#787b86;\n    --magenta:#e91e63; --trz:#26a69a;\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;height:100%}\n  body{background:var(--bg);color:var(--text);font:15px/1.6 system-ui,-apple-system,\"Segoe UI\",sans-serif;overflow:hidden}\n  h2{font-size:26px;line-height:1.25;margin:0;letter-spacing:.2px}\n  h3{font-size:17px;margin:28px 0 8px;color:#fff}\n  h4{font-size:13px;margin:20px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}\n  p{margin:9px 0;text-wrap:pretty}\n  ol,ul{margin:10px 0;padding-left:22px}\n  li{margin:5px 0;text-wrap:pretty}\n  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}\n  th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}\n  th{color:var(--muted);font-weight:600;background:var(--panel2)}\n  tr:last-child td{border-bottom:none}\n  code,kbd{font-family:ui-monospace,\"Cascadia Mono\",Consolas,monospace;font-size:13px;background:#0b0d12;border:1px solid var(--line);border-radius:4px;padding:1px 5px}\n  pre{margin:10px 0}\n  b{color:#fff}\n  a{color:var(--aqua);text-decoration:none;border-bottom:1px solid rgba(38,198,218,.35)}\n  a:hover{color:#7fe3ef;border-bottom-color:#7fe3ef}\n  svg text{font-family:system-ui,sans-serif}\n  svg{display:block}\n  [data-page]{display:none}\n  [data-page][data-active]{display:block;animation:pgin .22s ease both}\n  @keyframes pgin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}\n  [data-goto]{display:block;padding:7px 12px 7px 14px;border-radius:8px;color:var(--muted);font-size:14px;text-decoration:none;border:none;cursor:pointer;border-left:2px solid transparent}\n  [data-goto]:hover{background:var(--panel);color:var(--text)}\n  [data-goto][data-active]{background:var(--panel2);color:#fff;border-left-color:var(--aqua);font-weight:600}\n  [data-off]{display:none!important}\n  [data-step]{display:flex;flex-direction:column;gap:4px;flex:1 1 200px;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);cursor:pointer;text-align:left;font:inherit}\n  [data-step]:hover{border-color:var(--aqua);background:var(--panel2)}\n  [data-step]:disabled{opacity:.3;cursor:default}\n  @media (max-width:820px){\n    body{overflow:auto}\n    [data-shell]{grid-template-columns:1fr!important;height:auto!important}\n    [data-side]{height:auto!important;border-right:none!important;border-bottom:1px solid var(--line)}\n  }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n<div data-shell=\"1\" style=\"display:grid;grid-template-columns:296px 1fr;height:100vh;background:var(--bg)\">\n  <aside data-side=\"1\" style=\"display:flex;flex-direction:column;gap:0;height:100vh;background:#12151d;border-right:1px solid var(--line);overflow:hidden\">\n    <div style=\"padding:20px 18px 14px;border-bottom:1px solid var(--line)\">\n      <div style=\"font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal);font-weight:700\">Field guide<\u002Fdiv>\n      <div style=\"font-size:18px;font-weight:700;margin-top:4px\">DTF &amp; DTM Reference<\u002Fdiv>\n      <div style=\"font-size:12px;color:var(--muted);margin-top:3px\">Dynamic Momentum · Dynamic Time Map<\u002Fdiv>\n      <input value=\"{{ q }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search the guide…\" style=\"margin-top:14px;width:100%;padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:#0b0d12;color:var(--text);font:inherit;font-size:13px\">\n    <\u002Fdiv>\n    <nav sc-camel-on-click=\"{{ onNavClick }}\" style=\"flex:1 1 auto;overflow-y:auto;padding:14px 10px 28px;display:flex;flex-direction:column;gap:2px\">\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:10px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--lime);border-radius:2px\"><\u002Fspan>Start here<\u002Fdiv>\n        <a data-goto=\"overview\" href=\"#overview\">Overview<\u002Fa>\n      <\u002Fdiv>\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:10px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--aqua);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--aqua);border-radius:2px\"><\u002Fspan>DTF · direction<\u002Fdiv>\n        <a data-goto=\"dtf\" href=\"#dtf\">Dynamic Momentum<\u002Fa>\n        <a data-goto=\"dtf-visuals\" href=\"#dtf-visuals\">DTF visuals<\u002Fa>\n        <a data-goto=\"dtf-lifecycle\" href=\"#dtf-lifecycle\">Setup lifecycle<\u002Fa>\n        <a data-goto=\"dtf-table\" href=\"#dtf-table\">DTF status table<\u002Fa>\n      <\u002Fdiv>\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:10px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--orange);border-radius:2px\"><\u002Fspan>DTM · timing<\u002Fdiv>\n        <a data-goto=\"dtm\" href=\"#dtm\">Dynamic Time Map<\u002Fa>\n        <a data-goto=\"dtm-visuals\" href=\"#dtm-visuals\">DTM visuals<\u002Fa>\n        <a data-goto=\"dtm-models\" href=\"#dtm-models\">The five time models<\u002Fa>\n        <a data-goto=\"dtm-dash\" href=\"#dtm-dash\">Dashboard views<\u002Fa>\n        <a data-goto=\"dtm-ext\" href=\"#dtm-ext\">DTM extensions<\u002Fa>\n      <\u002Fdiv>\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:10px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--yellow);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--yellow);border-radius:2px\"><\u002Fspan>In practice<\u002Fdiv>\n        <a data-goto=\"together\" href=\"#together\">Using both together<\u002Fa>\n        <a data-goto=\"examples\" href=\"#examples\">Worked examples<\u002Fa>\n        <a data-goto=\"walkthrough\" href=\"#walkthrough\">Trade walkthrough<\u002Fa>\n        <a data-goto=\"wt-tree\" href=\"#wt-tree\">Decision tree &amp; checklist<\u002Fa>\n        <a data-goto=\"wt-panels\" href=\"#wt-panels\">Which panel at each step<\u002Fa>\n        <a data-goto=\"wt-window\" href=\"#wt-window\">How to read a window<\u002Fa>\n        <a data-goto=\"wt-steps\" href=\"#wt-steps\">The five steps, in order<\u002Fa>\n      <\u002Fdiv>\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:10px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--lime);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--lime);border-radius:2px\"><\u002Fspan>Operate<\u002Fdiv>\n        <a data-goto=\"journal\" href=\"#journal\">Trade journal template<\u002Fa>\n        <a data-goto=\"routine\" href=\"#routine\">Daily &amp; weekly routine<\u002Fa>\n        <a data-goto=\"sizing\" href=\"#sizing\">Position sizing<\u002Fa>\n        <a data-goto=\"alerts\" href=\"#alerts\">Alert setup<\u002Fa>\n        <a data-goto=\"gallery\" href=\"#gallery\">Screenshot gallery<\u002Fa>\n      <\u002Fdiv>\n      <div data-group=\"1\" style=\"display:flex;flex-direction:column;gap:2px\">\n        <div style=\"font-size:11px;letter-spacing:1.1px;text-transform:uppercase;letter-spacing:1.3px;text-transform:uppercase;color:var(--purple);padding:10px 12px 5px;font-weight:700;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:2px;background:var(--purple);border-radius:2px\"><\u002Fspan>Reference<\u002Fdiv>\n        <a data-goto=\"workflow\" href=\"#workflow\">Workflow map<\u002Fa>\n        <a data-goto=\"glossary\" href=\"#glossary\">Glossary<\u002Fa>\n        <a data-goto=\"calibration\" href=\"#calibration\">Version &amp; calibration log<\u002Fa>\n        <a data-goto=\"watchlist\" href=\"#watchlist\">Multi-symbol watchlist<\u002Fa>\n        <a data-goto=\"caveats\" href=\"#caveats\">Caveats &amp; known gaps<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fnav>\n    <div style=\"padding:10px 18px;border-top:1px solid var(--line);font-size:11px;color:#6b7382\">indicators/00_Current_Best · DTM V1.3<\u002Fdiv>\n  <\u002Faside>\n  <div data-scroll=\"1\" style=\"height:100vh;overflow-y:auto;position:relative\">\n    <div style=\"position:sticky;top:0;z-index:4;background:rgba(15,17,22,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding:12px 40px\">\n        <div data-counter=\"1\" style=\"font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums\">{{ counter }}<\u002Fdiv>\n        <div style=\"flex:1 1 auto\"><\u002Fdiv>\n        <div style=\"font-size:11px;color:#6b7382\">← → to move between pages<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ goPrev }}\" disabled=\"{{ noPrev }}\" style=\"padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:13px;cursor:pointer\">Prev<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ noNext }}\" style=\"padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;font-size:13px;cursor:pointer\">Next<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:var(--line)\"><div data-progress=\"1\" style=\"height:2px;width:0;background:var(--aqua);transition:width .25s ease\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <main sc-camel-on-click=\"{{ onContentClick }}\" data-inner=\"1\" style=\"max-width:1020px;margin:0 auto;padding:30px 40px 70px\">\n      <article data-page=\"overview\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Start here<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Overview<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">What each script answers, and how they divide the work<\u002Fdiv>\n        <\u002Fheader>\n<p style=\"font-size:16px;color:var(--muted);text-wrap:pretty\">Field guide to <code>Dynamic_Momentum_DTF.pine<\u002Fcode> and <code>Dynamic_Time_Map.pine<\u002Fcode>: what every mark means, how to read the dashboards, and how the two fit together. Both scripts are ticker-agnostic; the original <code>BTC-DTF.pine<\u002Fcode> and <code>BTC-DTM.pine<\u002Fcode> are retained unchanged in <code>indicators/archive/<\u002Fcode>.<\u002Fp>\n  \n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px\">\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n      <h3 style=\"margin-top:0\">DTF: Dual Time Frame Momentum<\u002Fh3>\n      <p>Answers <b>which direction<\u002Fb> and <b>when a pullback has ended<\u002Fb>. A higher-timeframe stochastic grants permission (long or short); a chart-timeframe stochastic crossover after a qualifying pullback arms a setup; a later close beyond the prior close is the price trigger. Based on Robert Miner's DTF rules (see claim <code>MINER-HPT-001<\u002Fcode>).<\u002Fp>\n      <p style=\"color:var(--muted);font-size:13px\">Pane: separate oscillator pane, with price markers forced onto the main chart.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n      <h3 style=\"margin-top:0\">DTM: Dynamic Time Map<\u002Fh3>\n      <p>Answers <b>when the next turn is probable<\u002Fb>. It builds a confirmed pivot path, measures the calendar-day durations between pivots, and projects several historical duration models forward from the last confirmed pivot. Where the models overlap it issues ranked windows. Based on Miner's Time Rhythm Zones and Time Bands (see claim <code>MINER-DT-030<\u002Fcode>).<\u002Fp>\n      <p style=\"color:var(--muted);font-size:13px\">Pane: overlay on price. Intended for daily charts.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--aqua);background:#12191c\">\n    <b>Division of labour.<\u002Fb> DTM never says which way price goes; DTF never says when a turn is due. A DTF setup that lands inside a DTM ranked window is the highest-quality condition either script can describe on its own.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtf\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTF · direction<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTF: Dynamic Momentum<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">The logic, the supported timeframe pairs, the defaults<\u002Fdiv>\n        <\u002Fheader>\n<h3>The idea in one diagram<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <svg sc-camel-view-box=\"0 0 900 230\" width=\"100%\" role=\"img\" aria-label=\"DTF logic flow\">\n      <defs><marker id=\"arr\" sc-camel-marker-width=\"10\" sc-camel-marker-height=\"10\" sc-camel-ref-x=\"8\" sc-camel-ref-y=\"5\" orient=\"auto\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#9aa3b2\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n      <g font-size=\"13\" fill=\"#e6e8ee\">\n        <rect x=\"20\" y=\"30\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"120\" y=\"58\" text-anchor=\"middle\" font-weight=\"700\">Higher TF stochastic<\u002Ftext>\n        <text x=\"120\" y=\"80\" text-anchor=\"middle\" fill=\"#9aa3b2\">fast &gt; slow = long permission<\u002Ftext>\n        <rect x=\"20\" y=\"130\" width=\"200\" height=\"70\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26c6da\"><\u002Frect>\n        <text x=\"120\" y=\"158\" text-anchor=\"middle\" font-weight=\"700\">Chart TF stochastic<\u002Ftext>\n        <text x=\"120\" y=\"180\" text-anchor=\"middle\" fill=\"#9aa3b2\">leg dipped below 50, then crosses up<\u002Ftext>\n        <line x1=\"220\" y1=\"65\" x2=\"330\" y2=\"105\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <line x1=\"220\" y1=\"165\" x2=\"330\" y2=\"125\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <rect x=\"340\" y=\"80\" width=\"170\" height=\"70\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"425\" y=\"108\" text-anchor=\"middle\" font-weight=\"700\">Setup armed  (S)<\u002Ftext>\n        <text x=\"425\" y=\"130\" text-anchor=\"middle\" fill=\"#9aa3b2\">invalidation = leg low − ticks<\u002Ftext>\n        <line x1=\"510\" y1=\"115\" x2=\"600\" y2=\"115\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <rect x=\"610\" y=\"30\" width=\"270\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#9ccc65\"><\u002Frect>\n        <text x=\"745\" y=\"54\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#9ccc65\">Price trigger  (T / DTF)<\u002Ftext>\n        <text x=\"745\" y=\"76\" text-anchor=\"middle\" fill=\"#9aa3b2\">first close above prior close within 3 bars<\u002Ftext>\n        <rect x=\"610\" y=\"140\" width=\"270\" height=\"60\" rx=\"8\" fill=\"#1e2230\" stroke=\"#787b86\"><\u002Frect>\n        <text x=\"745\" y=\"164\" text-anchor=\"middle\" font-weight=\"700\" fill=\"#9aa3b2\">Cancelled / expired  (×)<\u002Ftext>\n        <text x=\"745\" y=\"186\" text-anchor=\"middle\" fill=\"#9aa3b2\">invalidation hit, permission lost, or 3 bars pass<\u002Ftext>\n        <line x1=\"600\" y1=\"110\" x2=\"610\" y2=\"65\" stroke=\"#9aa3b2\" stroke-width=\"2\"><\u002Fline>\n        <line x1=\"600\" y1=\"120\" x2=\"610\" y2=\"165\" stroke=\"#9aa3b2\" stroke-width=\"2\"><\u002Fline>\n      <\u002Fg>\n    <\u002Fsvg>\n    <p style=\"color:var(--muted);font-size:13px\">Mirror everything for shorts: HTF fast below slow, leg rose above 50, crossunder, first lower close.<\u002Fp>\n  <\u002Fdiv>\n\n  <h3>Timeframe pairs<\u002Fh3>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>Chart<\u002Fsc-raw-th><sc-raw-th>Context (HTF)<\u002Fsc-raw-th><sc-raw-th>Pair label<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>60 min<\u002Fsc-raw-td><sc-raw-td>240 min<\u002Fsc-raw-td><sc-raw-td>1H / 4H<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>240 min<\u002Fsc-raw-td><sc-raw-td>Daily<\u002Fsc-raw-td><sc-raw-td>4H / Daily<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Daily<\u002Fsc-raw-td><sc-raw-td>Weekly<\u002Fsc-raw-td><sc-raw-td>Daily / Weekly<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <p style=\"color:var(--muted);font-size:13px\">Any other chart timeframe shows \"Use a 1H, 4H or Daily chart\" and draws nothing. Non-standard candles (Heikin Ashi, Renko) are also refused.<\u002Fp>\n\n  <h3>Default settings<\u002Fh3>\n  <div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>Parameter<\u002Fsc-raw-th><sc-raw-th>Default<\u002Fsc-raw-th><sc-raw-th>Meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Engine<\u002Fsc-raw-td><sc-raw-td>Stochastic<\u002Fsc-raw-td><sc-raw-td>Course-based default. Smoothed RSI, Stochastic RSI and Directional Efficiency are experimental substitutes, not Miner's proprietary DTosc.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Lookback / fast / slow<\u002Fsc-raw-td><sc-raw-td>8 / 3 / 3<\u002Fsc-raw-td><sc-raw-td>Both timeframes. Miner's \"833\" from the course.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Extremes<\u002Fsc-raw-td><sc-raw-td>20 / 80<\u002Fsc-raw-td><sc-raw-td>Both lines must be beyond the level to count as an extreme. RSI-type engines use 30 / 70.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Pullback qualification<\u002Fsc-raw-td><sc-raw-td>Midpoint<\u002Fsc-raw-td><sc-raw-td>The correcting leg's fast line must have crossed 50. \"Extreme\" requires the leg to have reached 20 / 80; \"Any\" accepts every corrective cross.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Follow-through window<\u002Fsc-raw-td><sc-raw-td>3 bars<\u002Fsc-raw-td><sc-raw-td>How long an armed setup waits for its price trigger.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Invalidation basis<\u002Fsc-raw-td><sc-raw-td>Wick + 1 tick<\u002Fsc-raw-td><sc-raw-td>Leg extreme plus padding. \"Closing price\" uses the leg's extreme close.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Block at context extremes<\u002Fsc-raw-td><sc-raw-td>Off<\u002Fsc-raw-td><sc-raw-td>When on, a bullish but overbought HTF refuses new longs (Miner's Table 2.2 row 2). Off lets a strong HTF trend keep issuing continuation setups.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtf-visuals\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTF · direction<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTF visuals<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Every mark on the price chart and in the DTF pane<\u002Fdiv>\n        <\u002Fheader>\n<h3>On the price chart<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;display:grid;grid-template-columns:34px 1fr;gap:12px 14px;align-items:start\">\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--lime)\">▲<\u002Fdiv><div><b>DTF, lime triangle below bar.<\u002Fb> Long price trigger: an armed long setup got its first higher close while the HTF still permitted it. This is the entry event, not the setup.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--fuchsia)\">▼<\u002Fdiv><div><b>DTF, fuchsia triangle above bar.<\u002Fb> Short price trigger, mirror of the above.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--yellow)\">●<\u002Fdiv><div><b>2U, yellow circle.<\u002Fb> The illustrative two-unit campaign opened on that trigger, both halves protected at the setup's invalidation. Requires \"Show two-unit management\".<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--aqua)\"><\u002Fdiv><div><b>Aqua line, U1 protection.<\u002Fb> Stop for the first half. It sits at the setup leg's extreme until two opposing chart-TF crossovers occur, then trails one bar behind price, which is why it climbs steeply late in a move.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--purple)\"><\u002Fdiv><div><b>Purple line, U2 protection.<\u002Fb> Stop for the second half. It stays at the cycle level until the HTF reaches an extreme and a later opposing crossover arms it. It lags U1 on purpose so the runner can breathe.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--aqua)\">✕<\u002Fdiv><div><b>U1 / U2 X marks.<\u002Fb> That half exited because price breached its protection (wick by default). Two X marks close together mean the campaign is flat.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--orange)\"><\u002Fdiv><div><b>Orange line, pending invalidation.<\u002Fb> The level that cancels an armed setup before it triggers. Visible only while a setup is pending, so its absence means nothing is armed.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3>In the DTF pane<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;display:grid;grid-template-columns:34px 1fr;gap:12px 14px;align-items:start\">\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--aqua)\"><\u002Fdiv><div><b>Aqua, chart fast line.<\u002Fb> The 8-period stochastic smoothed by 3. Provisional on the forming bar.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--orange)\"><\u002Fdiv><div><b>Orange, chart slow line.<\u002Fb> Fast smoothed by 3 again. Fast crossing above slow is a bullish momentum reversal, below is bearish. Every setup starts from one of these crosses.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:0;margin-top:11px;border:none;border-top:3px dashed;border-color:var(--red)\"><\u002Fdiv><div><b>Red dashed 80 / green dashed 20.<\u002Fb> Extreme zones. Long setups need the cross to happen below 80; short setups above 20.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:0;margin-top:11px;border:none;border-top:3px dashed;border-color:var(--grey)\"><\u002Fdiv><div><b>Dotted 50.<\u002Fb> Midpoint. With the default pullback rule, a long setup needs the correcting leg's fast line to have been below 50.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:#4d6b6b\"><\u002Fdiv><div><b>Grey and purple step lines.<\u002Fb> The confirmed HTF fast and slow (optional \"Show confirmed context lines\"). Fast above slow is long permission, below is short permission. Steps because they update only on HTF bar closes.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(90deg,var(--teal),var(--orange),var(--red))\"><\u002Fdiv><div><b>Ribbon at 104.<\u002Fb> HTF context at a glance. <span style=\"display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-right:6px;background:var(--teal);color:#000\">teal<\u002Fspan> bullish, <span style=\"display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-right:6px;background:var(--red);color:#000\">red<\u002Fspan> bearish, <span style=\"display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-right:6px;background:var(--orange);color:#000\">orange<\u002Fspan> at or leaving an extreme (Transition, Upper or Lower extreme), <span style=\"display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;margin-right:6px;background:var(--grey);color:#000\">grey<\u002Fspan> not ready. Orange is the caution colour: permission may still exist but the HTF is stretched.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--teal)\">●<\u002Fdiv><div><b>S circles (teal / red) at 8 or 92.<\u002Fb> Setup armed. Note the invalidation level and wait.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--lime)\">▲<\u002Fdiv><div><b>T triangles at 8 or 92.<\u002Fb> Price trigger, the same event as the DTF marker on the price chart.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--grey)\">✕<\u002Fdiv><div><b>Grey X at 50.<\u002Fb> A pending setup was cancelled (invalidation breached, permission lost, chart TF reached its extreme) or expired after three bars without follow-through.<\u002Fdiv>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtf-lifecycle\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTF · direction<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Setup lifecycle<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Waiting → armed → trigger or retired<\u002Fdiv>\n        <\u002Fheader>\n<div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <svg sc-camel-view-box=\"0 0 900 150\" width=\"100%\" role=\"img\" aria-label=\"Setup state machine\">\n      <g font-size=\"13\" fill=\"#e6e8ee\">\n        <circle cx=\"70\" cy=\"75\" r=\"34\" fill=\"#1e2230\" stroke=\"#787b86\"><\u002Fcircle><text x=\"70\" y=\"79\" text-anchor=\"middle\">Waiting<\u002Ftext>\n        <line x1=\"104\" y1=\"75\" x2=\"196\" y2=\"75\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <text x=\"150\" y=\"62\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11\">qualifying cross<\u002Ftext>\n        <circle cx=\"240\" cy=\"75\" r=\"34\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Fcircle><text x=\"240\" y=\"79\" text-anchor=\"middle\">Armed<\u002Ftext>\n        <line x1=\"274\" y1=\"60\" x2=\"386\" y2=\"35\" stroke=\"#9ccc65\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <text x=\"330\" y=\"36\" text-anchor=\"middle\" fill=\"#9ccc65\" font-size=\"11\">follow-through close<\u002Ftext>\n        <circle cx=\"430\" cy=\"30\" r=\"28\" fill=\"#1e2230\" stroke=\"#9ccc65\"><\u002Fcircle><text x=\"430\" y=\"34\" text-anchor=\"middle\" font-size=\"12\">Trigger<\u002Ftext>\n        <line x1=\"274\" y1=\"90\" x2=\"386\" y2=\"115\" stroke=\"#787b86\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <text x=\"330\" y=\"126\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"11\">breach / lost permission / 3 bars<\u002Ftext>\n        <circle cx=\"430\" cy=\"120\" r=\"28\" fill=\"#1e2230\" stroke=\"#787b86\"><\u002Fcircle><text x=\"430\" y=\"124\" text-anchor=\"middle\" font-size=\"12\">Retired<\u002Ftext>\n        <line x1=\"458\" y1=\"30\" x2=\"560\" y2=\"30\" stroke=\"#ffd54f\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <text x=\"510\" y=\"20\" text-anchor=\"middle\" fill=\"#ffd54f\" font-size=\"11\">if management on<\u002Ftext>\n        <rect x=\"570\" y=\"8\" width=\"310\" height=\"44\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ffd54f\"><\u002Frect>\n        <text x=\"725\" y=\"27\" text-anchor=\"middle\" font-size=\"12\">2U campaign: U1 and U2 at invalidation<\u002Ftext>\n        <text x=\"725\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" fill=\"#9aa3b2\">U1 tightens after 2 opposing crosses; U2 after HTF extreme + 1<\u002Ftext>\n        <line x1=\"458\" y1=\"120\" x2=\"104\" y2=\"150\" stroke=\"#9aa3b2\" stroke-width=\"1\" stroke-dasharray=\"4 4\"><\u002Fline>\n        <line x1=\"104\" y1=\"150\" x2=\"70\" y2=\"109\" stroke=\"#9aa3b2\" stroke-width=\"1\" stroke-dasharray=\"4 4\" marker-end=\"url(#arr)\"><\u002Fline>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0\">\n    <b>Cancellation order matters.<\u002Fb> On each bar the script checks, in order: data unavailable, invalidation breached, permission lost, chart-TF extreme reached, expiry, then follow-through. A bar that both breaches the invalidation and closes higher is a cancellation, not a trigger.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtf-table\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTF · direction<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTF status table<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Row by row<\u002Fdiv>\n        <\u002Fheader>\n<div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>Row<\u002Fsc-raw-th><sc-raw-th>What it tells you<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Pair<\u002Fsc-raw-td><sc-raw-td>Which chart / HTF pair is active, or \"Unsupported\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Feed<\u002Fsc-raw-td><sc-raw-td>Exchange, ticker and type. Different feeds of the same asset produce slightly different crossovers.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Engine<\u002Fsc-raw-td><sc-raw-td>Which oscillator is running; anything other than Stochastic is flagged experimental.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Chart / HTF N/range/F/S<\u002Fsc-raw-td><sc-raw-td>Lookback, RSI range (Stochastic RSI only), fast and slow smoothing, and the extreme levels in use.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Confirmed context<\u002Fsc-raw-td><sc-raw-td>HTF direction (Bullish, Bearish, Neutral) and zone (Middle, Transition, Upper or Lower extreme). Coloured like the ribbon.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>HTF close (UTC)<\u002Fsc-raw-td><sc-raw-td>Timestamp of the HTF bar the context comes from. It should lag the chart by one HTF bar; if it equals the current bar, the context is provisional.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Status<\u002Fsc-raw-td><sc-raw-td>What the script is doing now: warming up, armed long or short, \"Context blocks new entries\", or \"Waiting for qualifying crossover\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Last event<\u002Fsc-raw-td><sc-raw-td>The most recent state change and its reason, such as \"Price trigger\" or \"Cancelled: invalidation breached\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Last trigger / invalidation<\u002Fsc-raw-td><sc-raw-td>Close at the last trigger and the invalidation that applied to it. This is your reference for a live stop.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>U1 / U2 next protection<\u002Fsc-raw-td><sc-raw-td>With management on: the stop each half will use on the next bar, and whether it is at the Cycle level, Armed, or trailing 1-bar. \"Flat\" means exited.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtm\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTM · timing<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTM: Dynamic Time Map<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Script V1.3 · how a forecast is built<\u002Fdiv>\n        <\u002Fheader>\n<h3>How a forecast is built<\u002Fh3>\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <svg sc-camel-view-box=\"0 0 900 260\" width=\"100%\" role=\"img\" aria-label=\"DTM pipeline\">\n      <g font-size=\"13\" fill=\"#e6e8ee\">\n        <rect x=\"20\" y=\"20\" width=\"230\" height=\"64\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26a69a\"><\u002Frect>\n        <text x=\"135\" y=\"45\" text-anchor=\"middle\" font-weight=\"700\">1. Confirm pivots<\u002Ftext>\n        <text x=\"135\" y=\"66\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">depth 5 + 1.5 ATR deviation<\u002Ftext>\n        <line x1=\"250\" y1=\"52\" x2=\"300\" y2=\"52\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <rect x=\"310\" y=\"20\" width=\"230\" height=\"64\" rx=\"8\" fill=\"#1e2230\" stroke=\"#26c6da\"><\u002Frect>\n        <text x=\"425\" y=\"45\" text-anchor=\"middle\" font-weight=\"700\">2. Measure durations<\u002Ftext>\n        <text x=\"425\" y=\"66\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">low→high, high→low, high→high, low→low<\u002Ftext>\n        <line x1=\"540\" y1=\"52\" x2=\"590\" y2=\"52\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <rect x=\"600\" y=\"20\" width=\"280\" height=\"64\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ff9800\"><\u002Frect>\n        <text x=\"740\" y=\"45\" text-anchor=\"middle\" font-weight=\"700\">3. Project from last pivot<\u002Ftext>\n        <text x=\"740\" y=\"66\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">five models, each a set of candidate dates or a band<\u002Ftext>\n        <line x1=\"740\" y1=\"84\" x2=\"740\" y2=\"120\" stroke=\"#9aa3b2\" stroke-width=\"2\" marker-end=\"url(#arr)\"><\u002Fline>\n        <rect x=\"470\" y=\"130\" width=\"410\" height=\"110\" rx=\"8\" fill=\"#1e2230\" stroke=\"#ffd54f\"><\u002Frect>\n        <text x=\"675\" y=\"155\" text-anchor=\"middle\" font-weight=\"700\">4. Score every future day, rank windows<\u002Ftext>\n        <text x=\"675\" y=\"178\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">points = one vote per historical interval landing within ±1 day<\u002Ftext>\n        <text x=\"675\" y=\"196\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">+ range bonus if inside TRZ / Time Band overlap<\u002Ftext>\n        <text x=\"675\" y=\"214\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">+ maximum bonus (conditional) + theory bonus (optional)<\u002Ftext>\n        <text x=\"675\" y=\"232\" text-anchor=\"middle\" fill=\"#ffd54f\" font-size=\"12\">Output: up to 3 windows ≤ 5 days wide, within a 90-day horizon<\u002Ftext>\n        <rect x=\"20\" y=\"130\" width=\"400\" height=\"110\" rx=\"8\" fill=\"#1e2230\" stroke=\"#787b86\"><\u002Frect>\n        <text x=\"220\" y=\"155\" text-anchor=\"middle\" font-weight=\"700\">5. Resolve<\u002Ftext>\n        <text x=\"220\" y=\"178\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">When the next opposite pivot is confirmed, its date is<\u002Ftext>\n        <text x=\"220\" y=\"196\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">tested against the issued windows: hit if inside any.<\u002Ftext>\n        <text x=\"220\" y=\"214\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">Expired windows stay pending until a pivot confirms.<\u002Ftext>\n        <text x=\"220\" y=\"232\" text-anchor=\"middle\" fill=\"#9aa3b2\" font-size=\"12\">A new pivot issues a new forecast version (#id).<\u002Ftext>\n      <\u002Fg>\n    <\u002Fsvg>\n  <\u002Fdiv>\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--red);background:#1d1414\">\n    <b>Scores are evidence counts, not probabilities.<\u002Fb> A window scored 4.97 had roughly five independent historical intervals pointing at it plus bonuses. It says nothing about how far price will move.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtm-visuals\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTM · timing<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTM visuals<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Bands, zones, levels and labels<\u002Fdiv>\n        <\u002Fheader>\n<div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;display:grid;grid-template-columns:34px 1fr;gap:12px 14px;align-items:start\">\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(90deg,var(--teal) 50%,var(--orange) 50%)\"><\u002Fdiv><div><b>Green / orange zigzag.<\u002Fb> The confirmed pivot path. Green legs advance, orange legs decline. Every projection is measured from these pivots, so if the path looks wrong the forecasts are wrong.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:#e6e8ee\">▣<\u002Fdiv><div><b>\"Confirmed L\" / \"Confirmed H\" label.<\u002Fb> The most recent confirmed pivot and the anchor for the live forecast. Placed at the pivot's date, not the bar where it was confirmed. Optional \"Show provisional leg\" draws the unconfirmed leg from it.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(255,152,0,.35);border-color:var(--orange)\"><\u002Fdiv><div><b>Orange vertical bands.<\u002Fb> The ranked forecast windows for the next opposite pivot (up to 3, each ≤ 5 days). Darker means higher score. The label on each shows dates, width and score.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:0;margin-top:11px;border:none;border-top:3px dashed;border-color:var(--orange)\"><\u002Fdiv><div><b>Orange dashed vertical, Maximum boundary.<\u002Fb> Latest date the historical maximum-duration model expects the turn by. Conditional on no other pivot confirming first, hence the asterisk in the table.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(38,166,154,.25);border-color:var(--trz)\"><\u002Fdiv><div><b>TRZ cycle (teal, top).<\u002Fb> Trimmed same-type duration range (high→high for a HIGH forecast) projected from the last same-type pivot. Miner's Time Rhythm Zone, broad on its own.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(38,166,154,.45);border-color:var(--trz)\"><\u002Fdiv><div><b>TRZ overlap (teal, narrower).<\u002Fb> Intersection of the same-type range with the directional range (low→high) projected from the anchor. The classic TRZ zone.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(233,30,99,.2);border-color:var(--magenta)\"><\u002Fdiv><div><b>Time Band directional (magenta, wide).<\u002Fb> Range of the most recent directional durations (default last 10) projected from the anchor. Adapts faster than TRZ because it ignores older history.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(233,30,99,.3);border-color:var(--magenta)\"><\u002Fdiv><div><b>Time Band cycle (magenta).<\u002Fb> Recent same-type durations projected from the last same-type pivot.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(233,30,99,.5);border-color:var(--magenta)\"><\u002Fdiv><div><b>Time Band overlap (magenta, narrowest).<\u002Fb> Intersection of the two Time Band ranges. Ranked windows inside both this and the TRZ overlap earn the range bonus.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(120,123,134,.3);border-color:var(--grey)\"><\u002Fdiv><div><b>Grey bands (optional).<\u002Fb> \"Earliest-window baseline\": the same number of covered days placed as early as possible. Display-only comparison so you can see whether the model's windows differ from a naive placement.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:4px;margin-top:10px;border:none;background:var(--teal)\"><\u002Fdiv><div><b>Teal solid horizontal segments, APP levels.<\u002Fb> Alternate price projections (0.618 / 1.0 / 1.618 of the prior same-direction leg) from the anchor pivot. Drawn only across each ranked window by default; \"Full width\" extends them right from the anchor. Where price meets one of these inside a window, the window label gains <b>◆ level<\u002Fb> and turns yellow.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);height:0;margin-top:11px;border:none;border-top:3px dashed;border-color:var(--grey)\"><\u002Fdiv><div><b>Grey dotted horizontal segments, retracement levels.<\u002Fb> 0.382 / 0.5 / 0.618 / 0.786 of the last leg, same placement rules as APP.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:none;border:none;font-weight:700;text-align:center;height:auto;margin-top:0;color:var(--lime)\">●<\u002Fdiv><div><b>\"● mom\" on a window label.<\u002Fb> A qualifying chart-stochastic crossover (8/3/3, midpoint pullback) in the forecast's direction occurred inside that window. With ◆ level as well, the label border turns lime: time, price, and momentum agree.<\u002Fdiv>\n    <div style=\"width:30px;height:18px;border-radius:4px;margin-top:3px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);border-color:var(--grey)\"><\u002Fdiv><div><b>Faded historical bands (optional).<\u002Fb> \"Previous issued forecasts to display\" shows earlier versions with their outcome text so you can eyeball hits and misses.<\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"color:var(--muted);font-size:13px\">The empty pane below price is left over from the DTF layout; DTM draws nothing there.<\u002Fp>\n      <\u002Farticle>\n      <article data-page=\"dtm-models\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTM · timing<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">The five time models<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">What feeds the score, and in which units<\u002Fdiv>\n        <\u002Fheader>\n<div style=\"overflow-x:auto\"><sc-raw-table>\n    <sc-raw-tr><sc-raw-th>Model<\u002Fsc-raw-th><sc-raw-th>Source durations<\u002Fsc-raw-th><sc-raw-th>Projected from<\u002Fsc-raw-th><sc-raw-th>Contributes<\u002Fsc-raw-th><sc-raw-th>Preset<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Directional time symmetry<\u002Fsc-raw-td><sc-raw-td>Prior low→high (for a HIGH forecast) and their 62 / 100 / 162 percent alternates<\u002Fsc-raw-td><sc-raw-td>Anchor pivot<\u002Fsc-raw-td><sc-raw-td>Point votes, one per historical interval<\u002Fsc-raw-td><sc-raw-td>All<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Cycle votes<\u002Fsc-raw-td><sc-raw-td>Prior high→high<\u002Fsc-raw-td><sc-raw-td>Last same-type pivot<\u002Fsc-raw-td><sc-raw-td>Point votes<\u002Fsc-raw-td><sc-raw-td>V1 control only<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Automatic TRZ<\u002Fsc-raw-td><sc-raw-td>Both families, trimmed to the central 80 percent<\u002Fsc-raw-td><sc-raw-td>Both anchors, intersected<\u002Fsc-raw-td><sc-raw-td>Range bonus<\u002Fsc-raw-td><sc-raw-td>All<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Recent Time Bands<\u002Fsc-raw-td><sc-raw-td>Last 10 of each family, untrimmed<\u002Fsc-raw-td><sc-raw-td>Both anchors, intersected<\u002Fsc-raw-td><sc-raw-td>Range bonus<\u002Fsc-raw-td><sc-raw-td>All<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <sc-raw-tr><sc-raw-td>Maximum probable boundary<\u002Fsc-raw-td><sc-raw-td>Longest historical duration<\u002Fsc-raw-td><sc-raw-td>Anchor pivot<\u002Fsc-raw-td><sc-raw-td>Conditional bonus and the dashed line<\u002Fsc-raw-td><sc-raw-td>All<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n  <\u002Fsc-raw-table><\u002Fdiv>\n  <h4>Duration unit<\u002Fh4>\n  <p><b>Calendar days<\u002Fb> (default) is Miner's construction and the one the <code>MINER-DT-030<\u002Fcode> claim is written for: durations come from bar timestamps, so weekends and holidays count and a window can start on a non-trading day. <b>Bars<\u002Fb> is an evaluator variant added 2026-09-11: every chart bar is one unit, gaps do not exist, dates render as \"bar N\", and the horizon, tolerance and width inputs are read in bars. Use Bars on intraday charts and on five-day markets where you want windows to land only on trading sessions; use Calendar days when you want results comparable to the claim file and to Miner's own examples. On 24/7 crypto the two modes coincide.<\u002Fp>\n  <p><b>Alternative anchors<\u002Fb> (off by default) add closing-price extremes and nearby secondary extremes as extra anchor variants. They share one vote per interval so they cannot inflate scores. <b>Theoretical correction<\u002Fb> draws the 38.2 to 61.8 percent time-retracement window and can optionally score.<\u002Fp>\n      <\u002Farticle>\n      <article data-page=\"dtm-dash\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTM · timing<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTM dashboard views<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Compact, Detailed, Window evidence, Scorecard, Journal<\u002Fdiv>\n        <\u002Fheader>\n<p>Chosen under <b>Inputs › 7. Dashboard and review<\u002Fb>. Same panel, five depths: Compact, Detailed, Window evidence, Scorecard, Journal.<\u002Fp>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Compact <span style=\"color:var(--muted);font-size:13px\">(default)<\u002Fspan><\u002Fh3>\n    <div style=\"overflow-x:auto\"><sc-raw-table>\n      <sc-raw-tr><sc-raw-th>Row<\u002Fsc-raw-th><sc-raw-th>Reading<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Next HIGH? / LOW? | #id<\u002Fsc-raw-td><sc-raw-td>Pivot type expected next and the forecast version number. A new number appears every time a pivot confirms.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>State<\u002Fsc-raw-td><sc-raw-td><b>Upcoming<\u002Fb>: no window has started. <b>Active<\u002Fb>: inside a window now. <b>Elapsed<\u002Fb>: all windows passed, confirmation pending. Or \"No usable future support\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Nearest remaining<\u002Fsc-raw-td><sc-raw-td>First window still ahead, with its score.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Strongest at issuance<\u002Fsc-raw-td><sc-raw-td>Top-scored window when the forecast was created. Often differs from nearest.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Countdown<\u002Fsc-raw-td><sc-raw-td>Duration units (days or bars) until the nearest window opens, or remaining inside it.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Maximum boundary*<\u002Fsc-raw-td><sc-raw-td>The dashed-line date, marked \"conditional\" or \"exceeded\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Coverage / continuous span<\u002Fsc-raw-td><sc-raw-td>Total days covered by all windows, and the longest unbroken run. Fifteen days of cover in a 90-day horizon is a specific forecast; forty is vague.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Last resolved forecast<\u002Fsc-raw-td><sc-raw-td>Outcome text of the previous version, such as \"Occurrence inside issued window\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Expand in Inputs<\u002Fsc-raw-td><sc-raw-td>Reminder that the other views live under Inputs › 7, and that the score is evidence, not probability.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Price levels<\u002Fsc-raw-td><sc-raw-td>Count of APP and retracement levels drawn, the extent mode, and whether price is currently at a level inside a window (\"at level: YES / NO\"). \"off\" when group 8 is disabled.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Momentum<\u002Fsc-raw-td><sc-raw-td>Chart stochastic settings, current fast and slow values, the last qualifying cross and its age, and whether one has occurred inside the live forecast's windows.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Pooling<\u002Fsc-raw-td><sc-raw-td>Sibling count and how many pooled directional and cycle durations were added, plus the scope (ranges only, or ranges and votes). \"off\" by default.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Export<\u002Fsc-raw-td><sc-raw-td>Whether journal export is on, the delimiter, and how many JOURNAL lines have been emitted this session.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <p style=\"color:var(--muted);font-size:13px\">Before the first confirmed pivot the panel shows \"Waiting for first confirmed pivot\" with only the Price levels, Momentum, Pooling and Export rows.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Detailed<\u002Fh3>\n    <p>The Compact rows plus the ingredients: detector in use; pivot date versus the date it became known and the lag in duration units; the market / clock row (symbol, timeframe, unit); observation counts for the directional and cycle families against the minimum; how many each TRZ trim retained; the TRZ, Time Band, and shared overlap ranges as dates; which alternative anchors are on; the theoretical window; history counts; data gaps; lead and elapsed days; preset and adjacency mode; and the baseline text. Use it when a window looks odd and you want to see which family produced it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Window evidence<\u002Fh3>\n    <p>One window dissected. Pick <b>Strongest<\u002Fb>, <b>Nearest remaining<\u002Fb>, or <b>Window 1 to 3<\u002Fb> under \"Window to inspect\".<\u002Fp>\n    <ul>\n      <li><b>Score components at peak<\u002Fb>: points + range bonus + maximum bonus + theory bonus, summing to the displayed score.<\u002Fli>\n      <li><b>Directional unique / cycle unique<\u002Fb>: how many independent historical intervals voted. Five uniques from five different swings is stronger than five votes from anchor variants of one swing.<\u002Fli>\n      <li><b>Primary / close / secondary<\u002Fb>: which anchor variant produced each vote, so you can see whether closing or secondary anchors are carrying the score.<\u002Fli>\n      <li><b>Supporting sample IDs and anchor dates<\u002Fb>: the actual historical swings behind the window. Cross-check them on the chart.<\u002Fli>\n      <li><b>Range support at peak<\u002Fb>: whether the peak day sits inside TRZ and Time Band, or is a \"broad empirical overlap\" with no point-supported peak.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Scorecard<\u002Fh3>\n    <p>Track record over the last 100 forecast versions, recalculated with current inputs.<\u002Fp>\n    <div style=\"overflow-x:auto\"><sc-raw-table>\n      <sc-raw-tr><sc-raw-th>Row<\u002Fsc-raw-th><sc-raw-th>Reading<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Model hits / misses, hit rate<\u002Fsc-raw-td><sc-raw-td>Of resolved forecasts, how many next-pivots landed inside any issued window.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Hits / misses at a price level<\u002Fsc-raw-td><sc-raw-td>How many hits, and how many misses, occurred with price within tolerance of an APP or retracement level. Compare the two percentages.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Hits / misses with momentum confirmation; hits with time+price+momentum<\u002Fsc-raw-td><sc-raw-td>Shown only with group 9 on. Whether a qualifying stochastic cross inside a window accompanied the hit or the miss, and how many hits had all three agreeing.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Mean distance to nearest window<\u002Fsc-raw-td><sc-raw-td>Average days from the actual pivot to the closest window edge; inside counts as zero. Low distance with a low hit rate means near misses.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Mean confirmation delay<\u002Fsc-raw-td><sc-raw-td>How many daily bars after a pivot it took to confirm. This is the operational lag you live with.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Mean covered days / forecast<\u002Fsc-raw-td><sc-raw-td>Average specificity. Compare with the horizon.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Pending / no-window resolved<\u002Fsc-raw-td><sc-raw-td>Forecasts awaiting a pivot, and forecasts that issued no window.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Excluded: gaps / turn before issue<\u002Fsc-raw-td><sc-raw-td>Forecasts dropped for data gaps or because the turn came before the forecast existed.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"color:var(--yellow)\">Equal-coverage comparison<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--yellow)\">How many scored forecasts had a baseline built for them, and how many did not.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"color:var(--yellow)\">Paired model / baseline hits<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--yellow)\">For forecasts where an equal-coverage earliest-window baseline could be built: model hits versus baseline hits on the same forecasts.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"color:var(--yellow)\">Paired model minus baseline<\u002Fsc-raw-td><sc-raw-td style=\"color:var(--yellow)\"><b>The only line that says whether the timing models beat naive placement.<\u002Fb> Positive percentage points mean the models add information; near zero means the coverage alone explains the hits.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td>Paired coverage, each model<\u002Fsc-raw-td><sc-raw-td>Total duration units covered across the paired forecasts, identical for model and baseline by construction.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-table><\u002Fdiv>\n    <p style=\"color:var(--muted);font-size:13px\">The panel's own caveat applies: not an immutable journal, not an independent holdout, timing accuracy only, small samples do not establish an edge.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Journal<\u002Fh3>\n    <p>The last twelve resolved forecasts, newest first: id and kind, issued → occurred, HIT / MISS / NO_WINDOW / EXCLUDED, distance to the nearest window in units, and L M B flags for level, momentum, and both. This is the human-readable view of the export lines described below; the panel reads the forecast archive, so it fills even with export off.<\u002Fp>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"dtm-ext\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">DTM · timing<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">DTM extensions<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Added 2026-09-12 · five optional groups<\u002Fdiv>\n        <\u002Fheader>\n<p style=\"color:var(--muted);font-size:13px\">Five additions, each behind its own input group. Defaults keep the original behaviour except where stated. None has been compiled in TradingView yet; the static validator passes.<\u002Fp>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Duration unit and real dates <span style=\"color:var(--muted);font-size:13px\">(group 1)<\u002Fspan><\u002Fh3>\n    <p>Calendar days (default, Miner's construction) or Bars. In Bars mode every chart bar is one unit, so intraday charts and five-day markets work without weekend gaps. Dates render from real bar timestamps for past bars and as an estimate with \"(+K bars)\" for future ones.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Price confluence <span style=\"color:var(--muted);font-size:13px\">(group 8, on by default)<\u002Fspan><\u002Fh3>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px\">\n      <div>\n        <p><b>What it draws.<\u002Fb> From the three most recent confirmed pivots A (anchor), B, C: retracements of the last leg B→A at 0.382 / 0.5 / 0.618 / 0.786, and alternate price projections of the prior same-direction leg C→B at 0.618 / 1.0 / 1.618, both measured from A. Levels are computed once at forecast issuance and never move.<\u002Fp>\n        <p><b>Level extent.<\u002Fb> <em>Window only<\u002Fem> (default) draws each level as a short segment spanning each ranked window, so a level is visible only where time says it matters. <em>Full width<\u002Fem> draws each level once from the anchor and extends it right.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <p><b>Confluence flag.<\u002Fb> Price inside a ranked window and within 0.25 ATR (input) of any level sets <b>◆ level<\u002Fb> on that window's label, colours it yellow, adds a \"Time+price confluence at APP 1.0\" event to the alert stream once per window, and shows on the Compact row \"Price levels\".<\u002Fp>\n        <p><b>Scorecard rows.<\u002Fb> \"Hits at a price level\" and \"Misses at a price level\" record whether the resolved pivot's price sat at a level, using the ATR at issuance. They do not change how hits are scored; they show whether the price filter would have separated hits from misses.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <svg sc-camel-view-box=\"0 0 900 190\" width=\"100%\" role=\"img\" aria-label=\"Window-only versus full-width levels\">\n      <rect x=\"0\" y=\"0\" width=\"900\" height=\"190\" fill=\"#0b0d12\"><\u002Frect>\n      <text x=\"225\" y=\"22\" font-size=\"12\" fill=\"#e6e8ee\" text-anchor=\"middle\">Window only (default)<\u002Ftext>\n      <text x=\"675\" y=\"22\" font-size=\"12\" fill=\"#e6e8ee\" text-anchor=\"middle\">Full width<\u002Ftext>\n      <line x1=\"450\" y1=\"10\" x2=\"450\" y2=\"180\" stroke=\"#2a3040\"><\u002Fline>\n      <rect x=\"230\" y=\"30\" width=\"60\" height=\"140\" fill=\"#ff9800\" opacity=\".22\"><\u002Frect><rect x=\"330\" y=\"30\" width=\"45\" height=\"140\" fill=\"#ff9800\" opacity=\".22\"><\u002Frect>\n      <line x1=\"230\" y1=\"70\" x2=\"290\" y2=\"70\" stroke=\"#26a69a\" stroke-width=\"2\"><\u002Fline><line x1=\"330\" y1=\"70\" x2=\"375\" y2=\"70\" stroke=\"#26a69a\" stroke-width=\"2\"><\u002Fline><text x=\"380\" y=\"74\" font-size=\"10\" fill=\"#26a69a\">APP 1.0<\u002Ftext>\n      <line x1=\"230\" y1=\"110\" x2=\"290\" y2=\"110\" stroke=\"#9aa3b2\" stroke-width=\"2\" stroke-dasharray=\"3 3\"><\u002Fline><line x1=\"330\" y1=\"110\" x2=\"375\" y2=\"110\" stroke=\"#9aa3b2\" stroke-width=\"2\" stroke-dasharray=\"3 3\"><\u002Fline><text x=\"380\" y=\"114\" font-size=\"10\" fill=\"#9aa3b2\">Ret 0.618<\u002Ftext>\n      <polyline points=\"60,160 100,120 140,140 180,90 230,105 260,72 290,95\" fill=\"none\" stroke=\"#e6e8ee\" stroke-width=\"1.5\"><\u002Fpolyline>\n      <circle cx=\"260\" cy=\"72\" r=\"6\" fill=\"none\" stroke=\"#ffd54f\" stroke-width=\"2\"><\u002Fcircle><text x=\"262\" y=\"60\" font-size=\"10\" fill=\"#ffd54f\">◆ level<\u002Ftext>\n      <text x=\"60\" y=\"180\" font-size=\"10\" fill=\"#9aa3b2\">levels appear only inside windows<\u002Ftext>\n      <rect x=\"680\" y=\"30\" width=\"60\" height=\"140\" fill=\"#ff9800\" opacity=\".22\"><\u002Frect><rect x=\"780\" y=\"30\" width=\"45\" height=\"140\" fill=\"#ff9800\" opacity=\".22\"><\u002Frect>\n      <line x1=\"520\" y1=\"70\" x2=\"890\" y2=\"70\" stroke=\"#26a69a\" stroke-width=\"2\"><\u002Fline><text x=\"850\" y=\"64\" font-size=\"10\" fill=\"#26a69a\">APP 1.0<\u002Ftext>\n      <line x1=\"520\" y1=\"110\" x2=\"890\" y2=\"110\" stroke=\"#9aa3b2\" stroke-width=\"2\" stroke-dasharray=\"3 3\"><\u002Fline><text x=\"850\" y=\"124\" font-size=\"10\" fill=\"#9aa3b2\">Ret 0.618<\u002Ftext>\n      <polyline points=\"510,160 550,120 590,140 630,90 680,105 710,72 740,95\" fill=\"none\" stroke=\"#e6e8ee\" stroke-width=\"1.5\"><\u002Fpolyline>\n      <circle cx=\"520\" cy=\"160\" r=\"4\" fill=\"#26a69a\"><\u002Fcircle><text x=\"528\" y=\"176\" font-size=\"10\" fill=\"#9aa3b2\">anchor pivot<\u002Ftext>\n    <\u002Fsvg>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Momentum agreement <span style=\"color:var(--muted);font-size:13px\">(group 9, on by default)<\u002Fspan><\u002Fh3>\n    <p>DTM now computes the same chart stochastic DTF uses (8/3/3, extremes 20/80, midpoint-pullback rule). A bullish crossover confirms a next-LOW forecast, a bearish crossunder a next-HIGH, but only when it occurs <em>inside<\u002Fem> a ranked window. That window gets <b>● mom<\u002Fb>, the alert stream reports \"Momentum confirmation inside window\", and if a price level is also met the label border turns lime.<\u002Fp>\n    <p><b>Scorecard rows<\u002Fb> (shown only when the feature is on): \"Hits with momentum confirmation\", \"Misses with momentum confirmation\", and \"Hits with time+price+momentum\". Read them against the plain hit rate: if hits carry momentum confirmation far more often than misses do, the DTF pairing is earning its place on that symbol.<\u002Fp>\n    <p style=\"color:var(--muted);font-size:13px\">The Compact row \"Momentum\" shows current fast and slow values, the last qualifying cross and its age, and whether one has occurred inside the live forecast's windows.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Symbol pooling <span style=\"color:var(--muted);font-size:13px\">(group 10, off by default)<\u002Fspan><\u002Fh3>\n    <p>Miner pools swing files across related instruments when one has too few cycles, and the <code>MINER-DT-030<\u002Fcode> claim requires per-symbol counts whenever pooling is used. Up to three sibling symbols are read on the chart timeframe with a simple left/right pivot detector; their pivot-to-pivot durations join the four duration families as tagged samples, capped per sibling.<\u002Fp>\n    <p><b>Scope.<\u002Fb> <em>Ranges only<\u002Fem> (default when on) lets pooled durations widen the TRZ and Time Band ranges but not cast point votes. <em>Ranges and votes<\u002Fem> lets them vote too. The Detailed view's observation row breaks counts down per symbol, the Compact \"Pooling\" row summarises, and Window-evidence sample ids carry the sibling's ticker. The chart symbol's own detector, issuance, scoring, and resolution are untouched.<\u002Fp>\n    <p style=\"color:var(--muted);font-size:13px\">Sibling durations are comparable only because the request runs on the chart timeframe; in Bars mode they are the sibling's bars.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <h3 style=\"margin-top:0\">Journal export <span style=\"color:var(--muted);font-size:13px\">(group 11, on by default)<\u002Fspan><\u002Fh3>\n    <p>When a forecast resolves, DTM emits one fixed-format line through <code>alert()<\u002Fcode>, prefixed \"JOURNAL\", plus a header line on the first resolution. Capture it with a TradingView alert set to \"Any alert() function call\" and a webhook, and you have a record that survives input changes, which the recomputed Scorecard cannot promise.<\u002Fp>\n    <pre style=\"background:#0b0d12;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;overflow-x:auto;color:var(--text)\">source|version|symbol|tf|unit|id|kind|issued|anchor|windows|occurred|resolved|outcome|distance|lag|atLevel|momentum|both|pooled|preset|detector\nDTM|1.3|COINBASE:BTCUSD|1D|days|42|HIGH|2026-08-01|2026-07-29|2026-08-05~2026-08-07~2.50;2026-08-10~2026-08-12~1.75|2026-08-06|2026-08-09|HIT|0|3|1|1|1|0|V1 control|Original depth + ATR%<\u002Fpre>\n    <p style=\"color:var(--muted);font-size:13px\">Windows are <code>start~finish~score<\u002Fcode> joined by \";\", so keep the field delimiter at \"|\" (default). Outcome tokens: HIT, MISS, NO_WINDOW, EXCLUDED_GAP, EXCLUDED_EARLY. Lines are emitted only on live bars; the Journal view fills from history regardless.<\u002Fp>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"together\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Using DTF and DTM together<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">The six-step loop, and what agreement looks like<\u002Fdiv>\n        <\u002Fheader>\n<div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0\">\n    <ol>\n      <li><b>Start with DTM.<\u002Fb> Note the next expected pivot type (HIGH or LOW), the nearest window, and whether it sits inside both overlaps. Set the Countdown as your attention timer.<\u002Fli>\n      <li><b>Check the DTF ribbon.<\u002Fb> If DTM expects a HIGH and the HTF ribbon is orange (Transition or Upper extreme), the two agree that a top is plausible. Teal with a HIGH forecast means the timing model is calling a pause inside a trend; treat it as an exit or tightening cue rather than a reversal.<\u002Fli>\n      <li><b>Wait for the DTF setup.<\u002Fb> An S inside a DTM window, in the direction of the expected turn, is the condition you are looking for. Note the orange invalidation line.<\u002Fli>\n      <li><b>Act on the trigger, not the setup.<\u002Fb> The T / DTF marker is the entry event. If no trigger comes within three bars the setup retires with a grey X and you wait for the next one.<\u002Fli>\n      <li><b>Manage with U1 / U2 or your own rules.<\u002Fb> The purple U2 line is the cycle stop; the aqua U1 line shows how a tight trail would have behaved. Neither places orders.<\u002Fli>\n      <li><b>Score the window afterwards.<\u002Fb> When the pivot confirms, DTM resolves the forecast. Over time the Scorecard's paired difference tells you whether the timing filter is earning its keep on this symbol.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div style=\"border-left:4px solid var(--orange);background:#1c1a14;padding:12px 16px;border-radius:0 10px 10px 0;margin:14px 0;border-left-color:var(--aqua);background:#12191c\">\n    <b>What agreement looks like:<\u002Fb> DTM State \"Active\", DTF ribbon orange or freshly flipped, a DTF S then T in the forecast direction, and the setup's invalidation just beyond the recent extreme. <b>What disagreement looks like:<\u002Fb> a DTF trigger with no DTM window for weeks, or a DTM window that passes with the DTF stochastic still mid-range and no cross.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"examples\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">In practice<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Worked examples<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">A long, a short, and four ways to stand down<\u002Fdiv>\n        <\u002Fheader>\n\n  <p style=\"color:var(--muted);font-size:13px\">Dates and prices are illustrative. Each example names the exact visual cue at every step so you can match it on screen.<\u002Fp>\n\n  <div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:14px 0;border-left:4px solid var(--teal)\">\n    <h3 style=\"margin-top:0;color:var(--teal)\">Example 1: Long, trend continuation<\u002Fh3>\n\n    <svg sc-camel-view-box=\"0 0 900 400\" width=\"100%\" role=\"img\" aria-label=\"Long example\">\n      <defs><marker id=\"ar2\" sc-camel-marker-width=\"8\" sc-camel-marker-height=\"8\" sc-camel-ref-x=\"6\" sc-camel-ref-y=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 z\" fill=\"#9aa3b2\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n      <rect x=\"0\" y=\"0\" width=\"900\" height=\"400\" fill=\"#0b0d12\"><\u002Frect>\n      <rect x=\"40\" y=\"16\" width=\"820\" height=\"200\" fill=\"#12151d\" stroke=\"#2a3040\"><\u002Frect>\n      <rect x=\"40\" y=\"244\" width=\"820\" height=\"140\" fill=\"#12151d\" stroke=\"#2a3040\"><\u002Frect>\n      <text x=\"46\" y=\"30\" font-size=\"11\" fill=\"#9aa3b2\">Price (daily)<\u002Ftext>\n      <text x=\"46\" y=\"258\" font-size=\"11\" fill=\"#9aa3b2\">DTF pane<\u002Ftext>\n      <line x1=\"40\" y1=\"272\" x2=\"860\" y2=\"272\" stroke=\"#ef5350\" stroke-dasharray=\"4 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"276\" font-size=\"10\" fill=\"#ef5350\">80<\u002Ftext>\n      <line x1=\"40\" y1=\"314\" x2=\"860\" y2=\"314\" stroke=\"#787b86\" stroke-dasharray=\"2 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"318\" font-size=\"10\" fill=\"#9aa3b2\">50<\u002Ftext>\n      <line x1=\"40\" y1=\"356\" x2=\"860\" y2=\"356\" stroke=\"#26a69a\" stroke-dasharray=\"4 4\" opacity=\".6\"><\u002Fline><text x=\"864\" y=\"360\" font-size=\"10\" fill=\"#26a69a\">20<\u002Ftext>\n      \n  <rect x=\"455\" y=\"16\" width=\"120\" height=\"200\" fill=\"#ff9800\" opacity=\".18\"><\u002Frect>\n  <rect x=\"490\" y=\"16\" width=\"55\" height=\"200\" fill=\"#ff9800\" opacity=\".28\"><\u002Frect>\n  <rect x=\"470\" y=\"16\" width=\"100\" height=\"14\" fill=\"#26a69a\" opacity=\".55\"><\u002Frect>\n  <text x=\"520\" y=\"27\" font-size=\"11\" fill=\"#0b0d12\" text-anchor=\"middle\">TRZ overlap<\u002Ftext>\n  <text x=\"515\" y=\"44\" font-size=\"11\" fill=\"#ff9800\" text-anchor=\"middle\">DTM window: Next LOW? 09-24 to 09-28<\u002Ftext>\n  <line x1=\"80\" y1=\"140\" x2=\"80\" y2=\"160\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"76\" y=\"140\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"110\" y1=\"128\" x2=\"110\" y2=\"150\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"106\" y=\"130\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"140\" y1=\"118\" x2=\"140\" y2=\"142\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"136\" y=\"120\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"170\" y1=\"108\" x2=\"170\" y2=\"132\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"166\" y=\"110\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"200\" y1=\"100\" x2=\"200\" y2=\"124\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"196\" y=\"104\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect><line x1=\"230\" y1=\"96\" x2=\"230\" y2=\"118\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"226\" y=\"100\" width=\"8\" height=\"4\" fill=\"#26a69a\"><\u002Frect><line x1=\"260\" y1=\"94\" x2=\"260\" y2=\"114\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"256\" y=\"96\" width=\"8\" height=\"4\" fill=\"#26a69a\"><\u002Frect><line x1=\"290\" y1=\"90\" x2=\"290\" y2=\"110\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"286\" y=\"92\" width=\"8\" height=\"4\" fill=\"#26a69a\"><\u002Frect><line x1=\"320\" y1=\"88\" x2=\"320\" y2=\"106\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"316\" y=\"92\" width=\"8\" height=\"4\" fill=\"#ef5350\"><\u002Frect><line x1=\"350\" y1=\"92\" x2=\"350\" y2=\"112\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"346\" y=\"96\" width=\"8\" height=\"8\" fill=\"#ef5350\"><\u002Frect><line x1=\"380\" y1=\"98\" x2=\"380\" y2=\"118\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"376\" y=\"104\" width=\"8\" height=\"8\" fill=\"#ef5350\"><\u002Frect><line x1=\"410\" y1=\"106\" x2=\"410\" y2=\"128\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"406\" y=\"112\" width=\"8\" height=\"10\" fill=\"#ef5350\"><\u002Frect><line x1=\"440\" y1=\"116\" x2=\"440\" y2=\"140\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"436\" y=\"122\" width=\"8\" height=\"12\" fill=\"#ef5350\"><\u002Frect><line x1=\"470\" y1=\"128\" x2=\"470\" y2=\"150\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"466\" y=\"134\" width=\"8\" height=\"12\" fill=\"#ef5350\"><\u002Frect><line x1=\"500\" y1=\"140\" x2=\"500\" y2=\"160\" stroke=\"#ef5350\" stroke-width=\"1.5\"><\u002Fline><rect x=\"496\" y=\"146\" width=\"8\" height=\"4\" fill=\"#ef5350\"><\u002Frect><line x1=\"530\" y1=\"142\" x2=\"530\" y2=\"158\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"526\" y=\"144\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect><line x1=\"560\" y1=\"128\" x2=\"560\" y2=\"150\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"556\" y=\"132\" width=\"8\" height=\"12\" fill=\"#26a69a\"><\u002Frect><line x1=\"590\" y1=\"112\" x2=\"590\" y2=\"138\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"586\" y=\"118\" width=\"8\" height=\"14\" fill=\"#26a69a\"><\u002Frect><line x1=\"620\" y1=\"98\" x2=\"620\" y2=\"126\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"616\" y=\"104\" width=\"8\" height=\"14\" fill=\"#26a69a\"><\u002Frect><line x1=\"650\" y1=\"90\" x2=\"650\" y2=\"112\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"646\" y=\"94\" width=\"8\" height=\"10\" fill=\"#26a69a\"><\u002Frect><line x1=\"680\" y1=\"84\" x2=\"680\" y2=\"100\" stroke=\"#26a69a\" stroke-width=\"1.5\"><\u002Fline><rect x=\"676\" y=\"88\" width=\"8\" height=\"6\" fill=\"#26a69a\"><\u002Frect>\n  <line x1=\"500\" y1=\"164\" x2=\"600\" y2=\"164\" stroke=\"#ff9800\" stroke-width=\"2\"><\u002Fline>\n  <text x=\"604\" y=\"168\" font-size=\"11\" fill=\"#ff9800\" text-anchor=\"start\">invalidation = leg low − 1 tick<\u002Ftext>\n  <polygon points=\"560,168 552,180 568,180\" fill=\"#9ccc65\"><\u002Fpolygon><text x=\"560\" y=\"194\" font-size=\"11\" fill=\"#9ccc65\" text-anchor=\"middle\">DTF<\u002Ftext>\n  <circle cx=\"560\" cy=\"122\" r=\"6\" fill=\"#ffd54f\"><\u002Fcircle><text x=\"572\" y=\"126\" font-size=\"11\" fill=\"#ffd54f\" text-anchor=\"start\">2U<\u002Ftext>\n  <polyline points=\"560,164 590,164 620,150 650,120 680,100\" fill=\"none\" stroke=\"#26c6da\" stroke-width=\"2\"><\u002Fpolyline><text x=\"684\" y=\"104\" font-size=\"11\" fill=\"#26c6da\" text-anchor=\"start\">U1<\u002Ftext>\n  <polyline points=\"560,166 680,166\" fill=\"none\" stroke=\"#ab47bc\" stroke-width=\"3\"><\u002Fpolyline><text x=\"684\" y=\"170\" font-size=\"11\" fill=\"#ab47bc\" text-anchor=\"start\">U2<\u002Ftext>\n  <rect x=\"40\" y=\"228\" width=\"820\" height=\"8\" fill=\"#26a69a\"><\u002Frect><text x=\"46\" y=\"224\" font-size=\"11\" fill=\"#26a69a\" text-anchor=\"start\">ribbon: teal = weekly bullish, longs permitted<\u002Ftext>\n  <polyline points=\"80,268 140,262 200,270 260,290 320,300 380,306 440,318 500,340 530,350 560,338 590,318 620,296 650,280 680,270\" fill=\"none\" stroke=\"#26c6da\" stroke-width=\"2.5\"><\u002Fpolyline>\n  <polyline points=\"80,272 140,266 200,272 260,286 320,296 380,302 440,312 500,330 530,342 560
