olid var(--wf-line);border-left:4px solid var(--wf-accent);border-radius:10px;padding:16px 20px 14px}\n.wf-card h3{margin:0 0 6px;font-size:18px;color:var(--wf-ink);font-weight:700}\n.wf-card h3 small{font-weight:500;color:var(--wf-dim);font-size:14px;margin-left:8px}\n.wf-read{font-size:15px;line-height:1.5;color:var(--wf-ink);margin:0 0 8px}\n.wf-read b{color:#fff}\n.wf-meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13.5px;color:var(--wf-dim);align-items:center}\n.wf-page{color:var(--wf-accent);text-decoration:none;border-bottom:1px dotted var(--wf-accent)}\n.wf-exit{display:inline-flex;align-items:center;gap:6px;background:#1e2230;border:1px solid var(--wf-line);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--wf-dim)}\n.wf-exit::before{content:\"↳\";color:#c98a8a}\n.wf-go{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#a7c4a0}\n.wf-go::before{content:\"↓\"}\n.wf-phase{grid-column:2;font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--wf-dim);margin:6px 0 10px;font-weight:700}\n.wf .p-scan{--wf-accent:#8a94a6}\n.wf .p-gate{--wf-accent:#7aa2c7}\n.wf .p-wait{--wf-accent:#a89a7a}\n.wf .p-enter{--wf-accent:#8fb58a}\n.wf .p-manage{--wf-accent:#a58fb8}\n.wf .p-review{--wf-accent:#8a94a6}\n.wf-aside{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:760px;margin:22px auto 0}\n.wf-aside .card{margin:0}\n.wf-aside h4{margin:0 0 10px;font-size:13px;letter-spacing:1.2px;color:#9aa3b2}\n.wf-aside li{font-size:14.5px;line-height:1.5;margin:6px 0}\n@media (max-width:700px){.wf::before{left:19px}.wf-step{grid-template-columns:40px 1fr;gap:0 12px}.wf-num{width:40px;height:40px;font-size:14px}.wf-aside{grid-template-columns:1fr}}\n<\u002Fstyle><div class=\"wf\"><div class=\"wf-step\"><div><\u002Fdiv><div class=\"wf-phase\">Every day, a few minutes after the chart-TF close<\u002Fdiv><\u002Fdiv><div class=\"wf-step p-scan\"><div class=\"wf-num\">1<\u002Fdiv><div class=\"wf-card\"><h3>Scan<small>two cells per symbol<\u002Fsmall><\u002Fh3><p class=\"wf-read\"><b>DTM Compact › State<\u002Fb> and <b>DTF table › Status<\u002Fb>. Move on unless State is Active (or Upcoming within 3) or Status is Armed or has a new Last event.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#watchlist\">Multi-symbol watchlist<\u002Fa><span class=\"wf-exit\">quiet: next symbol<\u002Fspan><span class=\"wf-go\">something is live<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step\"><div><\u002Fdiv><div class=\"wf-phase\">Qualify the setup, one gate per closed bar<\u002Fdiv><\u002Fdiv><div class=\"wf-step p-gate\"><div class=\"wf-num\">2<\u002Fdiv><div class=\"wf-card\"><h3>Timing<small>gate 1<\u002Fsmall><\u002Fh3><p class=\"wf-read\"><b>State<\u002Fb> reads Active, or Upcoming with <b>Countdown<\u002Fb> of 3 or less. Write down the direction from <b>Next HIGH? / LOW?<\u002Fb>.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#wt-tree\">Decision tree & checklist<\u002Fa><span class=\"wf-exit\">no window: wait<\u002Fspan><span class=\"wf-go\">window live<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-gate\"><div class=\"wf-num\">3<\u002Fdiv><div class=\"wf-card\"><h3>Window grade<small>gate 2<\u002Fsmall><\u002Fh3><p class=\"wf-read\">Switch the view to <b>Window evidence<\u002Fb>. Score 2 or more, at least 2 unique intervals, Range support YES, not Broad range. Note the size modifier in the journal now.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#wt-window\">How to read a window<\u002Fa><span class=\"wf-exit\">weak window: watch only<\u002Fspan><span class=\"wf-go\">window passes<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-gate\"><div class=\"wf-num\">4<\u002Fdiv><div class=\"wf-card\"><h3>Permission<small>gate 3<\u002Fsmall><\u002Fh3><p class=\"wf-read\"><b>DTF table › Confirmed context<\u002Fb> agrees with the direction, and <b>Status<\u002Fb> does not read \"Context blocks new entries\".<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#dtf-table\">DTF status table<\u002Fa><span class=\"wf-exit\">weekly disagrees: skip, log gate 3<\u002Fspan><span class=\"wf-go\">permitted<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-wait\"><div class=\"wf-num\">5<\u002Fdiv><div class=\"wf-card\"><h3>Wait for S<\u002Fh3><p class=\"wf-read\">Let the phone tell you: the DTF <b>Long / Short setup<\u002Fb> alert. Keep running the daily scan until an S prints inside the window in the right direction, or the window elapses.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#alerts\">Alert setup<\u002Fa><span class=\"wf-exit\">window elapses: stand down, log<\u002Fspan><span class=\"wf-go\">S prints<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-gate\"><div class=\"wf-num\">6<\u002Fdiv><div class=\"wf-card\"><h3>Size from the invalidation<small>gate 4<\u002Fsmall><\u002Fh3><p class=\"wf-read\">Read the orange line. <b>Size = $1,000 ÷ distance × modifier<\u002Fb>, rounded down. Pre-stage two half orders and one stop at the invalidation.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#sizing\">Position sizing<\u002Fa><span class=\"wf-exit\">grey ✕ or breach: back to step 5<\u002Fspan><span class=\"wf-exit\">3 bars and no T: hold<\u002Fspan><span class=\"wf-go\">closed-bar T prints<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step\"><div><\u002Fdiv><div class=\"wf-phase\">In the trade<\u002Fdiv><\u002Fdiv><div class=\"wf-step p-enter\"><div class=\"wf-num\">7<\u002Fdiv><div class=\"wf-card\"><h3>Enter<small>gate 5<\u002Fsmall><\u002Fh3><p class=\"wf-read\"><b>DTF table › Last trigger / invalidation<\u002Fb>. Recompute size on the actual fill. The stop never moves inward. Fill the entry fields of the journal.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#wt-steps\">The five steps › Step 4<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-manage\"><div class=\"wf-num\">8<\u002Fdiv><div class=\"wf-card\"><h3>Manage<small>daily after close<\u002Fsmall><\u002Fh3><p class=\"wf-read\"><b>DTF table › U1 / U2 next protection<\u002Fb>: move both broker stops to the shown levels. Weekly, re-read Confirmed context; a flip against you means tighten U2.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#dtf-lifecycle\">Setup lifecycle<\u002Fa><span class=\"wf-exit\">Flat on U1: half out<\u002Fspan><span class=\"wf-go\">Flat on U2: campaign over<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-step p-review\"><div class=\"wf-num\">9<\u002Fdiv><div class=\"wf-card\"><h3>Review<\u002Fh3><p class=\"wf-read\"><b>DTM Journal view<\u002Fb> gives HIT / MISS and the L M B flags; complete the journal row with the R result. Monthly, copy the Scorecard into the calibration log and count skips by gate.<\u002Fp><div class=\"wf-meta\"><a class=\"wf-page\" href=\"#journal\">Trade journal template<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><div class=\"wf-aside\">\n  <div class=\"card\"><h4>WHILE LOOKING, IF YOU…<\u002Fh4><ul style=\"list-style:none;padding:0;margin:0\">\n    <li>…meet an unknown mark or word → <a class=\"wf-page\" href=\"#glossary\">Glossary<\u002Fa><\u002Fli>\n    <li>…wonder what the pattern looks like → <a class=\"wf-page\" href=\"#gallery\">Screenshot gallery<\u002Fa><\u002Fli>\n    <li>…suspect a stand-down case → <a class=\"wf-page\" href=\"#examples\">Worked examples › Example 3<\u002Fa><\u002Fli>\n    <li>…forget which row to read → <a class=\"wf-page\" href=\"#wt-panels\">Which panel at each step<\u002Fa><\u002Fli>\n  <\u002Ful><\u002Fdiv>\n  <div class=\"card\"><h4>TWO HABITS<\u002Fh4><ul style=\"list-style:none;padding:0;margin:0\">\n    <li>Advance at most one gate per closed bar. Intrabar readings are display only.<\u002Fli>\n    <li>Every exit chip still gets a journal line naming the gate that stopped you. Skips are data.<\u002Fli>\n  <\u002Ful><\u002Fdiv>\n<\u002Fdiv>\n  <div class=\"two\" style=\"max-width:760px;margin:22px auto 0\">\n    <div class=\"callout blue\" style=\"margin:0\"><b>Reading order on a new symbol:<\u002Fb> Overview → Trade walkthrough → How to read a window → Position sizing → Alert setup. After that this map is all you need day to day.<\u002Fdiv>\n    <div class=\"callout\" style=\"margin:0\"><b>When a trade goes wrong:<\u002Fb> Setup lifecycle (cancellation order) → Worked examples › Example 3 → Caveats. Most surprises are the one-bar HTF lag or a weekend window.<\u002Fdiv>\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"glossary\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Reference<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Glossary<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Every abbreviation and mark on one page<\u002Fdiv>\n        <\u002Fheader>\n\n  <div class=\"wrap\"><table>\n    <tr><th style=\"width:170px\">Term<\u002Fth><th>Meaning<\u002Fth><\u002Ftr>\n    <tr><td><b>DTF<\u002Fb><\u002Ftd><td>Dynamic Momentum, dual time frame. The direction and entry script: chart-TF stochastic filtered by the higher-TF stochastic.<\u002Ftd><\u002Ftr>\n    <tr><td><b>DTM<\u002Fb><\u002Ftd><td>Dynamic Time Map. The timing script: projects when the next opposite pivot is likely from historical swing durations.<\u002Ftd><\u002Ftr>\n    <tr><td><b>HTF<\u002Fb><\u002Ftd><td>Higher time frame. Weekly when the chart is daily. DTF reads the last <em>closed<\u002Fem> HTF bar, so context lags by one HTF bar.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Ribbon<\u002Fb><\u002Ftd><td>DTF's colour strip showing HTF direction and zone. Teal bullish, red bearish, orange Transition or extreme.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Permission / context<\u002Fb><\u002Ftd><td>Whether the HTF state allows a new entry in a direction. \"Context blocks new entries\" is the refusal.<\u002Ftd><\u002Ftr>\n    <tr><td><b>S<\u002Fb><\u002Ftd><td>Setup mark. A qualifying chart-TF cross with permission. Teal for long, red for short. Not an entry.<\u002Ftd><\u002Ftr>\n    <tr><td><b>T / ▲ DTF / ▼ DTF<\u002Fb><\u002Ftd><td>Trigger. A close beyond the setup bar's extreme within three bars. The entry event.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Invalidation<\u002Fb><\u002Ftd><td>The orange line at the setup bar's opposite extreme. Breach cancels the setup; after entry it is the initial stop.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Grey ✕<\u002Fb><\u002Ftd><td>Setup retired: invalidation breached, permission lost, chart-TF extreme reached, or three bars expired without a trigger.<\u002Ftd><\u002Ftr>\n    <tr><td><b>2U campaign<\u002Fb><\u002Ftd><td>DTF's illustrative management: the position as two equal halves with separate stops.<\u002Ftd><\u002Ftr>\n    <tr><td><b>U1<\u002Fb><\u002Ftd><td>First half. Stop tightens to a one-bar trail after two opposing chart-TF crosses. Aqua line.<\u002Ftd><\u002Ftr>\n    <tr><td><b>U2<\u002Fb><\u002Ftd><td>Second half. Stop stays at the cycle level until the HTF reaches its extreme, then tightens. Purple line.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Flat<\u002Fb><\u002Ftd><td>Table value meaning that half has exited.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Pivot / confirmed pivot<\u002Fb><\u002Ftd><td>A swing high or low that DTM has accepted after depth bars plus an ATR (or percent) deviation. The \"Confirmed H / L\" label.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Anchor<\u002Fb><\u002Ftd><td>The most recent confirmed pivot; all directional projections start from it.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Forecast #id / version<\u002Fb><\u002Ftd><td>One DTM forecast, issued when a pivot confirms. A new pivot issues the next id and supersedes the old one.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Window<\u002Fb><\u002Ftd><td>An orange band: a ranked span of up to 5 units where the next opposite pivot is expected, with a score.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Score / support<\u002Fb><\u002Ftd><td>Points from historical intervals landing on the window plus range, maximum and theory bonuses. Evidence count, not probability.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Points<\u002Fb><\u002Ftd><td>The vote part of the score: one per independent historical interval.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Unique intervals<\u002Fb><\u002Ftd><td>How many distinct historical swings voted, after collapsing anchor variants of the same swing.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Broad range<\u002Fb><\u002Ftd><td>A window that is only an overlap of ranges with no point-supported peak. Downgrade it.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Cluster / Single factor<\u002Fb><\u002Ftd><td>Window quality text: two or more families voted, or only one.<\u002Ftd><\u002Ftr>\n    <tr><td><b>TRZ<\u002Fb><\u002Ftd><td>Time Rhythm Zone. Trimmed historical duration range projected forward; the teal bands. The overlap of directional and cycle TRZ is the classic zone.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Time Band<\u002Fb><\u002Ftd><td>Range of the most recent durations, untrimmed; the magenta bands. Adapts faster than TRZ.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Directional / cycle<\u002Fb><\u002Ftd><td>Duration families. Directional is low→high (or high→low); cycle is high→high (or low→low).<\u002Ftd><\u002Ftr>\n    <tr><td><b>Maximum probable*<\u002Fb><\u002Ftd><td>The dashed line: latest date the longest historical duration allows. Conditional on no other pivot confirming first.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Coverage / continuous span<\u002Fb><\u002Ftd><td>Total units all windows cover, and the longest unbroken run. Specificity of the forecast.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Baseline<\u002Fb><\u002Ftd><td>Equal-coverage windows placed as early as possible. The naive comparison the Scorecard pairs against.<\u002Ftd><\u002Ftr>\n    <tr><td><b>APP<\u002Fb><\u002Ftd><td>Alternate price projection: 0.618 / 1.0 / 1.618 of the prior same-direction leg, from the anchor. Teal horizontal segments.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Retracement<\u002Fb><\u002Ftd><td>0.382 / 0.5 / 0.618 / 0.786 of the last leg. Grey dotted segments.<\u002Ftd><\u002Ftr>\n    <tr><td><b>◆ level<\u002Fb><\u002Ftd><td>Price inside the window within tolerance of an APP or retracement level. Label turns yellow.<\u002Ftd><\u002Ftr>\n    <tr><td><b>● mom<\u002Fb><\u002Ftd><td>A qualifying chart stochastic cross in the forecast direction inside the window. With ◆ level the label border turns lime.<\u002Ftd><\u002Ftr>\n    <tr><td><b>State<\u002Fb><\u002Ftd><td>Upcoming, Active, Window elapsed: confirmation pending, Superseded by next pivot, Data gap: forecast suspended, or No usable future support.<\u002Ftd><\u002Ftr>\n    <tr><td><b>HIT / MISS / NO_WINDOW / EXCLUDED<\u002Fb><\u002Ftd><td>Forecast outcomes: pivot inside a window, outside all windows, no window issued, or dropped for a data gap or a turn before issuance.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Duration unit<\u002Fb><\u002Ftd><td>Calendar days (Miner's construction) or Bars. All DTM counts, widths and horizons are in this unit.<\u002Ftd><\u002Ftr>\n    <tr><td><b>Pooling<\u002Fb><\u002Ftd><td>Adding sibling symbols' durations to the families. Ranges only by default.<\u002Ftd><\u002Ftr>\n    <tr><td><b>JOURNAL line<\u002Fb><\u002Ftd><td>DTM's fixed-format export emitted by alert() when a forecast resolves.<\u002Ftd><\u002Ftr>\n    <tr><td><b>R<\u002Fb><\u002Ftd><td>Result as a multiple of initial risk: (exit − entry) ÷ (entry − stop).<\u002Ftd><\u002Ftr>\n    <tr><td><b>Risk unit<\u002Fb><\u002Ftd><td>$1,000 USD per trade before modifiers, in this reference.<\u002Ftd><\u002Ftr>\n  <\u002Ftable><\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"calibration\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Reference<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Version and calibration log<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">The Scorecard recomputes on every input change; this page remembers<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>Both scripts' dashboards are recalculated from loaded history with the current inputs. Change one input and every number changes with it, with no memory of what it was. Keep this table by hand, one row per change, per symbol, so a tweak can be judged against what it replaced.<\u002Fp>\n  <div class=\"card\">\n    <div class=\"wrap\"><table>\n      <tr><th>Date<\u002Fth><th>Symbol / TF<\u002Fth><th>Script and version<\u002Fth><th>Input changed (from → to)<\u002Fth><th>Scored forecasts<\u002Fth><th>Hit rate<\u002Fth><th>Paired model − baseline<\u002Fth><th>Hits T+P+M<\u002Fth><th>Note<\u002Fth><\u002Ftr>\n      <tr><td>2026-09-10<\u002Ftd><td>—<\u002Ftd><td>DTF, DTM generalised from BTC scripts<\u002Ftd><td>Base-currency gate removed<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td>Baseline entry; fill from Scorecard<\u002Ftd><\u002Ftr>\n      <tr><td>2026-09-11<\u002Ftd><td>—<\u002Ftd><td>DTM<\u002Ftd><td>Duration unit input added (Calendar days default)<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td>No behaviour change at default<\u002Ftd><\u002Ftr>\n      <tr><td>2026-09-12<\u002Ftd><td>—<\u002Ftd><td>DTM V1.3<\u002Ftd><td>Price confluence, momentum agreement, pooling, export added<\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td>Scoring unchanged; new Scorecard rows<\u002Ftd><\u002Ftr>\n      <tr><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><\u002Ftr>\n      <tr><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><td><\u002Ftd><\u002Ftr>\n    <\u002Ftable><\u002Fdiv>\n  <\u002Fdiv>\n  <h3>Rules for changing an input<\u002Fh3>\n  <div class=\"card\">\n    <ol>\n      <li>Record the Scorecard row values <em>before<\u002Fem> the change in the row above the change.<\u002Fli>\n      <li>Change one input at a time. Two changes in one row cannot be attributed.<\u002Fli>\n      <li>Judge on <b>Paired model minus baseline<\u002Fb> first, hit rate second. A higher hit rate with a lower paired difference means the change widened coverage rather than improving timing.<\u002Fli>\n      <li>Do not change an input while a forecast you are trading is live. Alerts freeze inputs at creation; a changed input silently desynchronises the alert from the chart.<\u002Fli>\n      <li>Fewer than 30 scored forecasts is not enough to prefer one setting over another. Write the row anyway; it will matter later.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div class=\"callout\">\n    <b>What not to tune:<\u002Fb> the stochastic 8/3/3 and 20/80 levels in DTF, the depth 5 / ATR 1.5 pivot detector in DTM, and the calendar-day unit. These are the claim's construction. Tuning them turns the system into something the claim files no longer describe.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"watchlist\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Reference<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Multi-symbol watchlist<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Scanning several instruments without losing the routine<\u002Fdiv>\n        <\u002Fheader>\n\n  <p>The daily routine is two minutes per symbol. Past four or five symbols that stops being true, so the scan has to be narrower than the routine.<\u002Fp>\n  <h3>The one-row scan<\u002Fh3>\n  <div class=\"card\">\n    <p>Save one TradingView layout per symbol with both scripts, DTM on <b>Compact<\u002Fb>, DTF table visible. Then for each symbol read exactly two cells and move on:<\u002Fp>\n    <div class=\"wrap\"><table>\n      <tr><th>Cell<\u002Fth><th>Advance to the full routine only if<\u002Fth><\u002Ftr>\n      <tr><td>DTM Compact · <b>State<\u002Fb><\u002Ftd><td>Active, or Upcoming with Countdown ≤ 3<\u002Ftd><\u002Ftr>\n      <tr><td>DTF table · <b>Status<\u002Fb><\u002Ftd><td>Armed long / short, or Last event changed since yesterday, or you hold a position<\u002Ftd><\u002Ftr>\n    <\u002Ftable><\u002Fdiv>\n    <p>Either cell passes: run the daily routine for that symbol. Neither passes: next symbol. With alerts configured, the scan is a safety net for muted alerts, not the primary signal.<\u002Fp>\n  <\u002Fdiv>\n  <h3>Choosing symbols<\u002Fh3>\n  <div class=\"card\">\n    <ul>\n      <li><b>Enough history.<\u002Fb> DTM needs at least the minimum observations (default 5) in both duration families, and the Scorecard needs dozens of resolved forecasts to say anything. Prefer instruments with years of daily bars over new listings.<\u002Fli>\n      <li><b>One feed per asset.<\u002Fb> Different exchanges produce slightly different crossovers. Pick one feed and keep it; the DTF Feed row shows which you are on.<\u002Fli>\n      <li><b>Supported pair.<\u002Fb> The DTF Pair row must not read Unsupported. Daily / weekly is the tested pairing.<\u002Fli>\n      <li><b>Sibling pooling<\u002Fb> is for symbols that are structurally related and individually short of cycles. Pooling unrelated symbols to inflate counts gives you ranges that describe neither.<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n  <h3>Correlated positions<\u002Fh3>\n  <div class=\"card\">\n    <p>Two windows Active in the same week on correlated symbols (two large-cap cryptos, two index futures) are one trade, not two. Apply the $1,000 risk unit across the pair, not to each. The simplest rule: take the one with the higher window score at full modifier and skip the other, or halve both.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"callout blue\">\n    <b>Reading the Pooling row across symbols:<\u002Fb> \"off\" is the default and comparable across symbols. If it reads \"2 siblings | +14 directional, +11 cycle\", that symbol's TRZ and Time Bands are wider than its own history would make them, and its windows should be compared only with other pooled symbols.\n  <\u002Fdiv>\n      <\u002Farticle>\n      <article data-page=\"caveats\">\n        <header style=\"margin-bottom:8px\">\n          <div style=\"font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--teal);font-weight:700\">Reference<\u002Fdiv>\n          <h2 style=\"margin:6px 0 6px\">Caveats and known gaps<\u002Fh2>\n          <div style=\"color:var(--muted);font-size:14px\">Read before trusting any number here<\u002Fdiv>\n        <\u002Fheader>\n<ul>\n    <li><b>Both scripts were generalised from BTC versions on 2026-09-10.<\u002Fb> DTF dropped a base-currency gate; DTM's gate was already disabled. The BTC originals now live in <code>indicators/archive/<\u002Fcode>. Neither has been compiled in TradingView since the change beyond your own paste.<\u002Fli>\n    <li><b>Weekend gaps.<\u002Fb> In Calendar-days mode DTM projects in calendar days, as Miner does, so on five-day markets a window can start or end on a weekend with no bar to score against. Switch Duration unit to Bars to avoid that, at the cost of departing from the claim's construction.<\u002Fli>\n    <li><b>Confirmation lag.<\u002Fb> A DTM pivot confirms only after depth bars plus the ATR deviation. The \"Confirmed L\" label can appear a week after the low. Forecasts issued from a late-confirmed pivot may already have windows in the past (\"Issued after end\").<\u002Fli>\n    <li><b>HTF context is one bar behind by design.<\u002Fb> DTF reads the last closed HTF bar so it never repaints, which means the first bars of a new HTF trend are systematically missed.<\u002Fli>\n    <li><b>Not the DT Oscillator.<\u002Fb> Miner's proprietary DTosc is unpublished. DTF uses a two-line stochastic at his illustrated 8/3/3 settings. Results describe that substitute.<\u002Fli>\n    <li><b>Scores and hit rates are in-sample.<\u002Fb> Both dashboards recompute from loaded history with current inputs. Change an input and the Scorecard changes with it.<\u002Fli>\n    <li><b>Illustrative management only.<\u002Fb> The 2U / U1 / U2 machinery models equal halves, one campaign at a time, with no position sizing, costs, or orders.<\u002Fli>\n  <\u002Ful>\n  <p style=\"color:var(--muted);font-size:13px\">Claim files behind these tools: <code>indicators/claims/MINER-HPT-001_dual-timeframe-momentum-setup.md<\u002Fcode>, <code>MINER-HPT-062_weekly-ob-daily-reversal-marks-weekly-high.md<\u002Fcode>, <code>MINER-CRS-030_weekly-stochastic-exits-overbought-bear-trend.md<\u002Fcode>, <code>MINER-DT-030_time-rhythm-zone-overlap-projects-next-swing-low.md<\u002Fcode>.<\u002Fp>\n      <\u002Farticle>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:40px;padding-top:22px;border-top:1px solid var(--line)\">\n        <button data-step=\"1\" sc-camel-on-click=\"{{ goPrev }}\" disabled=\"{{ noPrev }}\">\n          <span style=\"font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px\">Previous<\u002Fspan>\n          <span style=\"font-weight:600\">{{ prevLabel }}<\u002Fspan>\n        <\u002Fbutton>\n        <button data-step=\"1\" sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ noNext }}\">\n          <span style=\"font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px\">Next<\u002Fspan>\n          <span style=\"font-weight:600\">{{ nextLabel }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"margin-top:26px;font-size:12px;color:#6b7382\">DTF and DTM Reference · generated 2026-09-10 · updated 2026-09-13 for DTM V1.3<\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showProgress&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Reading&quot;},&quot;contentWidth&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1020,&quot;min&quot;:820,&quot;max&quot;:1400,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Reading&quot;}}\">\nclass Component extends DCLogic {\n  state = { idx: 0, q: \"\", ready: false };\n\n  componentDidMount() {\n    this.pages = Array.from(document.querySelectorAll(\"[data-page]\"));\n    this.navs = Array.from(document.querySelectorAll(\"[data-goto]\"));\n    this.text = this.pages.map(p => (p.textContent || \"\").toLowerCase());\n    const id = decodeURIComponent(location.hash.slice(1));\n    const i = this.pages.findIndex(p => p.dataset.page === id);\n    this.onKey = e => {\n      if (e.metaKey || e.ctrlKey || e.altKey) return;\n      const t = e.target.tagName;\n      if (t === \"INPUT\" || t === \"TEXTAREA\") return;\n      if (e.key === \"ArrowRight\") { e.preventDefault(); this.go(this.state.idx + 1); }\n      if (e.key === \"ArrowLeft\") { e.preventDefault(); this.go(this.state.idx - 1); }\n    };\n    this.onHash = () => {\n      const h = decodeURIComponent(location.hash.slice(1));\n      const j = this.pages.findIndex(p => p.dataset.page === h);\n      if (j >= 0 && j !== this.state.idx) this.setState({ idx: j });\n    };\n    document.addEventListener(\"keydown\", this.onKey);\n    window.addEventListener(\"hashchange\", this.onHash);\n    this.setState({ idx: i >= 0 ? i : 0, ready: true });\n    this.sync();\n  }\n\n  componentWillUnmount() {\n    document.removeEventListener(\"keydown\", this.onKey);\n    window.removeEventListener(\"hashchange\", this.onHash);\n  }\n\n  componentDidUpdate(prev) { this.sync(prev && prev.idx !== this.state.idx); }\n\n  go(i) {\n    if (!this.pages || i < 0 || i >= this.pages.length) return;\n    this.setState({ idx: i });\n  }\n\n  sync(changed) {\n    if (!this.pages || !this.pages.length) return;\n    const idx = Math.min(this.state.idx, this.pages.length - 1);\n    const cur = this.pages[idx];\n    this.pages.forEach((p, i) => i === idx ? p.setAttribute(\"data-active\", \"\") : p.removeAttribute(\"data-active\"));\n    this.navs.forEach(n => n.dataset.goto === cur.dataset.page ? n.setAttribute(\"data-active\", \"\") : n.removeAttribute(\"data-active\"));\n\n    const q = this.state.q.trim().toLowerCase();\n    this.navs.forEach((n, i) => {\n      const hit = !q || (n.textContent || \"\").toLowerCase().includes(q) || (this.text[i] || \"\").includes(q);\n      hit ? n.removeAttribute(\"data-off\") : n.setAttribute(\"data-off\", \"\");\n    });\n    document.querySelectorAll(\"[data-group]\").forEach(g => {\n      const any = Array.from(g.querySelectorAll(\"[data-goto]\")).some(n => !n.hasAttribute(\"data-off\"));\n      any ? g.removeAttribute(\"data-off\") : g.setAttribute(\"data-off\", \"\");\n    });\n\n    const bar = document.querySelector(\"[data-progress]\");\n    if (bar) bar.style.width = ((idx + 1) / this.pages.length * 100).toFixed(1) + \"%\";\n    const inner = document.querySelector(\"[data-inner]\");\n    if (inner) inner.style.maxWidth = (this.props.contentWidth ?? 1020) + \"px\";\n    const counter = document.querySelector(\"[data-counter]\");\n    if (counter) counter.style.display = (this.props.showProgress ?? true) ? \"\" : \"none\";\n\n    if (changed !== false) {\n      const sc = document.querySelector(\"[data-scroll]\");\n      if (sc) sc.scrollTop = 0;\n      window.scrollTo(0, 0);\n    }\n    if (decodeURIComponent(location.hash.slice(1)) !== cur.dataset.page) {\n      history.replaceState(null, \"\", \"#\" + cur.dataset.page);\n    }\n    const active = this.navs.find(n => n.hasAttribute(\"data-active\"));\n    if (active && active.offsetParent) {\n      const nav = active.closest(\"nav\");\n      if (nav) {\n        const top = active.offsetTop, h = active.offsetHeight;\n        if (top < nav.scrollTop || top + h > nav.scrollTop + nav.clientHeight) nav.scrollTop = top - nav.clientHeight / 2 + h;\n      }\n    }\n  }\n\n  label(i) {\n    const n = this.navs && this.navs[i];\n    return n ? (n.textContent || \"\").trim() : \"\";\n  }\n\n  renderVals() {\n    const n = this.pages ? this.pages.length : 0;\n    const i = this.state.idx;\n    return {\n      q: this.state.q,\n      counter: n ? \"Page \" + (i + 1) + \" of \" + n + \" · \" + this.label(i) : \"\",\n      prevLabel: i > 0 ? this.label(i - 1) : \"Start of guide\",\n      nextLabel: i < n - 1 ? this.label(i + 1) : \"End of guide\",\n      noPrev: i <= 0,\n      noNext: n === 0 || i >= n - 1,\n      goPrev: () => this.go(i - 1),\n      goNext: () => this.go(i + 1),\n      onSearch: e => this.setState({ q: e.target.value }),\n      onNavClick: e => {\n        const a = e.target.closest(\"[data-goto]\");\n        if (!a) return;\n        e.preventDefault();\n        this.go(this.pages.findIndex(p => p.dataset.page === a.dataset.goto));\n      },\n      onContentClick: e => {\n        const a = e.target.closest('a[href^=\"#\"]');\n        if (!a) return;\n        const id = a.getAttribute(\"href\").slice(1);\n        const j = this.pages.findIndex(p => p.dataset.page === id);\n        if (j >= 0) { e.preventDefault(); this.go(j); }\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
