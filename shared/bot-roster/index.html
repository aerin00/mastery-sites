     Always give every face a real fallback stack. -->

<style>
/* =====================================================================
   TOKENS — light palette lives on the bare :root.
   >>> CHOOSE PER SUBJECT: the 6 values marked [PICK] below. <<<
   Derive them from the subject's own world. Keep neutrals biased
   toward the accent hue. Everything else in this file is structural
   and should carry over unchanged.
   ===================================================================== */
:root{
  /* grounds — cool violet-biased paper, from the project's own badge hue */
  --bg:#EEEDF5; --paper:#F9F9FD; --raise:#FFFFFF;
  --ink:#15122A; --body:#2B2647; --muted:#5F5980; --faint:#8B85A8;
  --line:#D9D5E5; --line-2:#C2BCD7;
  /* structural accent — the roster, links, labs */
  --accent:#5638CF; --accent-soft:#E5DFFA; --accent-ink:#41279C;
  /* signal — active now, current phase, the one loud thing */
  --signal:#B4510C; --signal-soft:#FADFCE;
  --ok:#2C7644; --ok-soft:#DCEEE1;
  --warn:#6D6606; --warn-soft:#EEEDC6;
  --stop:#A72820; --stop-soft:#F6DEDB;
  --deep:#0E6C85; --deep-soft:#D5EAF1;
  --code-bg:#120F24; --code-ink:#DFDBEF; --code-line:#272143;
  --shadow:0 1px 2px rgba(21,18,42,.05), 0 8px 24px -12px rgba(21,18,42,.16);
  --rail:264px;
  /* type: display / body / mono */
  --f-disp:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Newsreader','Iowan Old Style',Georgia,serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A0816; --paper:#131024; --raise:#1A1631;
    --ink:#EBE8F7; --body:#C9C4E1; --muted:#958EB9; --faint:#746D97;
    --line:#282244; --line-2:#382F58;
    --accent:#A98CFB; --accent-soft:#241C48; --accent-ink:#C7B4FE;
    --signal:#F28C42; --signal-soft:#3B2413;
    --ok:#6FC98A; --ok-soft:#14291C;
    --warn:#CFCB4E; --warn-soft:#2A2A0D;
    --stop:#EC7F74; --stop-soft:#371818;
    --deep:#57BEDA; --deep-soft:#0E2932;
    --code-bg:#050311; --code-ink:#D4CFE9; --code-line:#1F1937;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.75);

  }
}
:root[data-theme="dark"]{
    --bg:#0A0816; --paper:#131024; --raise:#1A1631;
  --ink:#EBE8F7; --body:#C9C4E1; --muted:#958EB9; --faint:#746D97;
  --line:#282244; --line-2:#382F58;
  --accent:#A98CFB; --accent-soft:#241C48; --accent-ink:#C7B4FE;
  --signal:#F28C42; --signal-soft:#3B2413;
  --ok:#6FC98A; --ok-soft:#14291C;
  --warn:#CFCB4E; --warn-soft:#2A2A0D;
  --stop:#EC7F74; --stop-soft:#371818;
  --deep:#57BEDA; --deep-soft:#0E2932;
  --code-bg:#050311; --code-ink:#D4CFE9; --code-line:#1F1937;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.75);

}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); color:var(--ink); text-wrap:balance; margin:0; letter-spacing:-.015em}
a{color:var(--accent-ink); text-underline-offset:3px}
code,kbd{font-family:var(--f-mono); font-size:.855em}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:9px 18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--f-disp); font-weight:700;
  font-size:15px; color:var(--ink); letter-spacing:-.02em; white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--signal);display:inline-block;transform:translateY(-1px)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.modes{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:2px}
.modes button{
  font-family:var(--f-disp); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  border:0; background:transparent; color:var(--muted); padding:5px 11px; border-radius:5px; cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{flex:1}
#q{
  font-family:var(--f-mono); font-size:12.5px; padding:6px 10px; width:min(300px,42vw);
  border:1px solid var(--line-2); border-radius:7px; background:var(--raise); color:var(--ink);
}
#q::placeholder{color:var(--faint)}
.iconbtn{border:1px solid var(--line-2); background:var(--raise); color:var(--muted); border-radius:7px;
  padding:5px 9px; cursor:pointer; font-family:var(--f-mono); font-size:12px}
.iconbtn:hover{color:var(--ink); border-color:var(--accent)}

.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:1fr} }

/* ---------- rail ---------- */
.rail{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--paper); padding:16px 12px 40px;
}
@media (max-width:900px){
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; scrollbar-width:thin}
  .railhead,.legend{display:none}
}
.railhead{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 8px}
.pnav{display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .pnav{flex-direction:row; gap:6px} }
.pnav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  text-decoration:none; color:var(--body); font-family:var(--f-disp); font-size:13.5px;
  font-weight:500; line-height:1.25; border:1px solid transparent; white-space:nowrap;
}
.pnav a:hover{background:var(--bg)}
.pnav a.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.pnav .n{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); width:16px; flex:none}
.pnav a.on .n{color:var(--accent)}
.pnav .tick{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-left:auto;
  display:grid;place-items:center;font-size:8px;color:transparent}
.pnav .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pnav .tick.part{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}

.legend{margin-top:22px; padding:11px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg)}
.legend h4{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin-bottom:8px}
.legend .row{display:flex; align-items:center; gap:8px; font-size:12px; font-family:var(--f-disp); padding:2.5px 0; color:var(--muted)}
.swatch{width:16px;height:4px;border-radius:2px;flex:none}

/* ---------- main ---------- */
main{padding:28px 30px 96px; max-width:1080px; min-width:0}
@media (max-width:640px){ main{padding:22px 16px 72px} }
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--signal)}
.ptitle{font-size:clamp(28px,4.4vw,40px); font-weight:700; line-height:1.06; margin:7px 0 0}
.meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px}
.chip{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; padding:3px 8px; border-radius:20px;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper); text-transform:uppercase}
.chip.l1{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.l2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.l3{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.chip.l4{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chip.l5{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}
.chip.l6{background:var(--deep-soft);border-color:var(--deep);color:var(--deep)}

.objective{
  margin:24px 0 0; padding:16px 18px; border-left:3px solid var(--signal);
  background:var(--paper); border-radius:0 9px 9px 0; font-size:17.5px; line-height:1.5; color:var(--ink);
}
.objective b{font-weight:600}

h2.sec{
  font-size:12px; font-family:var(--f-mono); font-weight:500; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); margin:42px 0 0; padding-bottom:7px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px;
}
h2.sec .cnt{color:var(--line-2); font-size:11px}

.concept{padding:19px 0; border-bottom:1px solid var(--line)}
.concept:last-child{border-bottom:0}
.concept h3{font-size:18.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.01em}
.concept p{margin:0 0 9px; max-width:66ch}
.concept p:last-child{margin-bottom:0}
.concept ul{margin:9px 0; padding-left:19px; max-width:66ch}
.concept li{margin:4px 0}
.concept .k{font-family:var(--f-mono); font-size:.85em; background:var(--accent-soft); color:var(--accent-ink);
  padding:1px 5px; border-radius:4px; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}

pre{
  margin:12px 0; background:var(--code-bg); color:var(--code-ink); border:1px solid var(--code-line);
  border-radius:9px; padding:13px 15px; overflow-x:auto; font-family:var(--f-mono);
  font-size:12.6px; line-height:1.65; position:relative;
}
pre code{font-size:inherit; color:inherit; background:none}
.codewrap{position:relative}
.copy{position:absolute; top:8px; right:8px; z-index:2; font-family:var(--f-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:5px; cursor:pointer;
  background:rgba(255,255,255,.07); color:#9FB5B0; border:1px solid rgba(255,255,255,.13)}
.copy:hover{background:rgba(255,255,255,.15); color:#fff}
.copy.done{background:var(--ok); color:#fff; border-color:var(--ok)}
.cap{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin:-4px 0 0}

.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
table{border-collapse:collapse; width:100%; font-family:var(--f-disp); font-size:13.4px; min-width:480px}
th{text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; padding:9px 13px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
td code{background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--line)}
td.num{font-variant-numeric:tabular-nums}

.gotcha{display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; padding:13px 0; border-bottom:1px solid var(--line)}
.gotcha:last-child{border-bottom:0}
.sev{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; height:fit-content; white-space:nowrap; margin-top:2px}
.sev.trap{background:var(--stop-soft); color:var(--stop)}
.sev.cost{background:var(--warn-soft); color:var(--warn)}
.sev.stale{background:var(--signal-soft); color:var(--signal)}
.sev.ok{background:var(--ok-soft); color:var(--ok)}
.gotcha b{font-family:var(--f-disp); font-weight:600; color:var(--ink); display:block; font-size:14.5px; margin-bottom:2px}
.gotcha span{font-size:15px}

.lab{margin:14px 0 0; padding:18px 20px; border:1px solid var(--accent); border-radius:11px;
  background:var(--accent-soft)}
.lab h3{font-size:17px; margin-bottom:4px; color:var(--accent-ink)}
.lab ol{margin:11px 0 0; padding-left:20px}
.lab li{margin:6px 0}
.lab .pre-in-lab pre{background:var(--code-bg)}
.done-line{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:14px; border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.done-line label{font-family:var(--f-disp); font-size:14px; font-weight:600; color:var(--accent-ink); cursor:pointer;
  display:flex; align-items:center; gap:8px}
.done-line input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

details.qa{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:var(--paper); overflow:hidden}
details.qa summary{padding:11px 15px; cursor:pointer; font-family:var(--f-disp); font-weight:600; font-size:14.5px;
  color:var(--ink); list-style:none; display:flex; gap:9px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:'?'; font-family:var(--f-mono); color:var(--signal); font-size:12px; flex:none}
details.qa[open] summary::before{content:'!'}
details.qa .ans{padding:0 15px 13px 33px; font-size:15px; color:var(--body); border-top:1px solid var(--line); padding-top:11px}

.tree{margin:14px 0; display:flex; flex-direction:column; gap:0}
.branch{display:grid; grid-template-columns:minmax(140px,.9fr) auto minmax(0,1.4fr); gap:12px; align-items:center;
  padding:11px 14px; border:1px solid var(--line); border-top:0; background:var(--paper)}
.branch:first-child{border-top:1px solid var(--line); border-radius:9px 9px 0 0}
.branch:last-child{border-radius:0 0 9px 9px}
.branch .cond{font-family:var(--f-body); font-size:14.5px; color:var(--body)}
.branch .arr{font-family:var(--f-mono); color:var(--line-2); font-size:13px}
.branch .res{font-family:var(--f-disp); font-weight:600; font-size:14px; color:var(--ink)}
.branch .res em{display:block; font-family:var(--f-body); font-weight:400; font-style:normal; font-size:13.5px; color:var(--muted)}
@media (max-width:640px){ .branch{grid-template-columns:1fr; gap:5px} .branch .arr{display:none} }

.docs{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.docs a{font-family:var(--f-mono); font-size:11.5px; padding:4px 10px; border-radius:20px; text-decoration:none;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper)}
.docs a:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}

/* progress header */
.prog{margin:0 0 26px; padding:15px 18px; border:1px solid var(--line); border-radius:11px; background:var(--paper)}
.prog .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.prog .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.prog .pct{font-family:var(--f-disp); font-size:26px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.bar{display:flex; gap:3px; margin-top:11px}
.bar i{height:7px; flex:1; border-radius:2px; background:var(--line); transition:background .25s}
.bar i.done{background:var(--ok)}
.bar i.part{background:var(--signal)}

/* reference / drill / audit */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:14px 0}
.card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--paper)}
.card h4{font-size:15px; font-weight:600; margin-bottom:5px}
.card p{margin:0; font-size:14.5px; color:var(--muted)}

#drill .flash{
  border:1px solid var(--line-2); border-radius:14px; background:var(--paper); padding:34px 30px;
  min-height:220px; display:flex; flex-direction:column; justify-content:center; gap:16px; box-shadow:var(--shadow);
}
#drill .fq{font-family:var(--f-disp); font-size:clamp(19px,2.6vw,25px); font-weight:600; color:var(--ink); line-height:1.3}
#drill .fa{font-size:16.5px; color:var(--body); border-top:1px solid var(--line); padding-top:15px}
#drill .fa.hide{display:none}
#drill .fsrc{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
#drill .fbtns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font-family:var(--f-disp); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink)}
.btn.prime{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.prime:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--accent)}
.counter{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); align-self:center; margin-left:auto}

.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; padding:15px 0; border-bottom:1px solid var(--line)}
.verdict:last-child{border-bottom:0}
.vtag{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:4px 8px;
  border-radius:5px; height:fit-content; white-space:nowrap; margin-top:2px; font-weight:700}
.vtag.holds{background:var(--ok-soft); color:var(--ok)}
.vtag.stale{background:var(--warn-soft); color:var(--warn)}
.vtag.wrong{background:var(--stop-soft); color:var(--stop)}
.vtag.gap{background:var(--signal-soft); color:var(--signal)}
.vtag.unver{background:var(--bg); color:var(--muted); border:1px solid var(--line-2)}
.verdict .claim{font-family:var(--f-disp); font-weight:600; font-size:15px; color:var(--ink); margin-bottom:4px}
.verdict .fix{font-size:15px}

.hits{margin-top:6px}
.hit{display:block; padding:11px 14px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px;
  background:var(--paper); text-decoration:none; color:var(--body)}
.hit:hover{border-color:var(--accent); background:var(--accent-soft)}
.hit b{display:block; font-family:var(--f-disp); color:var(--ink); font-size:14.5px}
.hit small{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.empty{color:var(--muted); font-style:italic; padding:20px 0}
.lede{font-size:17.5px; max-width:66ch; color:var(--body); margin:14px 0 0}
.hr{height:1px;background:var(--line);margin:38px 0 0;border:0}
.unv{font-family:var(--f-mono);font-size:.86em;color:var(--muted);background:var(--bg);
  border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px;white-space:normal}
kbd{background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-size:.82em;color:var(--muted)}
.lede a{color:var(--accent-ink)}
.verdict .claim{display:block}
#view > h3{margin-top:28px; font-size:19px}


</style>
</head>

<!-- ============================ SHELL ============================
     Structural. Carries over unchanged between sites; SITE fills it in.
     ============================================================== -->

/* ============================== 00 ============================== */
{
  id:'p0', n:'00', title:'Read the roster', layer:'l1', layerLabel:'Instrument',
  time:'~40 min', pre:'A working Hermes install',
  objective:'You can state, without opening the desktop app, <b>which bots exist, which machine owns each one, what each has scheduled, and whether the fleet is idle</b>. Every later phase measures against this baseline.',
  concepts:[
    {h:'A Bot is a profile. There is no second system.',
     p:'<p>This is the single most useful sentence in Bot Mode. A Bot <b>is</b> a Hermes profile: an isolated home directory holding its own '+K('config.yaml')+', '+K('.env')+', '+K('SOUL.md')+', memories, sessions, skills, cron jobs, and state database, under '+K('~/.hermes/profiles/&lt;name&gt;/')+'.</p><p>Bot Mode is a <b>UI over that primitive</b>. It adds no daemon, no core patch, no extra storage. Everything the roster shows you is visible from a shell, and anything you break in a shell shows up in the roster. If you internalise this now, every later behaviour is predictable instead of magic.</p>'},
    {h:'The four commands that are your instrument',
     p:'<p>Learn to answer the fleet-state question from the terminal first. The desktop pane is a convenience; the terminal is ground truth.</p>',

            '',
            '# What is one bot actually configured with?',

            '',
            '# What does the fleet have scheduled?',
            '# Routines appear as [bot:<name>] <routine>',
            'hermes cron list',
            '',
            '# Is the scheduler even running?',
            'hermes cron status'),
     p2:'<p>Note the shape of a routine name: '+K('[bot:researcher] morning digest')+'. That prefix is the only thing that makes a Bot Mode routine distinguishable from a cron job you wrote by hand. It is a naming convention, not a separate table.</p>'},
    {h:'Where Bot Mode lives, and where it does not',
     p:'<p>Bot Mode ships <b>built into the desktop app</b> and is <b>on by default</b>. It appears as a <b>Bots</b> tab beside Sessions in the left sidebar, with a <b>Routines</b> tile docked next to the conversation while the Bots tab is active. You turn it off in <b>Settings &rarr; Plugins &rarr; Bots</b>; the roster, the Routines pane, and the composer middleware unregister live, with no restart. Your profiles, sessions, and cron jobs are untouched either way.</p>',
     table:{head:['Question','Answer'],rows:[
       ['Do I install anything?','No. Bundled and default-on in current Desktop builds.'],
       ['Where does the plugin run?','On the machine running the <b>desktop app</b>, not the gateway.'],
       ['What happens if I disable it?','Roster and Routines pane disappear. Profiles, sessions, cron jobs keep working.'],
       ['Does it own any of my data?','No. It renders profile state that already exists.']]}},
    {h:'Active now: the fleet presence strip',
     p:'<p>Above the roster, a strip shows every Bot currently working — the gateway-busy profile, plus any Bot that wrote within the <b>last 90 seconds</b>. Each chip opens that Bot chat. The strip never reorders the roster and disappears entirely when the fleet is idle.</p><p>That 90-second window is your only cheap liveness signal in the UI. A Bot doing a long tool call with no output will drop off the strip while still running. Treat an empty strip as <i>nothing has spoken recently</i>, not as <i>nothing is running</i>.</p>'},
    {h:'Hidden is not off',
     p:'<p>Right-click a roster row &rarr; <b>Hide Bot</b> takes a Bot out of the roster and the Active-now strip. Hiding is <b>display only</b>. The Bot still resolves '+K('@mentions')+', keeps its group memberships, and <b>keeps running its routines</b>.</p><p>Once at least one Bot is hidden an <b>eye toggle</b> appears in the pane header; it reveals hidden Bots dimmed in place, and right-click &rarr; <b>Unhide Bot</b> restores one. Hidden Bots never toast, but they accumulate unread activity silently and the eye badges a dot. Hidden state is saved in profile metadata, so it follows the Bot to every desktop connected to that backend.</p>'},
    {h:'CLI parity, permanently',
     p:'<p>Because Bots are profiles, every desktop action has a terminal twin. Keep this table where you can see it; it is the escape hatch for every UI problem you will hit.</p>',
     table:{head:['In Bot Mode','From a shell'],rows:[
       ['Chat with a Bot','<code>hermes -p &lt;bot&gt; chat</code>'],
       ['A Bot files, skills, memory','<code>~/.hermes/profiles/&lt;bot&gt;/</code>'],
       ['Routines','<code>hermes cron list</code> (jobs named <code>[bot:&lt;name&gt;] …</code>)'],
       ['Create / inspect profiles','<code>hermes profile create</code>, <code>hermes profile list</code>']]}}
  ],
  lab:{title:'Baseline your actual fleet',
    steps:[

    verify:'You have a written fleet-size number, a routine count, and first-hand proof that hiding a Bot does not stop it.'},
  gotchas:[
    {s:'trap',t:'Installing the plugin on the gateway box does nothing at all',d:'Bot Mode is a <b>desktop</b> plugin. Desktop plugins load from the app-side <code>~/.hermes/desktop-plugins/</code>. If your gateway runs on a homelab box and the desktop app runs on your laptop, installing on the homelab produces no error and no roster — it simply never appears. On current builds you should not be installing anything at all.'},
    {s:'stale',t:'The standalone Hermes-Bot-Mode repository is archived',d:'It carries an explicit ARCHIVED banner: Bot Mode ships built into Hermes Desktop as of hermes-agent PR #87886, development continues in-tree at <code>apps/desktop/src/plugins/hermes-bots/</code>, and issues belong on <code>NousResearch/hermes-agent</code>. Its README faithfully describes an <i>earlier</i> Bot Mode and is the origin of several stale beliefs corrected later in this path. Do not follow its git-clone install on a current build.'},
    {s:'trap',t:'An empty Active-now strip does not mean an idle fleet',d:'The strip shows the gateway-busy profile plus anyone who <i>wrote</i> in the last 90 seconds. A Bot grinding through a long tool call silently ages off the strip while still consuming tokens. Use it as a recency signal, never as a process monitor.'},
    {s:'trap',t:'Hidden Bots keep running and keep costing money',d:'Hiding is display-only by design: mentions resolve, group memberships stand, routines fire. If you hid a Bot to stop it doing something, you have not stopped it — you have stopped seeing it do it. Pause the routine with <code>hermes cron pause</code> instead.'},
    {s:'ok',t:'Ground truth is the filesystem, not the pane',d:'Every question about what a Bot is has an answer under <code>~/.hermes/profiles/&lt;name&gt;/</code>. When the UI and the shell disagree, the shell is right and you are probably connected to a different backend than you think.'}
  ],
  quiz:[
    {q:'Name the seven kinds of state a Hermes profile isolates.',a:'Its own <code>config.yaml</code>, its own <code>.env</code>, its own <code>SOUL.md</code>, its own memories, its own sessions, its own skills, and its own cron jobs — plus its own state database. Each profile is a separate Hermes home directory under <code>~/.hermes/profiles/&lt;name&gt;/</code>. This isolation is the whole reason Bot Mode needs no new storage layer.'},
    {q:'How do you tell a Bot Mode routine apart from a hand-written cron job in "hermes cron list" output?',a:'By its name. Routines are plain Hermes cron jobs namespaced <code>[bot:&lt;name&gt;] &lt;routine&gt;</code>. There is no separate table and no separate scheduler — the prefix is the only marker.'},
    {q:'Exactly what does hiding a Bot stop, and what does it not stop?',a:'It stops the Bot appearing in the roster and the Active-now strip, and stops it toasting. It does <b>not</b> stop @mention resolution, group-chat membership, or routines. Hidden state lives in profile metadata and syncs to every desktop on that backend. Unread activity still accumulates and the eye toggle badges a dot.'},
    {q:'What two conditions put a Bot on the Active-now strip?',a:'It is the gateway-busy profile, or it wrote something within the last 90 seconds. The strip never reorders the roster and disappears when nothing matches.'},
    {q:'Your roster is empty but "hermes profile list" shows six profiles. Name the two most likely causes.',a:'One: Bot Mode is disabled in Settings &rarr; Plugins &rarr; Bots. Two: the desktop app is connected to a different backend than the shell you ran the command in — the roster reflects the connected gateway, not your local filesystem.'}
  ],
  docs:[['Bot Mode (primary)','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['Profiles (primary)','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/profiles.md'],
        ['Archived plugin repo','https://github.com/NousResearch/Hermes-Bot-Mode']]

/* ============================== 01 ============================== */
{
  id:'p1', n:'01', title:'One bot, well', layer:'l2', layerLabel:'Self',
  time:'1–2 h', pre:'Phase 00',
  objective:'You can create a Bot whose <b>title and description are load-bearing</b>, and you understand why its canonical chat refuses to be reset.',
  concepts:[
    {h:'Three fields, and two of them are not decoration',
     p:'<p><b>New Agent</b> asks for <b>Name</b>, <b>Title</b>, and <b>Description</b>. The Bot exists in seconds and introduces itself as the first message of its new Bot Chat.</p><p>It is tempting to treat Title and Description as roster garnish. They are not. The teammate roster injected into <b>every</b> Bot Chat system prompt carries <b>names and roles drawn from each profile title and description</b>. That is how one Bot knows another exists and what it is for, before it chooses a recipient. A Bot with an empty description is a name with no job attached, and its teammates have nothing to route on.</p>'},
    {h:'The canonical Bot Chat is a forever-chat',
     p:'<p>Every Bot gets one canonical, persistent <b>Bot Chat</b>, created and pinned the moment the Bot is born. Clicking a roster row lands you in it. It is the delivery address for bot-to-bot messages and the session the messaging protocol is injected into.</p><p>Typing '+K('/new')+' or '+K('/reset')+' inside it would fork the relationship into a scratch session — the one thing Bot Mode promises never happens. The composer <b>reroutes it to</b> '+K('/compact')+' instead: fresh working context, same conversation. Regular sessions on the same profile keep full '+K('/new')+' freedom.</p>'},
    {h:'The same Bot from a shell',
     code:C('# Create the profile directly. --description matters: it feeds both the',
            '# teammate roster and the kanban orchestrator routing model.',
            'hermes profile create researcher \\',
            '  --description "Reads source code and external docs, writes findings."',
            '',
            '# Talk to it. This opens the same agent the roster row opens.',
            'hermes -p researcher chat',
            '',
            '# Or one-shot it without entering the REPL.',
            'hermes -p researcher chat -q "Summarise what you are for, in one line."'),
     p2:'<p>Creating a profile also creates a command alias, so '+K('researcher chat')+' works immediately alongside '+K('hermes -p researcher chat')+'. Manage those wrappers with '+K('hermes profile alias')+'.</p>'},
    {h:'Editing, duplicating, deleting',
     table:{head:['Action','Where','What it touches'],rows:[
       ['<b>Edit Profile</b>','Right-click a Bot','Avatar, title, description, model pin, skills, toolsets, MCP servers, full <code>SOUL.md</code> — on the live profile'],
       ['<b>Duplicate</b>','Right-click a Bot','Full clone: config, skills, <code>SOUL.md</code>, <b>memory</b>, and its look'],
       ['<b>Delete Profile</b>','Right-click a Bot','Permanent, behind the desktop destructive confirmation. The <b>default profile cannot be deleted</b>'],
       ['<b>Rename</b>','Pencil in the chat header, or <code>hermes profile rename</code>','Display name and the @tag it answers to; the old profile name keeps resolving']]}},
    {h:'Renaming keeps tags in sync',
     p:'<p>Give a Bot a friendly name and it becomes taggable by it. A Bot titled <i>Research Buddy</i> answers to '+K('@research-buddy')+' <b>and</b> '+K('@researchbuddy')+', in regular chats and group rooms alike. The composer autocomplete offers the renamed tag and also matches when you type the old profile name, which keeps resolving.</p><p>This means tags accumulate rather than migrate. Two Bots whose friendly names normalise to the same tag is a collision you create silently by renaming.</p>'},
    {h:'Visual identity is profile metadata, not capability',
     p:'<p>A Bot can use a deterministic blob face, a geometric face, an uploaded image, an AI-generated portrait, or a petdex pet. The look, title, and description live in profile metadata, so every desktop connected to that backend renders the same identity. An unlocked name-derived face may change when the Bot is renamed; lock a face before renaming if visual continuity matters.</p><p>Avatars are useful recognition cues, but they enforce nothing. The real capability boundary remains the model pin, enabled skills, toolsets, MCP servers, and operating-system sandbox.</p>'}
  ],
  lab:{title:'Build one Bot you will actually keep',
    steps:[
      'Create a Bot for a job you genuinely do weekly. Not "assistant" — something like "release-notes" or "inbox-triage". Give it a Title and a Description that a <i>different</i> Bot could route on: say what it reads, what it produces, and what it will not do.',
      'Open its Bot Chat and read the self-introduction it generated. Ask it: "What is your role, and what would you refuse?" Compare the answer to the description you wrote.',
      'Now try '+K('/new')+' inside that canonical chat. Observe that you get '+K('/compact')+' behaviour instead: the working context resets, the conversation does not fork.',
      'Open a <b>regular</b> session on the same profile (Sessions tab, or '+K('hermes -p &lt;bot&gt; chat')+') and run '+K('/new')+' there. Confirm it forks normally. Two sessions, same profile, different rules.',
      'Rename the Bot to a two-word friendly name. Confirm from the composer autocomplete that both the hyphenated and unhyphenated tags resolve, <i>and</i> that the original profile name still does.',
      '<b>Break it deliberately:</b> blank out the Bot description entirely via Edit Profile. Then, from a different Bot chat, ask that Bot to pick the right teammate for a research task. With no role text in the roster, watch it pick on name alone or ask you. Restore the description and repeat the same question.',
      'Run '+K('hermes profile show &lt;name&gt;')+' and confirm every change you made in the UI is visible from the shell.'],
    verify:'You have one Bot whose description is specific enough that a teammate chose it correctly, and you have watched that choice degrade when you removed the description.'},
  gotchas:[
    {s:'trap',t:'A blank description silently degrades every teammate routing decision',d:'The teammate roster in each Bot Chat system prompt is built from profile <b>titles and descriptions</b>. Leave the description empty and the Bot is still fully functional, still mentionable, still in the roster — and effectively invisible as a <i>role</i>. Its teammates route on the name string alone. Nothing errors; the fleet just gets worse at choosing.'},
    {s:'trap',t:'Duplicate copies memory, not just configuration',d:'Right-click &rarr; Duplicate is a <b>full</b> clone: config, skills, <code>SOUL.md</code>, memory, and look. The new Bot starts life carrying the original model of you and of its past work. If you duplicated a Bot to make a clean specialist, you did not get one — and the divergence is invisible until it cites something that never happened to it.'},
    {s:'trap',t:'Renaming creates tag collisions with no warning',d:'Old profile names keep resolving after a rename, and friendly names normalise into tags two ways. Rename two Bots into names that normalise alike and you have an ambiguous <code>@tag</code> with no error at rename time — only a surprising recipient later.'},
    {s:'cost',t:'The introduction message is a real inference',d:'Each new Bot introduces itself as the first message of its Bot Chat. On a pinned frontier model, spinning up eight specialists to "see how it feels" is eight full turns before you have used any of them.'},
    {s:'ok',t:'Write the description for a reader who is not you',d:'The audience for a Bot description is another Bot deciding whether to hand it work. Name the input, the output, and the boundary. "Reads source code and external docs, writes findings" routes correctly. "Research helper" does not.'}
  ],
  quiz:[
    {q:'What happens when you type /new inside a canonical Bot Chat, and why?',a:'The composer reroutes it to <code>/compact</code>. A <code>/new</code> would fork the persistent relationship into a scratch session, which is the one thing Bot Mode promises never happens. You get fresh working context in the same conversation. Regular sessions on the same profile keep full <code>/new</code> freedom.'},
    {q:'Where does a Bot title and description actually get used, beyond the roster row?',a:'They are injected into every Bot Chat system prompt as the teammate roster — names <b>and roles</b> — so Bots know who does what before choosing a message recipient. A profile description also drives kanban orchestrator routing, which is why <code>hermes profile create</code> accepts <code>--description</code>.'},
    {q:'Name everything Duplicate copies from a Bot.',a:'Config, skills, <code>SOUL.md</code>, memory, and its look (avatar, title, description). It is a full clone, not a template — including the memory the original built up.'},
    {q:'A Bot is renamed from "researcher" to "Research Buddy". Which tags now resolve to it?',a:'All three: <code>@research-buddy</code>, <code>@researchbuddy</code>, and the original <code>@researcher</code>. Old profile names keep resolving, and the composer autocomplete matches both the new friendly tag and the old name.'},
    {q:'Which profile can never be deleted?',a:'The default profile. Delete Profile is permanent and sits behind the same destructive confirmation as the desktop profile menu, but the default is excluded.'}
  ],
  docs:[['Bot Mode: creating a Bot','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['Profile commands','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md']]

/* ============================== 02 ============================== */
{
  id:'p2', n:'02', title:'The profile boundary', layer:'l2', layerLabel:'Self',
  time:'2 h', pre:'Phase 01',
  objective:'You can predict <b>exactly what a Bot can and cannot see</b>, and you will never again point two processes at one profile.',
  concepts:[
    {h:'The one rule that corrupts state if you break it',
     p:'<p>From the Hermes profiles documentation, stated as a caution: <b>never point two agent processes at the same profile</b> — the same Hermes home. Both write memory automatically, and each loads the other writes into its system prompt at session start, <i>so two writers on one home compound each other state until it stops being anything you configured</i>.</p><p>Profiles exist precisely to prevent this. Agents that genuinely need shared memory should use an external memory provider, not a shared home. This is the highest-severity failure in the whole subject and it produces no error at any point.</p>'},
    {h:'What the boundary contains',
     table:{head:['Inside the profile','Shared / outside'],rows:[
       ['<code>config.yaml</code>, <code>.env</code>, <code>SOUL.md</code>','The Hermes binary and its version'],
       ['Memories and the state database','The desktop app and its plugins'],
       ['Sessions and chat history','The gateway process, if one is shared'],
       ['Skills and enabled toolsets','The kanban board DB (<code>~/.hermes/kanban.db</code>)'],
       ['Cron jobs, including Bot routines','Peer registry keys in <code>~/.hermes/.env</code>'],
       ['Avatar, title, description (profile metadata)','Group room mirrors, per connected gateway']]}},
    {h:'The three ways to clone, and what each carries',
     code:C('# Fresh: bundled skills seeded, nothing else.',
            'hermes profile create mybot',
            '',
            '# Config only: copies config.yaml, .env, SOUL.md and skills',
            '# from the ACTIVE profile. Fresh sessions and fresh memory.',
            'hermes profile create work --clone',
            '',
            '# Everything: all state, including memory and sessions.',
            'hermes profile create work --clone-all',
            '',
            '# From a named source rather than the active profile.',
            '# Implies config clone unless paired with --clone-all.',
            'hermes profile create work --clone-from researcher'),
     p2:'<p>The desktop New Agent dialog exposes the same choice as <b>Clone from an existing profile</b> versus <b>Fresh profile</b>, plus <b>Create empty</b> which skips the bundled skills entirely for a minimal profile.</p>'},
    {h:'Credentials: shared pool, not copies',
     p:'<p>By default a new Bot <b>shares one OAuth/token pool with the main profile</b>, so credential refreshes cannot invalidate each other. This is the behaviour you want: five Bots on one account refreshing the same token, not five forked copies racing to invalidate it.</p><p>Older gateways <b>copy</b> credentials instead. Still functional, just forked — and forked copies are exactly the situation where one refresh silently invalidates the other four.</p>'},
    {h:'Profiles are not workspaces and not sandboxes',
     p:'<p>A profile isolates <i>Hermes state</i>. It does not isolate the filesystem, the network, or the shell. A Bot with a terminal tool can read anything your user can read, including another Bot profile directory. If you want isolation of the work itself rather than the agent state, that is a workspace or sandbox concern, and it is out of scope for this path.</p>'},
    {h:'Moving a Bot between machines',
     code:C('# Export a profile to a portable archive.',
            'hermes profile export researcher -o researcher-backup.tar.gz',
            '',
            '# Restore it, optionally under a new name.',
            'hermes profile import researcher-backup.tar.gz --name researcher-2',
            '',
            '# Install a profile distribution from git, and keep it updated.',
            'hermes profile install github.com/user/my-distro --alias',
            'hermes profile update my-distro',
            '',
            '# What distribution is this profile from?',
            'hermes profile info my-distro')}
  ],
  lab:{title:'Prove the boundary, then violate it on purpose',
    steps:[
      'Create two Bots from the same source: one with '+K('--clone')+' and one with '+K('--clone-all')+'. Ask each "what do you already know about me?" and diff the answers. That difference is the memory the second one inherited.',
      'Run '+K('ls -la ~/.hermes/profiles/')+' and confirm each Bot has its own home. Open two of the '+K('SOUL.md')+' files and confirm they are genuinely separate.',
      'Give one Bot a fact in conversation ("my deploy window is Thursday mornings"). Ask the other Bot the same question. Confirm it does not know.',
      'Check credential sharing: look at whether the new Bot has its own tokens or shares the pool. Note which behaviour your gateway version gives you.',
      '<b>Break it deliberately, in a throwaway profile:</b> create '+K('scratch-a')+', then open <b>two</b> concurrent sessions against that same profile — a desktop chat and '+K('hermes -p scratch-a chat')+' in a terminal. Have each assert a different, contradictory fact about you, several turns each. Then start a third session and ask it what it believes. Watch the compounded state. Delete the profile afterwards.',
      'Export one real Bot to a tarball and import it under a new name. Confirm the clone is independent by changing the original SOUL.md and verifying the copy is unaffected.'],
    verify:'You have a corrupted throwaway profile you produced on purpose, and you can describe in one sentence why no error ever appeared.'},
  gotchas:[
    {s:'trap',t:'Two processes on one profile compound memory until it is unrecognisable',d:'Both write memory automatically; each loads the other writes into its system prompt at session start. There is no lock, no warning, and no error — just an agent that gradually believes things nobody told it. The documented fix is one profile per agent process, and an <b>external memory provider</b> when agents genuinely need shared memory.'},
    {s:'trap',t:'--clone-all quietly gives your new specialist someone else memory',d:'<code>--clone</code> takes config, <code>.env</code>, <code>SOUL.md</code> and skills, leaving sessions and memory fresh. <code>--clone-all</code> takes <b>all state</b>. The new Bot behaves plausibly and cites experience it never had. Pick <code>--clone</code> unless you specifically want continuity.'},
    {s:'stale',t:'Copied credentials, on older gateways',d:'Current behaviour is a shared OAuth/token pool so refreshes cannot invalidate each other. Older gateways <b>copy</b> credentials into the new profile. Both work on day one; the copied version fails weeks later when one profile refresh silently invalidates the token the others are still holding.'},
    {s:'trap',t:'A profile is not a sandbox',d:'Profiles isolate Hermes state, not the operating system. A Bot with terminal access can read and write another Bot profile directory, your dotfiles, and your repositories. Do not use a profile boundary as a security boundary.'},
    {s:'cost',t:'Every profile seeds bundled skills unless you say otherwise',d:'A fresh profile ships with the bundled skill set, which is context in every system prompt. For a narrow specialist, <b>Create empty</b> in the Advanced disclosure gives you a minimal profile and a materially smaller prompt.'}
  ],
  quiz:[
    {q:'What exactly goes wrong when two agent processes share one profile, and what is the documented alternative?',a:'Both write memory automatically and each loads the other writes into its system prompt at session start, so the two writers compound each other state until it is nothing you configured. No error is raised. The documented alternative for agents that need shared memory is an external memory provider, not a shared Hermes home.'},
    {q:'Distinguish --clone, --clone-all, and --clone-from.',a:'<code>--clone</code> copies <code>config.yaml</code>, <code>.env</code>, <code>SOUL.md</code> and skills from the <i>active</i> profile, leaving sessions and memory fresh. <code>--clone-all</code> copies all state including memory and sessions. <code>--clone-from &lt;source&gt;</code> names a source profile instead of using the active one, and implies a config clone unless paired with <code>--clone-all</code>.'},
    {q:'What is the current default for credentials on a newly created Bot, and how did it used to work?',a:'By default the new Bot shares one OAuth/token pool with the main profile, so credential refreshes cannot invalidate each other. Older gateways copy credentials into the new profile instead — still functional, but forked, so one refresh can invalidate the others.'},
    {q:'Name three things a profile does NOT isolate.',a:'The filesystem, the network, and the shell. Also the Hermes binary itself, the kanban board database, and peer keys in <code>~/.hermes/.env</code>. A profile is a state boundary, not a security boundary.'},
    {q:'Which two commands move a Bot to another machine without a gateway?',a:'<code>hermes profile export &lt;name&gt; -o file.tar.gz</code> and <code>hermes profile import file.tar.gz --name &lt;newname&gt;</code>. For distributions there is also <code>hermes profile install &lt;git-url&gt;</code> and <code>hermes profile update</code>, which re-pulls while preserving memories, sessions, and auth.'}
  ],
  docs:[['Profiles (primary)','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/profiles.md'],
        ['hermes profile reference','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md']]
},

/* ============================== 03 ============================== */
{
  id:'p3', n:'03', title:'Soul, model, capability', layer:'l2', layerLabel:'Self',
  time:'2–3 h', pre:'Phase 02',
  objective:'You can build a specialist whose <b>model, persona, and enabled capabilities are each chosen deliberately</b>, and you know which of those the system writes for you.',
  concepts:[
    {h:'The Advanced disclosure is the whole capability surface',
     p:'<p>Behind <b>Advanced</b> in New Agent — and behind <b>Edit Profile</b> on a live Bot — sits everything that makes a specialist a specialist.</p>',
     table:{head:['Control','What it does','When you reach for it'],rows:[
       ['<b>Clone from / Fresh</b>','Start from another Bot config, skills, SOUL and memory, or clean','Cloning a proven setup into a sibling role'],
       ['<b>Create empty</b>','Skips the bundled skills entirely','Narrow specialists where prompt size matters'],
       ['<b>Model &amp; provider pin</b>','Any provider/model pair Hermes knows; different Bots run different models side by side','Frontier reasoning for the orchestrator, cheap models for the grunts'],
       ['<b>Custom SOUL.md</b>','The Bot persona and standing instructions','Always. This is the Bot job description'],
       ['<b>Per-skill / per-toolset / per-MCP-server</b>','Tick exactly the capabilities this specialist needs','Always. Unticked capability is unspent context and unspent risk'],
       ['<b>Shared keys</b>','One OAuth/token pool with the main profile','Default; leave it alone unless you know why not']]}},
    {h:'Leave the model unset and it inherits',
     p:'<p>An unpinned Bot inherits the model from the launch profile. That is fine for a fleet of one. It is expensive for a fleet of ten, because your default is almost certainly your best model, and most Bots do not need it.</p><p>The kanban documentation names the pattern explicitly as a cost strategy: <b>frontier orchestrator, inexpensive workers</b>. Pin deliberately, in both directions.</p>'},
    {h:'SOUL.md is yours. The messaging protocol is not.',
     p:'<p>This is the single most commonly mis-stated fact about Bot Mode, and getting it wrong costs you context in every message.</p><p>The backend teaches each Bot canonical Bot Chat the bot-to-bot messaging protocol <b>automatically at prompt-build time</b> — including when a teammate opens it headlessly from the CLI. Only the canonical Bot Chat gets the protocol section. <b>Your regular sessions and your SOUL.md stay untouched.</b> It is controlled by one config key, on by default:</p>',
     code:C('# ~/.hermes/profiles/<bot>/config.yaml',
            'agent:',
            '  bot_mode_protocol: true   # inject the bot-to-bot messaging protocol',
            '                            # into canonical Bot Chats'),
     p2:'<p>The <b>archived</b> plugin taught the protocol through <code>SOUL.md</code> instead. If you carried protocol text into a SOUL from an older guide, you are now paying for it twice: once in your SOUL, once in the injected section.</p>'},
    {h:'Capability scoping is where the real leverage is',
     p:'<p>Per-skill, per-toolset, and per-MCP-server enablement is not a tidiness feature. Every enabled toolset is schema in the model context on every turn, and every enabled MCP server is a live capability the Bot can reach for. A research Bot with a deploy toolset enabled will eventually use it.</p><p>Build specialists by <b>subtraction</b>. Start from <b>Create empty</b>, add the two or three skills the role actually needs, and enable exactly one MCP server if any.</p>'},
    {h:'Editing a live Bot',
     p:'<p><b>Edit Profile</b> reopens the same surface on a live profile at any time: avatar, title, description, model pin, skills, toolsets, MCP servers, and the full <code>SOUL.md</code>. There is no separate edit model — the create dialog and the edit dialog are the same surface pointed at a different profile.</p>'}
  ],
  lab:{title:'Build a specialist by subtraction and measure the difference',
    steps:[
      'Create a Bot with <b>Create empty</b> and a tight SOUL.md — one paragraph naming its input, output, and refusal. Enable nothing else yet.',
      'Run '+K('hermes prompt-size')+' against that profile and against your default profile. Write both numbers down. That gap is what bundled skills and toolsets cost you per turn.',
      'Pin the specialist to a cheaper model than your default. Give it three real tasks from its actual job and judge the output honestly.',
      'Add back exactly one skill it demonstrably needed. Re-run '+K('hermes prompt-size')+' and note the delta.',
      'Open its canonical Bot Chat and ask it to describe how it would message a teammate. It will know, because the protocol was injected. Now open a <b>regular</b> session on the same profile and ask the same thing. Compare.',
      '<b>Break it deliberately:</b> set '+K('agent.bot_mode_protocol: false')+' in that profile config, restart the session, and ask the same question in the canonical Bot Chat. Watch the Bot lose its knowledge of the messaging protocol and its teammate roster. Set it back to true.',
      'Confirm the whole time that '+K('SOUL.md')+' on disk never changed. The protocol was never written there.'],
    verify:'You have two prompt-size numbers, a working specialist on a cheaper model, and first-hand proof that the messaging protocol lives outside SOUL.md.'},
  gotchas:[
    {s:'stale',t:'"SOUL.md teaches bots the protocol" describes the archived plugin',d:'The archived Hermes-Bot-Mode README says the bots learn the protocol from their <code>SOUL.md</code>. Current behaviour is the opposite and is stated explicitly: the backend injects the protocol at prompt-build time into the canonical Bot Chat only, and your SOUL.md stays untouched. Following the old guidance duplicates the protocol in your context budget and desynchronises when the real one changes.'},
    {s:'trap',t:'The messaging tool exists only in canonical Bot Chats',d:'<code>message_agent</code> is present <b>only</b> in canonical Bot Chat sessions on Bot-Mode-managed installs. Regular chats, group-room member sessions, and CLI sessions never see it. A workflow you prototype in a regular chat will not have the tool, and the model will improvise something else rather than telling you the tool is missing.'},
    {s:'cost',t:'An unpinned model silently inherits your most expensive one',d:'Leave the pin unset and the Bot uses the launch profile model. Ten specialists on your frontier default is ten frontier bills for work most of them do not need. The documented pattern is a frontier orchestrator with inexpensive workers.'},
    {s:'trap',t:'Every enabled toolset is context you pay for on every single turn',d:'Capability enablement looks like a permissions screen. It is also a prompt-size decision. A Bot with everything ticked has a large schema, a slower first token, and a broader blast radius — and none of that surfaces as an error, only as cost and the occasional surprising tool call.'},
    {s:'ok',t:'Build specialists by subtraction, not addition',d:'Start from Create empty and add only what the role provably needs. It is far easier to notice a missing capability than to notice an unnecessary one.'}
  ],
  quiz:[
    {q:'Where does the bot-to-bot messaging protocol come from, and which sessions receive it?',a:'The backend injects it at prompt-build time into the <b>canonical Bot Chat only</b> — including when a teammate opens that chat headlessly from the CLI. Regular sessions and <code>SOUL.md</code> are untouched. It is controlled by <code>agent.bot_mode_protocol</code> in <code>config.yaml</code>, default true.'},
    {q:'Which sessions have the message_agent tool in their schema?',a:'Only canonical Bot Chat sessions, and only on Bot-Mode-managed installs. Regular chats, group-room member sessions, and CLI sessions never see it.'},
    {q:'What does "Create empty" do that a normal fresh profile does not?',a:'It skips the bundled skills entirely, producing a minimal profile. A normal fresh profile is created with bundled skills seeded, which cost prompt size on every turn.'},
    {q:'What happens to a Bot model if you leave the model pin unset?',a:'It inherits the model from the launch profile. Any provider/model pair Hermes knows about can be pinned instead, and different Bots can run different models side by side — which is the basis of the frontier-orchestrator, inexpensive-workers cost strategy.'},
    {q:'Name the six controls in the Advanced disclosure.',a:'Clone from an existing profile (or Fresh); Create empty; model and provider pin; custom <code>SOUL.md</code>; per-skill, per-toolset and per-MCP-server enablement; and shared keys. Edit Profile reopens the identical surface on a live profile.'}
  ],
  docs:[['Bot Mode: creating a Bot','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['Kanban cost strategy','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/kanban.md']]
},
/* ============================== 04 ============================== */
{
  id:'p4', n:'04', title:'Roster craft', layer:'l3', layerLabel:'Fleet',
  time:'1–2 h', pre:'Phase 03',
  objective:'Your roster is <b>scannable at a glance</b> and each Bot is distinguishable at speed, because you will be picking one under time pressure.',
  concepts:[
    {h:'What a roster row actually shows',
     p:'<p>One row per agent profile: <b>avatar</b>, <b>latest-message preview</b>, and <b>timestamp</b>. The list is activity-ordered. Groups are standalone rows in the same list — a Bot keeps one DM row even when it belongs to several groups, while every group gets its own room row with member count, latest-message preview, timestamp, and needs-you state.</p><p>Search filters the roster as you type. Beyond about a dozen Bots, search stops being a convenience and becomes the primary navigation.</p>'},
    {h:'Avatars, in order of how much you should care',
     table:{head:['Kind','How it is made','Notes'],rows:[
       ['<b>Blob face</b> (default)','Deterministic soft-body face drawn from the Bot name','Same name, same face, forever. Follows the name live as you type'],
       ['<b>Geometric face</b>','7 shapes &times; 10 colors','Blinking eyes that <b>scan while the Bot works</b> — a genuine activity signal'],
       ['<b>Uploaded image</b>','Any picture you like','The only option with no relationship to the name'],
       ['<b>AI portrait</b>','Generated in place via the <code>image.generate</code> RPC','Requires a configured image backend; works over local and remote gateways'],
       ['<b>Pixel pet</b>','A companion from the petdex gallery','Bounces beside the avatar while the Bot is busy. Browse with <code>hermes pets</code>']]}},
    {h:'Blob face controls',
     p:'<p>While you type a name in New Agent the blob face follows it live. <b>Randomize</b> re-rolls it. <b>Lock face</b> keeps the one you like even if the name changes. You can also pin one of the six silhouettes — round, organic, boxy, nub, cloud, sun — while everything else still derives from the name.</p><p>Determinism is the point: a Bot face is a function of its name, so the same Bot looks the same on every machine without syncing an image.</p>'},
    {h:'Look is profile metadata, so it travels',
     p:'<p>A Bot look, title, and description are stored in the profile metadata <b>on the backend</b>. The same Bot appears the same way on every desktop connected to that backend. This is also true of hidden state and group membership.</p><p>Practical consequence: the roster you carefully arrange on your laptop is the roster you get on your desktop, without exporting anything.</p>'},
    {h:'Browsing a Bot history',
     p:'<p><b>Sessions</b> from a Bot context menu browses and filters that profile <b>200 most recent stored conversations</b> without changing the primary click-to-chat flow. The canonical Bot Chat is one of them, and it is pinned.</p><p>There is also a preference to hide canonical Bot Chats from the regular sidebar session list so they appear only inside the Bots pane. It uses the core hidden-session flag; on older gateways the chats simply stay visible.</p>'},
    {h:'Pets from the terminal',
     code:C('# Browse, install, and select petdex pets shown across CLI, TUI, and desktop.',
            'hermes pets list',
            'hermes pets install <pet>',
            'hermes pets select <pet>',
            'hermes pets scale <n>',
            'hermes pets off',
            'hermes pets doctor')}
  ],
  lab:{title:'Make an eight-Bot roster scannable',
    steps:[
      'Count your Bots. If you have fewer than six, create throwaway ones until you have at least eight — the problems in this phase do not appear at three.',
      'Scroll the roster and time yourself finding a specific Bot by eye, without search. Write the number down.',
      'Assign avatars deliberately: give each functional cluster (research, ops, writing) a visually distinct treatment. Use the six blob silhouettes as your category axis if you have no better one.',
      'Lock the face on any Bot whose name you might change later.',
      'Time yourself again on the same find-by-eye task. Compare.',
      '<b>Break it deliberately:</b> rename a Bot whose face is <i>not</i> locked. Watch its blob face change — the roster row you had learned to recognise is now a different picture, with no warning and no way back except restoring the old name.',
      'Open Sessions on your busiest Bot and confirm the 200-conversation window is enough for your usage. If your busiest Bot rolls past 200 in a week, that is a sign the work belongs on a board rather than in a chat.'],
    verify:'You have a before-and-after find-by-eye time, and you have watched an unlocked face change under a rename.'},
  gotchas:[
    {s:'trap',t:'Renaming re-rolls an unlocked blob face',d:'Blob faces are deterministic from the <b>name</b>. Rename the Bot and you get a different face — silently, and the roster row you had trained your eye on is gone. <b>Lock face</b> before you rename anything you have learned to recognise.'},
    {s:'stale',t:'Every third-party writeup describes only the geometric faces',d:'All five of the sources this site audits describe avatars as "7 shapes &times; 10 colors" and none mention blob faces, which are the <b>default</b> in current builds, or the six silhouettes, or Lock face. If your mental model of Bot Mode avatars came from a blog post, it is one generation behind.'},
    {s:'trap',t:'The AI-portrait option is simply absent without an image backend',d:'AI-generated portraits ride the <code>image.generate</code> RPC and need a configured image backend. Without one you do not get an error explaining that — the capability is just not there, which reads as "this build does not have it".'},
    {s:'cost',t:'The Sessions view caps at 200 conversations per profile',d:'It filters a profile 200 most recent stored conversations. Anything older is still on disk but not in that view. A Bot that churns past 200 conversations quickly is a Bot whose work has outgrown a chat surface.'},
    {s:'ok',t:'Determinism beats decoration',d:'The reason blob faces derive from the name is that the same Bot then looks identical on every machine with nothing to sync. Uploaded images are the only avatar kind that breaks that property.'}
  ],
  quiz:[
    {q:'What is the default avatar kind in current builds, and what determines it?',a:'A blob face — a deterministic soft-body face drawn from the Bot name. Same name, same face, forever. You can Randomize, Lock face so it survives a rename, or pin one of six silhouettes (round, organic, boxy, nub, cloud, sun) while the rest still derives from the name.'},
    {q:'Which avatar kind gives you a live activity signal, and what is the signal?',a:'The geometric faces — 7 shapes by 10 colors — have blinking eyes that <b>scan while the Bot is working</b>. Pixel pets also bounce beside the avatar while the Bot is busy.'},
    {q:'Where are a Bot look, title, and description stored, and what follows from that?',a:'In the profile metadata on the backend. Consequently the same Bot appears identically on every desktop connected to that backend, with nothing to export. Hidden state and group membership live in the same place and travel the same way.'},
    {q:'How many stored conversations does the Sessions view show for a profile?',a:'The 200 most recent. Older conversations remain on disk but are outside that view.'},
    {q:'What appears on a group row in the roster that does not appear on a Bot DM row?',a:'Member count and needs-you state. Both row kinds show a latest-message preview and timestamp, and both live in the same activity-ordered list; a Bot keeps a single DM row no matter how many groups it belongs to.'}
  ],
  docs:[['Bot Mode: avatars and the pane','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['hermes pets','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md']]
},

/* ============================== 05 ============================== */
{
  id:'p5', n:'05', title:'Routines', layer:'l3', layerLabel:'Fleet',
  time:'2 h', pre:'Phase 04',
  objective:'You can attach recurring work to the Bot that owns it, <b>read that work back from the CLI</b>, and you know the one config typo that silently downgrades your scheduler.',
  concepts:[
    {h:'A routine is a cron job with a naming convention',
     p:'<p>The <b>Routines</b> pane attaches recurring tasks to the Bot that does them — "summarize my inbox every morning" lives next to the Bot responsible for it. The pane docks beside the chat only while the Bots tab is active and steps aside when you switch back to Sessions. Older desktop builds keep it always visible.</p><p>Underneath, routines are <b>plain Hermes cron jobs namespaced</b> '+K('[bot:&lt;name&gt;] &lt;routine&gt;')+'. They show up in '+K('hermes cron list')+' and on the core Cron page. Runs land in the Bot own chat history, so the result is exactly where you would go to talk to that Bot anyway.</p>'},
    {h:'The schedule picker and the raw string',
     p:'<p>A structured picker builds the schedule — frequency first, then only the detail that matters — with an <b>Advanced</b> field exposing the raw Hermes schedule string. Use the picker for anything ordinary; drop to the raw string when you need something the picker will not express.</p>'},
    {h:'The cron surface you actually have',
     code:C('hermes cron list      # show scheduled jobs',
            'hermes cron create    # create a job from a prompt',
            'hermes cron edit      # change schedule, prompt, name, delivery, skills',
            'hermes cron pause     # pause without deleting',
            'hermes cron resume    # resume and compute the next future run',
            'hermes cron run       # trigger on the next scheduler tick',
            'hermes cron remove    # delete a job',
            'hermes cron status    # is the scheduler running?',
            'hermes cron tick      # run due jobs once and exit'),
     p2:'<p>Two flags on '+K('create')+' and '+K('edit')+' are worth knowing: repeated '+K('--skill')+' attaches skills to a job, and '+K('--reasoning-effort')+' pins per-job effort from '+K('none')+' through '+K('minimal, low, medium, high, xhigh, max')+' to '+K('ultra')+'. On '+K('edit')+' you also get '+K('--clear-skills')+', '+K('--add-skill')+', '+K('--remove-skill')+', and an empty '+K('--reasoning-effort')+' clears the pin.</p>'},
    {h:'Routines are per-profile, because cron is per-profile',
     p:'<p>Each profile owns its own cron jobs, the same way it owns its own memory. Which means '+K('hermes cron list')+' shows you the <b>active profile</b> jobs. To read one Bot schedule specifically, use the global profile flag:</p>',
     code:C('# The active profile only.',
            'hermes cron list',
            '',
            '# One specific Bot. -p is a global option on every hermes invocation.',
            'hermes -p researcher cron list',
            '',
            '# Pause a routine without hiding the Bot.',
            'hermes -p researcher cron pause "[bot:researcher] morning digest"')},
    {h:'The pluggable trigger, and its silent fallback',
     p:'<p>The cron <b>trigger</b> is pluggable via the '+K('cron.provider')+' config key. Empty — the default — uses the built-in in-process ticker. Set it to '+K('chronos')+' for the NAS-managed provider used by scale-to-zero hosted gateways, configured through the '+K('cron.chronos.*')+' keys: '+K('portal_url')+', '+K('callback_url')+', '+K('expected_audience')+', '+K('nas_jwks_url')+'. You can also name a custom provider under '+K('plugins/cron/&lt;name&gt;/')+' or '+K('$HERMES_HOME/plugins/&lt;name&gt;/')+'.</p><p><b>An unknown or unavailable provider falls back to the built-in, so cron is never left without a trigger.</b> That is a good availability property and a terrible debugging property. See the gotcha.</p>'}
  ],
  lab:{title:'Give one Bot a real routine and prove you can read it back',
    steps:[
      'Pick the Bot from Phase 01 and give it one genuinely useful daily routine through the Routines pane. Use the structured picker.',
      'Before it fires, run '+K('hermes -p &lt;bot&gt; cron list')+' and find your routine by its '+K('[bot:&lt;name&gt;]')+' prefix. Confirm the schedule the picker generated is what you meant.',
      'Force a run with '+K('hermes -p &lt;bot&gt; cron run')+' and then '+K('hermes -p &lt;bot&gt; cron tick')+'. Confirm the output lands in that Bot own chat history, not in a separate log.',
      'Edit the routine from the CLI rather than the UI — change its prompt with '+K('hermes -p &lt;bot&gt; cron edit')+' — then confirm the change appears in the desktop Routines pane. Parity in both directions.',
      'Attach a skill with '+K('--add-skill')+' and pin '+K('--reasoning-effort low')+'. Run it again and compare cost and quality against the unpinned run.',
      '<b>Break it deliberately:</b> set '+K('cron.provider: chronoss')+' (a deliberate typo) in that profile config and restart. Run '+K('hermes cron status')+' and fire the job. It keeps working — on the built-in ticker, not the provider you named. Nothing tells you. Fix the typo and note how you would have caught this in production.',
      'Pause the routine and confirm with '+K('hermes cron list')+' that it is paused rather than deleted. Resume it and note that the next run is computed forward, not backfilled.'],
    verify:'You have a routine you can create, read, edit, and pause from either surface, and you have seen a mistyped cron provider fail silently upward.'},
  gotchas:[
    {s:'trap',t:'A mistyped cron.provider silently falls back to the built-in ticker',d:'The documented behaviour is that an unknown or unavailable provider falls back to the built-in <i>so cron is never left without a trigger</i>. Excellent for availability. It also means <code>chronoss</code>, or a chronos endpoint that is down, produces a working scheduler that is not the one you configured — and on a scale-to-zero hosted gateway, an in-process ticker inside a process that scales to zero is a scheduler that does not fire.'},
    {s:'trap',t:'"hermes cron list" only shows the active profile',d:'Cron jobs are per-profile state, like memory and sessions. Run it in your default profile and your researcher routines are simply absent — not an error, just an empty-looking fleet. Use <code>hermes -p &lt;bot&gt; cron list</code>, or read the desktop pane, which aggregates.'},
    {s:'trap',t:'Hiding a Bot does not pause its routines',d:'This is the Phase 00 trap arriving where it costs money. A hidden Bot with a daily frontier-model routine bills every day and never toasts. <code>hermes cron pause</code> is the off switch; the eye icon is not.'},
    {s:'cost',t:'Routine output is a full agent turn into a persistent chat',d:'Runs land in the Bot own chat history, which means every scheduled run also grows the context of the conversation you will next open. A chatty hourly routine makes its Bot slower and more expensive to talk to.'},
    {s:'trap',t:'Resume computes the next FUTURE run',d:'A paused job that you resume does not backfill the runs it missed — <code>resume</code> computes its next future run. If you paused a daily digest for a week, that week is gone, and nothing says so.'}
  ],
  quiz:[
    {q:'What is a Bot Mode routine, underneath the pane?',a:'A plain Hermes cron job namespaced <code>[bot:&lt;name&gt;] &lt;routine&gt;</code>. It appears in <code>hermes cron list</code> and on the core Cron page. There is no separate scheduler and no separate storage; runs land in the Bot own chat history.'},
    {q:'Name the nine hermes cron subcommands.',a:'<code>list</code>, <code>create</code> (aliased <code>add</code>), <code>edit</code>, <code>pause</code>, <code>resume</code>, <code>run</code>, <code>remove</code>, <code>status</code>, and <code>tick</code>. <code>run</code> triggers on the next scheduler tick; <code>tick</code> runs due jobs once and exits.'},
    {q:'What happens when cron.provider names a provider that does not exist or is unavailable?',a:'It falls back to the built-in in-process ticker, so cron is never left without a trigger. No error surfaces. On a scale-to-zero hosted gateway this is a real outage, because the in-process ticker dies with the process it lives in.'},
    {q:'Why does "hermes cron list" sometimes show none of your Bot routines?',a:'Because cron jobs are per-profile state and the command reports the <b>active</b> profile. Use the global <code>-p &lt;bot&gt;</code> flag to read a specific Bot schedule.'},
    {q:'What are the two per-job tuning flags on cron create and edit?',a:'Repeated <code>--skill</code> to attach skills, and <code>--reasoning-effort</code> with values none, minimal, low, medium, high, xhigh, max, ultra. On edit you additionally get <code>--clear-skills</code>, <code>--add-skill</code>, <code>--remove-skill</code>, and passing an empty reasoning effort clears the pin.'},
    {q:'You resume a job that was paused for a week. What runs?',a:'Only the next future run. Resume computes the next future run rather than backfilling missed ones, and nothing reports the gap.'}
  ],
  docs:[['Bot Mode: routines','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['hermes cron reference','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md']]
},

/* ============================== 06 ============================== */
{
  id:'p6', n:'06', title:'Handoffs', layer:'l4', layerLabel:'Between',
  time:'3 h', pre:'Phase 05',
  objective:'You can hand work from one Bot to another three different ways, and you can state precisely <b>which of them guarantee delivery</b> (none) and <b>which guarantee the work gets done</b> (also none).',
  concepts:[
    {h:'Three mechanisms, one destination',
     p:'<p>All bot-to-bot traffic on one machine ends up in the recipient <b>canonical Bot Chat</b>. What differs is who initiates and whether you wait.</p>',
     table:{head:['Mechanism','Initiated by','Sender waits?'],rows:[
       ['<code>@mention</code> in any chat','You, typing','<b>Yes</b> — the active Bot hands off, waits for the reply, and reports back'],
       ['<code>message_agent</code> tool','The Bot itself','<b>No</b> — fire-and-forget with an acknowledgement'],
       ['<code>hermes -p &lt;bot&gt; chat</code>','You, from a shell','Yes — it is just a session on that profile']]}},
    {h:'@mentions are validated against the live roster',
     p:'<p>Type '+K('@researcher have a look at this')+' in any chat and the active Bot hands the message off, waits for the reply, and reports back. Mention names are validated against the live roster, so <b>an email address or an unknown @ passes through untouched</b> rather than erroring or being swallowed.</p><p>Renamed Bots keep their tags in sync, and old profile names keep resolving, so the set of strings that trigger a handoff only ever grows.</p>'},
    {h:'message_agent: the tool the Bots actually use',
     p:'<p>Every canonical Bot Chat carries the '+K('message_agent')+' tool. A Bot messages a teammate by calling it directly:</p>',
     code:C('message_agent(',
            '    target="researcher",',
            '    message="Need the 2024-2026 seed funding numbers for the launch brief.",',
            ')'),
     p2:'<p>What the runtime does for you, in order:</p><ol><li><b>Validates the target</b> against the live roster.</li><li><b>Prefixes attribution</b> automatically: '+K('Message from 🤖 &lt;sender&gt; (@&lt;sender&gt;):')+'.</li><li><b>Delivers into the teammate canonical Bot Chat.</b></li><li><b>Acknowledges to the sender</b>, which finishes its turn. The reply arrives later as a background completion notification.</li></ol><p>Two properties matter enormously. The message travels as a <b>real parameter</b> — nothing is shell-interpreted, so quotes, '+K('$(...)')+', and backticks arrive verbatim. And the Bot <b>composes its own message</b> rather than forwarding your words.</p>'},
    {h:'How a Bot knows who to message',
     p:'<p>The teammate roster — names <b>and roles</b> from each profile title and description — is part of every Bot Chat system prompt. That is the whole discovery mechanism. There is no directory service and no capability negotiation: a Bot picks a recipient by reading a list of names and one-line roles.</p><p>Which is why Phase 01 insisted the description was load-bearing. Routing quality is a direct function of description quality.</p>'},
    {h:'Delivery is per-invocation. This is the sentence to memorise.',
     p:'<p>From the documentation, stated as a note: <b>bot-to-bot delivery is per-invocation — the receiving Bot picks the message up when it next runs. Live interrupt of a Bot mid-conversation is future work.</b></p><p>Combine that with fire-and-forget and you get the defining limitation of Bot Mode handoffs: the sender receives a successful acknowledgement for a message that may not be read for hours, or ever, if nothing causes the recipient to run. There is no queue you can inspect, no retry, and no dead-letter.</p>'},
    {h:'The one config key',
     code:C('# ~/.hermes/profiles/<bot>/config.yaml',
            'agent:',
            '  bot_mode_protocol: true'),
     p2:'<p>Turning this off removes the injected protocol section, so the Bot stops being taught the messaging contract and the teammate roster. Whether the '+K('message_agent')+' tool itself remains in the schema when the protocol is off is <span class="unv">unverified</span> — the documentation describes the key as controlling protocol injection, not tool registration.</p>'}
  ],
  lab:{title:'Run a three-Bot chain and then break the middle of it',
    steps:[
      'Build three Bots with sharp, non-overlapping descriptions: a researcher that gathers, a critic that attacks findings, and an editor that synthesises. Write each description so the other two could route on it cold.',
      'From the researcher Bot Chat, give <b>one</b> instruction and ask it to hand off to the critic when done. Do not intervene again. Watch how far the chain gets on its own.',
      'Read the message that actually arrived in the critic Bot Chat. Compare it to what you would have written. The Bot composed it, not you — note what it dropped.',
      'Now do the same handoff with an explicit '+K('@critic')+' mention from your own composer. Note the difference: you wait for the reply, and it is reported back to you.',
      'Send a message containing '+K('$(whoami)')+', a backtick, and a double quote through '+K('message_agent')+'. Confirm it arrives verbatim. Nothing is shell-interpreted.',
      '<b>Break it deliberately:</b> have the critic hand off to the editor and then do not open the editor chat. Wait. The handoff acknowledged successfully; the editor never runs; the work stops. Nothing errors, nothing retries, nothing appears in any queue. This is the exact failure the dev.to writeup hit — reproduce it on purpose so you recognise it under pressure.',
      'Now open the editor chat. Confirm the message was waiting and is picked up on this invocation. Write down the wall-clock delay between acknowledgement and pickup.'],
