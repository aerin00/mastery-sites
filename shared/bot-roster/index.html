    verify:'You have a measured gap, in minutes or hours, between a successful handoff acknowledgement and the work actually starting.'},
  gotchas:[
    {s:'trap',t:'A successful handoff acknowledgement is not delivery of work',d:'<code>message_agent</code> is fire-and-forget: the sender gets an acknowledgement and finishes its turn. Delivery is per-invocation, so the recipient reads the message <i>when it next runs</i>. If nothing makes it run, the chain stops with every participant reporting success. There is no retry, no timeout, no dead-letter, and no queue depth to check.'},
    {s:'trap',t:'The Bot composes its own message, so your wording is not what arrives',d:'Documented explicitly: the Bot composes its own message rather than forwarding your words. Instructions you carefully phrased get paraphrased by an intermediate model. If exact wording matters — a command, an identifier, a quoted requirement — put it somewhere durable and hand over a pointer, not prose.'},
    {s:'stale',t:'Three generations of the transport exist, and most guides describe an old one',d:'The archived plugin used an inline CLI handoff (<code>hermes -p &lt;bot&gt; chat -c "Bot Chat" -Q -q "Message from 🤖 …"</code>) with the protocol taught via SOUL.md. An intermediate generation used a file-based transport (<code>--query-file</code>) with <code>agent.bot_mode_protocol</code> injection. Current <code>main</code> uses the <code>message_agent</code> tool with real parameters. All three are described in live documentation somewhere on the internet right now.'},
    {s:'trap',t:'Unknown @handles pass through silently instead of failing',d:'Mentions are validated against the live roster so that email addresses and stray <code>@</code> characters are not mangled. The cost is that a mistyped Bot name is not an error — it is just text in a message, and no handoff happens. You find out when the work does not appear.'},
    {s:'trap',t:'Prototyping a handoff in a regular chat will not work',d:'<code>message_agent</code> exists only in canonical Bot Chats. Test it in a regular session and the tool is absent; the model will improvise a plausible-looking alternative rather than reporting a missing tool.'},
    {s:'cost',t:'Every hop is a full agent turn',d:'A four-Bot chain is at minimum four full inferences plus the reply notifications, and each Bot re-reads its own accumulated Bot Chat context. Chains get expensive faster than they get useful.'}
  ],
  quiz:[
    {q:'State the delivery semantics of message_agent in one sentence.',a:'Fire-and-forget with per-invocation delivery: the sender gets an acknowledgement and finishes its turn, the message lands in the recipient canonical Bot Chat, and the recipient reads it <b>when it next runs</b>. The reply comes back later as a background completion notification. Live interrupt of a Bot mid-conversation is future work.'},
    {q:'Name the four things the runtime does to a message_agent call before delivery.',a:'Validates the target against the live roster; prefixes the sender attribution <code>Message from 🤖 &lt;sender&gt; (@&lt;sender&gt;):</code>; delivers into the teammate canonical Bot Chat; and acknowledges to the sender so it can finish its turn.'},
    {q:'How does one Bot discover which teammate to message?',a:'From the teammate roster injected into every Bot Chat system prompt — names <b>and roles</b> taken from each profile title and description. There is no directory service or capability negotiation, so routing quality is a direct function of how well you wrote the descriptions.'},
    {q:'Why do quotes, $(...) and backticks survive a bot-to-bot message intact?',a:'Because the message travels as a real tool parameter, not through a shell. Nothing is shell-interpreted. The earlier CLI-handoff and file-transport generations went to some trouble to achieve the same property; the tool gets it for free.'},
    {q:'What is the practical difference between an @mention you type and a message_agent call a Bot makes?',a:'An @mention is synchronous from your point of view: the active Bot hands off, <b>waits</b> for the reply, and reports back to you. <code>message_agent</code> is asynchronous: the sender does not wait, and the reply surfaces later as a background completion notification.'},
    {q:'You typed @reserchers by mistake. What happens?',a:'Nothing. Mentions are validated against the live roster, and an unrecognised handle passes through untouched as ordinary text so that email addresses are not mangled. No handoff occurs and no error is raised.'}
  ],
  docs:[['Bot Mode: bot-to-bot messaging','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['dev.to: a chain that broke','https://dev.to/vivek_shetye/hermes-bot-mode-i-built-a-team-of-ai-agents-that-hand-off-work-to-each-other-a49']]
},

/* ============================== 07 ============================== */
{
  id:'p7', n:'07', title:'Group rooms', layer:'l4', layerLabel:'Between',
  time:'2–3 h', pre:'Phase 06',
  objective:'You can run a room that converges instead of spinning, and you know <b>which part of a room history is durable and which part is a bounded projection</b>.',
  concepts:[
    {h:'Membership, and where it lives',
     p:'<p>Right-click a local Bot &rarr; <b>Manage groups</b> to add or remove it from any number of group chats. You can pick existing groups independently or create one inline. Membership is stored in the Bot backend-synced <b>profile metadata</b>, so it follows that profile across desktops. Older profiles with a single legacy group continue to work. Connections Bots join through the New Group Chat picker and stay source-qualified in the room shared state.</p>'},
    {h:'The turn-taking contract',
     p:'<p>Open chat on any group row seats <b>2 to 6 Bots</b> in a shared room. What happens when you send a message is precisely specified:</p>',
     table:{head:['Rule','Value'],rows:[
       ['Rounds per message you send','Up to <b>3 serial rounds</b> of member turns'],
       ['Who responds','@-mentioned Bots; <b>everyone</b> when nobody is mentioned'],
       ['Each Bot per turn','Replies briefly, <b>or passes</b>'],
       ['Settling condition','A full round in which nobody speaks'],
       ['Hard cap','<b>10 messages per send</b>'],
       ['Escalation to you','A Bot writes <code>@user</code>; the group row shows a <b>needs you</b> badge'],
       ['Per-member session','Its own persistent <code>Group: &lt;name&gt;</code> session']]}},
    {h:'Silence is a choice, not a failure',
     p:'<p>Stated explicitly in the documentation: <b>not every Bot replies to every message.</b> Speaking is each member own choice — a Bot replies only when it has something new to add and passes otherwise. @-mentioning specific members scopes the round to them.</p><p>This is good design and a debugging nightmare, because a Bot that passed and a Bot that never received the message look identical from the transcript.</p>'},
    {h:'Rooms follow gateways, not desktops',
     p:'<p>Each room recent transcript, members, picture, and name are mirrored into the shared profile metadata of <b>every</b> gateway your Desktop is connected to, with <b>per-gateway versioning so two Desktops writing at once merge instead of overwriting</b>. Open Hermes Desktop on another machine against the same gateway — local network, Tailscale, anywhere — and the room appears with its history. Gateway-only clients see it too.</p><p>Rooms carry a <b>durable internal identity</b>. Renaming one changes only its display name everywhere. Disbanding one removes it permanently on every client, <b>even ones that were offline at the time</b>. Recreating a same-name group starts a genuinely fresh room.</p>'},
    {h:'What survives a gateway dying',
     p:'<p>If a gateway dies or is removed, nothing is lost: every connected Desktop keeps the full room locally and re-seeds any gateway it reconnects to.</p><p>Read the parenthetical in the docs carefully, because it is the important half: <b>the full orchestration log stays in each Desktop local storage; the shared mirror is a bounded recent-history projection.</b> The gateway does not hold your complete room history. Your desktops do.</p>'},
    {h:'Rooms across machines',
     p:'<p>The New Group Chat picker seats Bots from any registered connection. Each member turns run <b>on its own machine</b>, in its own '+K('Group: &lt;name&gt;')+' session there. Cross-machine members carry a device badge such as '+K('dixie · Mac Mini')+' in the room and in other members transcripts, and the disambiguated '+K('@name-device')+' handle works in room mentions — so same-named agents on two machines never blur together.</p>'}
  ],
  lab:{title:'Run a room to convergence, then poison it',
    steps:[
      'Seat three Bots with genuinely different roles in a room. Give them one real decision to make — something with a trade-off, not a lookup.',
      'Send one message with nobody mentioned. Count the messages produced and the rounds used. Compare against the caps: 3 rounds, 10 messages.',
      'Send a second message @-mentioning only one member. Confirm the round is scoped to them and the others stay quiet.',
      'Get a Bot to escalate: ask something only you can decide. Confirm the '+K('@user')+' escalation and the <b>needs you</b> badge on the group row.',
      'Open a member '+K('Group: &lt;name&gt;')+' session directly from the Sessions list and read what that member alone sees. Each member has its own persistent room session, and they are not identical.',
      '<b>Break it deliberately:</b> disband the group, then immediately create a new group with the <i>same name</i> and the same members. Confirm it is a genuinely fresh room with no history — the name is identical, the internal identity is not, and nothing warns you. This is how people lose a room and conclude it is a sync bug.',
      'If you have a second desktop on the same gateway, open it and confirm the room appears with its recent history. Note that what you see is the bounded mirror, not the full orchestration log.'],
    verify:'You have a room that settled inside the caps, and you have destroyed and recreated a same-named room and watched the history not come back.'},
  gotchas:[
    {s:'trap',t:'A Bot that passed and a Bot that never got the message look identical',d:'Speaking is each member own choice; a Bot replies only when it has something new and passes otherwise. There is no "passed" marker in the transcript. When a room produces two replies from six members you cannot tell from the room whether four Bots declined or four Bots failed. Check each member <code>Group: &lt;name&gt;</code> session to find out.'},
    {s:'trap',t:'Recreating a same-named group gives you an empty room, permanently',d:'Rooms carry a durable internal identity, so a recreated group with an identical name is genuinely fresh. Disbanding removes the room on every client, including ones that were offline. The name looks the same and the history is gone, which reads exactly like a failed sync.'},
    {s:'trap',t:'The gateway mirror is a bounded recent-history projection, not your archive',d:'Every connected Desktop keeps the full orchestration log in local storage; the shared mirror carries recent transcript, members, picture, and name. A new machine joining sees the projection. Lose the desktops and you lose the full log, while the room continues to look intact.'},
    {s:'cost',t:'One message can buy you ten agent turns',d:'Up to 3 serial rounds across up to 6 members, hard-capped at 10 messages per send. On pinned frontier models a single question to a six-Bot room is up to ten full inferences. Rooms are the most expensive surface in Bot Mode per unit of human input.'},
    {s:'trap',t:'Cross-machine members run on their own machine, with their own everything',d:'A remote member turn executes on its machine, in a <code>Group: &lt;name&gt;</code> session <i>there</i>, with that machine credentials, tools, and filesystem. A room that looks like one conversation is several processes on several boxes. The device badge (<code>dixie · Mac Mini</code>) is the only in-room signal.'},
    {s:'ok',t:'The settling condition is silence, so quiet Bots end rooms faster',d:'The room settles when a full round stays silent. Well-scoped Bots that pass when they have nothing to add converge in one round. Eager Bots that always respond burn all three.'}
  ],
  quiz:[
    {q:'State every hard limit on a group room.',a:'2 to 6 Bots per room; up to 3 serial rounds of member turns per message you send; a hard cap of 10 messages per send. The room settles early when a full round stays silent.'},
    {q:'Who responds when you send a message with no mentions, and who responds when you mention one member?',a:'With no mentions, everyone responds — though each Bot may still reply briefly or pass. Mentioning specific members scopes the round to them.'},
    {q:'What is stored in the shared gateway mirror, and what is not?',a:'The mirror holds each room recent transcript, members, picture, and name, with per-gateway versioning so concurrent Desktop writes merge rather than overwrite. It is a <b>bounded recent-history projection</b>. The full orchestration log stays in each Desktop local storage.'},
    {q:'You disband a room and recreate it with the same name and members. What do you get?',a:'A genuinely fresh room. Rooms carry a durable internal identity independent of the display name, so recreation does not restore history. Disbanding removes the room permanently on every client, including ones offline at the time.'},
    {q:'How does a Bot ask a human for a decision inside a room, and where does that surface?',a:'It writes <code>@user</code>. The group row in the roster then shows a <b>needs you</b> badge.'},
    {q:'Where does a cross-machine room member actually run?',a:'On its own machine, in its own persistent <code>Group: &lt;name&gt;</code> session there. It carries a device badge such as <code>dixie · Mac Mini</code> in the room and in other members transcripts, and its <code>@name-device</code> handle works in room mentions.'}
  ],
  docs:[['Bot Mode: groups and group chats','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md']]
},
/* ============================== 08 ============================== */
{
  id:'p8', n:'08', title:'Connections', layer:'l5', layerLabel:'Across',
  time:'2 h', pre:'Phase 07',
  objective:'You can run one roster spanning several machines and <b>always know which machine a given Bot actually executes on</b>.',
  concepts:[
    {h:'One roster, many backends',
     p:'<p>Register several backends in <b>Settings &rarr; Connections</b> — the local runtime, remote gateways, SSH hosts, Hermes Cloud instances — and the roster shows the Bots from <b>every</b> connected source, <b>persistently</b>. Two properties are doing real work in that sentence:</p><ul><li><b>SSH sources are inventoried without spawning anything on the remote box.</b> Adding an SSH host to your roster does not start an agent there.</li><li><b>Machines that are momentarily unreachable keep their last-known rows instead of vanishing.</b> The roster is stable across flaky links.</li></ul>'},
    {h:'Where a Bot lives is where it runs',
     p:'<p>A Bot chats, sessions, memory, and routines live on the machine that owns the profile. Full stop. Clicking a Connections Bot does <b>not</b> hop your window onto that machine — you stay in your chat and interact with it remotely: '+K('@mention')+' it, seat it in a group chat, or create new agents on it directly.</p><p>This is the mental model to hold: the roster is a <i>view</i> that spans machines; execution never moves.</p>'},
    {h:'Disambiguation by device handle',
     p:'<p>When the same profile name exists on several sources, handles disambiguate as '+K('@name-device')+' — for example '+K('@research-homelab')+'. The device-qualified handle works in ordinary chats and in room mentions.</p><p>Same-named profiles on two machines are common and mostly harmless, because the handle disambiguates. What is <i>not</i> harmless is assuming a bare '+K('@research')+' resolves to the one you meant.</p>'},
    {h:'Create on: building a Bot on another machine',
     p:'<p>With more than one connection registered, the New Agent dialog grows a <b>Create on</b> picker. Pick a device and the profile is created on <b>that</b> machine backend; your window never switches gateways. The new Bot appears as a Connections Bot, and chatting with it routes to its own machine. With a single connection the picker is hidden.</p>',
     table:{head:['Remote-creation detail','Behaviour'],rows:[
       ['Clone source','A profile of the <b>target</b> machine (its <code>default</code>) — a remote box does not have your local profiles to clone'],
       ['Capabilities tab','Pins to the <b>target</b> machine backend, so skills, tools and MCP servers land on the machine the Bot will live on'],
       ['Older desktop builds','Fall back to staged Skills/Tools/MCP checklists for remote targets; both read the target machine catalog'],
       ['Cancelling','Discards the draft profile on whichever machine it was created']]}},
    {h:'Cloud and local in one fleet',
     p:'<p>Register your Hermes Cloud instance and your desktop — over Tailscale or SSH, say — and their Bots share one roster, can message each other, and can sit in the same rooms, with each agent work running on its own machine. Connections is the mechanism that makes "my cloud researcher and my laptop editor are teammates" true without either of them moving.</p>'}
  ],
  lab:{title:'Span two backends and prove where execution happens',
    steps:[
      'Register a second backend in Settings &rarr; Connections. If you have no second machine, an SSH connection to any box you own, or a Hermes Cloud instance, is enough — SSH sources are inventoried without spawning anything.',
      'Confirm the roster now shows Bots from both sources and that they are visually distinguishable by source.',
      'Create a Bot on the remote target using the <b>Create on</b> picker. During creation, note that the clone source offered is the <i>target</i> machine default profile, not any of your local Bots.',
      'Chat with that remote Bot. While it is working, run '+K('hermes profile list')+' on your <b>local</b> machine and confirm it is not there. Then check the remote machine. Execution is where the profile is.',
      'Ask the remote Bot to write a file. Verify the file appears on the remote machine filesystem, not yours. This is the concrete version of "execution never moves".',
      'Create a same-named profile on both machines. Confirm the roster disambiguates them as '+K('@name-device')+' and that both device-qualified handles resolve.',
      '<b>Break it deliberately:</b> disconnect the remote machine — pull its network, or stop its gateway. Watch the roster keep its last-known rows: the Bots are still listed, still look normal, and are simply gone. Now '+K('@mention')+' one and observe what you get. Reconnect and confirm the rows refresh.'],
    verify:'You have watched a whole machine go offline while its Bots continued to appear healthy in your roster, and you know what a mention to an unreachable Bot does.'},
  gotchas:[
    {s:'trap',t:'Unreachable machines keep their last-known rows, so a dead box looks like a healthy one',d:'This is a deliberate stability feature — momentarily unreachable machines do not flicker out of your roster. It is also a perfect silent failure: an entire backend can be down while its five Bots sit in your roster with plausible timestamps. The roster is not a health dashboard.'},
    {s:'trap',t:'The remote clone source is the target machine default, not your local Bot',d:'Same dialog, different meaning depending on the Create on target. A remote box does not have your local profiles to clone from, so picking "clone" during remote creation clones something you have never seen. If you wanted your local Bot on that machine, use <code>hermes profile export</code> and <code>import</code> instead.'},
    {s:'trap',t:'A bare @handle with same-named profiles resolves to something',d:'Handles disambiguate as <code>@name-device</code> when a name exists on several sources, but a bare mention still resolves. Which one it picks in an ambiguous case is <span class="unv">unverified</span>. Use the device-qualified handle whenever a name is not unique, rather than finding out.'},
    {s:'trap',t:'Cancelling remote creation relies on a discard round-trip',d:'The draft profile is created on the target machine and cancelling discards it. A network drop between creation and cancellation leaving an orphan profile on the remote box is a plausible consequence but is <span class="unv">unverified</span>. Run <code>hermes profile list</code> on the target after a cancelled remote creation.'},
    {s:'ok',t:'Clicking a Connections Bot never hops your window',d:'This is the design invariant that makes multi-machine rosters usable: you stay on your gateway, and the work routes. If you find yourself wanting to switch gateways to talk to a Bot, you have missed a feature — mention it, seat it in a room, or use Create on.'}
  ],
  quiz:[
    {q:'What does registering an SSH host as a connection do, and what does it not do?',a:'It inventories that source Bots into your roster. It does <b>not</b> spawn anything on the remote box. The roster is a view; nothing starts running because you looked at it.'},
    {q:'Where do a Connections Bot chats, sessions, memory, and routines live, and where does it execute?',a:'All of them live on the machine that owns the profile, and it executes there. Clicking it does not move your window to that machine — you stay on your gateway and interact remotely by mention, room seat, or Create on.'},
    {q:'How are same-named profiles on different machines addressed?',a:'With a device-qualified handle, <code>@name-device</code> — for example <code>@research-homelab</code>. It works in ordinary chats and in room mentions.'},
    {q:'When you create a Bot on a remote target, what can you clone from and where do capabilities come from?',a:'The clone source is a profile of the <b>target</b> machine, its <code>default</code>, because the remote box has no access to your local profiles. The Capabilities tab pins to the target machine backend so skills, tools and MCP servers land on the machine the Bot will live on. Older builds fall back to staged checklists that still read the target catalog.'},
    {q:'What happens in the roster when a registered backend goes offline?',a:'Its Bots keep their last-known rows rather than vanishing. The roster stays stable across flaky links, which also means it will show you a healthy-looking fleet on a machine that is entirely down.'}
  ],
  docs:[['Bot Mode: bots across machines','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md'],
        ['Multi-connection desktop','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/multi-connection-desktop.md']]
},

/* ============================== 09 ============================== */
{
  id:'p9', n:'09', title:'Peers', layer:'l5', layerLabel:'Across',
  time:'2–3 h', pre:'Phase 08',
  objective:'Your Bots can message Bots on another machine <b>with no desktop in the loop</b>, and you can manage the credential that makes it possible.',
  concepts:[
    {h:'Connections is a desktop feature. Peers is not.',
     p:'<p>Connections spans machines <i>for you</i>, through the desktop app. '+K('hermes peer')+' spans machines <i>for your Bots</i>, through the gateway API server, with no desktop involved at all. This is the mechanism that lets a headless box participate in your fleet.</p>'},
    {h:'The whole command surface',
     code:C('hermes peer add <name> --url http://host:port --key <API_SERVER_KEY> [--note TEXT]',
            'hermes peer list',
            'hermes peer dm <peer>[/<agent>] "message"',
            'hermes peer remove <name>'),
     table:{head:['Subcommand','Behaviour'],rows:[
       ['<code>add</code>','Register or update a peer. The <b>URL</b> goes to <code>config.yaml</code> under <code>bot_peers</code>; the <b>key</b> is stored as <code>HERMES_PEER_&lt;NAME&gt;_KEY</code> in <code>~/.hermes/.env</code>'],
       ['<code>list</code>','List peers and <b>whether each has a key configured</b>'],
       ['<code>dm</code>','Message the peer agent canonical Bot Chat and print the reply. <code>--json</code> for machine-readable output; the message falls back to <b>stdin</b>'],
       ['<code>remove</code>','Remove the peer from the registry. <b>The .env key entry is left in place</b>']]}},
    {h:'What a dm actually does',
     p:'<p>'+K('hermes peer dm')+' resolves the remote agent canonical <b>Bot Chat</b> session over the peer API server, <b>runs one agent turn there</b>, and prints the reply on stdout. It is the exact cross-machine twin of the local Bot-messaging command.</p><p>Targeting: '+K('&lt;peer&gt;')+' alone targets the peer gateway <b>main agent</b>. '+K('&lt;peer&gt;/&lt;agent&gt;')+' targets a named profile on a multiplexed peer, routed via its '+K('/p/&lt;profile&gt;/')+' mirror.</p>',
     code:C('# Message body from a file. Nothing is shell-interpreted this way.',
            'hermes peer dm spark < /tmp/dm.txt',
            '',
            '# A named profile on a multiplexed peer.',
            'hermes peer dm spark/researcher < /tmp/dm.txt',
            '',
            '# Machine-readable, for scripts and cron.',
            'hermes peer dm spark/researcher --json < /tmp/dm.txt'),
     p2:'<p>Exit codes: '+K('0')+' on success, '+K('1')+' on delivery or peer failure, '+K('2')+' on usage errors. Those three codes are what makes '+K('peer dm')+' safe to put in a script; use them.</p>'},
    {h:'Your Bots learn about peers by themselves',
     p:'<p>Once a peer is registered, the messaging protocol taught to every Bot Chat — the one governed by '+K('agent.bot_mode_protocol')+' — <b>automatically includes the peer roster</b> and the '+K('hermes peer dm')+' pattern. And '+K('message_agent')+' accepts peer targets directly: '+K('message_agent(target="spark/researcher", ...)')+', or '+K('target="spark"')+' for the peer main agent.</p><p>So your Bots discover cross-machine teammates without any SOUL edits. Registering or removing a peer refreshes each Bot Chat protocol <b>on its next message</b> — a capability epoch, not an immediate push.</p>'},
    {h:'What the other machine has to be running',
     p:'<p>The peer machine runs the '+K('api_server')+' gateway platform with a <b>strong</b> '+K('API_SERVER_KEY')+'. Reachability is your network business — LAN, Tailscale, VPN. Hermes does not tunnel for you.</p><p>Treat the key as what it is: a credential that grants the holder the ability to run agent turns on your machine. It lives in '+K('~/.hermes/.env')+'; peer names and URLs live in '+K('config.yaml')+' under '+K('bot_peers')+'.</p>'}
  ],
  lab:{title:'Register a peer and audit the credential you just created',
    steps:[
      'On the machine that will be the peer, start the '+K('api_server')+' gateway platform with a strong '+K('API_SERVER_KEY')+'. If you only have one machine, run it on a distinct port on localhost and register '+K('http://127.0.0.1:&lt;port&gt;')+' — whether a self-peer is a supported configuration is <span class="unv">unverified</span>, so treat a one-machine run as a mechanics rehearsal, not a validation.',
      'Register it: '+K('hermes peer add spark --url http://&lt;host&gt;:&lt;port&gt; --key &lt;API_SERVER_KEY&gt; --note "homelab"')+'.',
      'Run '+K('hermes peer list')+' and confirm it reports that the peer has a key configured.',
      'Write a message to '+K('/tmp/dm.txt')+' containing a backtick, a '+K('$(whoami)')+', and a double quote. Send it with '+K('hermes peer dm spark < /tmp/dm.txt')+'. Confirm it arrives verbatim and the reply prints on stdout.',
      'Check the exit code with '+K('echo $?')+'. Then point a peer at a dead URL and confirm you get exit 1, not 0. This is what makes it scriptable.',
      'Open one of your local Bot Chats and ask it who its cross-machine teammates are. It should now know, because the protocol includes the peer roster. Note that this only refreshes on the Bot <b>next</b> message.',
      '<b>Break it deliberately:</b> run '+K('hermes peer remove spark')+'. Then '+K('grep HERMES_PEER ~/.hermes/.env')+'. The key is still there. You have removed the registration and kept the credential — a live API key for another machine, sitting in your environment file with nothing referencing it.',
      'Decide your own hygiene rule for this and write it down. Then remove the key.'],
    verify:'You have a working peer dm with verified exit codes, and an orphaned credential you found yourself and cleaned up.'},
  gotchas:[
    {s:'trap',t:'hermes peer remove leaves the API key in your .env',d:'Documented behaviour: <code>remove</code> takes the peer out of the registry and <b>the .env key entry is left in place</b>. You end up with <code>HERMES_PEER_SPARK_KEY</code> holding a live credential for a machine you no longer talk to, referenced by nothing, surviving every subsequent audit of <code>config.yaml</code>. Grep <code>~/.hermes/.env</code> after every peer removal.'},
    {s:'trap',t:'Peer protocol refresh happens on the Bot next message, not now',d:'Registering or removing a peer refreshes each Bot Chat protocol on its next message — a capability epoch. A Bot mid-conversation is still working from the previous peer roster, so it can confidently try to reach a peer you just removed, or fail to know about one you just added.'},
    {s:'trap',t:'An inline dm message goes through your shell; a piped one does not',d:'<code>hermes peer dm spark "message"</code> is documented and works, but your shell interprets it first. The docs consistently demonstrate <code>&lt; /tmp/dm.txt</code>. Anything containing quotes, <code>$(...)</code>, or backticks — which is to say anything containing code — should come from a file or stdin.'},
    {s:'cost',t:'Every peer dm runs a full agent turn on someone else machine',d:'<code>peer dm</code> does not deliver a message and return; it resolves the remote canonical Bot Chat, <b>runs one agent turn there</b>, and prints the reply. Every dm is a billable inference on the peer, using the peer model pin and the peer credentials. A retry loop against a peer is a retry loop against their bill.'},
    {s:'trap',t:'A bare peer name and a peer/agent target are different destinations',d:'<code>hermes peer dm spark</code> hits the peer gateway <b>main agent</b>. <code>hermes peer dm spark/researcher</code> hits a named profile via the <code>/p/&lt;profile&gt;/</code> mirror. Forget the suffix and your carefully addressed message lands in the wrong Bot chat and gets a plausible answer from the wrong specialist.'},
    {s:'ok',t:'API_SERVER_KEY is a remote-execution credential',d:'Holding it lets the holder run agent turns on that machine, with that machine tools and filesystem. The docs say "strong" for a reason. Reachability is deliberately left to your network — put peers behind Tailscale or a VPN rather than on an open port.'}
  ],
  quiz:[
    {q:'Name the four hermes peer subcommands and what each writes or reads.',a:'<code>add</code> registers a peer, writing the URL to <code>config.yaml</code> under <code>bot_peers</code> and the key to <code>~/.hermes/.env</code> as <code>HERMES_PEER_&lt;NAME&gt;_KEY</code>; <code>list</code> shows peers and whether each has a key; <code>dm</code> messages a peer agent canonical Bot Chat and prints the reply; <code>remove</code> deletes the registry entry and <b>leaves the .env key in place</b>.'},
    {q:'What exactly happens on the remote machine when you run hermes peer dm?',a:'It resolves that agent canonical Bot Chat session over the peer API server, <b>runs one agent turn there</b>, and prints the reply on stdout. It is the cross-machine twin of the local bot-messaging command — not a message drop.'},
    {q:'Distinguish "hermes peer dm spark" from "hermes peer dm spark/researcher".',a:'The bare peer name targets the peer gateway <b>main agent</b>. The <code>peer/agent</code> form targets a named profile on a multiplexed peer, routed via its <code>/p/&lt;profile&gt;/</code> mirror.'},
    {q:'What are the three hermes peer dm exit codes?',a:'<code>0</code> on success, <code>1</code> on delivery or peer failure, <code>2</code> on usage errors. These are what make it safe to script.'},
    {q:'How do your Bots find out that a peer exists, and when does that knowledge update?',a:'The Bot Mode messaging protocol governed by <code>agent.bot_mode_protocol</code> automatically includes the peer roster and the <code>hermes peer dm</code> pattern once a peer is registered, and <code>message_agent</code> accepts peer targets directly. Registering or removing a peer refreshes each Bot Chat protocol <b>on its next message</b> — a capability epoch, not an immediate push.'},
    {q:'What must the peer machine be running, and who is responsible for reachability?',a:'The <code>api_server</code> gateway platform with a strong <code>API_SERVER_KEY</code>. Reachability is explicitly your network business — LAN, Tailscale, or VPN. Hermes does not provide a tunnel.'}
  ],
  docs:[['hermes peer reference','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md'],
        ['Bot Mode: peer DMs','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md']]
},

/* ============================== 10 ============================== */
{
  id:'pA', n:'10', title:'The reliability wall', layer:'l6', layerLabel:'Durable',
  time:'1–2 h', pre:'Phases 06–09',
  objective:'You can state, for any piece of work, <b>whether Bot Mode messaging is sufficient or whether you have hit the wall</b> — before you build the thing that fails.',
  concepts:[
    {h:'Everything you have learned so far is best-effort',
     p:'<p>This phase adds no new commands. It is the phase where the previous four stop looking like a workflow engine.</p>',
     table:{head:['Property','@mention','message_agent','Group round','peer dm','Kanban'],rows:[
       ['Sender blocks for the result','Yes','<b>No</b>','n/a','Yes','No, by design'],
       ['Delivery guaranteed','No','No','No','Per-call','<b>Yes</b> — a row in SQLite'],
       ['Work guaranteed to start','No','<b>No</b>','Within caps','Yes, one turn','<b>Yes</b> — dispatcher claims it'],
       ['Automatic retry','No','No','No','No','<b>Yes</b> — block, unblock, re-run'],
       ['Survives a restart','No','No','No','No','<b>Yes</b>'],
       ['Human can intervene mid-flight','No','No','Via <code>@user</code>','No','<b>Yes</b> — comment, unblock'],
       ['Discoverable afterwards','Chat history','Chat history','Chat history','stdout','<b>Durable rows, forever</b>']]}},
    {h:'The three failure shapes you will actually hit',
     p:'<ol><li><b>The silent stall.</b> Bot A hands to Bot B; the handoff acknowledges; Bot B never runs; nothing errors. This is the dev.to failure, and it is not a bug — per-invocation delivery is the documented contract.</li><li><b>The lossy paraphrase.</b> Each hop composes its own message, so a four-hop chain is four rounds of summarisation. Detail decays with distance, and nothing measures the decay.</li><li><b>The capped conversation.</b> A room hits 3 rounds or 10 messages and stops mid-deliberation. It settles because it ran out, not because it converged, and the transcript looks the same either way.</li></ol>'},
    {h:'The distinction the docs draw themselves',
     p:'<p>Hermes documents a related pair, '+K('delegate_task')+' versus Kanban, and the comparison transfers almost exactly to Bot Mode messaging:</p>',
     table:{head:['','<code>delegate_task</code>','Kanban'],rows:[
       ['Shape','RPC call (fork &rarr; join)','Durable message queue + state machine'],
       ['Parent','Blocks until child returns','Fire-and-forget after <code>create</code>'],
       ['Child identity','Anonymous subagent','<b>Named profile with persistent memory</b>'],
       ['Resumability','None — failed = failed','Block &rarr; unblock &rarr; re-run; crash &rarr; reclaim'],
       ['Human in the loop','Not supported','Comment / unblock at any point'],
       ['Agents per task','One call = one subagent','N agents over the task life'],
       ['Audit trail','Lost on context compression','<b>Durable rows in SQLite forever</b>'],
       ['Coordination','Hierarchical (caller &rarr; callee)','Peer — any profile reads/writes any task']]},
     p2:'<p>The one-sentence version from the docs: <b>delegate_task is a function call; Kanban is a work queue where every handoff is a row any profile or human can see and edit.</b> Bot Mode messaging sits closer to the function call, minus the blocking.</p>'},
    {h:'When Bot Mode messaging is exactly right',
     p:'<p>Do not read this phase as "always use the board". Bot Mode messaging is the correct tool when the work is <b>conversational, cheap to redo, and observed by a human</b>: asking a specialist a question mid-chat, pulling a second opinion into a room, kicking a nightly digest to the Bot that owns it.</p><p>It is the wrong tool when the work <b>crosses agent boundaries unattended, must survive a restart, might need human input, might be retried, or has to be discoverable after the fact</b>. Those five conditions are the wall.</p>'}
  ],
  lab:{title:'Cost the failure before you build on it',
    steps:[
      'Take the three-Bot chain from Phase 06. Run it five times end to end with no intervention. Record how many completed unassisted.',
      'For each failure, write down the exact point it stopped and what, if anything, told you.',
      'Measure the paraphrase decay: put a specific numeric fact and a specific identifier in the first instruction, then check whether both survive to the third Bot. Run it three times.',
      'Time the whole chain wall-clock, from your instruction to the final output, including the invocation delays. Compare against doing it yourself in one chat.',
      'Price it: count total agent turns across all five runs, multiply by the pinned models. You now have a real number for what an unreliable chain costs.',
      '<b>Break it deliberately:</b> kill the desktop app halfway through a chain. Restart it. Confirm that nothing resumes, nothing retries, and nothing is queued anywhere you can inspect. Compare that to what you will build in Phase 11.',
      'Write one sentence, in your own words, describing the class of work you will <b>stop</b> putting through Bot Mode messaging.'],
    verify:'You have a completion rate out of five, a wall-clock number, a cost number, and a written boundary rule.'},
  gotchas:[
    {s:'trap',t:'A chain that works three times in a row is not reliable',d:'Per-invocation delivery means success depends on whether something happens to invoke the recipient. That is correlated with how actively you are using the app, so chains work beautifully while you watch them and stall overnight. The demo always passes.'},
    {s:'trap',t:'A capped room and a converged room produce identical transcripts',d:'A room settles when a full round stays silent <i>or</i> when it hits 3 rounds and 10 messages. There is no marker distinguishing "we agreed" from "we ran out". If you act on room output unattended, you will eventually act on a truncated deliberation.'},
    {s:'cost',t:'Retrying by hand is the hidden cost of no retry',d:'The absence of automatic retry does not remove the retry — it relocates it to you. Count the times you re-poked a chain when pricing this against a board.'},
    {s:'ok',t:'Conversational, cheap, observed: messaging. Unattended, durable, retryable, auditable: the board.',d:'This is the decision, and it is not close once you state it in those terms. The mistake is not choosing messaging; it is choosing messaging and then treating it as a pipeline.'}
  ],
  quiz:[
    {q:'Name the five conditions that mean work should be on a board rather than in Bot Mode messaging.',a:'The work crosses agent boundaries unattended; it must survive restarts; it might need human input; it might be retried or picked up by a different role; or it must be discoverable after the fact. Any one of those is the wall.'},
    {q:'Describe the three characteristic failure shapes of Bot Mode chains.',a:'The <b>silent stall</b> — a handoff acknowledges and the recipient never runs, because delivery is per-invocation. The <b>lossy paraphrase</b> — each hop composes its own message, so detail decays with hop count. The <b>capped conversation</b> — a room stops at 3 rounds or 10 messages mid-deliberation, and the transcript looks identical to one that converged.'},
    {q:'In the docs own comparison, what is the one-sentence difference between delegate_task and Kanban?',a:'<code>delegate_task</code> is a function call; Kanban is a work queue where every handoff is a row any profile or human can see and edit. Bot Mode messaging sits near the function call, minus the blocking.'},
    {q:'Which Bot Mode mechanism blocks the sender until a reply comes back?',a:'An <code>@mention</code> you type — the active Bot hands off, waits, and reports back — and <code>hermes peer dm</code>, which runs one remote turn and prints the reply. <code>message_agent</code> does not block; it acknowledges and the reply arrives later as a background completion notification.'},
    {q:'Why do Bot Mode chains pass demos and fail overnight?',a:'Because per-invocation delivery makes success depend on something invoking the recipient, and that correlates with a human actively using the app. Watched chains get invoked; unwatched ones sit.'}
  ],
  docs:[['Kanban vs delegate_task','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/kanban.md'],
        ['Bot Mode delivery note','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/bot-mode.md']]
},
/* ============================== 11 ============================== */
{
  id:'pB', n:'11', title:'The board', layer:'l6', layerLabel:'Durable',
  time:'3–4 h', pre:'Phase 10',
  objective:'You can stand up a Kanban board with a live dispatcher, route a task to a named Bot, and <b>diagnose why a task is not moving</b>.',
  concepts:[
    {h:'What the board is',
     p:'<p>Hermes Kanban is a durable task board <b>shared across all your Hermes profiles</b>, letting named agents collaborate without fragile in-process subagent swarms. Every task is a row in '+K('~/.hermes/kanban.db')+'; every handoff is a row anyone can read and write; every worker is <b>a full OS process with its own identity</b>.</p><p>Note what that buys you relative to Phase 10: the queue is inspectable, the state machine is explicit, and a crash is recoverable because the state was never in a context window.</p>'},
    {h:'Two front doors, one database',
     table:{head:['Who','Surface','Notes'],rows:[
       ['<b>Agents</b>','The <code>kanban_*</code> toolset','The dispatcher spawns each worker with these tools already in schema. The model calls tools, it does <b>not</b> shell out'],
       ['<b>You, scripts, cron</b>','<code>hermes kanban …</code>, <code>/kanban …</code>, the dashboard','For the places with no tool-calling model behind them']]},
     p2:'<p>Both surfaces route through the same '+K('kanban_db')+' layer, so reads see a consistent view and writes cannot drift.</p>'},
    {h:'Standing one up',
     code:C('# 1. Create the board.',
            'hermes kanban init',
            '',
            '# 2. Start the gateway. It hosts the embedded dispatcher.',
            'hermes gateway start',
            '',
            '# 3. Create a task assigned to one of your Bots.',
            'hermes kanban create "research AI funding landscape" --assignee researcher',
            '',
            '# 4. Watch it live.',
            'hermes kanban watch',
            '',
            '# 5. See the board.',
            'hermes kanban list',
            'hermes kanban stats'),
     p2:'<p>The '+K('--assignee')+' is a profile name. This is where Phase 01 insistence on descriptions pays off again: the orchestrator routes on profile descriptions, which you set at create time with '+K('hermes profile create &lt;name&gt; --description "&lt;role&gt;"')+' or later with '+K('hermes profile describe')+'.</p>'},
    {h:'The dispatcher lives in the gateway',
     code:C('# config.yaml',
            'kanban:',
            '  dispatch_in_gateway: true        # default',
            '  dispatch_interval_seconds: 60    # default',
            '  review_dispatch: true            # default: spawn the assigned profile',
            '                                   # with the bundled sdlc-review skill.',
            '                                   # Set false for human-only review boards.'),
     p2:'<p>Nothing to install, no separate service. If the gateway is up, ready tasks get picked up on the next tick. <b>Without a running gateway, ready tasks stay where they are</b> until one comes up — '+K('hermes kanban create')+' warns about this at creation time. Override at runtime with '+K('HERMES_KANBAN_DISPATCH_IN_GATEWAY=0')+' for debugging.</p><p>Running '+K('hermes kanban daemon')+' as a separate process is <b>deprecated</b>. A '+K('--force')+' escape hatch keeps the old standalone daemon alive for one release cycle, but running both a gateway-embedded dispatcher <b>and</b> a standalone daemon against the same '+K('kanban.db')+' causes <b>claim races</b> and is not supported.</p>'},
    {h:'Boards are plural',
     p:'<p>A single install can host many boards — one per project, repo, or domain. New installs start with '+K('default')+', whose DB is '+K('~/.hermes/kanban.db')+' for back-compat; additional boards live at '+K('~/.hermes/kanban/boards/&lt;slug&gt;/kanban.db')+'. The gateway-embedded dispatcher sweeps <b>every</b> board per tick.</p><p>Select a board with the global '+K('--board &lt;slug&gt;')+' flag, '+K('hermes kanban boards switch')+', or the '+K('HERMES_KANBAN_BOARD')+' environment variable. <b>Workers have HERMES_KANBAN_BOARD pinned in their env so they physically cannot see other boards.</b></p>'},
    {h:'Blocking, unblocking, and the loop breaker',
     p:'<p>Where an unblocked task lands is deterministic, and it is not where most people guess:</p>',
     table:{head:['Situation','Unblock routes to'],rows:[
       ['Reviewer-origin work, parents complete','<code>review</code>'],
       ['Implementation work, parents complete','<code>ready</code>'],
       ['Any parent still open','<code>todo</code> (returns automatically when the gate clears)'],
       ['Never','<code>triage</code>']]},
     p2:'<p>But a task <i>can</i> end up in '+K('triage')+', and this is the part worth memorising. After a task is blocked &rarr; unblocked &rarr; <b>re-blocked for the same reason</b> '+K('BLOCK_RECURRENCE_LIMIT')+' times (default '+K('2')+'), the unblock-loop breaker stops sending it back to blocked — where a cron would just keep unblocking it — and routes it to '+K('triage')+' for a human decision. This is a <b>deterministic DB guard, not an LLM judgment call</b>, and a task body text cannot opt out of it. The recurrence counter deliberately survives each unblock and <b>resets only on a successful complete</b>.</p>'},
    {h:'Automation-safe creation and bulk verbs',
     code:C('# Idempotent create: the same key returns the existing task id',
            '# instead of duplicating. Use this from webhooks and cron.',
            'hermes kanban create "nightly ops review" \\',
            '    --assignee ops \\',
            '    --idempotency-key "nightly-ops-$(date -u +%Y-%m-%d)" \\',
            '    --json',
            '',
            '# Every lifecycle verb takes multiple ids.',
            'hermes kanban complete t_abc t_def t_hij --result "batch wrap"',
            'hermes kanban archive  t_abc t_def t_hij',
            'hermes kanban unblock  t_abc t_def',
            'hermes kanban block    t_abc "need input" --ids t_def t_hij')}
  ],
  lab:{title:'Route real work through a board and starve it on purpose',
    steps:[
      'Run '+K('hermes kanban init')+' and '+K('hermes gateway start')+'. Confirm the dispatcher is live by creating a trivial task and watching it get claimed within one tick.',
      'Give one of your existing Bots a proper description via '+K('hermes profile describe')+' if it does not have one. Then create a real task assigned to it.',
      'Run '+K('hermes kanban watch')+' in one terminal while the worker runs. Watch the state transitions as rows, not as chat.',
      'Create a second board for a different project with a slug of your choosing. Confirm '+K('--board')+' scopes your commands and that the dispatcher sweeps both.',
      'Deliberately block a task with a reason, then unblock it. Confirm it landed in '+K('ready')+' or '+K('review')+' according to its origin, and not in '+K('triage')+'.',
      '<b>Break it deliberately, twice:</b> first, stop the gateway and create a task. Confirm it sits in '+K('ready')+' forever and note the warning that '+K('create')+' gave you. Restart the gateway and watch it get claimed. Second, block, unblock, and re-block the same task for the <b>same reason</b> three times. Watch it route itself to '+K('triage')+' without any model deciding that.',
      'Complete that task successfully and confirm the recurrence counter resets — block it once more and see that it goes to '+K('blocked')+', not straight to triage.'],
    verify:'You have a task you starved by stopping the gateway, and a task you drove into triage through the deterministic loop breaker rather than through anyone judgment.'},
  gotchas:[
    {s:'trap',t:'No gateway means ready tasks sit forever, quietly',d:'The dispatcher is embedded in the gateway process. With no gateway running, <code>ready</code> tasks stay exactly where they are — the board looks populated and healthy and nothing is being worked. <code>hermes kanban create</code> warns at creation time, which is the only signal you get, and it scrolls away.'},
    {s:'trap',t:'A task in triage was not put there by your unblock',d:'<code>unblock</code> never routes directly to <code>triage</code>; it restores <code>review</code>, <code>ready</code>, or <code>todo</code>. If a task you unblocked shows up in triage, a subsequent <b>re-block for the same reason</b> did it, via the recurrence limiter. Chasing the unblock is chasing the wrong event. Fix why it keeps re-blocking — unfinished parent, missing input, unmet capability.'},
    {s:'trap',t:'The recurrence counter survives unblocks and only resets on success',d:'Default <code>BLOCK_RECURRENCE_LIMIT</code> is 2. The counter deliberately persists across unblocks so a cron cannot launder a task around the guard, and it resets <b>only on a successful complete</b>. A task you have been nursing for a week is closer to triage than it looks.'},
    {s:'trap',t:'Two dispatchers on one kanban.db cause claim races',d:'Running the deprecated standalone <code>hermes kanban daemon</code> alongside the gateway-embedded dispatcher against the same DB is explicitly unsupported and produces claim races. The <code>--force</code> escape hatch keeps the daemon alive for one release cycle, which is exactly long enough for someone to leave both running.'},
    {s:'trap',t:'Workers physically cannot see other boards',d:'<code>HERMES_KANBAN_BOARD</code> is pinned in a worker environment. That is a safety property, not a bug — but it means an orchestrator on board A cannot fan out to board B, and the failure looks like a missing task rather than a scoping rule.'},
    {s:'ok',t:'Use --idempotency-key for anything a webhook or cron can fire twice',d:'The first call creates; subsequent calls with the same key return the existing task id instead of duplicating. A date-stamped key is the standard shape: <code>--idempotency-key "nightly-ops-$(date -u +%Y-%m-%d)"</code>.'}
  ],
  quiz:[
    {q:'Where does the Kanban dispatcher run by default, what is its tick interval, and what happens without it?',a:'Inside the gateway process, with <code>kanban.dispatch_in_gateway: true</code> and <code>dispatch_interval_seconds: 60</code> by default. Without a running gateway, <code>ready</code> tasks stay put indefinitely; <code>hermes kanban create</code> warns at creation time.'},
    {q:'Name the three places an unblocked task can land, and the one it never lands in.',a:'<code>review</code> for reviewer-origin work whose parents are complete; <code>ready</code> for implementation work whose parents are complete; <code>todo</code> while any parent remains open, returning automatically when the gate clears. It <b>never</b> routes directly to <code>triage</code>.'},
    {q:'Explain the unblock-loop breaker precisely.',a:'After a task is blocked, unblocked, and re-blocked <b>for the same reason</b> <code>BLOCK_RECURRENCE_LIMIT</code> times (default 2), it is routed to <code>triage</code> for a human decision instead of back to <code>blocked</code>. It is a deterministic DB guard, not an LLM judgment; task body text cannot opt out; the counter survives unblocks and resets only on a successful complete.'},
    {q:'Where do board databases live, and how does a worker get scoped to one?',a:'The <code>default</code> board is <code>~/.hermes/kanban.db</code>; additional boards are at <code>~/.hermes/kanban/boards/&lt;slug&gt;/kanban.db</code>. Workers have <code>HERMES_KANBAN_BOARD</code> pinned in their environment so they physically cannot see other boards. You select a board with <code>--board &lt;slug&gt;</code>, <code>hermes kanban boards switch</code>, or the same env var.'},
    {q:'What is unsupported about running hermes kanban daemon today?',a:'It is deprecated in favour of the gateway-embedded dispatcher. A <code>--force</code> escape hatch keeps it alive for one release cycle, but running both it and the gateway dispatcher against the same <code>kanban.db</code> causes claim races and is not supported.'},
    {q:'What does --idempotency-key do and when do you need it?',a:'The first call creates the task; any subsequent call with the same key returns the existing task id instead of duplicating. Use it for anything a webhook, cron, or retry can fire more than once — typically with a date-stamped key.'}
  ],
  docs:[['Kanban (primary)','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/kanban.md'],
        ['hermes kanban CLI','https://github.com/NousResearch/hermes-agent/blob/main/website/docs/reference/cli-commands.md']]

  concepts:[
    {h:'How a Bot becomes a worker',
     p:'<p>When the dispatcher spawns a worker it sets '+K('HERMES_KANBAN_TASK=t_abcd')+' in the child environment, and <b>that environment variable flips on a dedicated kanban toolset in the model schema</b>. The same toolset is available to orchestrator profiles that enable '+K('kanban')+' in their toolsets config.</p><p>The consequence worth internalising: <b>a regular hermes chat session has zero kanban_* tools in its schema</b> unless the active profile explicitly enables the kanban toolset. No tool bloat for people who never touch the board.</p>'},
    {h:'The toolset',
     table:{head:['Tool','Purpose'],rows:[

       ['<code>kanban_request_review</code>','Start same-card review with a durable summary and optional reviewer profile. Moves the task to <code>review</code>. <b>Not a block</b>'],
       ['<code>kanban_request_changes</code>','Reviewer verdict. Closes the run, reapplies parent gating, routes to the original implementer <b>without block-loop accounting</b>'],
       ['<code>kanban_block</code>','Stop and route by cause: <code>dependency</code> waits in <code>todo</code> and auto-resumes; <code>needs_input</code>, <code>capability</code>, <code>transient</code> surface to a human'],
       ['<code>kanban_heartbeat</code>','Signal liveness during long operations. Pure side effect'],

       ['<code>kanban_create</code> / <code>kanban_link</code> / <code>kanban_unblock</code>','Orchestrator surface: fan out, add a <code>parent &rarr; child</code> edge after the fact, restore a blocked task']]}},
    {h:'Why tools and not the CLI',
     p:'<p>The docs give three reasons, and the first will bite you if you ignore it:</p><ol><li><b>Backend portability.</b> A worker whose terminal tool points at Docker, Modal, Singularity, or SSH would run '+K('hermes kanban complete')+' <i>inside the container</i> — where '+K('hermes')+' is not installed and '+K('~/.hermes/kanban.db')+' is not mounted. The tools run in the agent own Python process and always reach the real DB.</li><li><b>No shell-quoting fragility.</b> Passing '+K('--metadata')+' JSON through shlex and argparse is a latent footgun; structured tool args skip it.</li><li><b>Better errors.</b> Tool results are structured JSON the model can reason about, not stderr strings it has to parse.</li></ol>'},
    {h:'The lifecycle is injected, not configured',
     p:'<p>Every profile that works kanban tasks automatically gets the worker lifecycle: it is injected into the worker system prompt at spawn as the '+K('KANBAN_GUIDANCE')+' block. <b>There is nothing to install or configure.</b> A typical worker turn:</p>',

            'kanban_complete(summary="decomposed into 2 research tasks + 1 writer; linked deps")'),
     p2:'<p>The '+K('parents')+' array is the dependency gate: the child promotes to '+K('ready')+' when every parent completes. The convention — encoded in the injected guidance — is that worker profiles do not fan out or route unrelated work, and orchestrator profiles do not execute implementation work. Dispatcher-spawned workers remain task-scoped for destructive lifecycle operations and cannot mutate unrelated tasks.</p>'},
    {h:'Handoff evidence: the four questions',
     p:'<p>'+K('kanban_complete(summary=..., metadata={...})')+' is deliberately flexible: the summary is the human-readable closeout, and '+K('metadata')+' is the machine-readable handoff downstream agents, reviewers, and dashboards reuse without scraping prose. The documented convention:</p>',

  lab:{title:'Run a fan-out with real evidence, then poison a handoff',
    steps:[

      'Second break: point a worker terminal tool at a container backend and instruct it to run '+K('hermes kanban complete')+' in the shell instead of calling the tool. Watch it fail because <code>hermes</code> is not in the container and the DB is not mounted.'],

    {s:'trap',t:'Secrets in metadata are durable SQLite rows any profile can read',d:'The board is shared across all your profiles and the rows last forever. The docs say to keep secrets, raw logs, tokens, OAuth material, and unrelated transcripts out of metadata, and to store pointers instead. Nothing enforces it, nothing scans it, and there is no redaction pass.'},
    {s:'trap',t:'A worker that shells out to hermes kanban fails on remote backends',d:'With a Docker, Modal, Singularity, or SSH terminal backend, <code>hermes kanban complete</code> runs inside the container where <code>hermes</code> is not installed and <code>~/.hermes/kanban.db</code> is not mounted. The kanban tools run in the agent own Python process and always reach the real DB. This is why the toolset exists.'},
    {s:'trap',t:'Enabling the kanban toolset on the wrong profile widens its surface permanently',d:'The orchestrator routing tools — <code>kanban_list</code>, <code>kanban_create</code>, <code>kanban_link</code>, <code>kanban_unblock</code>, and commenting on foreign tasks — come with the toolset. Dispatcher-spawned workers are task-scoped for destructive operations, but a profile you gave the toolset to by hand is not a dispatcher-spawned worker. The separation of worker and orchestrator is a <i>convention</i> in the injected guidance, not an enforcement boundary.'},
    {s:'cost',t:'A fan-out multiplies your model bill by the fan width, immediately',d:'Three children means three full agent processes, each with its own context and its own model pin. This is exactly where the frontier-orchestrator, inexpensive-workers strategy stops being a nicety.'},
    {s:'ok',t:'kanban_heartbeat is free insurance on long work',d:'A pure side-effect liveness signal. A worker doing a twenty-minute operation with no heartbeat is indistinguishable from a stalled one; one line of tool call makes the difference visible on the board.'}

  quiz:[
    {q:'What single mechanism turns a normal profile into a board worker with kanban tools?',a:'The dispatcher sets <code>HERMES_KANBAN_TASK=t_abcd</code> in the spawned child environment, and that env var flips on the dedicated kanban toolset in the model schema. Orchestrator profiles can alternatively enable the <code>kanban</code> toolset in config. A regular chat session has zero <code>kanban_*</code> tools.'},
    {q:'Give the three documented reasons workers call tools instead of shelling out to hermes kanban.',a:'Backend portability — a worker on a Docker, Modal, Singularity or SSH terminal backend would run the CLI inside a container with no hermes and no mounted DB. No shell-quoting fragility — structured tool args skip shlex and argparse. Better errors — structured JSON the model can reason about, not stderr strings.'},
    {q:'Distinguish kanban_block, kanban_request_review, and kanban_request_changes.',a:'<code>kanban_block</code> stops work and routes by cause: <code>dependency</code> waits in <code>todo</code> and auto-resumes, while <code>needs_input</code>, <code>capability</code> and <code>transient</code> surface to a human; repeated same-kind re-blocks escalate to triage. <code>kanban_request_review</code> moves the task to <code>review</code> and is explicitly <b>not</b> a block. <code>kanban_request_changes</code> is the reviewer verdict: it closes the run, reapplies parent gating, and routes to the original implementer <b>without block-loop accounting</b>.'},
    {q:'Name the six recommended metadata keys and the four questions they exist to answer.',a:'<code>changed_files</code>, <code>verification</code>, <code>dependencies</code>, <code>blocked_reason</code>, <code>retry_notes</code>, <code>residual_risk</code>. They exist so the next reader can quickly answer: what changed, how was it verified, what can unblock or retry this, and what risk is still deliberately open. They are a convention, not a schema.'},
    {q:'How does an orchestrator make one task wait for two others?',a:'By passing <code>parents=["t_r1", "t_r2"]</code> to <code>kanban_create</code>. The child promotes to <code>ready</code> when both parents complete. <code>kanban_link(parent_id, child_id)</code> adds the same edge after the fact.'},
    {q:'What is the attachment size cap and what should never go in metadata?',a:'25 MB for an inline base64 attachment via <code>kanban_attach</code>. Secrets, raw logs, tokens, OAuth material, and unrelated transcripts should stay out of metadata — store pointers and summaries instead, because the rows are durable and readable by every profile on the board.'}

{

  time:'Half a day', pre:'All phases',
  objective:'You assemble one real fleet that does real work unattended, and you can <b>state exactly where this path stops and what lies past the edge</b>.',
  concepts:[
    {h:'The five invariants, restated with teeth',
     p:'<ol><li><b>A Bot is a profile.</b> Every question about what a Bot can see, cost, or corrupt is answered under <code>~/.hermes/profiles/&lt;name&gt;/</code>. One process per profile, always.</li><li><b>Descriptions are routing infrastructure.</b> They feed the teammate roster in every Bot Chat and the kanban orchestrator. A vague description degrades every routing decision in the fleet, silently.</li><li><b>Messaging is best-effort; the board is durable.</b> Conversational, cheap, observed &rarr; messaging. Unattended, restart-surviving, retryable, auditable &rarr; the board. Never treat a handoff chain as a pipeline.</li><li><b>Every cap is a silent stop.</b> 3 rounds, 10 messages, 90 seconds, 200 sessions, <code>BLOCK_RECURRENCE_LIMIT</code> 2, a 60-second tick. None of them announce themselves; all of them change outcomes.</li><li><b>The roster is a view, not a health check.</b> Unreachable machines keep their rows, hidden Bots keep running, and a fallen-back cron provider keeps ticking. Verify state from the shell.</li></ol>'},
    {h:'The ship checklist',
     table:{head:['#','Check','Command or place'],rows:[
       ['1','Every Bot has a description another Bot could route on','<code>hermes profile list</code>, then <code>hermes profile show &lt;name&gt;</code>'],
       ['2','No two processes share a profile','One agent process per home, always'],
       ['3','Model pins are deliberate in both directions','Edit Profile &rarr; Advanced, per Bot'],
       ['4','Every specialist was built by subtraction','<code>hermes prompt-size</code> per profile'],
       ['5','Routines you rely on are not on a hidden Bot you forgot','<code>hermes -p &lt;bot&gt; cron list</code>, per Bot'],
       ['6','<code>cron.provider</code> is spelled correctly and reachable','<code>hermes config</code>; confirm the provider actually ran'],
       ['7','No orphaned <code>HERMES_PEER_*_KEY</code> entries','<code>grep HERMES_PEER ~/.hermes/.env</code>'],
       ['8','Unattended work is on a board, not in a chain','<code>hermes kanban list</code>'],
       ['9','The gateway is supervised, because the dispatcher lives in it','systemd user unit, or equivalent'],
       ['10','Handoff metadata answers the four questions','Read three recent completed cards'],
       ['11','No secrets in kanban metadata','Read three recent completed cards again, adversarially'],
       ['12','Someone else can run the fleet from your notes','Hand it over cold and watch']]}},
    {h:'What this path deliberately does not cover',
     p:'<p>A curriculum that covers everything covers nothing. This one stops at <b>a multi-machine Bot fleet with durable board orchestration</b>. Past that edge, each with its own documentation:</p>',
     table:{head:['Excluded','Where it lives'],rows:[
       ['Messaging gateway platforms: Telegram, Discord, Slack, WhatsApp, Signal','<code>user-guide/messaging-gateway</code>, <code>hermes slack</code>, <code>hermes whatsapp</code>, <code>hermes send</code>'],

    {h:'The transfer test',
     p:'<p>The real test of this material is not whether you can recite the caps. It is whether, handed a <i>different</i> multi-agent system — a different framework, a different company internal tool — you immediately ask the right five questions: <b>What is the isolation unit? How does one agent discover another? Is delivery guaranteed or best-effort? What survives a restart? Which limits are silent?</b></p><p>Those five questions are the actual curriculum. Bot Mode is the worked example.</p>'}
  ],
  lab:{title:'Ship one fleet that runs without you for a week',
    steps:[
      'Pick one recurring piece of real work that currently costs you an hour a week and involves at least two distinct skills.',
      'Design the fleet on paper first: which Bots, which descriptions, which model pins, which work is messaging and which is board.',
      'Build it. Every specialist by subtraction, every description written for a machine reader, every unattended step on a board.',

    {s:'cost',t:'Fleet size is a recurring bill, not a one-time build',d:'Every Bot with a routine bills on a schedule; every room message is up to ten turns; every fan-out multiplies. The Phase 10 cost measurement is the number to revisit quarterly, not once.'},
    {s:'ok',t:'The five transfer questions outlive this tool',d:'What is the isolation unit; how does discovery work; is delivery guaranteed; what survives a restart; which limits are silent. Ask them of any agent system and you will find its Bot Mode-shaped problems in an afternoon.'}

  quiz:[
    {q:'State the five invariants of this curriculum.',a:'One: a Bot is a profile, and one process per profile always. Two: descriptions are routing infrastructure for both the teammate roster and the kanban orchestrator. Three: messaging is best-effort and the board is durable — conversational and observed versus unattended and auditable. Four: every cap is a silent stop. Five: the roster is a view, not a health check.'},
    {q:'Name the five transfer questions to ask of any multi-agent system.',a:'What is the isolation unit? How does one agent discover another? Is delivery guaranteed or best-effort? What survives a restart? Which limits are silent?'},
    {q:'List the silent numeric limits you have to hold in your head across Bot Mode and Kanban.',a:'90 seconds for the Active-now window; 2 to 6 Bots per room; 3 serial rounds and 10 messages per room send; 200 conversations in the Sessions view; a 60-second default dispatcher tick; <code>BLOCK_RECURRENCE_LIMIT</code> of 2; a 25 MB attachment cap; 7 shapes by 10 colors and 6 blob silhouettes for avatars.'},
    {q:'What is deliberately out of scope in this path, in one breath?',a:'Messaging gateway platforms (Telegram, Discord, Slack, WhatsApp, Signal), Voice Mode, authoring MCP servers, external memory providers, the Kanban dashboard plugin and its REST surface, kanban swarm topology and multi-tenant boards, Hermes Cloud provisioning, <code>hermes computer-use</code>, <code>moa</code>, <code>curator</code> and <code>claw</code>, and sandboxing of agent execution.'},

  ],
