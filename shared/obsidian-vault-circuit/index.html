<style>
/* =====================================================================
   TOKENS — light palette lives on the bare :root, redefined for the
   two dark states below. Obsidian the mineral: violet-cast neutrals,
   a violet sheen for structure, mahogany for signal.
   ===================================================================== */
:root{
  /* grounds — obsidian glass: violet-cast neutrals, never a flat grey */
  --bg:#EDEBF1; --paper:#F8F7FB; --raise:#FFFFFF;
  --ink:#141220; --body:#2B2739; --muted:#5F5A74; --faint:#8B85A2;
  --line:#D9D5E3; --line-2:#C1BCD0;
  /* structural accent — the violet sheen of polished obsidian */
  --accent:#5A3FBF; --accent-soft:#E8E3F9; --accent-ink:#43309B;
  /* signal — mahogany obsidian, the one loud thing */
  --signal:#B4471F; --signal-soft:#F8E5DC;
  --ok:#2F7350; --ok-soft:#DEEEE5;
  --warn:#8A6508; --warn-soft:#F5EAD2;
  --stop:#9B2233; --stop-soft:#F7DFE3;
  --code-bg:#151221; --code-ink:#DBD6E8; --code-line:#2A2440;
  --shadow:0 1px 2px rgba(20,18,32,.05), 0 8px 24px -12px rgba(20,18,32,.16);
  --rail:264px;
  --f-disp:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --f-body:'Newsreader','Iowan Old Style',Georgia,serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E0B16; --paper:#161222; --raise:#1D1830;
    --ink:#EAE6F4; --body:#C9C3DA; --muted:#948CAE; --faint:#6F6889;
    --line:#292240; --line-2:#392F55;
    --accent:#A48BFF; --accent-soft:#241B45; --accent-ink:#C3B2FF;
    --signal:#EE8155; --signal-soft:#3B1E14;
    --ok:#63BE8C; --ok-soft:#15281F;
    --warn:#DCAE4E; --warn-soft:#2F2513;
    --stop:#E8798C; --stop-soft:#37161F;
    --code-bg:#08060F; --code-ink:#CFC9DE; --code-line:#221C36;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
--bg:#0E0B16; --paper:#161222; --raise:#1D1830;
  --ink:#EAE6F4; --body:#C9C3DA; --muted:#948CAE; --faint:#6F6889;
  --line:#292240; --line-2:#392F55;
  --accent:#A48BFF; --accent-soft:#241B45; --accent-ink:#C3B2FF;
  --signal:#EE8155; --signal-soft:#3B1E14;
  --ok:#63BE8C; --ok-soft:#15281F;
  --warn:#DCAE4E; --warn-soft:#2F2513;
  --stop:#E8798C; --stop-soft:#37161F;
  --code-bg:#08060F; --code-ink:#CFC9DE; --code-line:#221C36;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); color:var(--ink); text-wrap:balance; margin:0; letter-spacing:-.015em}
a{color:var(--accent-ink); text-underline-offset:3px}
code,kbd{font-family:var(--f-mono); font-size:.855em}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:9px 18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--f-disp); font-weight:700;
  font-size:15px; color:var(--ink); letter-spacing:-.02em; white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--signal);display:inline-block;transform:translateY(-1px)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.modes{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:2px}
.modes button{
  font-family:var(--f-disp); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  border:0; background:transparent; color:var(--muted); padding:5px 11px; border-radius:5px; cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{flex:1}
#q{
  font-family:var(--f-mono); font-size:12.5px; padding:6px 10px; width:min(300px,42vw);
  border:1px solid var(--line-2); border-radius:7px; background:var(--raise); color:var(--ink);
}
#q::placeholder{color:var(--faint)}
.iconbtn{border:1px solid var(--line-2); background:var(--raise); color:var(--muted); border-radius:7px;
  padding:5px 9px; cursor:pointer; font-family:var(--f-mono); font-size:12px}
.iconbtn:hover{color:var(--ink); border-color:var(--accent)}

.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:1fr} }

/* ---------- rail ---------- */
.rail{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--paper); padding:16px 12px 40px;
}
@media (max-width:900px){
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; scrollbar-width:thin}
  .railhead,.legend{display:none}
}
.railhead{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 8px}
.pnav{display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .pnav{flex-direction:row; gap:6px} }
.pnav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  text-decoration:none; color:var(--body); font-family:var(--f-disp); font-size:13.5px;
  font-weight:500; line-height:1.25; border:1px solid transparent; white-space:nowrap;
}
.pnav a:hover{background:var(--bg)}
.pnav a.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.pnav .n{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); width:16px; flex:none}
.pnav a.on .n{color:var(--accent)}
.pnav .tick{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-left:auto;
  display:grid;place-items:center;font-size:8px;color:transparent}
.pnav .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pnav .tick.part{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}

.legend{margin-top:22px; padding:11px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg)}
.legend h4{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin-bottom:8px}
.legend .row{display:flex; align-items:center; gap:8px; font-size:12px; font-family:var(--f-disp); padding:2.5px 0; color:var(--muted)}
.swatch{width:16px;height:4px;border-radius:2px;flex:none}

/* ---------- main ---------- */
main{padding:28px 30px 96px; max-width:1080px; min-width:0}
@media (max-width:640px){ main{padding:22px 16px 72px} }
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--signal)}
.ptitle{font-size:clamp(28px,4.4vw,40px); font-weight:700; line-height:1.06; margin:7px 0 0}
.meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px}
.chip{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; padding:3px 8px; border-radius:20px;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper); text-transform:uppercase}
.chip.l1{background:var(--bg);border-color:var(--line-2);color:var(--muted)}
.chip.l2{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.l3{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.l4{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.chip.l5{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.objective{
  margin:24px 0 0; padding:16px 18px; border-left:3px solid var(--signal);
  background:var(--paper); border-radius:0 9px 9px 0; font-size:17.5px; line-height:1.5; color:var(--ink);
}
.objective b{font-weight:600}

h2.sec{
  font-size:12px; font-family:var(--f-mono); font-weight:500; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); margin:42px 0 0; padding-bottom:7px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px;
}
h2.sec .cnt{color:var(--line-2); font-size:11px}

.concept{padding:19px 0; border-bottom:1px solid var(--line)}
.concept:last-child{border-bottom:0}
.concept h3{font-size:18.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.01em}
.concept p{margin:0 0 9px; max-width:66ch}
.concept p:last-child{margin-bottom:0}
.concept ul{margin:9px 0; padding-left:19px; max-width:66ch}
.concept li{margin:4px 0}
.concept .k{font-family:var(--f-mono); font-size:.85em; background:var(--accent-soft); color:var(--accent-ink);
  padding:1px 5px; border-radius:4px; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}

pre{
  margin:12px 0; background:var(--code-bg); color:var(--code-ink); border:1px solid var(--code-line);
  border-radius:9px; padding:13px 15px; overflow-x:auto; font-family:var(--f-mono);
  font-size:12.6px; line-height:1.65; position:relative;
}
pre code{font-size:inherit; color:inherit; background:none}
.codewrap{position:relative}
.copy{position:absolute; top:8px; right:8px; z-index:2; font-family:var(--f-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:5px; cursor:pointer;
  background:rgba(255,255,255,.07); color:#9FB5B0; border:1px solid rgba(255,255,255,.13)}
.copy:hover{background:rgba(255,255,255,.15); color:#fff}
.copy.done{background:var(--ok); color:#fff; border-color:var(--ok)}
.cap{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin:-4px 0 0}

.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
table{border-collapse:collapse; width:100%; font-family:var(--f-disp); font-size:13.4px; min-width:480px}
th{text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; padding:9px 13px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
td code{background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--line)}
td.num{font-variant-numeric:tabular-nums}

.gotcha{display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; padding:13px 0; border-bottom:1px solid var(--line)}
.gotcha:last-child{border-bottom:0}
.sev{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; height:fit-content; white-space:nowrap; margin-top:2px}
.sev.trap{background:var(--stop-soft); color:var(--stop)}
.sev.cost{background:var(--warn-soft); color:var(--warn)}
.sev.stale{background:var(--signal-soft); color:var(--signal)}
.sev.ok{background:var(--ok-soft); color:var(--ok)}
.gotcha b{font-family:var(--f-disp); font-weight:600; color:var(--ink); display:block; font-size:14.5px; margin-bottom:2px}
.gotcha span{font-size:15px}

.lab{margin:14px 0 0; padding:18px 20px; border:1px solid var(--accent); border-radius:11px;
  background:var(--accent-soft)}
.lab h3{font-size:17px; margin-bottom:4px; color:var(--accent-ink)}
.lab ol{margin:11px 0 0; padding-left:20px}
.lab li{margin:6px 0}
.lab .pre-in-lab pre{background:var(--code-bg)}
.done-line{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:14px; border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.done-line label{font-family:var(--f-disp); font-size:14px; font-weight:600; color:var(--accent-ink); cursor:pointer;
  display:flex; align-items:center; gap:8px}
.done-line input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

details.qa{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:var(--paper); overflow:hidden}
details.qa summary{padding:11px 15px; cursor:pointer; font-family:var(--f-disp); font-weight:600; font-size:14.5px;
  color:var(--ink); list-style:none; display:flex; gap:9px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:'?'; font-family:var(--f-mono); color:var(--signal); font-size:12px; flex:none}
details.qa[open] summary::before{content:'!'}
details.qa .ans{padding:0 15px 13px 33px; font-size:15px; color:var(--body); border-top:1px solid var(--line); padding-top:11px}

.tree{margin:14px 0; display:flex; flex-direction:column; gap:0}
.branch{display:grid; grid-template-columns:minmax(140px,.9fr) auto minmax(0,1.4fr); gap:12px; align-items:center;
  padding:11px 14px; border:1px solid var(--line); border-top:0; background:var(--paper)}
.branch:first-child{border-top:1px solid var(--line); border-radius:9px 9px 0 0}
.branch:last-child{border-radius:0 0 9px 9px}
.branch .cond{font-family:var(--f-body); font-size:14.5px; color:var(--body)}
.branch .arr{font-family:var(--f-mono); color:var(--line-2); font-size:13px}
.branch .res{font-family:var(--f-disp); font-weight:600; font-size:14px; color:var(--ink)}
.branch .res em{display:block; font-family:var(--f-body); font-weight:400; font-style:normal; font-size:13.5px; color:var(--muted)}
@media (max-width:640px){ .branch{grid-template-columns:1fr; gap:5px} .branch .arr{display:none} }

.docs{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.docs a{font-family:var(--f-mono); font-size:11.5px; padding:4px 10px; border-radius:20px; text-decoration:none;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper)}
.docs a:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}

/* progress header */
.prog{margin:0 0 26px; padding:15px 18px; border:1px solid var(--line); border-radius:11px; background:var(--paper)}
.prog .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.prog .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.prog .pct{font-family:var(--f-disp); font-size:26px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.bar{display:flex; gap:3px; margin-top:11px}
.bar i{height:7px; flex:1; border-radius:2px; background:var(--line); transition:background .25s}
.bar i.done{background:var(--ok)}
.bar i.part{background:var(--signal)}

/* reference / drill / audit */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:14px 0}
.card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--paper)}
.card h4{font-size:15px; font-weight:600; margin-bottom:5px}
.card p{margin:0; font-size:14.5px; color:var(--muted)}

#drill .flash{
  border:1px solid var(--line-2); border-radius:14px; background:var(--paper); padding:34px 30px;
  min-height:220px; display:flex; flex-direction:column; justify-content:center; gap:16px; box-shadow:var(--shadow);
}
#drill .fq{font-family:var(--f-disp); font-size:clamp(19px,2.6vw,25px); font-weight:600; color:var(--ink); line-height:1.3}
#drill .fa{font-size:16.5px; color:var(--body); border-top:1px solid var(--line); padding-top:15px}
#drill .fa.hide{display:none}
#drill .fsrc{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
#drill .fbtns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font-family:var(--f-disp); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink)}
.btn.prime{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.prime:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--accent)}
.counter{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); align-self:center; margin-left:auto}

.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; padding:15px 0; border-bottom:1px solid var(--line)}
.verdict:last-child{border-bottom:0}
.vtag{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:4px 8px;
  border-radius:5px; height:fit-content; white-space:nowrap; margin-top:2px; font-weight:700}
.vtag.holds{background:var(--ok-soft); color:var(--ok)}
.vtag.stale{background:var(--warn-soft); color:var(--warn)}
.vtag.wrong{background:var(--stop-soft); color:var(--stop)}
.vtag.gap{background:var(--signal-soft); color:var(--signal)}
.vtag.unver{background:var(--bg); color:var(--muted); border:1px solid var(--line-2)}
.verdict .claim{font-family:var(--f-disp); font-weight:600; font-size:15px; color:var(--ink); margin-bottom:4px}
.verdict .fix{font-size:15px}

.hits{margin-top:6px}
.hit{display:block; padding:11px 14px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px;
  background:var(--paper); text-decoration:none; color:var(--body)}
.hit:hover{border-color:var(--accent); background:var(--accent-soft)}
.hit b{display:block; font-family:var(--f-disp); color:var(--ink); font-size:14.5px}
.hit small{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.empty{color:var(--muted); font-style:italic; padding:20px 0}
.lede{font-size:17.5px; max-width:66ch; color:var(--body); margin:14px 0 0}
.hr{height:1px;background:var(--line);margin:38px 0 0;border:0}
.unv{font-family:var(--f-mono);font-size:.86em;color:var(--muted);background:var(--bg);
  border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px;white-space:normal}
kbd{background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-size:.82em;color:var(--muted)}
.lede a{color:var(--accent-ink)}
.verdict .claim{display:block}
#view > h3{margin-top:28px; font-size:19px}


</style>
</head>
<body>

<!-- ============================ SHELL ============================
     Structural. Carries over unchanged between sites; SITE fills it in.
     ============================================================== -->
<div class="topbar">
  <div class="brand"><span class="dot"></span><span id="brandname"></span><small id="brandtag"></small></div>
  <div class="modes" role="group" aria-label="View">
    <button data-mode="learn" aria-pressed="true">Path</button>
    <button data-mode="ref" aria-pressed="false">Reference</button>
    <button data-mode="drill" aria-pressed="false">Drill</button>
    <button data-mode="audit" aria-pressed="false">Audit</button>
  </div>
  <div class="spacer"></div>
  <input id="q" type="search" placeholder="search &middot; / to focus" autocomplete="off">
  <button class="iconbtn" id="theme" title="Toggle theme">&#9686;</button>
  <button class="iconbtn" id="reset" title="Reset progress">reset</button>
</div>

<div class="shell">
  <nav class="rail">
    <div class="railhead">Phases</div>
    <div class="pnav" id="pnav"></div>
    <div class="legend" id="legend"></div>
  </nav>
  <main id="view"></main>
</div>


<script>
const SITE = {
  key:   'vault-circuit',

const C = (...l) => l.join('\n');
const K = s => '<code class="k">' + s + '</code>';

const PHASES = [

{
  id:'p0', n:'00', title:'Read the vault', layer:'l1', layerLabel:'Substrate',
  time:'45 min', pre:'None',
  objective:'You can state <b>what is actually on disk, how much of it, and which parts are unreachable</b> — before any model gets near it. Every later phase measures against these numbers.',
  concepts:[
    {h:'A vault is a folder. That is the entire trick.',
     p:'<p>Obsidian opens a directory. Inside it are Markdown files, attachments, and a '+K('.obsidian/')+' folder holding configuration, plugin data, and workspace layout. There is no database, no proprietary container, and no hidden index that outranks the files. Every tool you connect later — ripgrep, a Python indexer, an MCP server, Claude Code — sees exactly what you see in a file browser.</p><p>This matters because it fixes the arbitration rule for the whole curriculum: <b>when a derived thing disagrees with a note, the note wins.</b></p>'},
    {h:'Source of truth versus derived artifact',
     p:'<p>Sort everything in and around the vault into two buckets on day one. The distinction decides what you back up, what you rebuild, and what you are allowed to delete when something goes wrong.</p>',
     table:{head:['Artifact','Bucket','When it disagrees with a note'],rows:[
       ['<code>.md</code> notes','<b>Source</b>','It is right by definition'],
       ['Attachments (images, PDFs, audio)','<b>Source</b>','Right, if the link resolves'],
       ['<code>.base</code> and <code>.canvas</code> files','<b>Source</b>','Right — they are plaintext too'],
       ['<code>.obsidian/</code> config and plugin data','Derived-ish','Config is source; caches inside it are not'],
       ['Obsidian search index','Derived','Rebuild it'],
       ['Embedding store / vector DB','Derived','Reindex from the notes'],
       ['An AI summary you never reviewed','Derived','Delete it, do not reconcile it']]}},
    {h:'Measure it from the shell first',
     p:'<p>Run these against a copy, not the live vault, if your vault lives in a sync folder. The numbers are the baseline you will quote for the rest of the path.</p>',
     code:C('cd /absolute/path/to/vault',
            '',
            '# 1. how many notes',
            'find . -name "*.md" -not -path "./.obsidian/*" | wc -l',
            '',
            '# 2. median note length in words',
            'find . -name "*.md" -not -path "./.obsidian/*" -exec wc -w {} + \\',
            '  | awk \'{print $1}\' | sort -n | awk \'{a[NR]=$1} END{print a[int(NR/2)]}\'',
            '',
            '# 3. how many notes carry frontmatter at all',
            'grep -rl --include="*.md" --exclude-dir=.obsidian -m1 "^---$" . | wc -l',
            '',
            '# 4. anything that looks like a credential, before you index',
            'grep -rEn --include="*.md" --exclude-dir=.obsidian \\',
            '  "(api[_-]?key|secret|bearer |sk-[A-Za-z0-9]{20,})" . | head -40')},
    {h:'Then measure it from inside Obsidian',
     p:'<p>Obsidian ships a command line interface from <b>1.12.7</b> onward. Enable it under Settings &rarr; General &rarr; <i>Command line interface</i> and follow the registration prompt. It reports on link topology, which the shell cannot see.</p>',
     code:C('obsidian orphans      # notes nothing links to',
            'obsidian deadends     # notes that link to nothing',
            'obsidian unresolved   # links pointing at notes that do not exist',
            'obsidian wordcount',
            'obsidian tags'),
     p2:'<p>The CLI drives the running app. If Obsidian is not open, the first command launches it. For sync without a desktop app, the separate <b>Obsidian Headless</b> client is the tool, not the CLI.</p>'},
    {h:'Desktop and mobile are different release trains',
     p:'<p>Any guide that names one version number is naming half the answer. The two platforms ship on their own cadence, and a mobile-only patch can leave your phone ahead of your laptop.</p>',
     table:{head:['Platform','Version','Released'],rows:[
       ['Desktop','<b>1.13.7</b>','12 Aug 2026'],
       ['Mobile','<b>1.13.8</b>','20 Aug 2026'],
       ['1.13 line first public','1.13.4','30 Jul 2026']]},
     p2:'<p class="cap">Read from the official changelog on 21 Aug 2026. This is the most perishable table on the site — check the changelog, not this page, before you cite it.</p>'},
    {h:'Do all of Phase 00 through 07 against a practice vault',
     p:'<p>Make a disposable vault with twenty notes copied from your real one. Everything up to the point where you connect an agent happens there. The cost of getting this wrong is not a broken vault — it is a credential inside an embedding store you cannot un-embed.</p><p>If you do not have a real vault yet, the next two concepts are your entry point. Everything else on this path assumes notes exist to measure.</p>'},
    {h:'Starting from empty: the minimum viable vault',
     p:'<p>Phase 03 argues that structure is discovered rather than designed, and that is right — for a vault that already has notes to discover it from. On an empty vault the advice is useless, because there is nothing to observe. You need the smallest scaffold that produces observations, and it has to be small enough that outgrowing it is cheap.</p><p>Five folders. Not a methodology, not a system, and explicitly not permanent. Each one has to earn its place, and each one carries a condition that tells you to delete or split it.</p>',
     table:{head:['Folder','Earns its place by','Delete or split it when'],rows:[
       ['<code>inbox/</code>','Being the single destination for every capture path','Never — but past ~30 notes you are collecting rather than processing'],
       ['<code>notes/</code>','Separating your claims from other people&#39;s','Never'],
       ['<code>sources/</code>','Making the source/interpretation split physical','Never — Phase 05 depends on it'],
       ['<code>attachments/</code>','Keeping binaries out of your text searches','Never'],
       ['<code>templates/</code>','Enforcing the property vocabulary without relying on memory','Never'],
       ['<b>Any other folder</b>','<b>Three existing notes obviously wanting it</b>','It still has fewer than three notes after a month']]},
     code:C('vault/',
            '  inbox/          everything arrives here, nothing stays',
            '  notes/          things you wrote and stand behind',
            '  sources/        things other people wrote',
            '  attachments/    set this in Settings > Files and links',
            '  templates/      one file, to begin with',
            '  README.md       the decisions you made, and their delete conditions'),
     p2:'<p>Write the delete conditions into the README on the day you create the folders. The version of you with 300 notes will not remember what the version with zero was trying to achieve, and an unexamined scaffold quietly becomes the architecture.</p><p>One template is enough to start. Its entire job is to make the Phase 03 vocabulary automatic before you have learned it.</p>',
     code2:C('---',
            'type: ',
            'status: inbox',
            'domain: ',
            'source_kind: personal',
            'source_url: ',
            'created: {{date:YYYY-MM-DD}}',
            'reviewed: false',
            '---',
            '',
            '## What this is',
            '',
            '## Why it matters',
            '',
            '## Open questions')},
    {h:'The seeding week',
     p:'<p>Twenty notes is the smallest corpus that yields a meaningful measurement, a real evaluation set, and a retrieval failure you can actually diagnose. You cannot design your way to twenty notes — you have to capture them. Seven days, about thirty minutes a day.</p>',
     p2:'<ol><li><b>Day 1.</b> Create the five folders and the template. Set the attachment folder under Settings &rarr; Files and links. Write the README: what each folder is for, and the condition that would make you delete it.</li><li><b>Days 2 to 6.</b> Capture three real things a day into <code>inbox/</code> using the template. No organising, no linking, no renaming. Real things: something you read, something you decided, something you had to look up twice. Fill <code>type</code> and <code>domain</code> with whatever word fits, not from a list you invented on day 1.</li><li><b>Day 7.</b> Process the inbox. Move each note to <code>notes/</code> or <code>sources/</code> according to who wrote it. Link anything that obviously relates. Then list the <code>domain</code> values you actually used — <b>that</b> is your discovered vocabulary, and it is what Phase 03 formalises into a closed list.</li></ol><p>You end the week with roughly twenty notes, a vocabulary you observed instead of guessed, and a handful of real questions you asked the vault — which is exactly the raw material Phase 06 turns into an evaluation set. Then run the baseline lab below.</p>'}
  ],
  lab:{title:'Baseline what you have, or seed what you do not',
    steps:[
      '<b>Route first.</b> If you have an existing vault, start at step 2. If you are starting from empty, run the seeding week above and come back — you need roughly twenty notes before any measurement below means anything.',
      'Run all four shell measurements against your vault, read-only. Write the four numbers in a note called <code>00 Baseline</code>. <i>Seeded vault: run them anyway. The numbers will be small and that is the point — you now have a before.</i>',
      'Enable the CLI and run <code>obsidian orphans</code>, <code>deadends</code>, and <code>unresolved</code>. Add those three counts to the same note. <i>Seeded vault: expect a high orphan count. You have barely linked anything yet, and Phase 02 is where that changes.</i>',
      'Read the credential grep output line by line. Every hit is a folder that must be excluded from every index you build later. Write that exclusion list down now. <i>Seeded vault: likely zero hits — record the empty result, because the discipline is running the check, not finding something.</i>',
      'Copy twenty representative notes into a new folder and open it as a practice vault. <i>Seeded vault: your whole vault is already disposable, so use it directly and skip the copy.</i>',
      '<b>Break it deliberately:</b> quit Obsidian, delete <code>.obsidian/workspace.json</code> from the practice vault, and reopen. Your pane layout is gone; every note is intact. You have just proved by experiment which side of the source/derived line that file sits on.',
      'Now delete a note from the practice vault and reopen. Nothing regenerates it. That is the other side of the line.'],
    verify:'You have seven numbers written down and an explicit list of folders that must never be indexed — even if that list is empty and even if the numbers are small.'},
  gotchas:[
    {s:'trap',t:'Syncing <code>.obsidian/</code> syncs your API keys',d:'Plugin settings live in <code>.obsidian/plugins/&lt;plugin&gt;/data.json</code>, and plugins that hold credentials — the Local REST API key, an OpenAI key in an AI plugin — put them there in plaintext. Share that vault, commit it, or sync it to a work machine and the credential goes with it. Nothing warns you, because from the vault&#39;s point of view it is just another config file.'},
    {s:'trap',t:'Attachments outside the vault folder resolve in the editor and vanish everywhere else',d:'Obsidian will happily display an image linked by absolute path from outside the vault. Every tool that reads the folder — your indexer, an MCP server, a git clone on another machine — sees a broken reference and reports nothing, because to them the link simply does not resolve.'},
    {s:'trap',t:'An empty <code>orphans</code> count is not good news',d:'Zero orphans usually means you have a Map-of-Content note that links to everything, which makes the metric meaningless rather than the vault healthy. Check what is doing the linking before you celebrate.'},
    {s:'cost',t:'<code>find</code> across a synced vault wakes the sync client',d:'Running a full-vault walk inside an iCloud, Dropbox, or OneDrive folder can trigger materialization of every dehydrated file. On a large vault that is a multi-gigabyte download you did not ask for. Measure against a local clone.'},
    {s:'stale',t:'"Obsidian is free for personal use only"',d:'The Commercial license became optional on <b>20 February 2025</b>. Anyone can use Obsidian for work, for free; the paid license now exists as optional support. Guides written before that date still gate their advice on a purchase that is not required.'},
    {s:'trap',t:'A folder structure built before the notes exist survives long after it stops fitting',d:'Nothing in Obsidian tells you a folder is wrong. A twelve-folder hierarchy created on day one keeps working — you simply spend a decision on every capture forever, filing notes into categories you invented before you knew what you would write. The cost is continuous and invisible, which is why it never gets fixed.'},
    {s:'trap',t:'Seeding a vault by importing rather than capturing gives you a corpus you cannot navigate',d:'Bulk-importing an old note archive, an export from another app, or a folder of PDFs looks like a shortcut to twenty notes. It is not: you get volume with no links, no vocabulary, and no memory of why any of it is there. Every measurement in this phase then describes someone else&#39;s structure. Capture the first twenty by hand.'},
    {s:'ok',t:'A derived artifact you cannot rebuild is a liability',d:'Before you build any index, write down the one command that regenerates it from the notes. If you cannot write that command, you are about to create a second source of truth.'},
    {s:'ok',t:'The starter skeleton is scaffolding, and scaffolding comes down',d:'Five folders exist to make capture possible on day one, not to be a system. Write the delete condition for each one in the README the same day you create it, or the scaffold quietly becomes the architecture.'}
  ],
  quiz:[
    {q:'Name the categories of file inside a vault folder and say which are source of truth.',a:'Markdown notes, attachments, and <code>.base</code> / <code>.canvas</code> files are all source of truth and all plaintext. The <code>.obsidian/</code> folder is a mixture: your configuration is source, but the caches inside it are derived. Everything outside the folder — the search index, an embedding store, any AI summary you have not reviewed — is derived. When a derived artifact disagrees with a note, the note wins and the artifact gets rebuilt.'},
    {q:'Which Obsidian version first shipped the CLI, and what has to be true for a CLI command to work?',a:'Obsidian 1.12.7 or later, with the interface enabled under Settings &rarr; General &rarr; Command line interface. The CLI drives the running desktop app, so Obsidian must be running; if it is not, the first command launches it. Sync without a desktop app is a different tool: Obsidian Headless.'},
    {q:'State the numbers you record before connecting anything, and why the credential grep is one of them.',a:'Note count, median note length in words, how many notes carry frontmatter, orphan count, dead-end count, and unresolved-link count. The credential grep is not a measurement but a gate: every folder it hits goes on an exclusion list, because text you embed into a vector store cannot be un-embedded — you can only rebuild the store from scratch.'},
    {q:'Why does "structure is discovered, not designed" fail on a brand-new vault, and what replaces it?',a:'Discovery needs something to observe, and an empty vault offers nothing. It is replaced by the smallest scaffold that produces observations: five folders — <code>inbox/</code>, <code>notes/</code>, <code>sources/</code>, <code>attachments/</code>, <code>templates/</code> — plus a README recording the condition that would make you delete each one. Then a seeding week of roughly three captures a day, after which the <code>domain</code> values you actually used are your discovered vocabulary. The scaffold exists to reach the point where the discovery rule starts working.'},
    {q:'Why should the first twenty notes be captured rather than imported?',a:'A bulk import gives volume with no links, no vocabulary, and no memory of why anything is there, so every baseline measurement ends up describing someone else&#39;s structure rather than yours. The point of the seeding week is not to reach a note count — it is to generate real questions you asked your own vault, which is the raw material Phase 06 turns into an evaluation set.'},
    {q:'Why does naming a single Obsidian version number make a guide wrong?',a:'Desktop and mobile ship on separate trains. On 21 August 2026 desktop was 1.13.7 (12 Aug) while mobile was 1.13.8 (20 Aug). A claim pinned to one number is describing one platform and silently implying both.'}
  ],
  docs:[['Obsidian CLI','https://obsidian.md/help/cli'],['Obsidian changelog','https://obsidian.md/changelog/'],['Obsidian is now free for work','https://obsidian.md/blog/free-for-work/']]

{
  id:'p1', n:'01', title:'Operate it unmodified', layer:'l1', layerLabel:'Substrate',
  time:'2 h', pre:'Phase 00',
  objective:'You do real work with <b>core plugins only</b>, so every community plugin you later install is a response to a friction you measured rather than a habit you inherited from a YouTube setup video.',
  concepts:[
    {h:'The default loop, and the four places you can intervene',
     p:'<p>Strip away every plugin and what is left is a four-beat loop: <b>capture</b> into a daily note, <b>find</b> with the quick switcher or search, <b>connect</b> with a link, <b>review</b> through backlinks. Every primitive in the rest of this path is an intervention at exactly one of those four points. Naming the point tells you which primitive to reach for, and it is the reason configuration-first learning fails: you cannot choose an intervention before you have felt the friction it relieves.</p>'},
    {h:'Search operators are the highest-leverage thing in core Obsidian',
     p:'<p>Most people replace Obsidian search with semantic search before they have learned it, and then conclude that exact search is weak. It is not weak; it is unlearned. Every operator below is built in.</p>',
     table:{head:['Operator','Finds'],rows:[
       ['<code>file:</code>','Text in the filename, anywhere in the vault'],
       ['<code>path:</code>','Text in the file path'],
       ['<code>content:</code>','Text in the file content only'],
       ['<code>match-case:</code>','Case-sensitive match'],
       ['<code>ignore-case:</code>','Forced case-insensitive match'],
       ['<code>tag:</code>','Files carrying a tag'],
       ['<code>line:</code>','Terms that co-occur on one line'],
       ['<code>block:</code>','Terms that co-occur in one block'],
       ['<code>section:</code>','Terms that co-occur under one heading'],
       ['<code>task:</code>','Matches inside a task item'],
       ['<code>task-todo:</code>','Matches inside incomplete tasks only'],
       ['<code>task-done:</code>','Matches inside completed tasks only'],
       ['<code>[property:value]</code>','Filter on a frontmatter property']]}},
    {h:'The boolean layer people never reach',
     p:'<p>Spaces mean AND. <code>OR</code> is explicit. A leading hyphen means NOT. Parentheses group. Quotes make a phrase, and a backslash escapes a quote inside one. A pattern wrapped in forward slashes is a regular expression — <b>JavaScript-flavoured</b>, which matters the moment you paste a PCRE lookbehind and get silence instead of an error.</p>',
     code:C('# every note under Projects, tagged active, that mentions retrieval',
            '# but is not an archived meeting note',
            'path:Projects tag:#active content:retrieval -tag:#archive -file:meeting',
            '',
            '# either spelling, in the same section as the word budget',
            'section:(budget (organisation OR organization))',
            '',
            '# a regex: any four-digit year in a filename',
            'file:/\\d{4}/')},
    {h:'What you already have without installing anything',
     table:{head:['Core plugin','Does','Replaces the community plugin'],rows:[
       ['Bases','Database views over notes and properties','Dataview, for tables'],
       ['Backlinks / Outgoing links','Inbound and outbound reference panels','—'],
       ['Daily notes','Dated capture note','Calendar, partially'],
       ['Templates','Insert a note shape','Templater, for static shapes'],
       ['Note composer','Split and merge notes','—'],
       ['Unique note creator','Timestamped zettel IDs','Zettelkasten prefixer'],
       ['Footnotes view','Sidebar footnote management','—'],
       ['Web viewer','In-app browsing','—'],
       ['Search','Everything in the table above','Omnisearch, partially']]}},
    {h:'Why plugin-first is the most expensive beginner mistake',
     p:'<p>Three costs, in ascending order of how long they take to notice. Startup latency, which you feel immediately. Upgrade breakage, which you feel every few months. And <b>retrieval damage</b>, which you never feel directly: plugins that store JSON inside Markdown — drawing files, board files, some database plugins — put thousands of tokens of coordinate data into files your indexer will happily chunk and embed. Your search results get worse and nothing anywhere reports an error.</p>'}
  ],
  lab:{title:'Ten real questions, core search only',
    steps:[
      'Write down ten questions you have actually asked your own vault in the last month. Real ones, not example ones.',
      'Answer each with a <b>single</b> Obsidian search query. Record the query beside the question.',
      'Mark each query with the operator that did the work. If a query needed no operator, mark it plain.',
      'Count how many of the ten needed something core search cannot do. That number, not a blog post, is your justification for semantic search later.',
      '<b>Break it deliberately:</b> disable every community plugin at once (<code>obsidian plugins:restrict</code>, or the toggle in settings), restart, and re-run all ten queries.',
      'List the plugins whose absence actually broke something. That list is almost always shorter than your installed list, and the difference is pure carrying cost.'],
    verify:'You have ten question/query pairs and a plugin list shorter than the one you started with.'},
  gotchas:[
    {s:'trap',t:'A pre-1.9 singular property key returns zero results, not an error',d:'If a note still carries <code>tag:</code>, <code>alias:</code>, or <code>cssclass:</code> in its frontmatter, Obsidian 1.9 and later does not read it as a property. A search on <code>[tag:x]</code> or the Properties UI shows nothing. The note looks fine, the search looks like it ran, and the answer is silently empty.'},
    {s:'trap',t:'Search reads the source text, including what you cannot see',d:'Terms inside <code>%%comments%%</code> and inside collapsed callouts still match, so a query can return a note whose visible body never mentions the term. In the other direction, a wikilink written as <code>[[note|display text]]</code> matches on the target name and on the display text, but a term split across that pipe matches neither.'},
    {s:'cost',t:'Regex search runs uncached over the whole vault',d:'A bare <code>/pattern/</code> query walks every file with no index to help it and can stall the interface on a large vault. Lead with a cheap literal term or a <code>path:</code> filter to narrow the candidate set, then apply the regex.'},
    {s:'stale',t:'"Install Dataview first" is the single most-repeated piece of stale Obsidian advice',d:'Bases has been a core plugin since 1.9.0 (21 May 2025), and Dataview&#39;s most recent release is <b>0.5.70, dated 7 April 2025</b> — sixteen months old as of this writing. Dataview still works and is still unmatched for inline and task queries, but installing it reflexively for tables now means adding a dormant dependency to do a job the core app does.'},
    {s:'ok',t:'The right time to install a plugin is the second time the same friction costs you ten minutes',d:'Once is an anecdote. Twice is a pattern with a measured cost, which is also the number you will use to decide whether to keep the plugin at the next upgrade.'}
  ],
  quiz:[
    {q:'Name the four beats of the core Obsidian loop and say why the list matters.',a:'Capture, find, connect, review. It matters because every plugin, hook, index, and agent you add later is an intervention at exactly one of those four points. Naming the beat where the friction lives tells you which primitive to reach for, and stops you solving a capture problem with a retrieval tool.'},
    {q:'Which search operators restrict a match to co-occurrence within a bounded region, and what are the three regions?',a:'<code>line:</code>, <code>block:</code>, and <code>section:</code>. They require the terms to appear together within one line, one block, or one heading section respectively, instead of anywhere in the same file. They are the cheapest precision win in core search and the reason most "Obsidian search is imprecise" complaints are wrong.'},
    {q:'What flavour of regular expression does Obsidian search use, and how does it fail when you get that wrong?',a:'JavaScript-flavoured. A PCRE-only construct such as a lookbehind of the wrong form does not raise a syntax error in the search bar — the query simply returns nothing, which reads exactly like a vault that does not contain the thing.'},
    {q:'Name the three costs of installing community plugins early, in the order you notice them.',a:'Startup latency, felt immediately. Upgrade breakage, felt every few months. Retrieval damage, never felt directly: plugins that store JSON inside Markdown files inject thousands of tokens of coordinate and state data into files your indexer will chunk and embed, degrading every future search result with no error anywhere.'}
  ],
  docs:[['Obsidian search','https://obsidian.md/help/plugins/search'],['Dataview releases','https://github.com/blacksmithgu/obsidian-dataview/releases'],['Obsidian 1.9.0 changelog','https://obsidian.md/changelog/2025-05-21-desktop-v1.9.0/']]

{
  id:'p2', n:'02', title:'Links, embeds, silent breakage', layer:'l1', layerLabel:'Substrate',
  time:'2 h', pre:'Phase 01',
  objective:'You can predict <b>which reference survives a rename and which one quietly dies</b>, because retrieval quality is downstream of link integrity and nothing in Obsidian tells you when a reference stops resolving.',
  concepts:[
    {h:'The reference forms, and what each one costs a machine reader',
     p:'<p>Obsidian gives you several ways to point at something. They are not interchangeable, and the differences show up not in the editor but in whatever reads the folder afterwards.</p>',
     table:{head:['Form','Syntax','Survives rename','What a plain text reader sees'],rows:[
       ['Wikilink','<code>[[Note]]</code>','Yes, updated in place','A bare name with no path'],
       ['Wikilink with alias','<code>[[Note|shown]]</code>','Yes','Two strings, one of them not the target'],
       ['Markdown link','<code>[shown](Note.md)</code>','Yes, if configured','A relative path it can resolve'],
       ['Heading reference','<code>[[Note#Heading]]</code>','Name yes, heading <b>no</b>','A path plus a fragment that may not exist'],
       ['Block reference','<code>[[Note#^abc123]]</code>','Yes','An opaque six-character id'],
       ['Embed','<code>![[Note]]</code>','Yes','A reference, not the content'],
       ['Block embed','<code>![[Note#^abc123]]</code>','Yes','A reference to a fragment'],
       ['Attachment','<code>![[diagram.png]]</code>','Depends on setting','A filename that may sit anywhere']]}},
    {h:'Renaming a heading breaks every reference to it, silently',
     p:'<p>Obsidian rewrites wikilinks when you rename a <i>file</i>. It does not rewrite them when you rename a <i>heading</i>. A link of the form '+K('[[Architecture#Retrieval layer]]')+' becomes a link to a heading that no longer exists, and the editor renders it as a normal link. You find out when you click it.</p><p>This is the single strongest argument for block references over heading references in anything you intend to keep: a block id is opaque and never gets edited for style.</p>',
     code:C('Some paragraph you want to cite from elsewhere. ^ret-budget',
            '',
            'Elsewhere:',
            '',
            'The constraint is stated in [[Architecture#^ret-budget]].')},
    {h:'Callouts, comments, and the things that are and are not content',
     p:'<p>Four constructs behave differently for a machine reader, and you should decide deliberately which one a piece of text belongs in.</p>',
     table:{head:['Construct','Syntax','Indexed as content','Use for'],rows:[
       ['Callout','<code>&gt; [!note] Title</code>','Yes','Emphasis you want retrievable'],
       ['Comment','<code>%%hidden%%</code>','Yes, invisibly','Nothing you want retrievable'],
       ['Footnote','<code>[^1]</code>','Yes, detached from its anchor','Citations'],
       ['Frontmatter','<code>---</code> block','As properties, not prose','Anything you will filter on']]},
     p2:'<p>The trap is the comment. It is hidden in reading view and fully present in the file, so it is fully present in every index and every chunk you send to a model.</p>'},
    {h:'Attachment resolution is a setting, not a fact',
     p:'<p>Under Settings &rarr; Files and links, the default location for new attachments can be the vault root, a specified folder, or the same folder as the note. Change it mid-vault and you get two populations of attachment with different resolution rules, both of which work in the editor. Pick one at the start and write it in your vault README.</p>'},
    {h:'The links the CLI can see and you cannot',
     p:'<p>Three link-topology commands have no equivalent in the interface, and together they are the closest thing Obsidian has to a lint pass.</p>',
     code:C('obsidian unresolved   # links whose target does not exist',
            'obsidian orphans      # notes nothing links to',
            'obsidian deadends     # notes that link to nothing',
            'obsidian backlinks "Architecture"',
            'obsidian links "Architecture"')}
  ],
  lab:{title:'Break your own links four ways and see which ones report',
    steps:[
      'In the practice vault, make three notes: <code>Concept</code>, <code>Example</code>, <code>Review</code>. Link them in a cycle with wikilinks. Add an image attachment to <code>Example</code> and a code block with a source URL.',
      'Add a heading reference from <code>Review</code> to a named heading in <code>Concept</code>, and a block reference to a paragraph in <code>Example</code>.',
      'Rename <code>Concept</code> to <code>Concept v2</code>. Run <code>obsidian unresolved</code>. Note that nothing broke.',
      '<b>Break it deliberately, one:</b> rename the heading inside <code>Concept v2</code>. Run <code>obsidian unresolved</code> again. Note what it reports and what it does not.',
      '<b>Break it deliberately, two:</b> move the image out of the vault folder entirely, leaving the link. Confirm it still renders, then <code>grep</code> for the filename from the shell and confirm the file is not there.',
      'Write one sentence in your baseline note naming which of the two breakages any tool would have caught.'],
    verify:'You can state from experiment which reference forms survive which operations, rather than from a table you read.'},
  gotchas:[
    {s:'trap',t:'A renamed heading leaves a live-looking link to nowhere',d:'File renames update wikilinks. Heading renames do not. The link keeps its normal styling and Obsidian raises nothing at edit time — the failure surfaces only on click, or never, if the link is only ever read by a machine.'},
    {s:'trap',t:'<code>%%comments%%</code> are invisible to you and fully visible to your index',d:'Everything you park in a comment because it was not ready — half-formed opinions, a client name, a password reminder — gets chunked, embedded, and returned as context. Reading view hiding it is a rendering decision, not a storage one.'},
    {s:'trap',t:'An aliased wikilink hides its target from grep',d:'<code>[[2026-Q3-plan|the plan]]</code> reads as "the plan" and greps as the filename. Text searches written against how the vault reads will miss every aliased reference, and text searches written against filenames will miss the prose. Neither returns an error.'},
    {s:'cost',t:'Embeds duplicate content into every chunk that contains them',d:'An embed is a reference in the file and expanded content in the reader. Depending on how your indexer resolves embeds it either misses the content entirely or includes it in both the source note and every note embedding it, inflating your index and skewing similarity scores toward whatever you embed most.'},
    {s:'stale',t:'"Obsidian breaks links when you move files"',d:'It has not for a long time — moves and renames update wikilinks, and update Markdown links too when link-updating is enabled in Settings &rarr; Files and links. The real modern failure is heading renames and out-of-vault attachments, neither of which the old advice mentions.'},
    {s:'ok',t:'Prefer block references for anything you intend to cite twice',d:'Block ids are opaque, so nobody ever edits one for style. Heading text is prose, and prose gets edited.'}
  ],
  quiz:[
    {q:'Which link operation does Obsidian update automatically, and which one does it leave broken?',a:'It updates references when a file is renamed or moved, including Markdown links when link-updating is enabled. It does not update references when a heading is renamed: <code>[[Note#Old heading]]</code> silently becomes a link to a heading that no longer exists, still rendered as a normal link.'},
    {q:'Why is a block reference more durable than a heading reference?',a:'A block id such as <code>^ret-budget</code> is opaque and carries no meaning, so nobody rewrites it while editing for style. Heading text is prose, and prose gets rewritten — which breaks every heading reference pointing at it, with no warning.'},
    {q:'Name the construct that is invisible in the editor and fully present in every index, and state the consequence.',a:'The <code>%%comment%%</code>. It is hidden in reading view but stored verbatim in the file, so it is chunked, embedded, and retrievable like any other text. Anything you park in a comment because it was not ready to publish is nonetheless published to every model you give vault access.'},
    {q:'What does an aliased wikilink do to a text search?',a:'It splits the note into two non-matching surfaces. <code>[[2026-Q3-plan|the plan]]</code> matches a grep for the filename and a grep for the display text, but a query written against either one alone misses the other, and nothing reports a partial match.'}
  ],
  docs:[['Internal links','https://obsidian.md/help/linking-notes-and-files/internal-links'],['Obsidian CLI','https://obsidian.md/help/cli']]
},
{
  id:'p3', n:'03', title:'Properties and the four primitives', layer:'l2', layerLabel:'Structure',
  time:'2–3 h', pre:'Phase 02',
  objective:'You choose between a folder, a tag, a link, and a property <b>on the grounds of what will need to query it</b>, and you can defend each choice in one sentence.',
  concepts:[
    {h:'The four primitives are not four styles. They are four data structures.',
     p:'<p>Most organizational advice for Obsidian is taste. This is not: each primitive has a different shape and a different query cost, and picking the wrong one shows up later as a query you cannot write.</p>',
     table:{head:['Primitive','Shape','A note can have','Query cost','Right when'],rows:[
       ['Folder','Tree','Exactly one','Cheapest — path prefix','Location is genuinely exclusive'],
       ['Tag','Flat set, nestable by <code>/</code>','Many','Cheap — set membership','Cross-cutting, low-cardinality state'],
       ['Link','Directed graph','Many, both directions','Traversal','The relationship itself carries meaning'],
       ['Property','Typed key/value','Many keys, one value each','Filterable and sortable','You will filter, sort, or group on it']]},
     p2:'<p>The practical rule: <b>if you will ever want to sort or compare by it, it is a property, not a tag.</b> A tag can answer "which notes are active". Only a property can answer "which notes are active, ordered by review date".</p>'},
    {h:'Property types, and the one that bites',
     p:'<p>Obsidian frontmatter properties are typed: text, list, number, checkbox, date, and datetime. The Properties interface edits them structurally rather than as raw YAML. The type is assigned per key across the whole vault, so the first note that defines a key sets the type every other note inherits.</p>',
     code:C('---',
            'type: concept',
            'status: active',
            'domain: obsidian-ai',
            'tags:',
            '  - primitive',
            '  - retrieval',
            'source_url: https://obsidian.md/help/bases/syntax',
            'created: 2026-08-21',
            'reviewed: 2026-08-21',
            'generated_by: human',
            '---')},
    {h:'The 1.9 breaking change you will meet in old notes',
     p:'<p>Obsidian 1.9.0 removed support for the singular property keys outright. The changelog states it plainly: support for <code>tag</code>, <code>alias</code>, and <code>cssclass</code> was removed in favour of <code>tags</code>, <code>aliases</code>, and <code>cssclasses</code>, and <b>the values of these properties must be a list</b>.</p><p>Nothing migrates them for you and nothing flags them. A note carrying the old key simply has no tags as far as the app is concerned. Find them before you build anything that filters on tags.</p>',
     code2:C('# every note still carrying a pre-1.9 singular key',
            'grep -rn --include="*.md" --exclude-dir=.obsidian \\',
            '  -E "^(tag|alias|cssclass):" . ')},
    {h:'Keep the vocabulary small and closed',
     p:'<p>A controlled vocabulary is worth more than a rich one, because every value you allow is a value some future query has to enumerate. Four keys carry most of the weight.</p>',
     table:{head:['Key','Allowed values','Answers'],rows:[
       ['<code>type</code>','concept · source · lab · decision · person · project','What kind of note is this'],
       ['<code>status</code>','inbox · active · parked · done · archive','Does it need me'],
       ['<code>domain</code>','a short closed list you maintain','Which corner of the vault'],
       ['<code>source_kind</code>','personal · external · generated','Where did the text come from']]},
     p2:'<p>That last key is the one people leave out, and it is the one Phase 12 depends on entirely.</p>'},
    {h:'Structure is discovered, not designed — once there is something to discover',
     p:'<p>The failure mode with a name is the <b>collector&#39;s fallacy</b>: building an elaborate hierarchy before you have enough notes to know its shape, then spending your attention maintaining the hierarchy instead of the notes. Add a folder when three notes have obviously wanted one. Add a property when you have tried and failed to write a query without it.</p><p>The rule has one boundary condition, and skipping it is why the advice frustrates beginners: <b>discovery needs something to observe.</b> On an empty vault there is nothing to discover from, so the rule gives you no instruction at all. Phase 00 handles that case with a five-folder scaffold and a seeding week whose only job is to reach the point where this rule starts working. Once you are past twenty notes, the rule takes over and the scaffold becomes negotiable.</p>'}
  ],
  lab:{title:'Retrofit a property vocabulary onto real notes and watch it fail',
    steps:[
      'Take twenty real notes from your vault, copied into the practice vault. <i>If you seeded a vault in Phase 00, use those twenty directly.</i>',
      'Add <code>type</code>, <code>status</code>, <code>domain</code>, and <code>source_kind</code> to all twenty. Do not invent values as you go — write the closed list first, then apply it.',
      'Count how many notes forced you to add a value that was not on your list. That count is the honest measure of whether your vocabulary fits your thinking.',
      'Run the pre-1.9 grep above against your <b>real</b> vault. Fix any hits.',
      '<b>Break it deliberately:</b> in one note, change <code>status: active</code> to <code>status: [active]</code> — a list where every other note has text. Open the Properties panel and search <code>[status:active]</code>. Watch the note drop out of results without any error appearing.',
      'Now do the reverse in a second note: give <code>tags</code> a bare string instead of a list. Confirm the tag stops resolving.'],
    verify:'You have a written closed vocabulary of four keys, and you have seen a type mismatch remove a note from results silently.'},
  gotchas:[
    {s:'trap',t:'The first note to define a key sets its type for the vault',d:'Write <code>reviewed: 2026-08-21</code> in one note and <code>reviewed: yes</code> in another and the second one is a type conflict. Obsidian resolves it rather than refusing it, and the note quietly stops matching date-range filters. Nothing marks the note.'},
    {s:'trap',t:'Pre-1.9 <code>tag:</code>, <code>alias:</code>, <code>cssclass:</code> keys are dead weight, not legacy support',d:'Support was removed, not deprecated. A note carrying <code>tag: project</code> has zero tags as far as Obsidian is concerned, renders normally, and is invisible to every tag query, Base, and search you write.'},
    {s:'trap',t:'Nested tags match downward, not upward',d:'A query for <code>tag:#project</code> matches <code>#project/active</code>, but a query for <code>tag:#project/active</code> does not match a note tagged only <code>#project</code>. Deep tag hierarchies therefore make your specific queries narrower than you intend, and the result is an empty list rather than a warning.'},
    {s:'cost',t:'Every property key is a maintenance obligation',d:'A key you add to twenty notes and then stop applying is worse than no key, because queries filtering on it now silently exclude everything you wrote afterwards. Add keys you are willing to enforce in a template.'},
    {s:'ok',t:'If you will sort by it, it is a property',d:'Tags answer membership. Properties answer membership, ordering, comparison, and grouping. The one-word test for which to use is whether the word "by" ever appears in the question.'}
  ],
  quiz:[
    {q:'Name the four organizational primitives and the one-sentence test that picks between a tag and a property.',a:'Folders, tags, links, properties. The test: if you will ever want to sort, compare, or group <i>by</i> the thing, it is a property. A tag can answer "which notes are active"; only a property can answer "which notes are active, ordered by review date".'},
    {q:'What exactly changed about property keys in Obsidian 1.9.0, and how does an unmigrated note fail?',a:'Support for the singular keys <code>tag</code>, <code>alias</code>, and <code>cssclass</code> was removed in favour of <code>tags</code>, <code>aliases</code>, and <code>cssclasses</code>, and their values must be lists. An unmigrated note renders normally and has no tags at all as far as the app is concerned, so it is invisible to every tag query and every Base — with no error and no marker on the note.'},
    {q:'How does nested tag matching behave in each direction, and what is the practical consequence?',a:'It matches downward but not upward: <code>tag:#project</code> matches <code>#project/active</code>, but <code>tag:#project/active</code> does not match a note tagged only <code>#project</code>. The consequence is that deep tag hierarchies make your most specific queries narrower than you expect, returning an empty list rather than an error.'},
    {q:'What is the collector&#39;s fallacy in a vault context?',a:'Building organizational structure before you have enough notes to know its shape, then spending your attention maintaining the structure rather than the notes. The corrective is to add a folder only when three notes have obviously wanted one, and a property only when you have tried and failed to write a query without it.'}
  ],
  docs:[['Obsidian properties','https://obsidian.md/help/properties'],['Obsidian 1.9.0 changelog','https://obsidian.md/changelog/2025-05-21-desktop-v1.9.0/']]
},
{
  id:'p4', n:'04', title:'Bases', layer:'l2', layerLabel:'Structure',
  time:'2–3 h', pre:'Phase 03',
  objective:'You can write a <code>.base</code> file by hand and read one someone else wrote, so a query over your vault is <b>a plaintext file under version control</b> rather than a code block buried in a note.',
  concepts:[
    {h:'What a Base actually is',
     p:'<p>A '+K('.base')+' file is a YAML document that describes a filtered, computed, grouped view over files in the vault. It is a core plugin, shipped in 1.9.0 on 21 May 2025 with the changelog line: <i>"Introducing Bases, a new core plugin that lets you turn any set of notes into a powerful database."</i></p><p>The thing that makes it different from Dataview is not the feature set. It is that the query is a <b>file</b>. It has a path, it diffs in git, an agent can read and write it, and it is not trapped inside the note that renders it.</p>'},
    {h:'The five top-level keys',
     table:{head:['Key','Holds'],rows:[
       ['<code>filters</code>','Conditions applied across all views'],
       ['<code>formulas</code>','Computed properties derived from other values'],
       ['<code>properties</code>','Display configuration for properties'],
       ['<code>summaries</code>','Custom aggregation formulas'],
       ['<code>views</code>','One or more renderings of the filtered set']]}},
    {h:'Three property namespaces, and getting them wrong is silent',
     p:'<p>Every value you reference in a Base comes from one of three namespaces. Mixing them up produces an empty column rather than a parse error.</p>',
     table:{head:['Namespace','Source','Example'],rows:[
       ['<code>note.</code>','Frontmatter of the Markdown file','<code>note.status</code>'],
       ['<code>file.</code>','File metadata, available for every file type','<code>file.mtime</code>'],
       ['<code>formula.</code>','A formula you defined in this Base','<code>formula.age_days</code>']]},
     p2:'<p>The <code>file.</code> namespace is the one worth memorising, because it works on files that have no frontmatter at all and it is how you build a maintenance view over a messy vault.</p>',
     code2:C('file.name        file.path        file.folder      file.ext',
            'file.size        file.ctime       file.mtime',
            'file.tags        file.links       file.backlinks   file.embeds',
            'file.properties')},
    {h:'A Base you can paste',
     p:'<p>This one answers a real maintenance question: which active notes have not been reviewed recently.</p>',
     code:C('filters:',
            '  and:',
            '    - note.status == "active"',
            '    - file.ext == "md"',
            'formulas:',
            '  stale_days: \'(now() - note.reviewed).days\'',
            'properties:',
            '  note.reviewed:',
            '    displayName: Last reviewed',
            'views:',
            '  - type: table',
            '    name: Needs review',
            '    order:',
            '      - file.name',
            '      - note.reviewed',
            '      - formula.stale_days',
            '    sort:',
            '      - property: note.reviewed',
            '        direction: ASC',
            '    limit: 50'),
     p2:'<p class="cap">Structure and namespaces verified against the official Bases syntax page. Exact spelling of individual view options such as <code>sort</code> and <code>limit</code> varies by version — <span class="unv">check the syntax page for your build</span> before relying on this verbatim.</p>'},
    {h:'The four view types',
     table:{head:['View','Shows','Since'],rows:[
       ['<code>table</code>','Rows, columns populated from properties','1.9'],
       ['<code>cards</code>','A grid of cards, gallery-like, with images','1.9'],
       ['<code>list</code>','A bulleted or numbered list','1.10'],
       ['<code>map</code>','Pins on an interactive map — <b>requires the Maps plugin</b>','1.10']]}},
    {h:'Summaries, and embedding a view in a note',
     p:'<p>Built-in summary functions: Average, Min, Max, Sum, Range, Median, Stddev, Earliest, Latest, Checked, Unchecked, Empty, Filled, Unique. <code>Empty</code> and <code>Filled</code> are the two people overlook and the two that matter for vault hygiene — they count how much of your vocabulary you are actually applying.</p><p>Embed a Base into a note with '+K('![[File.base]]')+' for the first view, or '+K('![[File.base#View name]]')+' for a specific one.</p>'}
  ],
  lab:{title:'Write a maintenance Base by hand and prove a namespace failure',
    steps:[
      'Create <code>Maintenance.base</code> in the practice vault <b>in a text editor</b>, not through the interface. Paste the example above and adjust the property names to your own vocabulary.',
      'Open it in Obsidian. Fix whatever does not load, reading the syntax page rather than guessing.',
      'Add a second view of type <code>cards</code> over the same filters. Confirm both views share the top-level <code>filters</code>.',
      'Add a <code>Filled</code> summary on your <code>domain</code> property. The number it reports is the fraction of your vault your vocabulary actually covers.',
      '<b>Break it deliberately:</b> change one <code>note.status</code> reference to <code>file.status</code>. Reload. The column renders empty and no error appears anywhere — this is what a namespace mistake looks like in production.',
      'Add a <code>map</code> view without installing the Maps plugin and record what happens.',
      'Commit the <code>.base</code> file to git and confirm it diffs as plaintext.'],
    verify:'You have a hand-written <code>.base</code> file in version control, and you have seen a wrong namespace produce an empty column rather than an error.'},
  gotchas:[
    {s:'trap',t:'A wrong namespace renders an empty column, not an error',d:'<code>file.status</code> where you meant <code>note.status</code> is perfectly valid syntax referring to a file property that does not exist. The view loads, the column is blank, and the Base looks like it is telling you that no note has a status.'},
    {s:'trap',t:'A property with mixed types across notes filters unpredictably',d:'Because property types are vault-wide (Phase 03), a Base filtering on <code>note.reviewed</code> silently drops every note where that key holds a different type. The row count looks plausible, which is what makes it dangerous.'},
    {s:'trap',t:'<code>map</code> views need a plugin that is not installed by default',d:'The view type is built in; the renderer is not. A <code>.base</code> file you copy from someone else with a map view will not show you a map, and the failure reads like a syntax problem.'},
    {s:'cost',t:'Embedding a Base evaluates it every time the host note renders',d:'A Base with expensive formulas embedded in your daily note template runs on every daily note you open. Keep expensive views in their own file and link to them.'},
    {s:'stale',t:'"Bases is early access / a beta"',d:'That was accurate for 1.9.0 in May 2025, when the changelog itself said "This is an early beta". It is a shipped core plugin and has been through the 1.10, 1.11, 1.12, and 1.13 lines since. Advice that routes you to Dataview on stability grounds is reasoning from the beta note.'},
    {s:'ok',t:'The killer feature is that the query is a file',d:'Under version control, readable by an agent, diffable, movable, and not trapped inside the note that displays it. That property, not the view types, is why a Base beats an inline query for anything you intend to keep.'}
  ],
  quiz:[
    {q:'Name the three property namespaces in a Base and say which one works on files with no frontmatter.',a:'<code>note.</code> for frontmatter properties, <code>file.</code> for file metadata, <code>formula.</code> for values you compute in the Base. The <code>file.</code> namespace works on any file type regardless of frontmatter — it is how you build a maintenance view over an unstructured vault.'},
    {q:'What happens when you reference the wrong namespace, and why is that worse than a syntax error?',a:'The view loads and the column renders empty. It is worse than a syntax error because an empty column is indistinguishable from a true answer of "no note has this value", so you can act on it without ever noticing the mistake.'},
    {q:'List the four built-in Bases view types and the one with an external dependency.',a:'Table and cards since 1.9, list and map since 1.10. Map requires the Maps plugin; the view type is built in but the renderer is not, so a copied Base with a map view fails in a way that looks like bad syntax.'},
    {q:'What makes a <code>.base</code> file structurally better than an inline query block, independent of features?',a:'It is a file. It has a path, it diffs in version control, an agent can read and rewrite it without touching the note that displays it, and it can be embedded in many notes rather than living inside one. The query stops being a property of a note and becomes an artifact in its own right.'}
  ],
  docs:[['Bases syntax','https://obsidian.md/help/bases/syntax'],['Bases views','https://obsidian.md/help/bases/views'],['Obsidian 1.9.0 changelog','https://obsidian.md/changelog/2025-05-21-desktop-v1.9.0/']]
},
{
  id:'p5', n:'05', title:'The capture contract', layer:'l2', layerLabel:'Structure',
  time:'2 h', pre:'Phase 04',
  objective:'Everything entering the vault arrives with <b>a source, a date, and a declared origin</b>, so that six months later you can tell what you read from what you concluded from what a model wrote.',
  concepts:[
    {h:'Capture and interpretation are two notes, not one',
     p:'<p>The instinct is to read something, summarise it, and keep the summary. That collapses two different objects with different lifetimes: the <b>source note</b>, which is a faithful record and never changes, and the <b>interpretation note</b>, which is yours and changes constantly.</p><p>Collapse them and you lose the ability to revisit a source when your interpretation turns out to be wrong — which is exactly the moment you need it. Keep them separate and linked, and the source note becomes the thing you can hand to a model with confidence.</p>'},
    {h:'The four fields that make a capture auditable',
     table:{head:['Field','Value','Why it earns its place'],rows:[
       ['<code>source_kind</code>','<code>personal</code> · <code>external</code> · <code>generated</code>','The only field that separates what you wrote from what a model wrote'],
       ['<code>source_url</code>','The canonical URL or citation','Lets you re-fetch and re-check'],
       ['<code>created</code>','Capture date','Bounds the claim in time'],
       ['<code>reviewed</code>','Last human review date','Drives every staleness query you will write']]}},
    {h:'Web Clipper and its Interpreter',
     p:'<p>Obsidian ships an official Web Clipper browser extension, and it is the one piece of first-party AI in the product: the <b>Interpreter</b> lets you extract, summarise, or reformat a page with a model at clip time.</p><p>It is opt-in, configured in Web Clipper settings, and it is bring-your-own-key. Eleven preset providers are offered — Anthropic, Azure OpenAI, DeepSeek, Google Gemini, Hugging Face, Meta, Ollama, OpenAI, OpenRouter, Perplexity, and xAI Grok — plus custom endpoints. The help page is explicit about routing: <i>"Interpreter requests are sent directly to the provider you choose. Obsidian does not gather or store any data about your requests."</i></p><p>Ollama in that list is the interesting entry: it means a fully local clip-time summarisation path exists without any community plugin.</p>'},
    {h:'Obsidian ships no AI in the core app, and that is a decision',
     p:'<p>Beyond the Web Clipper Interpreter, there is no first-party model integration in the desktop or mobile app. This is deliberate policy rather than a roadmap gap, and it is the reason every AI capability in the rest of this path is something you attach from outside. Treat it as a stable architectural assumption, not a feature you are waiting for.</p>'},
    {h:'The collector&#39;s fallacy has a measurable signature',
     p:'<p>You do not need to introspect about whether you are hoarding. Two queries answer it.</p>',
     code:C('# notes captured but never reviewed',
            'obsidian search "[source_kind:external] -[reviewed]"',
            '',
            '# ratio of inbox to everything else',
            'obsidian search "[status:inbox]" | wc -l')},
    {h:'One inbox, one sync engine',
     p:'<p>If you run more than one capture pipeline — a browser clipper, a phone shortcut, a mail-to-vault rule, an agent that writes notes — route all of them into <b>one</b> inbox folder, and let exactly <b>one</b> sync engine own the vault directory. Two sync engines over the same files is the reliable way to produce conflict files, and bulk agent writes during a sync window is the reliable way to trigger it.</p>'}
  ],
  lab:{title:'Capture one real article twice and force a conflict',
    steps:[
      'Clip a real article into the practice vault with Web Clipper. Set <code>source_kind: external</code> and <code>source_url</code> in the clipper template so you never have to remember.',
      'Write a <b>separate</b> interpretation note that links to it. Put your conclusions there and nothing else.',
      'In the interpretation note, mark one claim <code>unverified</code> and one <code>verified</code> explicitly in the prose.',
      'Turn on the Interpreter with a local Ollama endpoint if you have one, or any provider key, and clip a second article with a summarisation prompt. Set <code>source_kind: generated</code> on the summary section.',
      'Run the two collector-fallacy queries above against your <b>real</b> vault. Write the ratio down.',
      '<b>Break it deliberately:</b> with the vault in a sync folder, edit the same note on two devices while both are offline, then bring both online. Find the conflict file. This is what a two-writer vault produces, and it is what an agent writing during a sync window produces too.'],
    verify:'You have a source note and an interpretation note that are separate files, and you have produced and resolved one sync conflict on purpose.'},
  gotchas:[
    {s:'trap',t:'A summary with no <code>source_kind</code> becomes indistinguishable from your own thinking',d:'Six months on, an unlabeled note reads as something you concluded. It gets cited in a decision, embedded in your index, and returned as authoritative context. There is no forensic way to recover the distinction later — the field has to be written at capture time or it does not exist.'},
    {s:'trap',t:'Two sync engines over one vault produce conflict files, not errors',d:'obsidian-git alongside iCloud, or Dropbox alongside Syncthing, will each resolve the other&#39;s writes as remote changes. You get <code>.md.conflict</code> files or silently diverging copies, and the first symptom is usually a note that lost a paragraph.'},
    {s:'trap',t:'Agent writes during a sync window are the same bug with a faster clock',d:'A bulk write of forty notes by an agent looks to a sync client exactly like a bulk remote change. Pause sync for bulk agent writes, or write into a folder the sync engine does not watch and move the results in afterwards.'},
    {s:'cost',t:'The Interpreter sends page content to a third party at clip time',d:'It goes directly to the provider you configured, and Obsidian stores nothing about the request — but the provider is a third party with its own terms. For anything you would not paste into a chat window, point it at a local Ollama endpoint instead of a hosted one.'},
