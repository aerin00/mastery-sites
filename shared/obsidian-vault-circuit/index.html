    {s:'trap',t:'A silently degraded retriever returns confident, slightly-wrong results',d:'Change the chunk size, the embedding model, or an exclusion rule and nothing tells you the system got worse. Results still arrive, still scored, still plausible. The only instrument that catches this is the evaluation set, re-run.'},
    {s:'cost',t:'Excluding unreviewed notes from the index means a review backlog is a retrieval gap',d:'This is the correct tradeoff and you should still know you made it. Notes you have not reviewed are invisible to your own search. If that becomes painful, the answer is to review them, not to open the gate.'},
    {s:'stale',t:'"Mark AI content so readers know" as the whole story',d:'The reader is not the point. The <b>indexer</b> is the point. Marking exists so a machine can exclude it from the corpus before it becomes retrievable evidence for the next generation. A marker that only a human sees does nothing about the feedback loop.'},
    {s:'ok',t:'The gate is a boolean and a filter, not a governance programme',d:'One field that starts false, one human action that sets it, one line in the indexer. Anything more elaborate is something you will stop maintaining within a month.'}
  ],
  quiz:[
    {q:'Describe the feedback loop that forms when an agent can write into an indexed vault, and name the three compounding harms.',a:'Generated text becomes a note, the note gets chunked and indexed, retrieval returns it as evidence, and the model generates from it — closing the loop with no gate. The harms: it dilutes precision, because every generated chunk competes for a slot in the token budget; it launders confidence, as a hedged claim becomes a flat assertion on the second pass and a cited fact on the third; and it is indistinguishable after the fact, because if <code>source_kind</code> was not written at creation the information simply does not exist.'},
    {q:'Name the two fields that constitute the gate, and state who may set each.',a:'<code>source_kind</code>, set by whatever created the note, valued personal, external, or generated. And <code>reviewed</code>, which starts false and may only be set to a date by a human. The second one is the gate; the first one is what makes the gate query possible.'},
    {q:'Where should the review gate be enforced, and why is the index-time enforcement the important one?',a:'At write time with a <code>PostToolUse</code> hook that stamps the fields, and at index time with an exclusion in the indexer. Index-time is the important one because it contains a failure of the other: a note that slipped through unstamped still exists in the vault but cannot be retrieved as evidence until a human touches it.'},
    {q:'Why is "mark AI content so readers know" an incomplete framing?',a:'The reader is not the consumer that matters. The indexer is. The marker exists so a machine can exclude generated text from the retrievable corpus before it becomes evidence for the next generation. A marker only a human sees does nothing about the feedback loop.'},
    {q:'Why is a vault a prompt-injection surface, and what is the only layer that holds?',a:'It contains clipped pages written by other people, and an agent reading a note cannot distinguish content about a topic from content addressed to the reader. Prose in <code>CLAUDE.md</code> is exactly the layer hostile note content competes with, so it cannot be the defence. A <code>PreToolUse</code> hook denying access to a path does not care what any note says.'}
  ],
  docs:[['Claude Code hooks','https://code.claude.com/docs/en/hooks'],['Obsidian properties','https://obsidian.md/help/properties']]
},
{
  id:'p13', n:'13', title:'Capstone', layer:'l5', layerLabel:'Return',
  time:'A day', pre:'All phases',
  objective:'You run the whole circuit against your <b>real</b> vault, end to end, and you can hand it to someone else without improvising a single undocumented step.',
  concepts:[
    {h:'The circuit, in one diagram',
     code:C('SUBSTRATE   files on disk, links that resolve',
            '     |',
            'STRUCTURE   properties, Bases, a capture contract',
            '     |',
            'RETRIEVAL   headings as chunks, BM25 + vectors, RRF, an eval set',
            '     |',
            'INTEGRATION Claude Code, MCP scopes, hooks that enforce, the CLI',
            '     |',
            'RETURN      provenance stamped, review gated, index filtered',
            '     |',
            '     +-------> back into SUBSTRATE, but only through the gate')},
    {h:'The five invariants',
     p:'<ol><li><b>The file wins.</b> Every index, embedding, cache, and summary is derived and rebuildable. If you cannot write the command that regenerates a thing, you have created a second source of truth.</li><li><b>Exact before semantic, structure before either.</b> A structural fix to a note improves every retrieval system at once and permanently. A retriever improvement helps one system until you replace it.</li><li><b>Prose asks; mechanisms enforce.</b> Anything you actually depend on exists twice: in <code>CLAUDE.md</code> so the model cooperates, and in a hook so it does not matter whether it does.</li><li><b>Embedding is irreversible.</b> The credential filter runs inside the indexer, before the write, not as a documented policy.</li><li><b>Nothing a model wrote is evidence until a human said so.</b> One field, one human action, one line in the indexer.</li></ol>'},
    {h:'The ship checklist',
     table:{head:['#','Check','Passes when'],rows:[
       ['1','Baseline recorded','Seven numbers from Phase 00 exist in a note'],
       ['2','Property migration done','No pre-1.9 singular keys anywhere'],
       ['3','Vocabulary closed','Four keys, written down, applied by a template'],
       ['4','Vault under git','Baseline commit, and <code>plugins/*/data.json</code> ignored'],
       ['5','Exclusion list enforced','Credential folders filtered <b>in the indexer</b>'],
       ['6','Evaluation set scored','Ten questions, three columns filled'],
       ['7','Index rebuildable','One command, run once, from scratch, timed'],
       ['8','Incremental reindex works','Edit a note, requery, get the new text'],
       ['9','MCP scope known','You can say which scope and who approved it'],
       ['10','Enforcement tested','A <code>PreToolUse</code> hook actually blocked a write'],
       ['11','Provenance stamped','Agent-written notes carry both fields, automatically'],
       ['12','Gate proven','A query returns unreviewed generated notes; the index excludes them'],
       ['13','One sync engine','Confirmed, and paused during bulk agent writes'],
       ['14','Recovery rehearsed','Index deleted and rebuilt, in full, at least once']]}},
    {h:'What this path deliberately does not cover',
     p:'<p>A curriculum that covers everything covers nothing. These were excluded on purpose, and each has its own documentation.</p>',
     table:{head:['Excluded','Where it lives'],rows:[
       ['Knowledge-management methodology — Zettelkasten, PARA, LYT, Johnny Decimal','Their own literature. This path is deliberately method-agnostic: every technique here works under any of them, and the AI-linking debate (machine as candidate generator, human as acceptor) is the only part that changes. Note the distinction from what Phase 00 <i>does</i> give you: a five-folder starter scaffold with stated delete conditions is not a methodology. It is the minimum needed to reach twenty notes, at which point you have a corpus and can choose a method on evidence'],
       ['Plugin development and the Obsidian plugin API','Obsidian developer documentation'],
       ['Writing MCP servers rather than consuming them','modelcontextprotocol.io — build a server'],
       ['Reranking models and query rewriting','Phase 07 stops at RRF, which is where the cost curve bends'],
       ['Publishing — Obsidian Publish, Quartz, digital gardens','A different problem: outward distribution, not inward retrieval'],
       ['Spaced repetition inside the vault','The spaced-repetition plugin ecosystem and Anki'],
       ['Multi-user and team vaults','Genuinely unsolved; treat any advice sceptically'],
       ['Mobile','No CLI, restricted plugins. Everything here assumes desktop']]}},
    {h:'The stopping criterion',
     p:'<p>Not "the system contains everything". It is this: you can go from a question to a grounded, cited answer, know which layer produced each part of it, and know what would have to break for the answer to be wrong. If a simpler configuration already does that for your vault, <b>stop there.</b> Phase 07 is a genuine upgrade and not a rite of passage, and plenty of real vaults are best served by good structure, core search, and an agent pointed at the folder.</p>'}
  ],
  lab:{title:'Run the circuit on your real vault, then hand it to someone cold',
    steps:[
      'Work the ship checklist top to bottom against your <b>real</b> vault. Every row gets a yes or a written reason it does not apply.',
      'Write a personal operating manual in the vault: which layer you use for which kind of question, and the one command that rebuilds each derived artifact.',
      'Run your ten evaluation questions one final time and record the scores beside the Phase 06 and Phase 07 numbers. Three columns of history is the artifact.',
      '<b>Break it deliberately:</b> delete your entire index and rebuild it from the operating manual alone, without looking at your shell history. Every step you had to improvise is a missing line in the manual. Add them.',
      'Hand the manual and this site to one other person and watch them set up a practice vault. Every question they ask is also a missing line.',
      'Write down the one simplification you would make if you started again. That sentence is worth more than the rest of the manual.'],
    verify:'Someone else reached a grounded, cited answer from a practice vault using only your manual and this site, without asking you a question.'},
  gotchas:[
    {s:'trap',t:'A system nobody can rebuild is a system that ends at its first corruption',d:'The index rebuild works in your shell history and nowhere else. The test is not whether it can be rebuilt — it is whether it can be rebuilt from the manual, by someone who is not you, without improvisation.'},
    {s:'cost',t:'Every layer has a maintenance cost that is invisible on the day you build it',d:'The index needs reindexing, the hooks need updating when event names change, the vocabulary needs enforcing, the evaluation set needs re-running. Budget for it or build fewer layers on purpose.'},
    {s:'ok',t:'Stopping at a simpler layer is a valid outcome',d:'A plaintext vault with good headings, a closed property vocabulary, core search, and an agent pointed at the folder solves a large fraction of real problems. Phase 07 exists for the vaults that measured a need for it, not for everyone who finished Phase 06.'},
    {s:'ok',t:'The system you maintain beats the system you designed',d:'Every component you add is a component you have agreed to keep working. Two layers you actually run beat five you built once.'}
  ],
  quiz:[
    {q:'State the five invariants of the circuit.',a:'The file wins — everything derived must be rebuildable by a command you can write. Exact before semantic and structure before either, because a structural fix improves every retrieval system permanently. Prose asks and mechanisms enforce, so anything you depend on exists both in <code>CLAUDE.md</code> and in a hook. Embedding is irreversible, so filtering happens inside the indexer before the write. And nothing a model wrote is evidence until a human said so.'},
    {q:'What is the stopping criterion for this whole path?',a:'Not completeness. It is that you can go from a question to a grounded, cited answer, name which layer produced each part of it, and say what would have to break for the answer to be wrong. If a simpler configuration already achieves that on your vault, stopping there is the correct outcome — semantic retrieval is an upgrade you measure a need for, not a rite of passage.'},
    {q:'Name three things this path deliberately excludes and why the exclusions are stated at all.',a:'Knowledge-management methodology, MCP server authoring, publishing, reranking, spaced repetition, team vaults, and mobile. They are stated because a curriculum that claims to cover everything gives the reader no way to know where the edge of the map is, and the edge is exactly what they need in order to go further on their own.'},
    {q:'What is the real test of whether your system is rebuildable?',a:'Not whether you can rebuild it — you have your shell history. Whether someone who is not you can rebuild it from your written operating manual without improvising a step. Every improvisation is a missing line, and the only way to find them is to delete the index and try.'}
  ],
  docs:[['Obsidian help','https://obsidian.md/help'],['Claude Code docs','https://code.claude.com/docs/en/overview'],['MCP docs','https://modelcontextprotocol.io/']]
}

const AUDIT = {
 intro:'Two source documents were supplied. The first is a curriculum blueprint for an Obsidian-plus-AI mastery guide; the second is a currency audit of a third-party guide (blakecrosley.com) plus source material for the same project. I checked both against primary sources on 21 August 2026: the Obsidian changelog and help pages, code.claude.com documentation, blog.modelcontextprotocol.io, the named GitHub repositories, and the npm registry. Overall verdict: both documents are unusually accurate for material in a fast-moving ecosystem, and the second is more accurate than the first. The errors that exist are concentrated in exactly one place — command-level detail for third-party tools — which is the failure mode both documents predicted about the guide they were auditing. Findings are sorted below into what holds, what has moved, what is wrong, and what neither document mentions.',
 groups:[

 {label:'Holds up', tag:'holds', items:[
   {c:'Both documents insist that Markdown files are the source of truth and that indexes, embeddings, caches, and AI summaries are derived artifacts.',f:'Correct, and it is the most load-bearing claim in either document. It is also stronger than stated: it settles the arbitration rule for the whole system, and it is the reason "can I write the command that rebuilds this?" is a usable test for whether you have accidentally created a second source of truth.'},
   {c:'Doc 1: Claude Code MCP scopes are <code>local</code>, <code>project</code>, and <code>user</code>, with local as the default and project using <code>.mcp.json</code> with approval handling.',f:'Verified exactly. Worth adding what neither document states: precedence runs local, project, user, plugin-provided, then claude.ai connectors, and <b>entries never merge</b> — the whole definition from the highest-precedence source is used.'},
   {c:'Doc 1: <code>mcpServers</code> should not be placed in <code>settings.json</code> as if it were an MCP registry.',f:'Correct. And the reason it matters is the failure shape: the file parses, the session starts, and the server is simply absent. Nothing reports the mistake.'},
   {c:'Doc 1: command hooks receive JSON on stdin and should not assume positional shell arguments.',f:'Verified. This is the highest-value correction in Doc 1, because the failure is silent — a script reading <code>$1</code> evaluates its guard against empty variables, finds nothing wrong, and exits 0 on every tool call.'},
   {c:'Doc 2: Obsidian ships no first-party AI in the core app by deliberate policy, with the Web Clipper Interpreter as the sole exception.',f:'Verified. The Interpreter offers eleven preset providers plus custom endpoints, and the help page states that requests go directly to the provider you choose and that Obsidian does not gather or store data about them. Ollama being on that preset list is the detail worth carrying forward: a fully local clip-time summarisation path exists with no community plugin.'},
   {c:'Doc 2: Bases shipped as a core plugin in 1.9.0, and 1.9 removed the singular property keys <code>tag</code>, <code>alias</code>, <code>cssclass</code>.',f:'Verified against the 1.9.0 changelog, which also states that the values of these properties must be a list. Doc 2 is right that this is a breaking change; what it understates is how it fails — an unmigrated note renders normally, has no tags as far as the app is concerned, and is invisible to every tag query and Base with no error anywhere.'},
   {c:'Doc 2: Obsidian became free for commercial use on 20 February 2025, with the Commercial license now optional.',f:'Verified against the announcement. The <b>$50/user/year</b> figure Doc 2 attaches to it is not stated in that announcement — treat the price as <span class="unv">unverified</span> while the policy change itself is solid.'},
   {c:'Doc 2: Dataview is dormant, last released 0.5.70 in April 2025, with Bases as the successor for table views.',f:'Verified — 0.5.70, 7 April 2025, sixteen months old at the time of writing. The framing Doc 2 lands on is the accurate one: dormant but functional, still unmatched for inline and task queries, and no longer the right reflexive first install.'},
   {c:'Doc 2: the npm collision between <code>obsidian-mcp</code> (file-based) and <code>obsidian-mcp-server</code> (REST-backed) is a real footgun.',f:'Verified, and worth stating more sharply than either document does: the wrong package starts cleanly, connects successfully, and exposes tools that cannot reach your vault. There is no error to diagnose.'},
   {c:'Doc 2: chunk at H2 boundaries; hybrid BM25 plus vector with RRF beats either alone; scrub credentials before embedding.',f:'Sound as design guidance, and the credential point deserves more weight than it gets in either document — it is the one irreversible step in the entire pipeline. Text in a vector store can only be removed by rebuilding the store, so the filter has to live inside the indexer, not in a policy document.'},
   {c:'Doc 2: <code>kepano/obsidian-skills</code> represents the officially-sanctioned integration shape.',f:'Verified. The repository contains five skills — obsidian-markdown, obsidian-bases, json-canvas, obsidian-cli, and defuddle — and the pattern it embodies (open formats plus external agent tooling, rather than AI in the app) is the architectural assumption to build on.'}
 ]},

 {label:'Stale, incomplete, or overstated', tag:'stale', items:[
   {c:'Doc 1: "The article names 1.13.7. Official changelog shows desktop 1.13.7 public, with a newer mobile 1.13.8 patch on Aug 20."',f:'Accurate as of 21 August 2026 and correctly separates the two release trains, which most guides do not. Both numbers will be wrong within weeks. The durable form of the point is the structural one Doc 1 makes and then buries: desktop and mobile ship separately, so any guide naming one version number is describing one platform while implying both.'},
   {c:'Doc 1: "Current hooks have many more lifecycle events and support structured <code>additionalContext</code>, decisions, and output replacement."',f:'True and substantially understated. The current surface spans session, turn, tool-call, batch, subagent, context-lifecycle, and environment events. More importantly, Doc 1 never states the fact that breaks most hook scripts: <b><code>exit 1</code> does not block</b>. It is a non-blocking failure — the notice appears and the action proceeds. Exit 2 blocks. Every guard written the obvious way is a guard that logs its objection and watches the write happen.'},
   {c:'Doc 1: the <code>PostToolUse</code> compression claim "needs qualification... current Claude Code supports <code>updatedToolOutput</code> and <code>additionalContext</code> after tool execution."',f:'Correct and the qualification is the right one. What is missing is the operational consequence: trimming a large output <i>before it lands</i> is real and useful; shrinking material already in the transcript is not possible. Those are different capabilities that the phrase "context compression" conflates.'},
   {c:'Doc 1: "Hybrid BM25 + vector retrieval — good design pattern, not a universal performance guarantee."',f:'The right instinct, stated too weakly to act on. The concrete version: on a corpus dominated by identifiers and code symbols, BM25 alone can beat hybrid, because the vector half contributes confident near-misses (<code>get_user_v2</code> and <code>get_user_v3</code> embed almost identically). This is precisely what an evaluation set is for — the answer is a measurement on your vault, not a property of retrieval.'},
   {c:'Doc 2: "MCP spec evolution — plausible and well-sourced-in-text... claims about the June 2025 and November 2025 revisions and a 2026-07-28 spec are internally consistent."',f:'The 2026-07-28 revision is real and is the current one. Doc 2 hedged where it could have verified, and in doing so missed the substance — see the gap section below, because what changed in that revision matters more than that it exists.'},
   {c:'Doc 2 on in-editor plugins: Copilot star counts, Smart Connections paywall complaints, the "2026 agent-plugin wave" (Claudian, Cortex, VaultSearch, and others).',f:'The shape is right and the specifics are the most perishable content in either document. From the repositories on 21 August 2026: Smart Connections was at 4.5.3 (4 June 2026), ships a local embedding model, needs no API key, and gates inline and footer connections, configurable scoring, and Bases integration behind Pro — which makes both "fully free and local" and "meaningfully paywalled" half-true, exactly as Doc 2 suspected. Copilot&#39;s frontend is open source with a proprietary backend, and it documents that you cannot change embedding model after indexing without breaking results. Smart Composer supports MCP and local models via Ollama and states in its own README that it is not under active development. Khoj I could not verify from a primary source and have marked <span class="unv">unverified</span> throughout.'}
 ]},

 {label:'Wrong', tag:'wrong', items:[
   {c:'Doc 1, Phase 6: <code>claude mcp add obsidian --scope local -- npx -y obsidian-mcp@2 serve --vault notes=/absolute/path/to/practice-vault</code>',f:'<b>The server arguments are wrong.</b> The Claude Code half of the command is correct. The <code>obsidian-mcp</code> half describes an interface that does not exist: there is no <code>serve</code> subcommand and no <code>--vault name=path</code> flag. The package takes <b>absolute vault paths as positional arguments</b>, one or more of them: <code>npx -y obsidian-mcp /absolute/path/to/vault</code>. Doc 1 deserves credit for flagging this line as unverified until tested locally — that caveat is exactly what saved it from being a trap. The package itself is real and current: <code>obsidian-mcp</code> 2.0.1, published 14 August 2026, twelve tools including read, create, edit, delete, move, and tag management, with a README that asks you to back up your vault first because it has write access.'},
   {c:'Doc 1: "MCP 2026-07-28 is current, with a modern stateless HTTP era and extension model" — presented as a minor currency note.',f:'The facts are right and the framing is wrong in a way that matters. This is not a version bump to note in a changelog view; it is a change of protocol shape. Treating it as a footnote means a reader keeps building a mental model — persistent sessions, a handshake, server-initiated requests over held-open streams — that the current specification has removed. See the gap section.'},
   {c:'Doc 1 lists MCP scopes and approval as needing "a dedicated lab", but never states which sessions bypass approval entirely.',f:'This is an omission that functions as an error, because it inverts the safety story. Project-scoped server approval is an <b>interactive</b> prompt. <code>claude -p</code>, Agent SDK sessions, and cloud sessions cannot display it, so they load project-scoped servers <b>without asking</b> — as does a session started in <code>bypassPermissions</code> with <code>skipDangerousModePermissionPrompt</code>. A reader taught that <code>.mcp.json</code> servers require approval will reasonably assume a committed <code>.mcp.json</code> is safe in automation. It is not. <code>disabledMcpjsonServers</code> blocks a server in every mode; <code>--setting-sources</code> excludes project settings entirely.'},
   {c:'Doc 2: "no primary source confirms a 5M users figure; the closest primary figure is over 10,000 organizations."',f:'The correction is right and Doc 2 should go one step further: the "over 10,000 organizations" figure comes from the February 2025 announcement and is therefore itself eighteen months old. It is a floor from a specific date, not a current user count, and citing it as a scale claim in 2026 repeats the same category of error in a smaller size.'}
 ]},

 {label:'Missing entirely', tag:'gap', items:[
   {c:'The Local REST API plugin now serves MCP itself, which makes the community bridge server optional.',f:'<b>The largest gap in either document, and it invalidates the setup instructions in most published Obsidian-plus-AI guides.</b> The plugin exposes a built-in MCP server at <code>https://127.0.0.1:27124/mcp/</code> over Streamable HTTP with bearer-token auth, plus an optional plain HTTP endpoint on 27123. Doc 2 gestures at this in one clause; Doc 1 does not mention it at all and routes the learner through a community npm package instead. The consequence is architectural rather than cosmetic: there are two genuinely different routes into a vault — through the running app, or through the folder on disk — and they differ in whether Obsidian must be open, what they can see, and how they authenticate. A curriculum that teaches only one leaves the reader unable to choose.'},
   {c:'What actually changed in MCP 2026-07-28.',f:'Neither document says. The protocol became <b>stateless request/response</b>: the <code>initialize</code> / <code>initialized</code> handshake and session IDs were removed, so requests are self-contained and can land on any instance behind a load balancer. Method and tool names moved into <code>Mcp-Method</code> and <code>Mcp-Name</code> HTTP headers so gateways route without parsing bodies. HTTP+SSE was formally deprecated with a twelve-month transition. Multi Round-Trip Requests replaced server-initiated requests: a server returns <code>resultType: "input_required"</code> and the client retries with <code>inputResponses</code>. List responses carry <code>ttlMs</code> and <code>cacheScope</code>. An extensions framework was formalised, with Tasks moving to <code>io.modelcontextprotocol/tasks</code> and Roots, Sampling, and Logging formally deprecated on a twelve-month minimum support window. Any material written against the stateful session model is describing a protocol that no longer works that way.'},
   {c:'The closed loop: an agent writing into an indexed vault creates a feedback loop, not just untidy notes.',f:'Doc 2 raises provenance and "AI slop" and Doc 1 raises capture hygiene, but neither states the mechanism. Generated text becomes a note, the note is chunked and indexed, retrieval returns it as evidence, and the model generates from it. Three compounding harms follow: precision dilutes as generated chunks compete for the token budget; confidence launders as a hedged claim becomes a flat assertion on the second pass and a cited fact on the third; and the distinction is unrecoverable after the fact, because if <code>source_kind</code> was not written at creation, the information does not exist. The gate is small — one field that starts false, one human action, one exclusion line in the indexer — and the index-time enforcement is the one that matters, because it contains a failure of the write-time one.'},
   {c:'Property types are vault-wide, and a type mismatch removes a note from results with no error.',f:'Both documents cover properties as a concept and neither covers the failure. The first note that defines a key sets its type for the whole vault, so writing <code>reviewed: 2026-08-21</code> in one note and <code>reviewed: yes</code> in another produces a conflict that Obsidian resolves rather than refuses. The affected note silently stops matching date-range filters and Bases queries. This masquerades as a retrieval problem for months, and adding semantic search does not fix it — improved recall merely hides it.'},
   {c:'Bases namespace errors render an empty column rather than raising an error.',f:'Doc 2 documents the Bases syntax well and does not mention this. <code>file.status</code> where you meant <code>note.status</code> is perfectly valid syntax referring to a file property that does not exist. The view loads, the column is blank, and it is indistinguishable from a truthful answer of "no note has this value" — so you can act on it without ever noticing.'},
   {c:'Local model context windows truncate rather than refuse.',f:'Doc 2 mentions setting <code>num_ctx</code> in passing and does not say why it is the highest-value line in the local-model section. Ollama defaults a model&#39;s context window well below what the model supports, and an over-long prompt is truncated silently. The model answers fluently about the fraction it received. On vault RAG — where you are deliberately stuffing retrieved chunks into context — the truncated portion is exactly the material you retrieved, and the symptom presents as a plugin that "does not seem to read my notes properly".'},
   {c:'Skill descriptions are truncated at 1,536 characters, which is why a well-written skill can never fire.',f:'Neither document covers skills at the mechanism level. <code>description</code> and <code>when_to_use</code> are truncated together at 1,536 characters in the listing the model reads to judge relevance, so a skill whose trigger conditions sit after a long preamble has them cut off and is never selected — with no error. Related and equally unstated: once a skill loads, its body stays in context for the rest of the session, making every line a recurring cost rather than a one-time load.'},
   {c:'The vault is a prompt-injection delivery mechanism.',f:'Doc 1 states the principle — treat external note content as data, not instructions — as a bullet in a security phase. Neither document draws the conclusion. Your vault contains clipped pages written by other people; an agent reading a note cannot distinguish content <i>about</i> a topic from content <i>addressed to</i> the reader. This is the decisive argument for enforcement over instruction: prose in <code>CLAUDE.md</code> is exactly the layer hostile note content competes with, so it cannot be the defence. A <code>PreToolUse</code> hook denying a path does not care what any note says.'},
   {c:'Heading renames break every reference to them, silently, while file renames are handled.',f:'Neither document mentions it. Obsidian rewrites wikilinks when a file is renamed or moved. It does not when a <i>heading</i> is renamed: <code>[[Note#Old heading]]</code> keeps normal styling and points at nothing. This is the strongest practical argument for block references (<code>^block-id</code>) over heading references in anything you intend to cite twice — a block id is opaque, so nobody ever edits it for style.'},
   {c:'A stale index answers with full confidence, and nothing in the stack reports degradation.',f:'Doc 1 lists staleness as a retrieval primitive to define. The operational point is missing: there is no field in a retrieval result saying "indexed eleven days and forty edits ago", so a model treats a stale passage as current. This is the most common way a working retrieval system starts producing wrong answers with nobody noticing, and the same blindness applies to any change in chunking, embedding model, or exclusion rules — results still arrive, still scored, still plausible. The only instrument that catches it is an evaluation set, re-run.'}
 ]}
 ]
};

/* ============================================================
   Vault Circuit — app
   ============================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* ---- storage: never load-bearing ---- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(SITE.key)||'{}'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem(SITE.key,JSON.stringify(v)); }catch(e){} }
};
let mem = {};
try { mem = JSON.parse(localStorage.getItem(SITE.key)||'{}'); } catch(e){ mem = {}; }
let state = mem;

const doneLab  = id => !!state['lab:'+id];
const doneQ    = (id,i) => !!state['q:'+id+':'+i];
const phaseDone = p => doneLab(p.id) && p.quiz.every((_,i)=>doneQ(p.id,i));
const phasePart = p => doneLab(p.id) || p.quiz.some((_,i)=>doneQ(p.id,i));

/* ---- theme ---- */
(function(){
  let t=null; try{ t=localStorage.getItem(SITE.key+'-theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme',t);
  $('#theme').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem(SITE.key+'-theme',next); }catch(e){}
  });
})();

/* ---- chrome built from SITE ---- */
document.title = SITE.title;
$('#brandname').textContent = SITE.title;
$('#brandtag').textContent  = SITE.tag;
if(typeof AUDIT === 'undefined') $('.modes button[data-mode="audit"]').remove();
$('#legend').innerHTML = '<h4>'+SITE.spine+'</h4>' + SITE.layers.map(l =>
  '<div class="row"><span class="swatch" style="background:var(--'+l.token+')"></span>'+l.label+'</div>').join('');

/* ---- routing ---- */
let mode='learn', current=PHASES[0].id;

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  render();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{ $('#q').value=''; setMode(b.dataset.mode); }));
$('#reset').addEventListener('click',()=>{
  if(!confirm('Clear all phase progress?')) return;
  state={}; store.set(state); render(); buildRail();
});

/* ---- rail ---- */
function buildRail(){
  const nav=$('#pnav'); nav.innerHTML='';
  PHASES.forEach(p=>{
    const a=el('a',p.id===current&&mode==='learn'?'on':'');
    a.href='#'+p.id;
    const cls = phaseDone(p)?'tick done':(phasePart(p)?'tick part':'tick');
    a.innerHTML='<span class="n">'+p.n+'</span><span>'+p.title+'</span><span class="'+cls+'">✓</span>';
    a.addEventListener('click',e=>{ e.preventDefault(); current=p.id; if(mode!=='learn') setMode('learn'); else render(); buildRail(); window.scrollTo({top:0,behavior:'smooth'}); });
    nav.appendChild(a);
  });
}

/* ---- render pieces ---- */
function codeBlock(src){
  const w=el('div','codewrap');
  const pre=el('pre','',  '<code>'+esc(src)+'</code>');
  const btn=el('button','copy','copy');
  btn.addEventListener('click',()=>{
    navigator.clipboard.writeText(src).then(()=>{
      btn.textContent='copied'; btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('done'); },1400);
    }).catch(()=>{ btn.textContent='select it'; });
  });
  w.appendChild(pre); w.appendChild(btn);
  return w;
}
function tableBlock(t){
  const w=el('div','tablewrap');
  let h='<table><thead><tr>'+t.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  h+=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  h+='</tbody></table>';
  w.innerHTML=h;
  return w;
}
function sec(label,count){
  const h=el('h2','sec',label+(count!=null?' <span class="cnt">'+count+'</span>':''));
  return h;
}

/* ---- learn view ---- */
function renderPhase(p){
  const v=$('#view'); v.innerHTML='';

  // progress strip
  const totalUnits = PHASES.reduce((a,x)=>a+1+x.quiz.length,0);
  const doneUnits  = PHASES.reduce((a,x)=>a+(doneLab(x.id)?1:0)+x.quiz.filter((_,i)=>doneQ(x.id,i)).length,0);
  const pct = Math.round(doneUnits/totalUnits*100);
  const pr=el('div','prog');
  pr.innerHTML='<div class="top"><span class="lbl">Path progress</span><span class="pct">'+pct+'%</span></div>'+
    '<div class="bar">'+PHASES.map(x=>'<i class="'+(phaseDone(x)?'done':(phasePart(x)?'part':''))+'"></i>').join('')+'</div>';
  v.appendChild(pr);

  const head=el('div');
  head.innerHTML='<div class="eyebrow">Phase '+p.n+' · '+p.layerLabel+' layer</div><h1 class="ptitle">'+p.title+'</h1>'+
    '<div class="meta"><span class="chip '+p.layer+'">'+p.layerLabel+'</span>'+
    '<span class="chip">'+p.time+'</span><span class="chip">prereq: '+p.pre+'</span></div>';
  v.appendChild(head);
  v.appendChild(el('div','objective',p.objective));

  v.appendChild(sec('Concepts',p.concepts.length));
  p.concepts.forEach(c=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',c.h));
    if(c.p) d.insertAdjacentHTML('beforeend',c.p);
    if(c.table) d.appendChild(tableBlock(c.table));
    if(c.code) d.appendChild(codeBlock(c.code));
    if(c.p2) d.insertAdjacentHTML('beforeend',c.p2);
    if(c.code2) d.appendChild(codeBlock(c.code2));
    v.appendChild(d);
  });

  v.appendChild(sec('Lab'));
  const lab=el('div','lab');
  lab.innerHTML='<h3>'+p.lab.title+'</h3><ol>'+p.lab.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
    '<p style="margin:14px 0 0"><b>Done when:</b> '+p.lab.verify+'</p>';
  const dl=el('div','done-line');
  const cb=el('input'); cb.type='checkbox'; cb.id='lab-'+p.id; cb.checked=doneLab(p.id);
  cb.addEventListener('change',()=>{ state['lab:'+p.id]=cb.checked; store.set(state); buildRail(); renderPhase(p); });
  const lb=el('label'); lb.htmlFor=cb.id; lb.appendChild(cb); lb.appendChild(document.createTextNode('Lab complete'));
  dl.appendChild(lb); lab.appendChild(dl);
  v.appendChild(lab);

  v.appendChild(sec('Gotchas',p.gotchas.length));
  p.gotchas.forEach(g=>{
    const d=el('div','gotcha');
    d.innerHTML='<span class="sev '+g.s+'">'+g.s+'</span><span><b>'+g.t+'</b>'+g.d+'</span>';
    v.appendChild(d);
  });

  v.appendChild(sec('Checkpoint',p.quiz.length));
  p.quiz.forEach((q,i)=>{
    const d=el('details','qa');
    d.innerHTML='<summary>'+q.q+'</summary><div class="ans">'+q.a+
      '<div class="done-line" style="border-top-color:var(--line)"><label style="color:var(--muted)">'+
      '<input type="checkbox" '+(doneQ(p.id,i)?'checked':'')+'> I could answer this without looking</label></div></div>';
    d.querySelector('input').addEventListener('change',e=>{
      state['q:'+p.id+':'+i]=e.target.checked; store.set(state); buildRail();
      const strip=$('.prog'); if(strip) renderPhase(p);
    });
    v.appendChild(d);
  });

  if(p.docs&&p.docs.length){
    v.appendChild(sec('Source docs'));
    const dd=el('div','docs');
    dd.innerHTML=p.docs.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' ↗</a>').join('');
    v.appendChild(dd);
  }

  const idx=PHASES.indexOf(p);
  const navd=el('div','done-line'); navd.style.borderTop='1px solid var(--line)'; navd.style.marginTop='40px';
  if(idx>0){ const b=el('button','btn','← '+PHASES[idx-1].title); b.onclick=()=>{current=PHASES[idx-1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  if(idx<PHASES.length-1){ const b=el('button','btn prime',PHASES[idx+1].title+' →'); b.onclick=()=>{current=PHASES[idx+1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  v.appendChild(navd);
}

/* ---- reference view ---- */
function renderRef(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Reference</div><h1 class="ptitle">Lookup and decisions</h1>'+
    '<p class="lede">'+SITE.refLede+'</p>';

  v.appendChild(sec('Decision trees',TREES.length));
  TREES.forEach(t=>{
    v.appendChild(el('h3','',t.title));
    const wrap=el('div','tree');
    t.rows.forEach(r=>{
      const b=el('div','branch');
      b.innerHTML='<span class="cond">'+r[0]+'</span><span class="arr">→</span><span class="res">'+r[1]+'<em>'+r[2]+'</em></span>';
      wrap.appendChild(b);
    });
    v.appendChild(wrap);
  });

  v.appendChild(sec('Tables',REF.length));
  REF.forEach(r=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',r.title));
    if(r.note) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin:2px 0 0">'+r.note+'</p>');
    d.appendChild(tableBlock(r));
    if(r.foot) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:8px">'+r.foot+'</p>');
    v.appendChild(d);
  });
}

/* ---- drill view ---- */
let deck=[], di=0, revealed=false;
function buildDeck(){
  deck=[];
  PHASES.forEach(p=>p.quiz.forEach(q=>deck.push({q:q.q,a:q.a,src:'Phase '+p.n+' · '+p.title,pid:p.id})));
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  di=0; revealed=false;
}
function renderDrill(){
  const v=$('#view'); v.innerHTML='';
  if(!deck.length) buildDeck();
  v.innerHTML='<div class="eyebrow">Drill</div><h1 class="ptitle">Recall, not recognition</h1>'+
    '<p class="lede">'+deck.length+' cards drawn from every phase checkpoint. Answer out loud before you flip — the gap between "that looks familiar" and "I can state it" is the entire point.</p>';
  const c=deck[di];
  const card=el('div','flash');
  card.innerHTML='<div class="fsrc">'+c.src+'</div><div class="fq">'+c.q+'</div>'+
    '<div class="fa'+(revealed?'':' hide')+'">'+c.a+'</div>';
  v.appendChild(card);
  const btns=el('div','fbtns');
  const flip=el('button','btn prime',revealed?'Hide answer':'Reveal answer');
  flip.onclick=()=>{ revealed=!revealed; renderDrill(); };
  const next=el('button','btn','Next card →');
  next.onclick=()=>{ di=(di+1)%deck.length; revealed=false; renderDrill(); };
  const goto=el('button','btn','Go to phase');
  goto.onclick=()=>{ current=c.pid; setMode('learn'); buildRail(); scrollTo({top:0}); };
  const shuf=el('button','btn','Shuffle');
  shuf.onclick=()=>{ buildDeck(); renderDrill(); };
  btns.appendChild(flip); btns.appendChild(next); btns.appendChild(goto); btns.appendChild(shuf);
  btns.appendChild(el('span','counter',(di+1)+' / '+deck.length));
  v.appendChild(btns);
  v.appendChild(el('p','cap','Keyboard: <kbd>space</kbd> flip · <kbd>→</kbd> next'));
}

/* ---- audit view ---- */
function renderAudit(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Audit</div><h1 class="ptitle">'+SITE.auditTitle+'</h1>'+
    '<p class="lede">'+AUDIT.intro+'</p>';
  AUDIT.groups.forEach(g=>{
    v.appendChild(sec(g.label,g.items.length));
    g.items.forEach(it=>{
      const d=el('div','verdict');
      d.innerHTML='<span class="vtag '+g.tag+'">'+g.tag+'</span><span><span class="claim">'+it.c+'</span><span class="fix">'+it.f+'</span></span>';
      v.appendChild(d);
    });
  });
  v.insertAdjacentHTML('beforeend','<hr class="hr"><p class="cap" style="margin-top:18px">'+SITE.verifiedAgainst+' Claims I could not confirm are marked <span class="unv">unverified</span> rather than restated as fact.</p>');
}

/* ---- search ---- */
function buildIndex(){
  const ix=[];
  PHASES.forEach(p=>{
    ix.push({t:'Phase '+p.n+': '+p.title,k:'phase',body:p.objective+' '+p.concepts.map(c=>c.h).join(' '),go:()=>{current=p.id;setMode('learn');buildRail();}});
    p.concepts.forEach(c=>ix.push({t:c.h,k:'Phase '+p.n,body:(c.p||'')+(c.p2||'')+(c.code||'')+(c.code2||''),go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.gotchas.forEach(g=>ix.push({t:g.t,k:'gotcha · Phase '+p.n,body:g.d,go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.quiz.forEach(q=>ix.push({t:q.q,k:'checkpoint · Phase '+p.n,body:q.a,go:()=>{current=p.id;setMode('learn');buildRail();}}));
  });
  REF.forEach(r=>ix.push({t:r.title,k:'reference table',body:(r.note||'')+' '+r.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  TREES.forEach(t=>ix.push({t:t.title,k:'decision tree',body:t.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  if(typeof AUDIT!=='undefined') AUDIT.groups.forEach(g=>g.items.forEach(i=>ix.push({t:i.c.replace(/<[^>]+>/g,''),k:'audit · '+g.label,body:i.f,go:()=>setMode('audit')})));
  return ix;
}
let INDEX=[];
function renderSearch(term){
  const v=$('#view'); v.innerHTML='';
  const t=term.toLowerCase();
  const hits=INDEX.filter(x=>(x.t+' '+x.body).toLowerCase().replace(/<[^>]+>/g,'').includes(t)).slice(0,40);
  v.innerHTML='<div class="eyebrow">Search</div><h1 class="ptitle">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(term)+'”</h1>';
  if(!hits.length){ v.appendChild(el('p','empty','Nothing matched. Try a config key, a command, or a frontmatter field.')); return; }
  const w=el('div','hits');
  hits.forEach(h=>{
    const a=el('a','hit'); a.href='#';
    a.innerHTML='<small>'+h.k+'</small><b>'+h.t+'</b>';
    a.addEventListener('click',e=>{ e.preventDefault(); $('#q').value=''; h.go(); scrollTo({top:0}); });
    w.appendChild(a);
  });
  v.appendChild(w);
}

/* ---- main render ---- */
function render(){
  const term=$('#q').value.trim();
  if(term.length>1){ renderSearch(term); return; }
  if(mode==='learn') renderPhase(PHASES.find(p=>p.id===current));
  else if(mode==='ref') renderRef();
  else if(mode==='drill') renderDrill();
  else if(typeof AUDIT!=='undefined') renderAudit(); else renderRef();
}

$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'&&document.activeElement===$('#q')){ $('#q').value=''; $('#q').blur(); render(); }
  if(mode==='drill'&&document.activeElement!==$('#q')){
    if(e.key===' '){ e.preventDefault(); revealed=!revealed; renderDrill(); }
    if(e.key==='ArrowRight'){ di=(di+1)%deck.length; revealed=false; renderDrill(); }
  }
});

INDEX=buildIndex();
buildRail();
render();

</script>
</body>
</html>
