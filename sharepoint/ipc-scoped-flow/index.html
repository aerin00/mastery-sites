  ],
  refLede: 'Decision trees and lookup tables for staying inside the BC Hydro SharePoint-only envelope.',
  auditTitle: 'Source checked against governance + Microsoft docs',
  verifiedAgainst: 'Verified against BC Hydro Power Platform governance summary (Aug 2026) and Microsoft Learn SharePoint connector / Copilot in SharePoint pages (Aug 2026).'

const K = s => '<code class="k">' + s + '</code>';
const PHASES = [
{
  id:'p0', n:'00', title:'Observe the surface', layer:'l1', layerLabel:'Governance',
  time:'20–30 min', pre:'None',
  objective:'You can open any list or library and <b>state what kind of surface it is and which governance rules apply</b> before you touch Automate.',
  concepts:[
    {h:'The single hard rule',
     p:'<p>At BC Hydro, citizen development is allowed only for solutions created from a SharePoint Online list or library and that interact only with that list or library. Everything else requires IT Advisor review.</p><p>If you start from make.powerautomate.com you are already outside the allowed path.</p>'},
    {h:'List vs library is not cosmetic',
     p:'<p>Lists hold items. Libraries hold files. Triggers differ. “When an item is created” never fires for a document library.</p>',
     table:{head:['Surface','Contains','Common triggers'],rows:[
       ['List','Items (rows + columns)','When an item is created / created or modified'],

    {h:'Why “properties only” exists',
     p:'<p>File triggers that return content can hit size limits. Properties-only returns metadata. Add Get file content only when you need the binary.</p>'}
  ],
  lab:{title:'Inventory one real list or library',
    steps:['Open a SharePoint site you use.','Pick one list and one library.','Note Site URL, name, type, key columns.','Note the exact menu labels (Integrate, Workflows).','<b>Break it:</b> confirm there is no approved Create-a-flow path outside Integrate/Workflows.'],
    verify:'You have a note that names the surface type and the only allowed entry menu.'},
  gotchas:[
    {s:'trap',t:'Starting from the Power Automate portal',d:'The flow may work in testing but violates the “created from SharePoint” rule.'},
    {s:'stale',t:'Looking for the old Automate menu',d:'2026 consolidated menus. Use Integrate or Workflows.'},
    {s:'ok',t:'Notifications are usually still allowed',d:'Email or Teams driven by a list change stays inside the SharePoint context.'}
  ],

    {q:'State the single hard governance rule.',a:'Citizen development is permitted only for solutions created from a SharePoint Online list or library that interact only with that list or library. Everything else goes to IT Advisor.'},
    {q:'Name the practical difference between a list trigger and a library trigger.',a:'List triggers use “item”; library triggers use “file”. Item triggers never fire on a document library.'}
  ],
  docs:[['Create a flow for a list or library','https://support.microsoft.com/en-us/sharepoint/lists/documents-and-library/create-a-flow-for-a-list-or-library']]
},
{
  id:'p1', n:'01', title:'Entry only', layer:'l2', layerLabel:'Entry',
  time:'30–45 min', pre:'Phase 00',
  objective:'You create every new flow <b>from the list or library itself</b> so the site and list are pre-filled.',
  concepts:[
    {h:'The only approved creation path',

  ],
  lab:{title:'Create a do-nothing flow the correct way',
    steps:['Go to your list.','Integrate → Power Automate → Create a flow.','Confirm Site Address and List Name are populated.','Save with a clear name.','<b>Break it:</b> open make.powerautomate.com and notice the missing list context. Close without saving.'],
    verify:'One flow whose trigger is already bound to the list and that was created from the list.'},
  gotchas:[
    {s:'trap',t:'Editing later and adding a new connector',d:'Adding Dataverse, SQL, or HTTP moves the flow out of the allowed box even if it started correctly.'}
  ],
  quiz:[
    {q:'Where must you start when creating a new citizen-developer flow?',a:'From the SharePoint list or library itself, using Integrate → Power Automate or the Workflows button.'},
    {q:'What signals a flow is still SharePoint-scoped?',a:'Its trigger is a SharePoint list/library event and every data action targets the same list or library.'}
  ],
  docs:[['Create a flow for a list or library','https://support.microsoft.com/en-us/sharepoint/lists/documents-and-library/create-a-flow-for-a-list-or-library']]
},
{
  id:'p2', n:'02', title:'Surface model', layer:'l3', layerLabel:'Surface',
  time:'45–60 min', pre:'Phase 01',
  objective:'You can look at any column and <b>predict whether a trigger condition can reliably test it</b>.',
  concepts:[
    {h:'Column types conditions can trust',
     p:'<p>Choice, Yes/No, Number, Date, and Person columns are reliable. Free-text Status fields are not. People type “Approved”, “approved”, “APPROVED - ready” and conditions miss them.</p>'},
    {h:'Internal names vs display names',
     p:'<p>Expressions use the internal column name. Display name “Project Status” may be <code>ProjectStatus</code> or <code>Project_x0020_Status</code>.</p>'}
  ],
  lab:{title:'Map the columns that drive decisions',
    steps:['List every column that changes during normal work.','Mark type for each.','Decide which free-text status columns should become Choice.','Note the internal name of the most important Choice column.','<b>Break it:</b> write a condition against free-text, change casing, watch the flow not fire.'],
    verify:'A short table of decision columns with type and internal name.'},
  gotchas:[
    {s:'trap',t:'Relying on free-text status for branching',d:'Works in testing with clean data, then silently skips real items with different wording.'}
  ],
  quiz:[
    {q:'Which column types are safe for reliable trigger conditions?',a:'Choice, Yes/No, Number, Date, and Person. Free-text status fields are not reliable.'},
    {q:'Why care about the internal column name?',a:'Trigger conditions and most expressions use the internal name, not the display name.'}
  ],
  docs:[['SharePoint connector','https://learn.microsoft.com/en-us/connectors/sharepoint/']]
},
{
  id:'p3', n:'03', title:'Events', layer:'l4', layerLabel:'Event',
  time:'45 min', pre:'Phase 02',
  objective:'You can choose the correct trigger and <b>predict whether it will fire once or many times</b>.',
  concepts:[
    {h:'Triggers you will actually use',
     table:{head:['Trigger','Fires when','Watch-out'],rows:[

     ]}},

  lab:{title:'Wire the right trigger and watch it fire',

{

  concepts:[

     code:C('@equals(triggerOutputs()?[\'body/Status\'], \'Approved\')',
            '@equals(triggerOutputs()?[\'body/Status/Value\'], \'Approved\')',

  lab:{title:'Add a trigger condition that actually filters',

  docs:[['Trigger condition patterns','https://ippu-biz.com/en/development/powerplatform/powerautomate/trigger-conditions-spolist/']]

{
  id:'p6', n:'06', title:'Assist', layer:'l5', layerLabel:'Assist',

    verify:'A working flow with only SharePoint actions on the same surface plus allowed notifications.'},
  gotchas:[
    {s:'trap',t:'Accepting every Copilot suggestion',d:'Copilot optimises for capability, not your governance model.'}
  ],
  quiz:[
    {q:'Maximum Copilot-in-SharePoint rules per list or library?',a:'15.'},
    {q:'What do you do when Copilot suggests a connector outside the current list?',a:'Reject it. Keep only SharePoint actions on the same list/library and allowed notifications.'}
  ],
  docs:[['Copilot in SharePoint automate workflows','https://learn.microsoft.com/en-us/sharepoint/copilot-in-sharepoint-automate-workflows']]
},

    verify:'One live compliant flow plus a written decision that either confirms scope or states why it needs IT Advisor.'},

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(SITE.key)||'{}'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem(SITE.key,JSON.stringify(v)); }catch(e){} }
};
let mem = {};
try { mem = JSON.parse(localStorage.getItem(SITE.key)||'{}'); } catch(e){ mem = {}; }
let state = mem;
const doneLab = id => !!state['lab:'+id];
const doneQ = (id,i) => !!state['q:'+id+':'+i];
const phaseDone = p => doneLab(p.id) && p.quiz.every((_,i)=>doneQ(p.id,i));
const phasePart = p => doneLab(p.id) || p.quiz.some((_,i)=>doneQ(p.id,i));
(function(){
  let t=null; try{ t=localStorage.getItem(SITE.key+'-theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme',t);
  $('#theme').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem(SITE.key+'-theme',next); }catch(e){}
  });
})();

$('#brandname').textContent = SITE.title;

$('#legend').innerHTML = '<h4>'+SITE.spine+'</h4>' + SITE.layers.map(l =>

let mode='learn', current=PHASES[0].id;
function buildRail(){
  const nav=$('#pnav'); nav.innerHTML='';
  PHASES.forEach(p=>{
    const a=el('a',''); a.href='#'; a.className=(p.id===current?'on':'');
    a.innerHTML='<span class="n">'+p.n+'</span><span>'+p.title+'</span><span class="tick '+(phaseDone(p)?'done':phasePart(p)?'part':'')+'"></span>';
    a.onclick=e=>{e.preventDefault(); current=p.id; mode='learn'; render(); buildRail();};
    nav.appendChild(a);
  });
}
function tableBlock(t){
  const wrap=el('div','tablewrap'); const table=el('table');
  const thead=el('thead'); const hr=el('tr');
  (t.head||[]).forEach(h=>hr.appendChild(el('th','',h)));
  thead.appendChild(hr); table.appendChild(thead);
  const tb=el('tbody');
  (t.rows||[]).forEach(r=>{ const tr=el('tr'); r.forEach(c=>tr.appendChild(el('td','',c))); tb.appendChild(tr); });
  table.appendChild(tb); wrap.appendChild(table); return wrap;
}
function codeBlock(code){
  const wrap=el('div','codewrap'); const pre=el('pre'); pre.innerHTML='<code>'+esc(code)+'</code>';
  const btn=el('button','copy','Copy');
  btn.onclick=()=>{navigator.clipboard.writeText(code).then(()=>{btn.textContent='Copied';btn.classList.add('done');setTimeout(()=>{btn.textContent='Copy';btn.classList.remove('done')},1500)})};
  wrap.appendChild(btn); wrap.appendChild(pre); return wrap;
}
function sec(title,cnt){ return el('h2','sec',title+(cnt!=null?' <span class="cnt">'+cnt+'</span>':'')); }

  prog.innerHTML='<div class="top"><span class="lbl">Path progress</span><span class="pct">'+pct+'%</span></div>';
  const bar=el('div','bar');
  PHASES.forEach(pp=>{ const i=el('i'); if(phaseDone(pp))i.className='done'; else if(phasePart(pp))i.className='part'; bar.appendChild(i); });
  prog.appendChild(bar); v.appendChild(prog);
  const head=el('div');
  head.innerHTML='<div class="eyebrow">Phase '+p.n+' · '+p.layerLabel+' layer</div><h1 class="ptitle">'+p.title+'</h1>'+
    '<div class="meta"><span class="chip '+p.layer+'">'+p.layerLabel+'</span><span class="chip">'+p.time+'</span><span class="chip">prereq: '+p.pre+'</span></div>';
  v.appendChild(head);
  v.appendChild(el('div','objective',p.objective));
  v.appendChild(sec('Concepts',p.concepts.length));
  p.concepts.forEach(c=>{
    const d=el('div','concept'); d.appendChild(el('h3','',c.h));
    if(c.p) d.insertAdjacentHTML('beforeend',c.p);
    if(c.table) d.appendChild(tableBlock(c.table));
    if(c.code) d.appendChild(codeBlock(c.code));
    v.appendChild(d);
  });
  v.appendChild(sec('Lab'));
  const lab=el('div','lab');
  lab.innerHTML='<h3>'+p.lab.title+'</h3><ol>'+p.lab.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol><p style="margin:14px 0 0"><b>Done when:</b> '+p.lab.verify+'</p>';
  const dl=el('div','done-line');
  const cb=el('input'); cb.type='checkbox'; cb.id='lab-'+p.id; cb.checked=doneLab(p.id);
  cb.addEventListener('change',()=>{ state['lab:'+p.id]=cb.checked; store.set(state); buildRail(); renderPhase(p); });
  const lb=el('label'); lb.htmlFor=cb.id; lb.appendChild(cb); lb.appendChild(document.createTextNode('Lab complete'));
  dl.appendChild(lb); lab.appendChild(dl); v.appendChild(lab);
  v.appendChild(sec('Gotchas',p.gotchas.length));
  p.gotchas.forEach(g=>{
    const d=el('div','gotcha');
    d.innerHTML='<span class="sev '+g.s+'">'+g.s+'</span><span><b>'+g.t+'</b>'+g.d+'</span>';
    v.appendChild(d);
  });
  v.appendChild(sec('Checkpoint',p.quiz.length));
  p.quiz.forEach((q,i)=>{
    const d=el('details','qa');
    d.innerHTML='<summary>'+q.q+'</summary><div class="ans">'+q.a+
      '<div class="done-line" style="border-top-color:var(--line)"><label style="color:var(--muted)"><input type="checkbox" '+(doneQ(p.id,i)?'checked':'')+'> I could answer this without looking</label></div></div>';
    d.querySelector('input').addEventListener('change',e=>{
      state['q:'+p.id+':'+i]=e.target.checked; store.set(state); buildRail(); renderPhase(p);
    });
    v.appendChild(d);
  });
  if(p.docs&&p.docs.length){
    v.appendChild(sec('Source docs'));
    const dd=el('div','docs');
    dd.innerHTML=p.docs.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' ↗</a>').join('');
    v.appendChild(dd);
  }
  const idx=PHASES.indexOf(p);
  const navd=el('div','done-line'); navd.style.borderTop='1px solid var(--line)'; navd.style.marginTop='40px';
  if(idx>0){ const b=el('button','btn','← '+PHASES[idx-1].title); b.onclick=()=>{current=PHASES[idx-1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  if(idx<PHASES.length-1){ const b=el('button','btn prime',PHASES[idx+1].title+' →'); b.onclick=()=>{current=PHASES[idx+1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  v.appendChild(navd);
}
function renderRef(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Reference</div><h1 class="ptitle">Lookup and decisions</h1><p class="lede">'+SITE.refLede+'</p>';
  v.appendChild(sec('Decision trees',TREES.length));
  TREES.forEach(t=>{
    v.appendChild(el('h3','',t.title));
    const wrap=el('div','tree');
    t.rows.forEach(r=>{
      const b=el('div','branch');
      b.innerHTML='<span class="cond">'+r[0]+'</span><span class="arr">→</span><span class="res">'+r[1]+'<em>'+r[2]+'</em></span>';
      wrap.appendChild(b);
    });
    v.appendChild(wrap);
  });
  v.appendChild(sec('Tables',REF.length));
  REF.forEach(r=>{
    const d=el('div','concept'); d.appendChild(el('h3','',r.title));
    if(r.note) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin:2px 0 0">'+r.note+'</p>');
    d.appendChild(tableBlock(r));
    if(r.foot) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:8px">'+r.foot+'</p>');
    v.appendChild(d);
  });
}
let deck=[], di=0, revealed=false;
function buildDeck(){
  deck=[];
  PHASES.forEach(p=>p.quiz.forEach(q=>deck.push({q:q.q,a:q.a,src:'Phase '+p.n+' · '+p.title,pid:p.id})));
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  di=0; revealed=false;
}
function renderDrill(){
  const v=$('#view'); v.innerHTML='';
  if(!deck.length) buildDeck();
  v.innerHTML='<div class="eyebrow">Drill</div><h1 class="ptitle">Recall deck</h1><p class="lede">Checkpoint questions only. Answer before you reveal.</p>';
  const card=el('div','flash'); card.id='drill';
  const item=deck[di];
  card.innerHTML='<div class="fsrc">'+item.src+'</div><div class="fq">'+item.q+'</div><div class="fa '+(revealed?'':'hide')+'">'+item.a+'</div>'+
    '<div class="fbtns"><button class="btn prime" id="reveal">'+(revealed?'Next':'Reveal')+'</button><button class="btn" id="shuffle">Shuffle</button><span class="counter">'+(di+1)+' / '+deck.length+'</span></div>';
  v.appendChild(card);
  $('#reveal').onclick=()=>{ if(!revealed){ revealed=true; renderDrill(); } else { di=(di+1)%deck.length; revealed=false; renderDrill(); } };
  $('#shuffle').onclick=()=>{ buildDeck(); renderDrill(); };
}
function renderAudit(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Audit</div><h1 class="ptitle">'+SITE.auditTitle+'</h1><p class="lede">'+AUDIT.intro+'</p>';
  AUDIT.groups.forEach(g=>{
    v.appendChild(el('h3','',g.label));
    g.items.forEach(it=>{
      const d=el('div','verdict');
      d.innerHTML='<span class="vtag '+g.tag+'">'+g.tag+'</span><div><span class="claim">'+it.c+'</span><div class="find">'+it.f+'</div></div>';
      v.appendChild(d);
    });
  });
  v.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:28px">'+SITE.verifiedAgainst+'</p>');
}
function render(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode?'true':'false'));
  if(mode==='learn'){ const p=PHASES.find(x=>x.id===current)||PHASES[0]; renderPhase(p); }
  else if(mode==='ref') renderRef();
  else if(mode==='drill') renderDrill();
  else if(mode==='audit') renderAudit();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{
  mode=b.dataset.mode; if(mode==='drill') buildDeck(); render(); buildRail();
}));
$('#reset').onclick=()=>{ if(confirm('Reset all progress for this site?')){ state={}; store.set(state); buildRail(); render(); }};
$('#q').addEventListener('input',()=>{
  const q=$('#q').value.trim().toLowerCase();
  if(!q){ render(); return; }
  const hits=[];
  PHASES.forEach(p=>{
    const blob=(p.title+' '+p.objective+' '+p.concepts.map(c=>c.h+' '+(c.p||'')).join(' ')).toLowerCase();
    if(blob.includes(q)) hits.push({type:'phase', title:p.title, n:p.n, id:p.id});
    p.quiz.forEach(qq=>{ if((qq.q+' '+qq.a).toLowerCase().includes(q)) hits.push({type:'quiz', title:qq.q, n:p.n, id:p.id}); });
  });
  TREES.forEach(t=>{ if(t.title.toLowerCase().includes(q)||t.rows.some(r=>r.join(' ').toLowerCase().includes(q))) hits.push({type:'tree', title:t.title}); });
  const v=$('#view'); v.innerHTML='<div class="eyebrow">Search</div><h1 class="ptitle">Results</h1><div class="hits"></div>';
  const box=$('.hits');
  if(!hits.length){ box.innerHTML='<p class="empty">No matches.</p>'; return; }
  hits.forEach(h=>{
    const a=el('a','hit'); a.href='#';
    a.innerHTML='<small>'+h.type+(h.n?' · Phase '+h.n:'')+'</small><b>'+h.title+'</b>';
    a.onclick=e=>{e.preventDefault(); if(h.id){ current=h.id; mode='learn'; } else mode='ref'; render(); buildRail();};
    box.appendChild(a);
  });
});
document.addEventListener('keydown',e=>{ if(e.key==='/' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); $('#q').focus(); } });
buildRail(); render();
</script>
</body>
</html>
