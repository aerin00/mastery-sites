<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pomodoro Walkthrough — Matt Pocock’s Skills (v1.3.1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F4EE;
      --surface: #FFFFFF;
      --surface-recessed: #EFECE4;
      --surface-code: #FAF8F3;
      --ink: #181715;
      --ink-2: #55514A;
      --ink-3: #868076;
      --hairline: #E4DFD4;
      --hairline-strong: #CEC7B8;

      --spine: #0D6E64;
      --spine-tint: rgba(13, 110, 100, 0.075);
      --spine-border: rgba(13, 110, 100, 0.30);

      --reset: #C25E12;
      --reset-tint: rgba(194, 94, 18, 0.085);
      --reset-border: rgba(194, 94, 18, 0.35);

      --detour: #7C4DDB;
      --detour-tint: rgba(124, 77, 219, 0.08);
      --detour-border: rgba(124, 77, 219, 0.30);

      --ok: #157A42;
      --ok-bg: #E2F6EB;
      --err: #B42318;
      --err-bg: #FEE4E2;

      --shadow-card: 0 1px 2px rgba(24, 23, 21, 0.04), 0 4px 12px rgba(24, 23, 21, 0.03);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 16px;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    [data-theme="obsidian"] {
      --bg: #0F1114;
      --surface: #171A1F;
      --surface-recessed: #13161B;
      --surface-code: #12151A;
      --ink: #F0EDE6;
      --ink-2: #A6A198;
      --ink-3: #706C65;
      --hairline: #252A32;
      --hairline-strong: #373E49;

      --spine: #2DD4BF;
      --spine-tint: rgba(45, 212, 191, 0.08);
      --spine-border: rgba(45, 212, 191, 0.30);

      --reset: #F59E0B;
      --reset-tint: rgba(245, 158, 11, 0.11);
      --reset-border: rgba(245, 158, 11, 0.35);

      --detour: #A78BFA;
      --detour-tint: rgba(167, 139, 250, 0.11);
      --detour-border: rgba(167, 139, 250, 0.35);

      --ok: #4ADE80;
      --ok-bg: rgba(74, 222, 128, 0.14);
      --err: #F87171;
      --err-bg: rgba(248, 113, 113, 0.14);

      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    code, pre { font-family: var(--font-mono); }

    /* Top Bar */
    .topbar {
      position: sticky;
      top: 33px;
      z-index: 40;
      background: color-mix(in srgb, var(--bg) 90%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--hairline);
    }

    .topbar-inner {
      max-width: 1380px;
      margin: 0 auto;
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand h1 {
      font-family: var(--font-serif);
      font-size: 1.7rem;
      font-weight: 400;
      line-height: 1;
    }

    .brand h1 em { font-style: italic; color: var(--spine); }

    .brand-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--ink-3);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--r-sm);
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--ink-2);
      font-size: 0.79rem;
      font-weight: 500;
      font-family: var(--font-sans);
      text-decoration: none;
      cursor: pointer;
      transition: all 140ms ease;
    }

    .btn:hover {
      border-color: var(--hairline-strong);
      color: var(--ink);
    }

    .btn.primary {
      background: var(--spine);
      border-color: var(--spine);
      color: #FFFFFF;
    }

    [data-theme="obsidian"] .btn.primary { color: #0F1114; font-weight: 600; }

    .btn.primary:hover { filter: brightness(1.06); }

    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Main 2-Column Layout */
    .shell {
      max-width: 1380px;
      margin: 0 auto;
      padding: 24px 28px 64px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    /* Left Sticky Rail */
    .rail {
      position: sticky;
      top: 109px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rail-card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      padding: 14px;
      box-shadow: var(--shadow-card);
    }

    .rail-title {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Timeline List */
    .step-nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .step-btn {
      width: 100%;
      text-align: left;
      font-family: inherit;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--r-sm);
      padding: 7px 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--ink-2);
      transition: all 130ms ease;
    }

    .step-btn:hover {
      background: var(--surface-recessed);
      color: var(--ink);
    }

    .step-btn.active {
      background: var(--spine-tint);
      border-color: var(--spine-border);
      color: var(--ink);
    }

    .step-btn.is-reset.active {
      background: var(--reset-tint);
      border-color: var(--reset-border);
    }

    .s-num {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 700;
      width: 24px;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .step-btn.active .s-num { color: var(--spine); }
    .step-btn.is-reset .s-num { color: var(--reset); }

    .s-label {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .step-btn.active .s-label { font-weight: 600; }

    .s-phase {
      margin-left: auto;
      font-size: 0.65rem;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    /* Live Context Window Meter */
    .ctx-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .ctx-tokens {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
    }

    .ctx-session {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--spine);
      background: var(--spine-tint);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .ctx-session.fresh {
      color: var(--reset);
      background: var(--reset-tint);
    }

    .ctx-bar-bg {
      height: 8px;
      border-radius: 999px;
      background: var(--surface-recessed);
      overflow: hidden;
      margin-bottom: 6px;
    }

    .ctx-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--spine);
      transition: width 350ms cubic-bezier(0.22, 1, 0.36, 1), background 250ms ease;
    }

    .ctx-caption {
      font-size: 0.74rem;
      color: var(--ink-3);
      line-height: 1.4;
    }

    /* Repo File Tree */
    .file-tree {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ft-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 3px 6px;
      border-radius: 5px;
      color: var(--ink-2);
    }

    .ft-item.added {
      background: var(--ok-bg);
      color: var(--ok);
      font-weight: 600;
    }

    .ft-item.updated {
      background: var(--spine-tint);
      color: var(--spine);
      font-weight: 600;
    }

    /* Right Stage */
    .stage {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: var(--r-lg);
      box-shadow: var(--shadow-card);
      overflow: hidden;
    }

    .stage-head {
      padding: 24px 28px 20px;
      border-bottom: 1px solid var(--hairline);
      background: color-mix(in srgb, var(--surface-recessed) 40%, var(--surface));
    }

    .stage-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .pill {
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--spine-tint);
      color: var(--spine);
      border: 1px solid var(--spine-border);
    }

    .pill.reset {
      background: var(--reset-tint);
      color: var(--reset);
      border-color: var(--reset-border);
    }

    .stage-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .stage-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.1;
    }

    .cmd-copy {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: var(--r-sm);
      border: 1px solid var(--hairline-strong);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .cmd-copy:hover { border-color: var(--spine); color: var(--spine); }

    .stage-why {
      margin-top: 8px;
      font-size: 0.92rem;
      color: var(--ink-2);
      max-width: 760px;
    }

    .stage-body {
      padding: 24px 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Two-pane Prompt + Artifact Grid */
    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      align-items: start;
    }

    .pane {
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      overflow: hidden;
      background: var(--surface);
    }

    .pane-head {
      padding: 9px 14px;
      border-bottom: 1px solid var(--hairline);
      background: var(--surface-recessed);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pane-body {
      padding: 14px 16px;
      font-size: 0.84rem;
      color: var(--ink-2);
    }

    /* Chat Bubbles inside Transcript Pane */
    .chat {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      padding: 10px 12px;
      border-radius: var(--r-sm);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .msg.user {
      background: var(--spine-tint);
      border: 1px solid var(--spine-border);
      color: var(--ink);
    }

    .msg.agent {
      background: var(--surface-recessed);
      border: 1px solid var(--hairline);
      color: var(--ink-2);
    }

    .msg-role {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      color: var(--ink-3);
    }

    .msg.user .msg-role { color: var(--spine); }

    /* Code / Markdown Artifact Block */
    .code-block {
      background: var(--surface-code);
      padding: 14px 16px;
      font-size: 0.76rem;
      line-height: 1.55;
      color: var(--ink);
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .code-dim { color: var(--ink-3); }
    .code-add { color: var(--ok); font-weight: 500; }
    .code-del { color: var(--err); }
    .code-hl  { color: var(--spine); font-weight: 600; }

    /* Non-Happy Path Detour Accordion */
    .detour-box {
      border: 1px dashed var(--detour-border);
      background: var(--detour-tint);
      border-radius: var(--r-md);
      overflow: hidden;
    }

    .detour-toggle {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-family: inherit;
      color: var(--ink);
    }

    .detour-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 0.84rem;
      font-weight: 600;
    }

    .detour-badge {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--detour);
      background: var(--surface);
      border: 1px solid var(--detour-border);
      padding: 2px 7px;
      border-radius: 999px;
    }

    .detour-content {
      display: none;
      padding: 0 16px 16px;
      border-top: 1px dashed var(--detour-border);
      padding-top: 14px;
    }

    .detour-box.open .detour-content { display: block; }

    /* Mode Switch inside Step 04 (Single vs Parallel) */
    .mode-switch {
      display: inline-flex;
      background: var(--surface-recessed);
      border: 1px solid var(--hairline);
      border-radius: var(--r-sm);
      padding: 3px;
      gap: 3px;
    }

    .mode-btn {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      padding: 6px 12px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--ink-2);
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--surface);
      color: var(--spine);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* Parallel DAG Visual */
    .dag-board {
      display: grid;
      grid-template-columns: 1fr auto 1.25fr auto 1fr;
      gap: 10px;
      align-items: center;
      padding: 16px;
      background: var(--surface-recessed);
      border-radius: var(--r-md);
      border: 1px solid var(--hairline);
    }

    .dag-node {
      background: var(--surface);
      border: 1px solid var(--hairline-strong);
      border-radius: var(--r-sm);
      padding: 10px 12px;
      font-size: 0.77rem;
    }

    .dag-node.parallel {
      border-color: var(--spine-border);
      background: var(--surface);
    }

    .dag-node b {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.73rem;
      color: var(--spine);
      margin-bottom: 3px;
    }

    .dag-meta {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--ink-3);
      margin-top: 5px;
    }

    /* Context Reset Interstitial Banner */
    .reset-callout {
      border: 1.5px dashed var(--reset-border);
      background: var(--reset-tint);
      border-radius: var(--r-md);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reset-callout h3 {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 400;
      color: var(--reset);
    }

    /* Live Mini Pomodoro Widget (The Finished Result!) */
    .pomo-widget {
      background: var(--surface-recessed);
      border: 1px solid var(--hairline);
      border-radius: var(--r-md);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }

    .pomo-ring-wrap {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .pomo-svg {
      width: 84px;
      height: 84px;
      transform: rotate(-90deg);
    }

    .pomo-track {
      fill: none;
      stroke: var(--hairline-strong);
      stroke-width: 6;
    }

    .pomo-prog {
      fill: none;
      stroke: var(--spine);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 250ms linear;
    }

    .pomo-time {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .pomo-state {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--spine);
      margin-top: 4px;
    }

    .pomo-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Stage Footer Navigation */
    .stage-foot {
      padding: 16px 28px;
      border-top: 1px solid var(--hairline);
      background: color-mix(in srgb, var(--surface-recessed) 40%, var(--surface));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .step-counter {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--ink-3);
    }

    @media (max-width: 1020px) {
      .shell { grid-template-columns: 1fr; }
      .rail { position: static; }
      .split-grid { grid-template-columns: 1fr; }
      .dag-board { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .topbar-inner, .shell { padding-left: 16px; padding-right: 16px; }
      .stage-head, .stage-body, .stage-foot { padding-left: 18px; padding-right: 18px; }
    }
  </style>
</head>
<body><nav id="ms-homebar" class="ms-homebar" aria-label="All sites"><a href="https://mastery-sites.stenguye.workers.dev/">All sites</a></nav>
<style>#ms-homebar{height:auto;min-height:0;max-height:none;width:auto;max-width:none;overflow:visible;margin:0;border:0;align-self:auto;flex:none;float:none;transition:none;position:sticky;top:0;z-index:2147483647;display:block;padding:8px 14px;background:#111827;font:600 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;border-bottom:1px solid #1f2937}#ms-homebar a{display:inline;margin:0;padding:0;border:0;background:none;font:inherit;color:#93c5fd;text-decoration:none}#ms-homebar a:hover{text-decoration:underline;color:#bfdbfe}</style>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1>Worked Example: <em>Pomodoro App</em></h1>
        <span class="brand-tag">End-to-end optimal workflow · v1.3.1</span>
      </div>
      <div class="top-actions">
        <a class="btn" href="index.html">Workflow Atlas</a>
        <a class="btn" href="paths.html">Happy vs. Other</a>
        <a class="btn" href="legacy.html">Legacy Rescue</a>
        <a class="btn" href="drills.html">Ask-Matt Drills</a>
        <button id="themeBtn" class="btn" type="button"><span id="themeText">Obsidian</span></button>
      </div>
    </div>
  </header>

  <main class="shell">
    <!-- LEFT RAIL: STEPPER + CONTEXT TELEMETRY + LIVE REPO FILES -->
    <aside class="rail">
      <div class="rail-card">
        <div class="rail-title">
          <span>Walkthrough Steps</span>
          <span>← / → keys</span>
        </div>
        <nav class="step-nav" id="stepNav" aria-label="Walkthrough steps"></nav>
      </div>

      <div class="rail-card">
        <div class="rail-title">
          <span>Context Window</span>
          <span id="ctxLimit">Limit: ~125k</span>
        </div>
        <div class="ctx-row">
          <span class="ctx-tokens" id="ctxTokens">14k</span>
          <span class="ctx-session" id="ctxSession">Session #1</span>
        </div>
        <div class="ctx-bar-bg">
          <div class="ctx-bar-fill" id="ctxBar" style="width: 11%;"></div>
        </div>
        <p class="ctx-caption" id="ctxCaption"></p>
      </div>

      <div class="rail-card">
        <div class="rail-title">
          <span>Repo Artifacts</span>
          <span id="fileCount">0 files</span>
        </div>
        <div class="file-tree" id="fileTree"></div>
      </div>
    </aside>

    <!-- RIGHT STAGE: ACTIVE STEP CONTENT -->

                      <circle class="pomo-prog" id="pomoArc" cx="42" cy="42" r="36" stroke-dasharray="226.2" stroke-dashoffset="0"></circle>
                    </svg>
                    <div>
                      <div class="pomo-time" id="pomoTime">25:00</div>
                      <div class="pomo-state" id="pomoState">FOCUS · CYCLE 1/4</div>
                    </div>
                  </div>
                  <div class="pomo-controls">
                    <button class="btn primary" id="pomoStart" type="button">Start</button>
                    <button class="btn" id="pomoReset" type="button">Reset</button>
                    <button class="btn" id="pomoFast" type="button" title="Toggle 5-second demo interval">5s Demo</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `
      },
      {
        num: '07',
        navLabel: '/retro',
        phase: 'Loop',
        phaseTag: 'Post-Ship Loop (v1.3 New)',
        cmd: '/retro',
        title: 'Turn session friction into compounding repo leverage',
        why: 'Run /retro before closing the session. It spots where the agent wasted tokens or made preventable mistakes and upgrades AGENTS.md or lint rules so the next feature ships even faster.',
        tokens: 34,
        session: 'Ship Session (End)',
        freshBadge: false,
        ctxCaption: 'Run right before clearing so session friction is still visible. Then clear and celebrate!',
        files: [
          { path: 'AGENTS.md', state: 'updated' },
          { path: 'eslint.config.js', state: 'updated' }
        ],
        renderBody: () => `
          <div class="split-grid">
            <div class="pane">
              <div class="pane-head"><span>Retro Findings</span><span>/retro (v1.3)</span></div>
              <div class="pane-body">
                <div class="chat">
                  <div class="msg agent">
                    <div class="msg-role">Agent Audit</div>
                    Found two avoidable friction points during this build:<br/><br/>
                    <strong>1. Test runner confusion (4 wasted tool calls):</strong> Subagent T3 tried <code>npm test</code> (which launched watch mode) instead of <code>pnpm vitest run</code>.<br/>
                    <strong>2. Direct <code>Date.now()</code> usage:</strong> Caught during review in <code>persist.ts</code> instead of using the injectable clock seam.
                  </div>
                </div>
              </div>
            </div>

            <div class="pane">
              <div class="pane-head"><span>Durable Upgrade Applied</span><span>AGENTS.md (via /writing-for-agents)</span></div>
              <pre class="code-block"><span class="code-hl">## Testing &amp; Guardrails</span>
<span class="code-add">+ Always run single-shot tests with:</span>
<span class="code-add">+   pnpm vitest run</span>
<span class="code-add">+ Never run \`npm test\` (watch mode hangs agents).</span>
<span class="code-add">+</span>
<span class="code-add">+ Time-dependent code MUST accept an injected</span>
<span class="code-add">+ \`now: () =&gt; number\` parameter (see ADR-001).</span>

<span class="code-dim">→ Next feature starts smarter from turn 1.</span></pre>
            </div>
          </div>
        `
      }
    ];

    let activeIdx = 0;
    let buildMode = 'parallel';

    // Mini working Pomodoro timer state (wall-clock endsAt per ADR-001!)
    const pomo = {
      fastMode: false,
      phase: 'focus', // focus | short | long
      cycle: 1,
      status: 'idle', // idle | running | paused | completed
      totalMs: 25 * 60 * 1000,
      remainingMs: 25 * 60 * 1000,
      endsAt: null,
      raf: null
    };

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.46);
      } catch (e) {}
    }

    function pomoDuration(phase) {
      if (pomo.fastMode) return phase === 'focus' ? 5000 : 3000;
      return phase === 'focus' ? 25 * 60 * 1000 : phase === 'long' ? 15 * 60 * 1000 : 5 * 60 * 1000;
    }

    function updatePomoDOM() {
      const tEl = document.getElementById('pomoTime');
      const sEl = document.getElementById('pomoState');
      const arc = document.getElementById('pomoArc');
      const startBtn = document.getElementById('pomoStart');
      const fastBtn = document.getElementById('pomoFast');
      if (!tEl) return;

      const ms = pomo.status === 'running' ? Math.max(0, pomo.endsAt - Date.now()) : pomo.remainingMs;
      const secs = Math.ceil(ms / 1000);
      const mm = String(Math.floor(secs / 60)).padStart(2, '0');
      const ss = String(secs % 60).padStart(2, '0');
      tEl.textContent = `${mm}:${ss}`;

      const labelMap = { focus: 'FOCUS', short: 'SHORT BREAK', long: 'LONG BREAK' };
      const st = pomo.status === 'completed' ? 'COMPLETED · CLICK START' : `${labelMap[pomo.phase]} · CYCLE ${pomo.cycle}/4`;
      sEl.textContent = st;

      const circ = 226.2;
      const ratio = pomo.totalMs > 0 ? ms / pomo.totalMs : 0;
      arc.setAttribute('stroke-dashoffset', String(circ * (1 - ratio)));

      startBtn.textContent = pomo.status === 'running' ? 'Pause' : pomo.status === 'completed' ? 'Next' : 'Start';
      fastBtn.classList.toggle('primary', pomo.fastMode);
    }

    function tickPomo() {
      if (pomo.status !== 'running') return;
      const left = Math.max(0, pomo.endsAt - Date.now());
      if (left <= 0) {
        pomo.remainingMs = 0;
        pomo.status = 'completed';
        playChime();
        updatePomoDOM();
        return;
      }
      updatePomoDOM();
      pomo.raf = requestAnimationFrame(tickPomo);
    }

    function bindPomo() {
      const startBtn = document.getElementById('pomoStart');
      const resetBtn = document.getElementById('pomoReset');
      const fastBtn = document.getElementById('pomoFast');
      if (!startBtn) return;

      startBtn.onclick = () => {
        if (pomo.status === 'running') {
          pomo.remainingMs = Math.max(0, pomo.endsAt - Date.now());
          pomo.status = 'paused';
          cancelAnimationFrame(pomo.raf);
        } else if (pomo.status === 'completed') {
          if (pomo.phase === 'focus') {
            pomo.phase = pomo.cycle >= 4 ? 'long' : 'short';
          } else {
            pomo.cycle = pomo.phase === 'long' ? 1 : pomo.cycle + 1;
            pomo.phase = 'focus';
          }
          pomo.totalMs = pomoDuration(pomo.phase);
          pomo.remainingMs = pomo.totalMs;
          pomo.endsAt = Date.now() + pomo.remainingMs;
          pomo.status = 'running';
          tickPomo();
        } else {
          pomo.endsAt = Date.now() + pomo.remainingMs;
          pomo.status = 'running';
          tickPomo();
        }
        updatePomoDOM();
      };

      resetBtn.onclick = () => {
        cancelAnimationFrame(pomo.raf);
        pomo.phase = 'focus';
        pomo.cycle = 1;
        pomo.status = 'idle';
        pomo.totalMs = pomoDuration('focus');
        pomo.remainingMs = pomo.totalMs;
        updatePomoDOM();
      };

      fastBtn.onclick = () => {
        cancelAnimationFrame(pomo.raf);
        pomo.fastMode = !pomo.fastMode;
        pomo.phase = 'focus';
        pomo.cycle = 1;
        pomo.status = 'idle';
        pomo.totalMs = pomoDuration('focus');
        pomo.remainingMs = pomo.totalMs;
        updatePomoDOM();
      };

      updatePomoDOM();
    }

    window.setBuildMode = function(mode) {
      buildMode = mode;
      renderStep();
    };

    function buildNav() {
      const nav = document.getElementById('stepNav');
      nav.innerHTML = '';
      STEPS.forEach((s, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'step-btn' + (s.isReset ? ' is-reset' : '') + (i === activeIdx ? ' active' : '');
        b.innerHTML = `
          <span class="s-num">${s.num}</span>
          <span class="s-label">${s.navLabel}</span>
          <span class="s-phase">${s.phase}</span>
        `;
        b.onclick = () => { activeIdx = i; renderStep(); };
        nav.appendChild(b);
      });
    }

    function renderStep() {
      const s = STEPS[activeIdx];
      buildNav();

      // Context telemetry
      document.getElementById('ctxTokens').textContent = s.tokens === 0 ? '0k' : `~${s.tokens}k`;
      const sess = document.getElementById('ctxSession');
      sess.textContent = s.session;
      sess.classList.toggle('fresh', Boolean(s.freshBadge));

      const pct = Math.min(100, Math.round((s.tokens / 125) * 100));
      const bar = document.getElementById('ctxBar');
      bar.style.width = `${Math.max(s.tokens === 0 ? 0 : 6, pct)}%`;
      bar.style.background = s.freshBadge ? 'var(--reset)' : 'var(--spine)';
      document.getElementById('ctxCaption').textContent = s.ctxCaption;

      // File tree
      document.getElementById('fileCount').textContent = `${s.files.length} active`;
      document.getElementById('fileTree').innerHTML = s.files.map(f => `
        <div class="ft-item ${f.state}">
          <span>${f.path}</span>
          <span>${f.state === 'added' ? '+ new' : f.state === 'updated' ? 'Δ edit' : ''}</span>
        </div>
      `).join('');

      // Stage header
      document.getElementById('sKicker').innerHTML = `
        <span class="pill ${s.isReset ? 'reset' : ''}">${s.phaseTag}</span>
      `;
      document.getElementById('sTitle').textContent = s.title;
      const copyBtn = document.getElementById('sCmdCopy');
      copyBtn.textContent = `${s.cmd}  ⧉`;
      copyBtn.onclick = () => {
        navigator.clipboard?.writeText(s.cmd).catch(() => {});
        copyBtn.textContent = `${s.cmd}  ✓`;
        setTimeout(() => (copyBtn.textContent = `${s.cmd}  ⧉`), 1300);
      };
      document.getElementById('sWhy').textContent = s.why;

      // Stage body
      document.getElementById('sBody').innerHTML = s.renderBody(buildMode);
      bindPomo();

      // Footer nav
      document.getElementById('prevBtn').disabled = activeIdx === 0;
      document.getElementById('nextBtn').disabled = activeIdx === STEPS.length - 1;
      document.getElementById('stepCounter').textContent = `Step ${activeIdx + 1} of ${STEPS.length}`;
    }

    document.getElementById('prevBtn').onclick = () => {
      if (activeIdx > 0) { activeIdx--; renderStep(); }
    };
    document.getElementById('nextBtn').onclick = () => {
      if (activeIdx < STEPS.length - 1) { activeIdx++; renderStep(); }
    };

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' && activeIdx < STEPS.length - 1) { activeIdx++; renderStep(); }
      else if (e.key === 'ArrowLeft' && activeIdx > 0) { activeIdx--; renderStep(); }
    });

    // Synced Paper / Obsidian Theme
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('themeText').textContent = t === 'obsidian' ? 'Paper' : 'Obsidian';
      try { localStorage.setItem('pocock-atlas-theme', t); } catch (e) {}
    }
    const savedTheme = (() => { try { return localStorage.getItem('pocock-atlas-theme'); } catch (e) { return null; } })();
    setTheme(savedTheme || 'paper');
    document.getElementById('themeBtn').onclick = () => {
      const cur = document.documentElement.getAttribute('data-theme');
      setTheme(cur === 'obsidian' ? 'paper' : 'obsidian');
    };

    renderStep();
  </script>
</body>
</html>
