<!doctype html>
<!-- index:
description: Master Claude Code context, instructions, permissions, hooks, subagents, MCP, and unattended runs.
tags: guide, agent-systems
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude Code Control Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ---------- tokens: light is the bare :root ---------- */
:root{
  --bg:#EDF0EE; --paper:#F9FBFA; --raise:#FFFFFF;
  --ink:#121A19; --body:#25322F; --muted:#5C6B67; --faint:#849490;
  --line:#D3DAD7; --line-2:#BCC6C2;
  --accent:#0E6A60; --accent-soft:#DCEBE7; --accent-ink:#0A4F47;
  --signal:#B94A16; --signal-soft:#F7E4D8;
  --ok:#3F7A2E; --ok-soft:#E2EFDB;
  --warn:#9A6B04; --warn-soft:#F6EAD1;
  --stop:#A32C24; --stop-soft:#F6DFDC;
  --code-bg:#111A19; --code-ink:#DCE7E4; --code-line:#24322F;
  --shadow:0 1px 2px rgba(18,26,25,.05), 0 8px 24px -12px rgba(18,26,25,.14);
  --rail:264px;
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'Source Serif 4','Iowan Old Style',Georgia,serif;
  --f-mono:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1413; --paper:#131D1B; --raise:#182422;
    --ink:#E6EEEB; --body:#C6D3CF; --muted:#8CA09B; --faint:#6A7C78;
    --line:#26332F; --line-2:#33433E;
    --accent:#54C6B4; --accent-soft:#12332E; --accent-ink:#8BDFD1;
    --signal:#F09055; --signal-soft:#3A2114;
    --ok:#7CC463; --ok-soft:#1B2E17;
    --warn:#E0AE4B; --warn-soft:#332714;
    --stop:#E8776B; --stop-soft:#371916;
    --code-bg:#07100F; --code-ink:#CFDEDA; --code-line:#1D2A27;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1413; --paper:#131D1B; --raise:#182422;
  --ink:#E6EEEB; --body:#C6D3CF; --muted:#8CA09B; --faint:#6A7C78;
  --line:#26332F; --line-2:#33433E;
  --accent:#54C6B4; --accent-soft:#12332E; --accent-ink:#8BDFD1;
  --signal:#F09055; --signal-soft:#3A2114;
  --ok:#7CC463; --ok-soft:#1B2E17;
  --warn:#E0AE4B; --warn-soft:#332714;
  --stop:#E8776B; --stop-soft:#371916;
  --code-bg:#07100F; --code-ink:#CFDEDA; --code-line:#1D2A27;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--body);
  font-family:var(--f-body); font-size:16.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); color:var(--ink); text-wrap:balance; margin:0; letter-spacing:-.015em}
a{color:var(--accent-ink); text-underline-offset:3px}
code,kbd{font-family:var(--f-mono); font-size:.855em}
:focus-visible{outline:2px solid var(--signal); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- chrome ---------- */
.topbar{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:9px 18px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; font-family:var(--f-disp); font-weight:700;
  font-size:15px; color:var(--ink); letter-spacing:-.02em; white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:2px;background:var(--signal);display:inline-block;transform:translateY(-1px)}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.modes{display:flex; gap:2px; background:var(--bg); border:1px solid var(--line); border-radius:7px; padding:2px}
.modes button{
  font-family:var(--f-disp); font-size:12.5px; font-weight:600; letter-spacing:.01em;
  border:0; background:transparent; color:var(--muted); padding:5px 11px; border-radius:5px; cursor:pointer;
}
.modes button[aria-pressed="true"]{background:var(--raise); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.09)}
.spacer{flex:1}
#q{
  font-family:var(--f-mono); font-size:12.5px; padding:6px 10px; width:min(300px,42vw);
  border:1px solid var(--line-2); border-radius:7px; background:var(--raise); color:var(--ink);
}
#q::placeholder{color:var(--faint)}
.iconbtn{border:1px solid var(--line-2); background:var(--raise); color:var(--muted); border-radius:7px;
  padding:5px 9px; cursor:pointer; font-family:var(--f-mono); font-size:12px}
.iconbtn:hover{color:var(--ink); border-color:var(--accent)}

.shell{display:grid; grid-template-columns:var(--rail) minmax(0,1fr); gap:0; align-items:start}
@media (max-width:900px){ .shell{grid-template-columns:1fr} }

/* ---------- rail ---------- */
.rail{
  position:sticky; top:53px; height:calc(100vh - 53px); overflow-y:auto;
  border-right:1px solid var(--line); background:var(--paper); padding:16px 12px 40px;
}
@media (max-width:900px){
  .rail{position:static; height:auto; border-right:0; border-bottom:1px solid var(--line);
    display:flex; gap:8px; overflow-x:auto; padding:10px 12px; scrollbar-width:thin}
  .railhead,.legend{display:none}
}
.railhead{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); padding:0 8px 8px}
.pnav{display:flex; flex-direction:column; gap:2px}
@media (max-width:900px){ .pnav{flex-direction:row; gap:6px} }
.pnav a{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  text-decoration:none; color:var(--body); font-family:var(--f-disp); font-size:13.5px;
  font-weight:500; line-height:1.25; border:1px solid transparent; white-space:nowrap;
}
.pnav a:hover{background:var(--bg)}
.pnav a.on{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent); font-weight:600}
.pnav .n{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); width:16px; flex:none}
.pnav a.on .n{color:var(--accent)}
.pnav .tick{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-left:auto;
  display:grid;place-items:center;font-size:8px;color:transparent}
.pnav .tick.done{background:var(--ok);border-color:var(--ok);color:#fff}
.pnav .tick.part{border-color:var(--signal);background:linear-gradient(90deg,var(--signal) 50%,transparent 50%)}

.legend{margin-top:22px; padding:11px 10px; border:1px solid var(--line); border-radius:9px; background:var(--bg)}
.legend h4{font-family:var(--f-mono); font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); font-weight:400; margin-bottom:8px}
.legend .row{display:flex; align-items:center; gap:8px; font-size:12px; font-family:var(--f-disp); padding:2.5px 0; color:var(--muted)}
.swatch{width:16px;height:4px;border-radius:2px;flex:none}

/* ---------- main ---------- */
main{padding:28px 30px 96px; max-width:1080px; min-width:0}
@media (max-width:640px){ main{padding:22px 16px 72px} }
.eyebrow{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.15em; text-transform:uppercase; color:var(--signal)}
.ptitle{font-size:clamp(28px,4.4vw,40px); font-weight:700; line-height:1.06; margin:7px 0 0}
.meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:13px}
.chip{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.05em; padding:3px 8px; border-radius:20px;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper); text-transform:uppercase}
.chip.soft{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.hard{background:var(--stop-soft);border-color:var(--stop);color:var(--stop)}
.chip.meta2{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.chip.scale{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}

.objective{
  margin:24px 0 0; padding:16px 18px; border-left:3px solid var(--signal);
  background:var(--paper); border-radius:0 9px 9px 0; font-size:17.5px; line-height:1.5; color:var(--ink);
}
.objective b{font-weight:600}

h2.sec{
  font-size:12px; font-family:var(--f-mono); font-weight:500; letter-spacing:.15em; text-transform:uppercase;
  color:var(--faint); margin:42px 0 0; padding-bottom:7px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; gap:9px;
}
h2.sec .cnt{color:var(--line-2); font-size:11px}

.concept{padding:19px 0; border-bottom:1px solid var(--line)}
.concept:last-child{border-bottom:0}
.concept h3{font-size:18.5px; font-weight:600; margin-bottom:6px; letter-spacing:-.01em}
.concept p{margin:0 0 9px; max-width:66ch}
.concept p:last-child{margin-bottom:0}
.concept ul{margin:9px 0; padding-left:19px; max-width:66ch}
.concept li{margin:4px 0}
.concept .k{font-family:var(--f-mono); font-size:.85em; background:var(--accent-soft); color:var(--accent-ink);
  padding:1px 5px; border-radius:4px; border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}

pre{
  margin:12px 0; background:var(--code-bg); color:var(--code-ink); border:1px solid var(--code-line);
  border-radius:9px; padding:13px 15px; overflow-x:auto; font-family:var(--f-mono);
  font-size:12.6px; line-height:1.65; position:relative;
}
pre code{font-size:inherit; color:inherit; background:none}
.codewrap{position:relative}
.copy{position:absolute; top:8px; right:8px; z-index:2; font-family:var(--f-mono); font-size:10px;
  letter-spacing:.06em; text-transform:uppercase; padding:4px 8px; border-radius:5px; cursor:pointer;
  background:rgba(255,255,255,.07); color:#9FB5B0; border:1px solid rgba(255,255,255,.13)}
.copy:hover{background:rgba(255,255,255,.15); color:#fff}
.copy.done{background:var(--ok); color:#fff; border-color:var(--ok)}
.cap{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin:-4px 0 0}

.tablewrap{overflow-x:auto; margin:14px 0; border:1px solid var(--line); border-radius:9px; background:var(--paper)}
table{border-collapse:collapse; width:100%; font-family:var(--f-disp); font-size:13.4px; min-width:480px}
th{text-align:left; font-family:var(--f-mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); font-weight:400; padding:9px 13px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45}
tr:last-child td{border-bottom:0}
td code{background:var(--bg); padding:1px 5px; border-radius:4px; border:1px solid var(--line)}
td.num{font-variant-numeric:tabular-nums}

.gotcha{display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; padding:13px 0; border-bottom:1px solid var(--line)}
.gotcha:last-child{border-bottom:0}
.sev{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:3px 7px;
  border-radius:4px; height:fit-content; white-space:nowrap; margin-top:2px}
.sev.trap{background:var(--stop-soft); color:var(--stop)}
.sev.cost{background:var(--warn-soft); color:var(--warn)}
.sev.stale{background:var(--signal-soft); color:var(--signal)}
.sev.ok{background:var(--ok-soft); color:var(--ok)}
.gotcha b{font-family:var(--f-disp); font-weight:600; color:var(--ink); display:block; font-size:14.5px; margin-bottom:2px}
.gotcha span{font-size:15px}

.lab{margin:14px 0 0; padding:18px 20px; border:1px solid var(--accent); border-radius:11px;
  background:var(--accent-soft)}
.lab h3{font-size:17px; margin-bottom:4px; color:var(--accent-ink)}
.lab ol{margin:11px 0 0; padding-left:20px}
.lab li{margin:6px 0}
.lab .pre-in-lab pre{background:var(--code-bg)}
.done-line{display:flex; align-items:center; gap:9px; margin-top:16px; padding-top:14px; border-top:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.done-line label{font-family:var(--f-disp); font-size:14px; font-weight:600; color:var(--accent-ink); cursor:pointer;
  display:flex; align-items:center; gap:8px}
.done-line input{width:17px;height:17px;accent-color:var(--accent);cursor:pointer}

details.qa{border:1px solid var(--line); border-radius:9px; margin:8px 0; background:var(--paper); overflow:hidden}
details.qa summary{padding:11px 15px; cursor:pointer; font-family:var(--f-disp); font-weight:600; font-size:14.5px;
  color:var(--ink); list-style:none; display:flex; gap:9px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:'?'; font-family:var(--f-mono); color:var(--signal); font-size:12px; flex:none}
details.qa[open] summary::before{content:'!'}
details.qa .ans{padding:0 15px 13px 33px; font-size:15px; color:var(--body); border-top:1px solid var(--line); padding-top:11px}

.tree{margin:14px 0; display:flex; flex-direction:column; gap:0}
.branch{display:grid; grid-template-columns:minmax(140px,.9fr) auto minmax(0,1.4fr); gap:12px; align-items:center;
  padding:11px 14px; border:1px solid var(--line); border-top:0; background:var(--paper)}
.branch:first-child{border-top:1px solid var(--line); border-radius:9px 9px 0 0}
.branch:last-child{border-radius:0 0 9px 9px}
.branch .cond{font-family:var(--f-body); font-size:14.5px; color:var(--body)}
.branch .arr{font-family:var(--f-mono); color:var(--line-2); font-size:13px}
.branch .res{font-family:var(--f-disp); font-weight:600; font-size:14px; color:var(--ink)}
.branch .res em{display:block; font-family:var(--f-body); font-weight:400; font-style:normal; font-size:13.5px; color:var(--muted)}
@media (max-width:640px){ .branch{grid-template-columns:1fr; gap:5px} .branch .arr{display:none} }

.docs{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
.docs a{font-family:var(--f-mono); font-size:11.5px; padding:4px 10px; border-radius:20px; text-decoration:none;
  border:1px solid var(--line-2); color:var(--muted); background:var(--paper)}
.docs a:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft)}

/* progress header */
.prog{margin:0 0 26px; padding:15px 18px; border:1px solid var(--line); border-radius:11px; background:var(--paper)}
.prog .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.prog .lbl{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.prog .pct{font-family:var(--f-disp); font-size:26px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.bar{display:flex; gap:3px; margin-top:11px}
.bar i{height:7px; flex:1; border-radius:2px; background:var(--line); transition:background .25s}
.bar i.done{background:var(--ok)}
.bar i.part{background:var(--signal)}

/* reference / drill / audit */
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin:14px 0}
.card{border:1px solid var(--line); border-radius:10px; padding:14px 16px; background:var(--paper)}
.card h4{font-size:15px; font-weight:600; margin-bottom:5px}
.card p{margin:0; font-size:14.5px; color:var(--muted)}

#drill .flash{
  border:1px solid var(--line-2); border-radius:14px; background:var(--paper); padding:34px 30px;
  min-height:220px; display:flex; flex-direction:column; justify-content:center; gap:16px; box-shadow:var(--shadow);
}
#drill .fq{font-family:var(--f-disp); font-size:clamp(19px,2.6vw,25px); font-weight:600; color:var(--ink); line-height:1.3}
#drill .fa{font-size:16.5px; color:var(--body); border-top:1px solid var(--line); padding-top:15px}
#drill .fa.hide{display:none}
#drill .fsrc{font-family:var(--f-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint)}
#drill .fbtns{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.btn{font-family:var(--f-disp); font-size:13.5px; font-weight:600; padding:9px 16px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line-2); background:var(--raise); color:var(--ink)}
.btn.prime{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.prime:hover{filter:brightness(1.08)}
.btn:hover{border-color:var(--accent)}
.counter{font-family:var(--f-mono); font-size:11.5px; color:var(--muted); align-self:center; margin-left:auto}

.verdict{display:grid; grid-template-columns:auto minmax(0,1fr); gap:13px; padding:15px 0; border-bottom:1px solid var(--line)}
.verdict:last-child{border-bottom:0}
.vtag{font-family:var(--f-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; padding:4px 8px;
  border-radius:5px; height:fit-content; white-space:nowrap; margin-top:2px; font-weight:700}
.vtag.holds{background:var(--ok-soft); color:var(--ok)}
.vtag.stale{background:var(--warn-soft); color:var(--warn)}
.vtag.wrong{background:var(--stop-soft); color:var(--stop)}
.vtag.gap{background:var(--signal-soft); color:var(--signal)}
.vtag.unver{background:var(--bg); color:var(--muted); border:1px solid var(--line-2)}
.verdict .claim{font-family:var(--f-disp); font-weight:600; font-size:15px; color:var(--ink); margin-bottom:4px}
.verdict .fix{font-size:15px}

.hits{margin-top:6px}
.hit{display:block; padding:11px 14px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px;
  background:var(--paper); text-decoration:none; color:var(--body)}
.hit:hover{border-color:var(--accent); background:var(--accent-soft)}
.hit b{display:block; font-family:var(--f-disp); color:var(--ink); font-size:14.5px}
.hit small{font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.05em; text-transform:uppercase}
.empty{color:var(--muted); font-style:italic; padding:20px 0}
.lede{font-size:17.5px; max-width:66ch; color:var(--body); margin:14px 0 0}
.hr{height:1px;background:var(--line);margin:38px 0 0;border:0}
.unv{font-family:var(--f-mono);font-size:.86em;color:var(--muted);background:var(--bg);
  border:1px dashed var(--line-2);padding:1px 6px;border-radius:4px;white-space:normal}
kbd{background:var(--bg);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;
  padding:1px 5px;font-size:.82em;color:var(--muted)}
.lede a{color:var(--accent-ink)}
.verdict .claim{display:block}
#view > h3{margin-top:28px; font-size:19px}


</style>

</head>
<body>
<div class="topbar">
  <div class="brand"><span class="dot"></span>Control Stack<small>CLAUDE&nbsp;CODE</small></div>
  <div class="modes" role="group" aria-label="View">
    <button data-mode="learn" aria-pressed="true">Path</button>
    <button data-mode="ref" aria-pressed="false">Reference</button>
    <button data-mode="drill" aria-pressed="false">Drill</button>
    <button data-mode="audit" aria-pressed="false">Audit</button>
  </div>
  <div class="spacer"></div>
  <input id="q" type="search" placeholder="search · / to focus" autocomplete="off">
  <button class="iconbtn" id="theme" title="Toggle theme">◐</button>
  <button class="iconbtn" id="reset" title="Reset progress">reset</button>
</div>

<div class="shell">
  <nav class="rail">
    <div class="railhead">Phases</div>
    <div class="pnav" id="pnav"></div>
    <div class="legend">
      <h4>Control layer</h4>
      <div class="row"><span class="swatch" style="background:var(--warn)"></span>Operating — you, live</div>
      <div class="row"><span class="swatch" style="background:var(--accent)"></span>Soft — instruction</div>
      <div class="row"><span class="swatch" style="background:var(--stop)"></span>Hard — enforcement</div>
      <div class="row"><span class="swatch" style="background:var(--signal)"></span>Scale — isolation</div>
    </div>
  </nav>
  <main id="view"></main>
</div>
<script>
/* ============================================================
   Claude Code Control Stack — content model
   Verified against code.claude.com/docs, August 2026.
   ============================================================ */
const C = (...l) => l.join('\n');
const K = s => '<code class="k">' + s + '</code>';

const PHASES = [
{
  id:'p0', n:'00', title:'Read the machine', layer:'meta', layerLabel:'Operating',
  time:'~30 min', pre:'None',
  objective:'At any moment in a session you can say <b>what is in the context window and why it got there</b>. Everything else in this path is an intervention on that answer.',
  concepts:[
    {h:'The loop you are configuring',
     p:'<p>Claude Code runs one loop: you prompt, the model picks tools, tools run, results come back, repeat until it stops. Every primitive you will learn is an intervention at exactly one point in that loop. Knowing which point tells you which primitive to reach for.</p><ul><li><b>Before the loop starts</b> — CLAUDE.md, rules, auto memory, skill descriptions, MCP tool names</li><li><b>Between turns</b> — skills loading, subagents spawning, compaction</li><li><b>At each tool call</b> — hooks, permission rules, permission mode, sandbox</li><li><b>At the end</b> — Stop hooks, checkpoints, verification</li></ul>'},
    {h:'What actually loads at session start',
     p:'<p>Before your first word, the window already holds: the system prompt and tool definitions, every CLAUDE.md and CLAUDE.local.md from the filesystem root down to your working directory, unscoped ' + K('.claude/rules/*.md') + ', the first 200 lines (or 25KB) of auto memory ' + K('MEMORY.md') + ', the <b>descriptions</b> of every discoverable skill, and MCP tool names.</p><p>Skill bodies do not load. Path-scoped rules do not load. Subdirectory CLAUDE.md files do not load until Claude reads a file there.</p>'},
    {h:'Context is the constraint, not cost',
     p:'<p>The failure mode is not hitting the limit — auto-compaction handles that. The failure mode is <b>degradation well before the limit</b>: skills stop triggering, conventions get dropped, the model picks the wrong tool. Treat every always-on byte as a tax on reasoning quality.</p>'},
    {h:'The three commands you should run reflexively',
     code:C(
      '/context      # live breakdown: system prompt, tools, memory files, messages',
      '/status       # model, effort, cwd, permission mode, sandbox state',
      '/doctor       # setup checkup; proposes CLAUDE.md trims (v2.1.206+)'),
     p:'<p>' + K('/context') + ' is the instrument. It names which memory files loaded — if a file you wrote is not listed there, Claude cannot see it, and no amount of rewording will help.</p>'}
  ],
  lab:{title:'Baseline your worst repo',
    steps:[
      'Open Claude Code in the messiest project you own.',
      'Run <code>/context</code>. Write down the token count for each category: system prompt, tools, memory files, messages.',
      'Run <code>/status</code> and note the model, effort level, and permission mode you are actually running.',
      'Run <code>/mcp</code> and note the per-server context cost.',
      'Run <code>/doctor</code> and read what it wants to trim.'],
    verify:'You can state your startup context budget as a number, and name the single largest contributor.'},
  gotchas:[
    {s:'cost',t:'MCP tool definitions are deferred now',d:'Tool search means only tool <i>names</i> cost context until a tool is first used. Older advice that "every MCP server bloats your baseline" overstates it — but ' + K('/mcp') + ' still shows real per-server cost, and subagents inherit every definition from the parent.'},
    {s:'trap',t:'A memory file that is not in /context does not exist',d:'Wrong location, excluded by <code>claudeMdExcludes</code>, or in a subdirectory that has not been touched yet. Check before rewriting.'}
  ],
  quiz:[
    {q:'Name the five things loaded into context before your first prompt.',a:'System prompt + tool definitions; CLAUDE.md / CLAUDE.local.md hierarchy from root down to cwd; unscoped <code>.claude/rules/*.md</code>; auto memory <code>MEMORY.md</code> (first 200 lines or 25KB); skill <b>descriptions</b> (not bodies). Plus MCP tool names.'},
    {q:'Which command tells you whether your CLAUDE.md actually loaded?',a:'<code>/context</code> — check the list under <b>Memory files</b>. <code>/memory</code> lists file <i>locations</i>, which is not the same as what loaded this session.'}
  ],
  docs:[['How Claude Code works','https://code.claude.com/docs/en/how-claude-code-works'],['Explore the context window','https://code.claude.com/docs/en/context-window'],['Debug your configuration','https://code.claude.com/docs/en/debug-your-config']]
},

{
  id:'p1', n:'01', title:'Drive the session', layer:'meta', layerLabel:'Operating',
  time:'1–2 h', pre:'Phase 00',
  objective:'Run <b>Explore → Plan → Implement → Verify → Commit</b> fluently, and recover from a bad turn, without editing a single config file. Most of the leverage in Claude Code is here, before any customization.',
  concepts:[
    {h:'Plan mode is the default opening for anything non-trivial',
     p:'<p>Plan mode is read-only exploration that ends in a proposal you approve. File edits are <b>never</b> auto-approved in plan mode, even when an allow rule matches — they route to a prompt. Since v2.1.212 shell commands that modify files (<code>touch</code>, <code>rm</code>) are gated the same way.</p>',
     code:C('Shift+Tab           # cycle permission modes, including plan',
            '/plan <description> # enter plan mode from the prompt',
            'claude --permission-mode plan')},
    {h:'Context hygiene is a habit, not a setting',
     code:C(
      '/clear                          # new conversation, empty context — between unrelated tasks',
      '/compact focus on the auth bug   # summarize, keeping what YOU choose',
      '/autocompact 500k                # raise/lower the trigger point; /autocompact auto to reset',
      '/btw does this repo use pnpm?    # side question that never enters history',
      '/context                         # check before and after'),
     p:'<p>The single highest-value habit: <b>' + K('/clear') + ' between unrelated tasks</b>. A clean session with a better prompt beats a long session full of accumulated corrections, almost every time.</p>'},
    {h:'Checkpoints: every prompt is an undo point',
     p:'<p>Claude snapshots files before each change. <kbd>Esc Esc</kbd> or ' + K('/rewind') + ' opens the menu: restore conversation only, code only, or both. The same menu offers <b>Summarize from here</b> (condense forward, keep earlier context) and <b>Summarize up to here</b> (condense earlier, keep recent in full) — partial compaction, which most people never discover.</p><p>' + K('/undo') + ' is an alias for ' + K('/rewind') + '.</p>'},
    {h:'Model and effort are a first-class lever',
     table:{head:['Level','Use it for'],rows:[
       ['<code>low</code>','Short, scoped, latency-sensitive work that is not intelligence-sensitive'],
       ['<code>medium</code>','Cost-sensitive work that can trade some capability'],
       ['<code>high</code>','<b>Default on every model except Opus 4.7.</b> Balanced'],
       ['<code>xhigh</code>','Deeper reasoning, higher spend. Default on Opus 4.7'],
       ['<code>max</code>','Demanding tasks. Diminishing returns and prone to overthinking — test first. Session-only unless set via env var'],
       ['<code>ultracode</code>','Not a model level: a Claude Code setting that sends <code>xhigh</code> <i>and</i> orchestrates dynamic workflows. Session-only']]},
     code:C('/model opus            # aliases: default best fable sonnet opus haiku opusplan sonnet[1m] opus[1m]',
            '/effort xhigh          # or /effort with no args for the slider, /effort auto to reset',
            '/fast on               # fast mode',
            '',
            '# one-off deep reasoning without changing the session level:',
            'ultrathink and then refactor the token refresh path'),
     p:'<p>Precedence: <code>CLAUDE_CODE_EFFORT_LEVEL</code> beats everything, then your configured level, then the model default. Frontmatter <code>effort:</code> on a skill or subagent overrides the session level but not the env var.</p>'},
    {h:'Verification surface',
     code:C(
      '/verify                         # run tests and checks (you invoke it; Claude cannot)',
      '/code-review high --fix         # levels: low medium high xhigh max ultra',
      '/security-review pr#142',
      '/simplify high --fix            # cleanup without behavior change',
      '/diff                           # interactive diff viewer, per-turn diffs'),
     p:'<p>As of v2.1.215 Claude no longer runs ' + K('/verify') + ' or ' + K('/code-review') + ' on its own. You invoke them. That is deliberate: verification you did not ask for is verification you will not read.</p>'}
  ],
  lab:{title:'The same bug, three ways',
    steps:[
      'Pick a real bug in a real repo.',
      'Round 1 — fix it conversationally, no plan mode. Note the turn count and run <code>/context</code>.',
      'Round 2 — <code>/rewind</code> back to the start, then <code>/clear</code>, then <code>/plan fix &lt;bug&gt;</code>. Approve the plan, implement, then <code>/verify</code> and <code>/code-review high</code>.',
      'Round 3 — <code>/clear</code>, then the same task at <code>/effort low</code>. Then at <code>max</code>.',
      'Compare turn count, context consumed, and quality of the diff across all three.'],
    verify:'You have a personal, evidence-based default for when plan mode and higher effort are worth their cost.'},
  gotchas:[
    {s:'trap',t:'"think hard" and "think more" are not keywords',d:'Only <code>ultrathink</code> is recognized. Everything else passes through as ordinary prompt text. This is one of the most widely repeated pieces of wrong Claude Code folklore.'},
    {s:'trap',t:'max effort is session-only',d:'Unless you set it through <code>CLAUDE_CODE_EFFORT_LEVEL</code>. <code>low</code>/<code>medium</code>/<code>high</code>/<code>xhigh</code> persist across sessions when set interactively; <code>max</code> and <code>ultracode</code> do not.'},
    {s:'cost',t:'Switching models mid-conversation re-reads history uncached',d:'<code>/model</code> now warns you. On a long session this is a real bill.'},
    {s:'stale',t:'/clear does not exist in cloud sessions',d:'Start a new session from the sidebar instead. <code>/compact</code> and <code>/context</code> do work there.'}
  ],
  quiz:[
    {q:'Which effort levels persist across sessions?',a:'<code>low</code>, <code>medium</code>, <code>high</code>, <code>xhigh</code> — when set in an interactive session. <code>max</code> and <code>ultracode</code> are session-only unless <code>max</code> comes from <code>CLAUDE_CODE_EFFORT_LEVEL</code>.'},
    {q:'What does <code>ultrathink</code> actually change?',a:'It adds an in-context instruction requesting deeper reasoning for that turn. <b>The effort level sent to the API is unchanged.</b>'},
    {q:'Name the two partial-compaction options in the rewind menu.',a:'<b>Summarize from here</b> (condense messages forward, keep earlier context intact) and <b>Summarize up to here</b> (condense earlier messages, keep recent ones in full).'},
    {q:'Are file edits auto-approved in plan mode if an allow rule matches?',a:'No. Plan mode routes file edits to a permission prompt regardless of allow rules. Since v2.1.212, file-modifying shell commands too.'}
  ],
  docs:[['Best practices','https://code.claude.com/docs/en/best-practices'],['Permission modes','https://code.claude.com/docs/en/permission-modes'],['Checkpointing','https://code.claude.com/docs/en/checkpointing'],['Model configuration','https://code.claude.com/docs/en/model-config']]
},

{
  id:'p2', n:'02', title:'Persistent instruction', layer:'soft', layerLabel:'Soft',
  time:'2–3 h', pre:'Phase 00',
  objective:'Get a project\u2019s always-on context <b>under 200 lines</b> without losing a single rule — by moving procedures into skills and file-specific rules into path-scoped rules.',
  concepts:[
    {h:'Three mechanisms, not one',
     table:{head:['Mechanism','Loads','Scope','Use for'],rows:[
       ['<code>CLAUDE.md</code>','Every session, in full','Whole project','Build commands, architecture, "always do X"'],
       ['<code>.claude/rules/*.md</code>','Every session, <i>or</i> only when matching files are opened','Path-scoped via <code>paths:</code>','Language- or directory-specific guidelines'],
       ['Skills','On demand, when invoked or matched','Task-specific','Procedures, reference material, workflows']]},
     p:'<p>These are not stylistic alternatives. They are three different <b>load timings</b>, and picking the wrong one is the entire cause of CLAUDE.md bloat.</p>'},
    {h:'Load order and precedence',
     table:{head:['Scope','Location'],rows:[
       ['Managed policy','<code>/Library/Application Support/ClaudeCode/CLAUDE.md</code> (macOS)<br><code>/etc/claude-code/CLAUDE.md</code> (Linux/WSL)<br><code>C:\\Program Files\\ClaudeCode\\CLAUDE.md</code> (Windows)'],
       ['User','<code>~/.claude/CLAUDE.md</code>'],
       ['Project','<code>./CLAUDE.md</code> or <code>./.claude/CLAUDE.md</code>'],
       ['Local (gitignored)','<code>./CLAUDE.local.md</code>']]},
     p:'<p>Claude walks <b>up</b> the tree from your cwd, then concatenates everything from filesystem root down — so instructions closer to where you launched are read <i>last</i>. Nothing overrides anything; it all accumulates. Within a directory, <code>CLAUDE.local.md</code> is appended after <code>CLAUDE.md</code>.</p><p>Critically: CLAUDE.md is delivered as a <b>user message after the system prompt</b>. It is context, not enforcement. There is no compliance guarantee. If something must happen, it is a hook.</p>'},
    {h:'Imports do not save context',
     p:'<p>' + K('@path/to/file') + ' imports are expanded and loaded at launch alongside the file that references them. Splitting a 400-line CLAUDE.md into five imports gives you five tidy files and <b>exactly the same token cost</b>. Only ' + K('paths:') + '-scoped rules actually reduce startup context.</p><ul><li>Relative paths resolve against the importing file, not cwd</li><li>Maximum four hops of recursion</li><li>Import parsing skips code spans and fences — write <code>`@README`</code> in backticks to mention a path literally</li><li>An import resolving outside your working directory triggers a one-time approval dialog</li></ul>'},
    {h:'Path-scoped rules: the actual fix',
     code:C('---',
            'paths:',
            '  - "src/api/**/*.ts"',
            '  - "tests/**/*.test.{ts,tsx}"',
            '---',
            '',
            '# API rules',
            '- Every endpoint validates input at the boundary',
            '- Errors use the standard envelope in src/api/errors.ts'),
     p:'<p>Drop it at ' + K('.claude/rules/api.md') + '. Discovery is recursive, so ' + K('.claude/rules/frontend/') + ' works. Rules <b>without</b> a <code>paths:</code> field load at launch with the same priority as <code>.claude/CLAUDE.md</code>. Rules <b>with</b> one load only when Claude reads a matching file.</p><p>User-level rules live in <code>~/.claude/rules/</code> and load before project rules, giving project rules higher priority. The directory supports symlinks, so a shared company ruleset can be linked into many repos.</p>'},
    {h:'Auto memory: what Claude writes about your project',
     code:C('~/.claude/projects/<project>/memory/',
            '├── MEMORY.md          # index — first 200 lines or 25KB loaded every session',
            '├── debugging.md       # topic file — read on demand only',
            '└── api-conventions.md',
            '',
            '/memory                          # browse, edit, toggle auto memory',
            'CLAUDE_CODE_DISABLE_AUTO_MEMORY=1'),
     p:'<p>On by default. Machine-local, shared across all worktrees of the same repo, and excluded from the transcript retention sweep. Subagents do <b>not</b> inherit the parent\u2019s auto memory unless they are a fork or set their own <code>memory:</code> field.</p>'},
    {h:'AGENTS.md is not read',
     p:'<p>Claude Code reads <code>CLAUDE.md</code>, full stop. If your repo already has an <code>AGENTS.md</code> for other agents, import it — and then you get one source of truth plus a place for Claude-specific additions.</p>',
     code:C('# CLAUDE.md',
            '@AGENTS.md',
            '',
            '## Claude Code',
            'Use plan mode for changes under src/billing/.')},
  ],
  lab:{title:'The 200-line diet',
    steps:[
      'Run <code>/init</code> in a project that has no CLAUDE.md, or <code>/doctor</code> in one that does.',
      'Run <code>/context</code> and record the <b>Memory files</b> token count.',
      'Go through the file line by line and sort every entry into one of three buckets: <b>always true</b> (stays), <b>true for certain files</b> (becomes a rule with <code>paths:</code>), <b>a procedure</b> (becomes a skill — Phase 03).',
      'Create <code>.claude/rules/</code> and move the second bucket out, one topic per file.',
      'Add block-level HTML comments <code>&lt;!-- maintainer note --&gt;</code> for anything humans need but Claude does not — they are stripped before injection and cost zero tokens.',
      'Re-run <code>/context</code>.'],
    verify:'Memory files consume noticeably less of the window, root CLAUDE.md is under 200 lines, and nothing you relied on was deleted — only relocated.'},
  gotchas:[
    {s:'trap',t:'Nested CLAUDE.md and path-scoped rules do not survive compaction',d:'Project-root CLAUDE.md is re-read from disk and re-injected after <code>/compact</code>. Subdirectory CLAUDE.md files and rules with <code>paths:</code> are not — they reload only the next time Claude touches a matching file. If an instruction "disappeared after compaction", this is usually why.'},
    {s:'trap',t:'Conflicting instructions resolve arbitrarily',d:'Two levels of the hierarchy disagreeing means Claude may pick either. Audit across user, project, nested, and rules files periodically.'},
    {s:'cost',t:'Brace expansion in paths: has a budget',d:'A rule\u2019s whole <code>paths:</code> list shares 1,000 expanded patterns and 4 MiB. Over-budget patterns are used <i>unexpanded</i>, and their literal braces match no files — the rule silently stops working.'},
    {s:'trap',t:'A [ that is not a bracket expression is an invalid glob',d:'<code>photos [2024/**</code> matches nothing. Escape it: <code>photos \\[2024/**</code>. The rule\u2019s other patterns keep working.'}
  ],
  quiz:[
    {q:'Which reduces startup context: splitting CLAUDE.md into <code>@imports</code>, or moving content into path-scoped rules?',a:'Path-scoped rules. Imports are expanded and loaded at launch — organization only, zero context savings.'},
    {q:'Does Claude Code read AGENTS.md?',a:'No. Import it from CLAUDE.md with <code>@AGENTS.md</code>, or symlink <code>CLAUDE.md → AGENTS.md</code>.'},
    {q:'What survives <code>/compact</code>?',a:'Project-root CLAUDE.md (re-read from disk and re-injected). Nested CLAUDE.md files and <code>paths:</code>-scoped rules do not; they reload on the next matching file read.'},
    {q:'Where do organization-wide instructions live, and can a user exclude them?',a:'The managed policy path (or the <code>claudeMd</code> key in managed settings). They cannot be excluded by <code>claudeMdExcludes</code>.'}
  ],
  docs:[['How Claude remembers your project','https://code.claude.com/docs/en/memory'],['Monorepos and large repos','https://code.claude.com/docs/en/large-codebases'],['Extend Claude Code','https://code.claude.com/docs/en/features-overview']]
},

{
  id:'p3', n:'03', title:'Skills', layer:'soft', layerLabel:'Soft',
  time:'3–4 h', pre:'Phase 02',
  objective:'Turn every prompt you have typed three times into a discoverable, cheap-to-load procedure — and understand the <b>lifecycle</b> well enough to know why a skill stopped working.',
  concepts:[
    {h:'Anatomy and discovery',
     code:C('.claude/skills/            # project — checked in',
            '~/.claude/skills/          # user — all your projects',
            '  ship/',
            '    SKILL.md               # entrypoint',
            '    checklist.md           # supporting file, read on demand',
            '',
            '# precedence: managed > user > project. Plugin skills are namespaced.',
            '# skills hot-reload since v2.1.0 — no restart needed'),
     p:'<p>The slash name comes from the <b>directory name</b>, not the <code>name:</code> field. In a personal or project skill, <code>name:</code> is only the display label in listings. (Plugin skills are the exception: there <code>name:</code> sets the last segment after the plugin prefix.)</p>'},
    {h:'Progressive disclosure is the whole point',
     table:{head:['Frontmatter','You invoke','Claude invokes','What is in context'],rows:[
       ['(default)','Yes','Yes','Description always; body on invoke'],
       ['<code>disable-model-invocation: true</code>','Yes','<b>No</b>','Nothing until you invoke it'],
       ['<code>user-invocable: false</code>','<b>No</b>','Yes','Description always; body on invoke']]},
     p:'<p>Use <code>disable-model-invocation: true</code> for anything with side effects (<code>/deploy</code>, <code>/release</code>) — it both prevents accidental automation <i>and</i> keeps the description out of context until needed. Use <code>user-invocable: false</code> for background knowledge like a legacy-system explainer that is not a meaningful action.</p>'},
    {h:'Frontmatter reference',
     table:{head:['Field','Effect'],rows:[
       ['<code>description</code>','<b>The single most important field.</b> Drives auto-invocation. Weak description = never triggered'],
       ['<code>name</code>','Display label only (except plugin skills)'],
       ['<code>disable-model-invocation</code>','User-only. Removes it from Claude\u2019s context entirely'],
       ['<code>user-invocable</code>','Set <code>false</code> to hide from the <code>/</code> menu'],
       ['<code>allowed-tools</code>','Pre-approves tools <b>for the invoking turn only</b>'],
       ['<code>disallowed-tools</code>','Removes tools from the pool while active; clears on your next message'],
       ['<code>context: fork</code>','Run the skill body as a subagent prompt in isolation'],
       ['<code>agent</code>','Which agent type the fork uses — <code>Explore</code>, <code>Plan</code>, <code>general-purpose</code>, or a custom one'],
       ['<code>background</code>','<code>false</code> makes a fork block the turn instead of backgrounding'],
       ['<code>model</code>, <code>effort</code>','Override for the duration of this skill'],
       ['<code>argument-hint</code>','Autocomplete hint for arguments']]},
     p:'<p>Booleans accept <code>yes/no/on/off/1/0</code> in any case since v2.1.218. Arguments: <code>$ARGUMENTS</code> for everything, <code>$0</code>/<code>$1</code> for positional. Shell output injects with <code>!`git diff $ARGUMENTS`</code>.</p>'},
    {h:'Lifecycle — why your skill "stopped working"',
     p:'<p>When invoked, the rendered SKILL.md enters the conversation as <b>one message and stays for the rest of the session</b>. Claude Code does not re-read the file on later turns. So write standing instructions, not one-time steps.</p><p>After auto-compaction, the most recent invocation of each skill is re-attached — but only the <b>first 5,000 tokens</b> of each, sharing a <b>25,000-token combined budget</b>, filled newest-first. Invoke many skills in one session and the oldest are dropped entirely.</p><p>If a skill seems to stop influencing behavior after the first response, the content is usually still there and the model is simply choosing other tools. Strengthen the description, or move the requirement into a hook.</p>'},
    {h:'context: fork — a skill that runs as a subagent',
     code:C('---',
            'name: deep-research',
            'description: Research a topic thoroughly across the codebase',
            'context: fork',
            'agent: Explore',
            '---',
            '',
            'Research $ARGUMENTS thoroughly:',
            '1. Find relevant files with Glob and Grep',
            '2. Read and analyze',
            '3. Summarize with specific file:line references'),
     p:'<p>The skill body becomes the subagent\u2019s prompt. It backgrounds by default (set <code>background: false</code> to wait). With <code>agent: Explore</code> the fork skips CLAUDE.md and git status, so it sees only the skill content and the agent\u2019s own system prompt — the leanest possible research worker.</p>'},
    {h:'Controlling skills you did not write',
     code:C('// .claude/settings.local.json — the /skills menu writes this for you',
            '{ "skillOverrides": {',
            '    "noisy-shared-skill": "off",           // hidden everywhere',
            '    "deploy": "user-invocable-only",       // hidden from Claude, in your / menu',
            '    "big-reference": "name-only"           // name listed, description not',
            '} }'),
     p:'<p>In <code>/skills</code>, highlight a skill and press <kbd>Space</kbd> to cycle states, <kbd>Enter</kbd> to save.</p>'}
  ],
  lab:{title:'Build two skills that fail differently',
    steps:[
      'Build <code>.claude/skills/ship/SKILL.md</code> with <code>disable-model-invocation: true</code> and <code>allowed-tools: Bash(git add *) Bash(git commit *) Bash(git status *)</code>. Add a bundled <code>checklist.md</code> and reference it by name from the body.',
      'Invoke <code>/ship</code>. Confirm git runs without prompts. Then send any other message and invoke a git command directly — confirm the grant has expired.',
      'Build a second, <b>reference</b> skill (your API conventions, say) with a deliberately vague description like "API stuff". Work on an API file and see whether Claude picks it up.',
      'Rewrite the description to name the concrete triggers: file paths, symptom words, the task phrasing you actually use. Retry.',
      'Run <code>/context</code> and observe the cost of the skill body sitting in your session.'],
    verify:'You can articulate why one skill triggered and the other did not, and the <code>allowed-tools</code> grant expiry is no longer a surprise.'},
  gotchas:[
    {s:'trap',t:'The description is the discovery mechanism',d:'Auto-invocation depends entirely on it. Write it as when-to-use, in the words you actually type, not as a summary of what the skill contains. This is the number one cause of unused skills.'},
    {s:'cost',t:'A loaded skill is a recurring cost for the whole session',d:'It never unloads. Keep the body short and push bulk into supporting files that Claude reads on demand.'},
    {s:'trap',t:'context: fork on a guidelines-only skill returns nothing',d:'The subagent receives your API conventions and no task, then exits. Forks need an imperative body.'},
    {s:'trap',t:'A forked background skill\u2019s edits are outside checkpoints',d:'<code>/rewind</code> will not undo them. Use git.'},
    {s:'trap',t:'Project skills grant themselves tools in untrusted folders',d:'Workspace trust does not gate <code>allowed-tools</code> — a project skill\u2019s grant applies even in a folder you have never trusted, including in <code>-p</code> runs. Read the skills in a repo before running Claude Code there.'},
    {s:'stale',t:'when_to_use is not a field',d:'The field is <code>description</code>. Outside Claude Code only six spec fields validate at all: <code>name, description, license, compatibility, metadata, allowed-tools</code>.'}
  ],
  quiz:[
    {q:'What determines the slash command name of a project skill?',a:'The <b>directory name</b>. The <code>name:</code> frontmatter field is only a display label (plugin skills are the exception).'},
    {q:'What is the skill budget after auto-compaction?',a:'The most recent invocation of each skill is re-attached, keeping the first <b>5,000 tokens</b> of each, within a <b>25,000-token</b> combined budget, filled newest-first. Older skills can be dropped entirely.'},
    {q:'When does an <code>allowed-tools</code> grant expire?',a:'When you send your next message. The skill <i>content</i> stays in context; the <i>permission</i> grant does not. Re-invoking re-applies it.'},
    {q:'Which skills cannot be preloaded into a subagent?',a:'Any with <code>disable-model-invocation: true</code>, since preloading draws from the set Claude can invoke. That includes the bundled <code>/verify</code>.'}
  ],
  docs:[['Extend Claude with skills','https://code.claude.com/docs/en/skills'],['Explore the .claude directory','https://code.claude.com/docs/en/claude-directory']]
},

{
  id:'p4', n:'04', title:'Permissions and sandbox', layer:'hard', layerLabel:'Hard',
  time:'2–3 h', pre:'Phase 00',
  objective:'Make "never do X" <b>true</b> regardless of what the model decides, and stop paying the permission-prompt tax without reaching for <code>--dangerously-skip-permissions</code>.',
  concepts:[
    {h:'The evaluation order — memorize this',
     table:{head:['#','Step','Can it approve?','Can it block?'],rows:[
       ['1','<b>Hooks</b> (<code>PreToolUse</code>)','Yes — skips the prompt','<b>Yes</b>'],
       ['2','<b>Deny</b> rules','No','<b>Yes</b> — in every mode, including bypass'],
       ['3','<b>Ask</b> rules','No','Routes to a prompt'],
       ['4','<b>Permission mode</b>','<code>bypassPermissions</code>, <code>acceptEdits</code>','<code>dontAsk</code> denies'],
       ['5','<b>Allow</b> rules','Yes','No'],
       ['6','Prompt / <code>canUseTool</code>','Yes','Yes']]},
     p:'<p>This ordering is the foundation of the whole determinism story: <b>hooks run before the permission mode is even consulted</b>, so a hook deny holds under <code>--dangerously-skip-permissions</code>. And a hook <code>allow</code> only skips the interactive prompt — it does not override a deny rule, an enterprise managed deny list, or an <code>ask</code> rule.</p>'},
    {h:'The six modes',
     table:{head:['Mode','Behavior'],rows:[
       ['<code>default</code> (alias <code>manual</code>)','Prompts for anything not pre-approved'],
       ['<code>acceptEdits</code>','Auto-approves file edits and common filesystem commands'],
       ['<code>plan</code>','Read-only. File edits and file-modifying shell commands always prompt, allow rules notwithstanding'],
       ['<code>auto</code>','<b>A model classifier approves or denies prompts.</b> The right answer to "too many prompts"'],
       ['<code>dontAsk</code>','Every prompt becomes a denial. Fixed, explicit tool surface for headless runs'],
       ['<code>bypassPermissions</code>','Approves everything that reaches step 4. Cannot be entered mid-session; refuses to run as root']]},
     p:'<p>Your friend\u2019s map lists four modes. There are six, and the two missing ones — <code>auto</code> and <code>dontAsk</code> — are exactly the two that make autonomous operation safe.</p>'},
    {h:'Nothing auto-approves these, in any mode',
     p:'<ul><li>Tools matched by an explicit <b>ask</b> rule</li><li>Connector tools your organization set to <code>ask</code></li><li>Tools requiring user interaction: <code>AskUserQuestion</code>, MCP tools marked <code>requiresUserInteraction</code></li><li><code>rm</code> / <code>rmdir</code> targeting a <b>critical path</b> — no allow rule and no <code>PreToolUse</code> hook <code>allow</code> clears this</li><li>Cross-session messaging safeguards</li></ul>'},
    {h:'Rule syntax',
     code:C('// .claude/settings.json',
            '{ "permissions": {',
            '    "deny":  ["Read(./.env*)", "Read(./secrets/**)", "Bash(curl *)", "WebFetch"],',
            '    "ask":   ["Bash(git push *)", "Bash(gh pr merge *)"],',
            '    "allow": ["Bash(npm run *)", "Bash(pytest *)", "Read(./src/**)"]',
            '} }',
            '',
            '# other specifier forms:',
            '#   WebFetch(domain:example.com)   Skill(deploy *)   Agent(Explore)',
            '#   mcp__github                    mcp__*'),
     p:'<p>Rules evaluate deny → ask → allow, and <b>the first match wins regardless of specificity</b>. A broad deny beats a narrow allow.</p>'},
    {h:'Sandbox is a different layer, not a stronger rule',
     p:'<p>Permission rules control what Claude <i>attempts</i>. The sandbox is OS-level enforcement on the <b>Bash tool and its child processes</b> — filesystem and network. Use both.</p><ul><li><code>sandbox.filesystem</code> merges with your Read/Edit deny rules into one boundary</li><li>Network restrictions merge WebFetch rules with <code>allowedDomains</code>/<code>deniedDomains</code></li><li><code>autoAllowBashIfSandboxed</code> (default <code>true</code>) lets a sandboxed command substitute the boundary for a bare <code>Bash</code> ask rule — <b>except in plan mode</b>, where it does not</li><li>Content-scoped ask rules like <code>Bash(git push *)</code> still prompt even when sandboxed</li></ul>'},
    {h:'Reducing prompts the safe way',
     code:C('/permissions               # manage allow / ask / deny interactively',
            '/fewer-permission-prompts  # scans transcripts, proposes a prioritized allowlist',
            '/add-dir ../shared         # file access only — does NOT load that dir\u2019s config',
            '',
            'claude --permission-mode auto   # classifier-gated, not blind')}
  ],
  lab:{title:'Prove the boundary holds',
    steps:[
      'Write <code>.claude/settings.json</code> with <code>deny: ["Read(./.env*)", "Bash(rm -rf *)"]</code>.',
      'Ask Claude to read <code>.env</code>. Confirm the denial.',
      'Restart with <code>claude --dangerously-skip-permissions</code> and ask again. <b>Confirm the deny still holds.</b> This is the determinism lesson, felt rather than read.',
      'Now try to defeat your own <code>Bash(rm -rf *)</code> deny with a compound command: <code>cd /tmp &amp;&amp; rm -rf ./scratch</code>. Note whether the prefix matcher catches it.',
      'Enable the sandbox and re-run the compound command. Note the difference between "Claude was not allowed to try" and "the process could not reach it".',
      'Run <code>/fewer-permission-prompts</code> and read the allowlist it proposes before accepting.'],
    verify:'You can state, for your own repo, which rules are advisory and which are enforced — and you have never needed to type <code>--dangerously-skip-permissions</code> to get work done.'},
  gotchas:[
    {s:'trap',t:'Allow rules have no effect under bypassPermissions',d:'The mode approves everything that reaches step 4. <code>allowed_tools</code> does not constrain it — every tool is approved, not just the listed ones.'},
    {s:'trap',t:'Bash pattern matching is prefix-based and defeatable',d:'Compound commands, shell expansion, and quoting all evade naive string matchers. For real logic, use a <code>PreToolUse</code> hook that parses <code>tool_input.command</code>.'},
    {s:'stale',t:'auto mode is the answer to prompt fatigue, not bypass',d:'<code>bypassPermissions</code> offers no protection against prompt injection or unintended actions. <code>auto</code> runs a safety classifier and eliminates most prompts. Admins can block bypass entirely with <code>permissions.disableBypassPermissionsMode: "disable"</code>.'},
    {s:'cost',t:'--add-dir grants file access, not configuration',d:'CLAUDE.md, rules, and settings from an added directory are not loaded unless you set <code>CLAUDE_CODE_ADDITIONAL_DIRECTORIES_CLAUDE_MD=1</code>.'}
  ],
  quiz:[
    {q:'What runs first — a <code>PreToolUse</code> hook or a deny rule?',a:'The hook. Order is hooks → deny → ask → mode → allow → prompt. That is why a hook deny holds even under <code>--dangerously-skip-permissions</code>.'},
    {q:'Which mode turns every permission prompt into a denial?',a:'<code>dontAsk</code>. Pre-approved tools still run; everything else is denied without prompting.'},
    {q:'Can an allow rule approve <code>rm -rf</code> on a critical path?',a:'No. Neither an allow rule nor a <code>PreToolUse</code> hook <code>allow</code> clears a critical-path removal, in any mode.'},
    {q:'What does the sandbox restrict that permission rules do not?',a:'It is OS-level and applies to the Bash tool and its child processes — filesystem and network reachability, enforced even if a prompt injection gets past Claude\u2019s decision-making.'}
  ],
  docs:[['Choose a permission mode','https://code.claude.com/docs/en/permission-modes'],['Configure permissions','https://code.claude.com/docs/en/permissions'],['Configure the sandboxed Bash tool','https://code.claude.com/docs/en/sandboxing'],['Claude Code settings','https://code.claude.com/docs/en/settings']]
},

{
  id:'p5', n:'05', title:'Hooks', layer:'hard', layerLabel:'Hard',
  time:'3–4 h', pre:'Phase 04',
  objective:'Encode "always run Y after Z" and "never X" as executable shell, not as prose in a markdown file that the model may or may not honor.',
  concepts:[
    {h:'Where they live and what they are',
     code:C('// .claude/settings.json  (also user, local, managed — all merge, all fire)',
            '{ "hooks": {',
            '    "PreToolUse": [{',
            '      "matcher": "Bash",',
            '      "hooks": [{ "type": "command", "command": "./.claude/guard.sh", "timeout": 5 }]',
            '    }],',
            '    "PostToolUse": [{',
            '      "matcher": "Edit|Write",',
            '      "hooks": [{ "type": "command", "command": "npx prettier --write $CLAUDE_FILE_PATHS" }]',
            '    }]',
            '} }'),
     p:'<p>Handler types: <code>command</code>, <code>http</code>, and <code>mcp_tool</code>. Hooks from every settings scope <b>merge</b> — unlike skills and subagents, which override by name. Subagents can also carry their own <code>hooks:</code> frontmatter.</p>'},
    {h:'Three cadences',
     p:'<ul><li><b>Once per session</b> — <code>SessionStart</code>, <code>SessionEnd</code></li><li><b>Once per turn</b> — <code>UserPromptSubmit</code>, <code>Stop</code>, <code>StopFailure</code></li><li><b>Every tool call</b> — <code>PreToolUse</code>, <code>PostToolUse</code></li></ul><p>Plus a long tail of situational events: <code>Setup</code>, <code>InstructionsLoaded</code>, <code>UserPromptExpansion</code>, <code>PermissionRequest</code>, <code>PermissionDenied</code>, <code>PostToolUseFailure</code>, <code>PostToolBatch</code>, <code>SubagentStart</code>, <code>SubagentStop</code>, <code>TaskCreated</code>, <code>TaskCompleted</code>, <code>TeammateIdle</code>, <code>Elicitation</code>, <code>ElicitationResult</code>, <code>MessageDisplay</code>, <code>PreCompact</code>, <code>PostCompact</code>, <code>Notification</code>, <code>ConfigChange</code>, <code>CwdChanged</code>, <code>DirectoryAdded</code>, <code>FileChanged</code>, <code>WorktreeCreate</code>, <code>WorktreeRemove</code>.</p>'},
    {h:'Exit codes — the trap everyone hits',
     table:{head:['Exit','Meaning'],rows:[
       ['<code>0</code>','No objection. For <code>PreToolUse</code> this is <b>not</b> an approval — the normal permission flow still runs. For <code>UserPromptSubmit</code> / <code>SessionStart</code>, stdout is added to context'],
       ['<code>2</code>','<b>Block.</b> stderr is the reason. Where it goes depends on the event'],
       ['anything else','<b>Non-blocking error.</b> The action proceeds — unless stdout carries valid JSON that passes schema validation, in which case the JSON decides']]},
     p:'<p>Read that last row again: <b><code>exit 1</code> does not block.</b> The conventional Unix failure code silently lets the action through. If your hook enforces policy, it must <code>exit 2</code>. The one exception is <code>WorktreeCreate</code>, where any non-zero exit aborts creation.</p>'},
    {h:'A blocking guard, both ways',
     code:C('#!/bin/bash',
            'input=$(cat)',
            'command=$(jq -r \'.tool_input.command\' <<<"$input")',
            '',
            'if [[ "$command" == *"rm -rf"* ]]; then',
            '  echo "Blocked: rm -rf is not permitted. Move to _trash/ instead." >&2',
            '  exit 2',
            'fi',
            'exit 0   # no decision — normal permission flow applies'),
     p:'<p>Or exit 0 with structured JSON for richer control. Pick one style per hook; do not mix.</p>',
     code2:C('{ "hookSpecificOutput": {',
             '    "hookEventName": "PreToolUse",',
             '    "permissionDecision": "deny",',
             '    "permissionDecisionReason": "Use rg instead of grep in this repo"',
             '} }',
             '',
             '// permissionDecision: "allow" | "deny" | "ask"  ("defer" only in -p mode)',
             '// allow  = skip the interactive prompt. Deny and ask rules STILL apply.')},
    {h:'Which events can actually block',
     table:{head:['Event','Blocks?','Effect of exit 2'],rows:[
       ['<code>PreToolUse</code>','Yes','Blocks the tool call'],
       ['<code>UserPromptSubmit</code>','Yes','Blocks processing and erases the prompt'],
       ['<code>UserPromptExpansion</code>','Yes','Blocks the expansion'],
       ['<code>Stop</code>','Yes','Prevents Claude from stopping — continues the conversation'],
       ['<code>SubagentStop</code>','Yes','Prevents the subagent from stopping'],
       ['<code>TaskCreated</code> / <code>TaskCompleted</code>','Yes','Prevents creation / completion, sends feedback'],
       ['<code>TeammateIdle</code>','Yes','Keeps the teammate working'],
       ['<code>PermissionRequest</code>','<b>No</b>','Exit 2 is ignored — deny via the <code>decision</code> object'],
       ['<code>SessionStart</code>, <code>Setup</code>, <code>SubagentStart</code>','No','stderr shown, execution continues']]}},
    {h:'Rewriting, not just blocking',
     p:'<p>A few events can transform content rather than only gate it:</p><ul><li><code>PreToolUse</code> — <code>updatedInput</code> replaces the tool\u2019s arguments before it runs</li><li><code>PostToolUse</code> — <code>updatedToolOutput</code> replaces the result Claude sees</li><li><code>PermissionRequest</code> — <code>updatedInput</code> inside the <code>decision</code> object</li><li><code>UserPromptSubmit</code> — cannot replace the prompt, only inject <code>additionalContext</code> alongside it</li><li><code>MessageDisplay</code> — <code>displayContent</code> changes what is on screen only; the transcript and what Claude sees keep the original</li></ul><p>For redaction: intercept outbound at <code>PreToolUse</code>, inbound at <code>PostToolUse</code>.</p>'}
  ],
  lab:{title:'A guard you can trust and a guard you cannot',
    steps:[
      'Write the <code>rm -rf</code> guard above as <code>.claude/guard.sh</code>. <code>chmod +x</code> it. Register it on <code>PreToolUse</code> with matcher <code>Bash</code>.',
      'Verify with <code>/hooks</code>, then trigger it.',
      'Change <code>exit 2</code> to <code>exit 1</code> and trigger it again. <b>Watch the command run anyway.</b>',
      'Restore <code>exit 2</code>. Now break the path in settings.json (typo the filename) and trigger it. Look for <code>Failed with non-blocking status code:</code> in the transcript — your gate is now silently off.',
      'Add a <code>PostToolUse</code> hook on <code>Edit|Write</code> that runs your formatter.',
      'Add a <code>Stop</code> hook that exits 2 if <code>git status --porcelain</code> shows uncommitted changes to a protected path, with a reason on stderr. Watch Claude receive the feedback and keep working.',
      'Run <code>claude --debug</code> and inspect the hook log.'],
    verify:'You have seen a hook fail open, and you know what that looks like in the transcript.'},
  gotchas:[
    {s:'trap',t:'exit 1 does not block',d:'Only <code>exit 2</code> blocks through the exit code alone. Exit 1 is a non-blocking error and the action proceeds. The lone exception: <code>WorktreeCreate</code> aborts on any non-zero exit.'},
    {s:'trap',t:'A timed-out hook renders no decision',d:'A <code>command</code>, <code>http</code>, or <code>mcp_tool</code> hook that hits its <code>timeout</code> is cancelled, its output discarded, and the tool call <b>continues through the normal permission flow</b>. Never build a gate on a slow hook. (Agent SDK callback hooks are the opposite: a timeout blocks.)'},
    {s:'trap',t:'A mistyped path silently disables the gate',d:'The shell exits ~127 and you get a non-blocking error notice, then the action proceeds. Watch the first run of every policy hook.'},
    {s:'cost',t:'Hooks are the right home for "never do X"',d:'CLAUDE.md is context, not enforcement. Any instruction that must run at a fixed point — before every commit, after each edit — belongs here. If you find yourself writing "ALWAYS" in caps in CLAUDE.md, you want a hook.'},
    {s:'ok',t:'For truly non-bypassable rules, go below the agent',d:'Hooks are strong, but the strongest boundary is the one the process cannot reach at all: the sandbox, a container, or OS-level policy.'}
  ],
  quiz:[
    {q:'What does <code>exit 0</code> mean for a <code>PreToolUse</code> hook?',a:'"No objection" — <b>not</b> an approval. The normal permission flow still runs afterward.'},
    {q:'A <code>PreToolUse</code> hook times out. What happens to the tool call?',a:'It proceeds through the normal permission flow. The hook renders no decision and its output is discarded. Do not build gates on slow hooks.'},
    {q:'Your hook exits 1 with a message on stderr. Is the action blocked?',a:'No. Exit 1 is a non-blocking error; the action proceeds. Use <code>exit 2</code>.'},
    {q:'Which event ignores exit 2 entirely?',a:'<code>PermissionRequest</code>. Deny through the <code>decision</code> object instead.'},
    {q:'How do hooks from different settings scopes combine?',a:'They <b>merge</b> — all registered hooks fire for their matching events regardless of source. (Skills and subagents override by name; MCP servers override by name; CLAUDE.md files are additive.)'}
  ],
  docs:[['Automate actions with hooks','https://code.claude.com/docs/en/hooks-guide'],['Hooks reference','https://code.claude.com/docs/en/hooks']]
},

{
  id:'p6', n:'06', title:'Subagents and isolation', layer:'scale', layerLabel:'Scale',
  time:'3–4 h', pre:'Phases 03, 04',
  objective:'Move expensive reading out of your context window, and design the <b>return contract</b> — because the summary is all you will ever see.',
  concepts:[
    {h:'Scope and precedence',
     table:{head:['Location','Scope','Priority'],rows:[
       ['Managed settings','Organization','1 (highest)'],
       ['<code>--agents</code> CLI flag','This session','2'],
       ['<code>.claude/agents/</code>','Project — check this in','3'],
       ['<code>~/.claude/agents/</code>','All your projects','4'],
       ['Plugin <code>agents/</code>','Where the plugin is enabled','5 (lowest)']]}},
    {h:'The full frontmatter surface',
     code:C('---',
            'name: reviewer                 # required, lowercase and hyphens',
            'description: Adversarial review of a diff for correctness bugs',
            'tools: Read, Grep, Glob, Bash  # allowlist',
            'disallowedTools: Write, Edit   # denylist',
            'model: sonnet                  # sonnet|opus|haiku|fable|inherit|full ID',
            'effort: high                   # low|medium|high|xhigh|max',
            'permissionMode: default        # default|acceptEdits|auto|dontAsk|bypassPermissions|plan|manual',
            'maxTurns: 12',
            'skills: [api-conventions]      # FULL content injected at startup',
            'mcpServers: [github]           # named or inline definition',
            'memory: project                # user|project|local — persistent agent memory',
            'hooks: { }                     # lifecycle hooks scoped to this subagent',
            'isolation: worktree            # run in its own git worktree',
            'background: false',
            'initialPrompt: "..."',
            'color: blue',
            '---',
            '',
            'System prompt goes here. Specify the OUTPUT FORMAT explicitly —',
            'the summary is the only thing the parent will ever see.'),
     p:'<p>Note how much of this is missing from the usual summaries: <code>maxTurns</code>, <code>memory</code>, <code>mcpServers</code>, per-agent <code>hooks</code>, and <code>isolation: worktree</code> are all real levers.</p>'},
    {h:'What loads — and what does not',
     p:'<p><b>Loads at startup:</b> the agent\u2019s own system prompt (not the full Claude Code one), the delegation message, the full CLAUDE.md hierarchy, git status, the full content of any <code>skills:</code> listed, and a roster of sibling agents reachable via <code>SendMessage</code>.</p><p><b>Does not load:</b> conversation history, skills already invoked in the parent, output style settings, the parent\u2019s auto memory, the main conversation\u2019s context window size.</p><p><b>Exception:</b> the built-in <code>Explore</code> and <code>Plan</code> agents skip CLAUDE.md and git status, deliberately, to stay small.</p>'},
    {h:'Foreground, background, and forks',
     table:{head:['','Regular subagent','Fork (<code>/subtask</code>)'],rows:[
       ['Context','Fresh','Full parent conversation'],
       ['System prompt','From definition','Same as main'],
       ['Tools','From definition (reduced if background)','Same as main'],
       ['Model','From definition','Same as main'],
       ['Prompt cache','Separate','Shared'],
       ['Can spawn more','Yes, to the depth limit','<b>No</b>']]},
     p:'<p>Background subagents get a <b>reduced built-in tool set</b>: Read, Grep, Glob, Bash, PowerShell, Edit, Write, NotebookEdit, WebFetch, WebSearch, TodoWrite, Skill, ToolSearch, EnterWorktree, ExitWorktree, Monitor, TaskStop, SendMessage — plus all MCP tools. Everything else is removed. If your agent needs a tool outside that list, run it in the foreground.</p>'},
    {h:'Hard limits',
     code:C('CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH   # default 3 layers deep',
            'CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS   # default 20 simultaneous',
            '',
            '# at the depth limit the Agent tool is removed entirely',
            '# exceeding concurrency returns: "Concurrent subagent limit reached"'),
     p:'<p>"Several levels" is 3. "Practical limits" is 20. Both are configurable via <code>env</code> in settings.</p>'},
    {h:'Designing the return contract',
     p:'<p>Context isolation is the point, and it is also the constraint: the parent never sees intermediate steps. So the agent\u2019s system prompt must specify the output shape, not just the task. A good one names the format, the required fields, and what to do when there is nothing to report.</p>',
     code:C('Return your findings as a markdown list. For each finding:',
            '  - file:line',
            '  - one-sentence description of the defect',
            '  - a concrete failure scenario (inputs -> wrong output)',
            'Rank most-severe first. If you found nothing, say exactly: NO FINDINGS.',
            'Do not include your search process, files you ruled out, or a summary of the codebase.')}
  ],
  lab:{title:'A reviewer that returns something you can act on',
    steps:[
      'Create <code>.claude/agents/reviewer.md</code> with <code>tools: Read, Grep, Glob, Bash</code>, <code>disallowedTools: Write, Edit</code>, and a system prompt that mandates the output format above.',
      'Add <code>skills: [your-conventions-skill]</code> from Phase 03 and <code>memory: project</code>.',
      'Run it against a real diff. Note what came back and what you wish had.',
      'Tighten the output contract based on that gap. Run again.',
      'Now run the same review three ways: one subagent, three parallel subagents with different lenses, and inline in your main session. Compare <code>/context</code> impact and <code>/usage</code>.',
      'Before the parallel run, try <code>/mcp disable</code> on servers you do not need and note the difference in subagent startup context.'],
    verify:'Your agent returns a consistent, parseable format, and you have measured what isolation actually saved you.'},
  gotchas:[
    {s:'trap',t:'Subagents inherit every MCP tool definition from the parent',d:'This can fill a subagent\u2019s window before its first turn. Run <code>/mcp disable &lt;name&gt;</code> for servers the worker does not need, or scope with the per-agent <code>mcpServers:</code> field.'},
    {s:'trap',t:'Background subagents lose most built-in tools',d:'A backgrounded <code>context: fork</code> skill hits this too — the fork exemption does not cover it. Set <code>background: false</code> to keep the full set.'},
    {s:'cost',t:'Fan-out is real money and can thrash',d:'Three focused workers beat five scattered ones. Concurrency and depth limits exist because over-fanning is the common failure.'},
    {s:'trap',t:'You cannot see the trace',d:'If you need to watch the reasoning, do not isolate it. Isolation trades visibility for context.'}
  ],
  quiz:[
    {q:'What is the default subagent nesting depth?',a:'3 layers (main → 1 → 2 → 3). At the limit the Agent tool is removed. Configure with <code>CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH</code>.'},
    {q:'What do the built-in Explore and Plan agents skip at startup?',a:'CLAUDE.md and git status — deliberately, to keep their context small.'},
    {q:'What does a fork inherit that a regular subagent does not?',a:'The full parent conversation, the same system prompt, tools, and model, and a shared prompt cache. A fork cannot spawn further forks.'},
    {q:'How many subagents can run at once by default?',a:'20. Exceeding it returns "Concurrent subagent limit reached". Set <code>CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS</code>.'}
  ],
  docs:[['Create custom subagents','https://code.claude.com/docs/en/sub-agents'],['Run agents in parallel','https://code.claude.com/docs/en/agents'],['Manage multiple agents with agent view','https://code.claude.com/docs/en/agent-view']]
},

{
  id:'p7', n:'07', title:'Scale out', layer:'scale', layerLabel:'Scale',
  time:'2–3 h', pre:'Phase 06',
  objective:'Know when parallelism pays for itself and when it just multiplies your bill — and keep teams from forming when you did not ask for one.',
  concepts:[
    {h:'Agent teams (experimental)',
     code:C('CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1   # in settings.json env, or your shell',
            '',
            '# then, in the session:',
            'Spawn three teammates to review PR #142:',
            '  - one on security implications',
            '  - one on performance impact',
            '  - one validating test coverage',
            'Have them each review and report findings.'),
     p:'<p>Off by default. Without the variable, no team is set up, no team directories are written, and Claude will not spawn teammates. One session is the lead; teammates each get their own context window and can message <b>each other</b>, not just the lead.</p>'},
    {h:'Teams vs subagents, in one line each',
     table:{head:['','Subagents','Agent teams'],rows:[
       ['Communication','Report only to the parent; never to each other','Shared task list + direct teammate-to-teammate messaging'],
       ['You can talk to them','No','Yes — any teammate directly'],
       ['Coordination','Parent orchestrates','File-locked task claiming, self-claim or lead-assigned'],
       ['Cost','One extra window per agent','Scales with active teammates — significantly more'],
       ['Best for','Isolated reads, parallel independent work','Research, review, competing hypotheses, cross-layer features']]}},
    {h:'Quality gates for teams',
     p:'<p>Three hook events exist specifically for teams. Each blocks on exit 2 and sends feedback:</p><ul><li><code>TeammateIdle</code> — fires as a teammate is about to go idle. Exit 2 keeps it working</li><li><code>TaskCreated</code> — exit 2 prevents creation</li><li><code>TaskCompleted</code> — exit 2 prevents marking complete</li></ul><p>This is how you enforce "no task is complete until tests pass" across a team without trusting prose.</p>'},
    {h:'Dynamic workflows and ultracode',
     p:'<p><code>/effort ultracode</code> sends <code>xhigh</code> to the model <b>and</b> has Claude orchestrate a dynamic workflow for each substantive task — planning and fanning out subagents at scale. Session-only. It is not accepted by the persisted <code>effortLevel</code> setting or by <code>CLAUDE_CODE_EFFORT_LEVEL</code>.</p>'},
    {h:'Worktrees and parallel sessions',
     code:C('# an agent that works in its own git worktree:',
            'isolation: worktree',
            '',
            '/batch <instruction>    # large-scale parallel changes across a codebase',
            '/background [prompt]    # detach this session, free the terminal',
            '/fork [prompt]          # copy the conversation into a new background session',
            '/subtask [prompt]       # side task in a fork that reports back here',
            '/tasks                  # list background work, including finished subagents',
            '/list-agents            # names you can message'),
     p:'<p>Worktrees are the answer to "two agents editing the same file". Give each worker its own checkout instead of coordinating writes.</p>'}
  ],
  lab:{title:'Measure whether the team was worth it',
    steps:[
      'Pick a PR with genuinely separable review dimensions.',
      'Run <code>/usage</code> and note the baseline.',
      'Review it with three <b>subagents</b>, one lens each. Record <code>/usage</code>.',
      'Enable teams, <code>/clear</code>, and review the same PR with three <b>teammates</b> instructed to challenge each other. Record <code>/usage</code>.',
      'Compare cost against findings actually worth acting on.',
      'Add a <code>TaskCompleted</code> hook that exits 2 unless the test suite passed, and watch a teammate get sent back to work.'],
    verify:'You have a number for what a team costs you, and a rule of thumb for when it earns it.'},
  gotchas:[
    {s:'trap',t:'Teams can form when you did not ask',d:'While teams are enabled, any subagent Claude <i>names</i> launches as a teammate — and Claude names subagents on its own so it can message them. If you wanted subagents, turn teams off.'},
    {s:'cost',t:'Token usage scales with active teammates',d:'Each has its own window. Worth it for research and review; wasteful for routine or sequential work.'},
    {s:'trap',t:'Two teammates on one file overwrite each other',d:'Split by file ownership, or give each one a worktree.'},
    {s:'trap',t:'A teammate\u2019s model and fast mode are fixed at spawn',d:'<code>/model</code> and <code>/fast</code> only change the lead. <code>/effort</code> does apply to the viewed teammate\u2019s later turns.'}
  ],
  quiz:[
    {q:'What enables agent teams?',a:'<code>CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</code> in settings.json <code>env</code> or the environment. They are off by default and experimental.'},
    {q:'One sentence: teams vs subagents.',a:'Subagents report only to the parent and never talk to each other; teammates share a task list, claim work, and message each other directly — and you can talk to any of them.'},
    {q:'Which three hook events gate team work?',a:'<code>TeammateIdle</code>, <code>TaskCreated</code>, <code>TaskCompleted</code>. Each blocks on exit 2 and returns feedback.'}
  ],
  docs:[['Orchestrate teams of Claude Code sessions','https://code.claude.com/docs/en/agent-teams'],['Dynamic workflows','https://code.claude.com/docs/en/workflows'],['Run parallel sessions with worktrees','https://code.claude.com/docs/en/worktrees'],['Cross-session messaging','https://code.claude.com/docs/en/cross-session-messaging']]
},

{
  id:'pA', n:'08', title:'Run it unattended', layer:'scale', layerLabel:'Scale',
  time:'3–4 h', pre:'Phases 04, 05',
