  objective:'Pick the right autonomy mechanism for <b>what you are actually waiting on</b> — a condition, a clock, or an event — and bound it so a forgotten loop cannot run all night.',
  concepts:[
    {h:'Four ways to keep working without you',
     table:{head:['Mechanism','Next turn starts when','Stops when'],rows:[
       ['<code>/goal &lt;condition&gt;</code>','The previous turn finishes','A model confirms the condition is met, or judges it impossible'],
       ['<code>/loop [interval] [prompt]</code>','A time interval elapses','You press <kbd>Esc</kbd>, Claude decides it is done, or 7 days pass'],
       ['A <code>Stop</code> hook','The previous turn finishes','Your own script or prompt decides'],
       ['A channel','An external event is pushed in','Event-driven — nothing to stop']]},
     p:'<p>Pick by <b>what starts the next turn</b>. That single question resolves almost every "which one do I want" argument.</p><p>Note what is <i>not</i> on this list: <code>auto</code> mode. Auto mode approves tool calls <i>within</i> a turn but never starts a new one — Claude still stops when it judges the work done. It is complementary, not an alternative: auto mode removes per-tool prompts, <code>/goal</code> removes per-turn prompts. Run them together.</p>'},

    {h:'/goal — work toward a condition',
     code:C('/goal all tests in test/auth pass and the lint step is clean',
            '',
            '/goal            # status: condition, duration, turns evaluated, token spend,',
            '                 #         and the evaluator’s most recent reason',
            '/goal clear      # aliases: stop, off, reset, none, cancel',
            '                 # /clear (new conversation) also removes an active goal'),
     p:'<p>One goal per session; a new one replaces the old. Setting it <b>starts a turn immediately</b> with the condition as the directive — no separate prompt needed. A <code>◎ /goal active</code> indicator shows how long it has been running, and <kbd>Ctrl+O</kbd> reveals the reason behind each verdict.</p><p>Conditions can be up to 4,000 characters. A goal still active when a session ends is restored by <code>--resume</code> or <code>--continue</code>; the condition carries over but the turn count, timer, and token baseline all reset. An achieved or cleared goal is not restored.</p>'},

    {h:'How the evaluator actually works — and its one hard limit',
     p:'<p><code>/goal</code> is a wrapper around a <b>session-scoped prompt-based <code>Stop</code> hook</b>. After every turn, Claude Code sends the condition plus the conversation so far to your configured small fast model (Haiku by default on the Claude API). It returns one of three verdicts with a reason:</p><ul><li><b>Not yet met</b> — Claude keeps working and takes the reason as guidance for the next turn</li><li><b>Met</b> — goal cleared, achieved entry recorded</li><li><b>Impossible</b> — the condition can never be satisfied. Goal cleared, failed entry recorded. You do not need to clear it yourself</li></ul><p><b>The evaluator does not call tools.</b> It cannot run commands or read files. It judges only what Claude has already surfaced in the conversation. This single fact determines whether your condition will ever resolve — see the next concept.</p><p>Two more behaviors worth knowing: if a subagent or background shell command is still running when a turn ends, evaluation is skipped for that turn. And if Claude answers the evaluator several turns in a row with no tool use, Claude Code stops the loop, prints a warning, and hands control back with the goal still set — evaluation resumes on your next prompt.</p>'},

    {h:'Writing a condition that resolves',
     p:'<p>A condition that holds up across many turns has three parts:</p><ul><li><b>One measurable end state</b> — a test result, a build exit code, a file count, an empty queue</li><li><b>A stated check</b> — how Claude should prove it, so the proof lands in the transcript where the evaluator can read it</li><li><b>Constraints that matter</b> — anything that must not change on the way there</li></ul><p>And a bound, so it cannot run forever.</p>',
     code:C('# Will not resolve — nothing Claude outputs can demonstrate this',
            '/goal the authentication module is clean',
            '',
            '# Resolves — every clause is visible in the transcript',
            '/goal every call site in src/auth/ uses the v2 client:',
            '  prove it with "npm test -- src/auth" exiting 0 and "npx tsc --noEmit" clean.',
            '  Do not modify files outside src/auth/ or any test fixture.',
            '  Report turn count each turn and stop after 20 turns.')},

    {h:'/loop — repeat on a clock',
     table:{head:['What you provide','Example','What happens'],rows:[
       ['Interval and prompt','<code>/loop 5m check the deploy</code>','Runs on a fixed cron schedule'],
       ['Prompt only','<code>/loop check the deploy</code>','Claude picks the interval each iteration, 1 min to 1 hour, and prints the delay and its reason'],
       ['Interval only, or nothing','<code>/loop</code>','Runs the built-in maintenance prompt, or your <code>loop.md</code> if one exists']]},
     p:'<p>The interval can lead as a bare token (<code>30m</code>) or trail as a clause (<code>every 2 hours</code>). Units: <code>s</code>, <code>m</code>, <code>h</code>, <code>d</code>. Seconds round up to a minute (cron granularity), and intervals that do not map to a clean cron step — <code>7m</code>, <code>90m</code> — are rounded to one that does, and Claude tells you what it picked.</p><p>In self-paced mode Claude may reach for the <b>Monitor tool</b> instead: it runs a background script and streams each output line back, which beats re-running a prompt on a timer on both tokens and latency.</p><p>Stop a waiting loop with <kbd>Esc</kbd> — that clears the pending wakeup. A self-paced loop can also end itself by calling <code>ScheduleWakeup</code> with <code>stop: true</code>. Tasks you scheduled by asking Claude directly are <i>not</i> affected by <kbd>Esc</kbd>.</p>'},

    {h:'The bare /loop maintenance prompt, and loop.md',
     p:'<p><code>/loop</code> with no prompt runs a built-in maintenance prompt that works, in order: continue unfinished work from the conversation → tend the current branch’s PR (review comments, failed CI, merge conflicts) → run cleanup passes such as bug hunts or simplification when nothing else is pending. It does not start new initiatives, and irreversible actions like pushing only proceed when they continue something the transcript already authorized.</p><p>Replace that default with your own:</p>',
     code:C('# .claude/loop.md      (project — wins when both exist)',
            '# ~/.claude/loop.md    (user — applies where no project file exists)',
            '',
            'Check the release/next PR. If CI is red, pull the failing job log,',
            'diagnose, and push a minimal fix. If new review comments have arrived,',
            'address each one and resolve the thread. If everything is green and',
            'quiet, say so in one line.'),
     p2:'<p>It defines the single default for bare <code>/loop</code>, not a list of tasks, and is ignored whenever you supply a prompt on the command line. Edits take effect on the <b>next iteration</b>, so you can refine it while a loop runs. Content past 25,000 bytes is truncated.</p>'},

    {h:'Passing a skill to /loop',
     code:C('/loop 20m /review-pr 1234'),
     p:'<p>A scheduled fire only runs skills <b>Claude is allowed to invoke on its own</b>. These reach Claude as <i>plain text</i> instead of executing:</p><ul><li>Built-in commands such as <code>/permissions</code>, <code>/model</code>, <code>/clear</code></li><li>Skills with <code>disable-model-invocation: true</code> — <b>including the bundled <code>/verify</code></b></li><li>Skills withheld by <code>skillOverrides</code> or a <code>Skill</code> deny rule</li><li>MCP prompts such as <code>/mcp__github__list_prs</code></li></ul><p>This is the trap: <code>/loop 30m /verify</code> looks like a self-testing loop and is actually Claude reading the string "/verify" every half hour.</p>'},

    {h:'Session-scoped scheduled tasks',
     code:C('# ask in natural language — Claude drives the tools',
            'remind me at 3pm to push the release branch',
            'in 45 minutes, check whether the integration tests passed',
            'what scheduled tasks do I have?',
            'cancel the deploy check job',
            '',
            '# under the hood:  CronCreate | CronList | CronDelete',
            '# 8-character task IDs. 50 tasks max per session.',
            '',
            '# 5-field cron, LOCAL timezone: minute hour day-of-month month day-of-week',
            '*/5 * * * *     every 5 minutes',
            '0 9 * * 1-5     weekdays at 9am local',
            '30 14 15 3 *    March 15 at 2:30pm local'),
     p:'<p>Wildcards, single values, steps (<code>*/15</code>), ranges (<code>1-5</code>), and lists (<code>1,15,30</code>) all work. Extended syntax does not: no <code>L</code>, <code>W</code>, <code>?</code>, or name aliases like <code>MON</code>. When both day-of-month and day-of-week are constrained, a date matches if <i>either</i> does — standard vixie-cron semantics.</p><p>Tasks fire <b>between turns</b>, never mid-response, and there is no catch-up: a fire missed while Claude was busy runs once when it goes idle, not once per missed interval.</p>'},

    {h:'Two behaviors that will surprise you: jitter and expiry',
     p:'<p><b>Jitter.</b> So every session does not hit the API at the same wall-clock moment, the scheduler adds a deterministic offset derived from the task ID:</p><ul><li>Recurring tasks fire up to <b>30 minutes late</b> — or up to half the interval, for sub-hourly tasks. An hourly job set for <code>:00</code> may fire anywhere up to <code>:30</code></li><li>One-shot tasks scheduled for the top or bottom of the hour fire up to <b>90 seconds early</b></li></ul><p>If exact timing matters, pick a minute that is not <code>:00</code> or <code>:30</code> — <code>3 9 * * *</code> instead of <code>0 9 * * *</code> — and the one-shot jitter does not apply.</p><p><b>Seven-day expiry.</b> Recurring tasks expire 7 days after creation: one final fire, then self-delete. This bounds how long a forgotten loop can run. For anything durable, use cloud routines, Desktop scheduled tasks, or GitHub Actions.</p>'},

    {h:'Where should it run?',
     table:{head:['','Cloud routines','Desktop tasks','<code>/loop</code>'],rows:[
       ['Runs on','Cloud, Anthropic-managed','Your machine','Your machine'],
       ['Machine must be on','No','Yes','Yes'],
       ['Open session required','No','No','<b>Yes</b>'],
       ['Survives restarts','Yes','Yes','Restored on <code>--resume</code> if unexpired'],
       ['Local file access','No — fresh clone','Yes','Yes'],
       ['MCP','Connectors per task','Config files and connectors','Inherits from session'],
       ['Permission prompts','None — runs autonomously','Configurable per task','Inherits from session'],
       ['Minimum interval','1 hour','1 minute','1 minute']]},
     p:'<p>Rule of thumb: <b>cloud</b> for work that must run whether or not your laptop is open. <b>Desktop</b> when it needs your local files and tools. <b><code>/loop</code></b> for quick polling inside a session you are already in.</p>'},

    {h:'Channels — react instead of poll',
     code:C('/plugin install telegram@claude-plugins-official',
            '/telegram:configure <bot-token>',
            '',
            'claude --channels plugin:telegram@claude-plugins-official',
            '',
            '/telegram:access pair <code-from-bot>',
            '/telegram:access policy allowlist'),
     p:'<p>A channel is an MCP server that <b>pushes events into a running session</b>, so your CI failure arrives where Claude already has your files open and remembers what you were debugging — instead of being discovered by a poll. Channels can be two-way, so you can ask Claude something from your phone and get the answer back in the same chat while the work runs on your machine.</p><p>Research preview. Telegram, Discord, iMessage, and a <code>fakechat</code> localhost demo are included. Requires Anthropic authentication (claude.ai or a Console API key); not available on Bedrock, Google Cloud’s Agent Platform, or Microsoft Foundry; Team and Enterprise organizations must set <code>channelsEnabled</code>. Being in <code>.mcp.json</code> is not enough — a server must also be named in <code>--channels</code>.</p>'},

    {h:'Bounding autonomy — the part people skip',
     p:'<p>Everything above starts turns without you. Four controls keep that from becoming a problem:</p><ul><li><b>A goal does not change your permission mode.</b> In Manual mode Claude still asks before every unallowed tool call, so an unattended goal stalls on the first prompt. Run <code>/goal</code> in <a href="https://code.claude.com/docs/en/auto-mode-config" target="_blank" rel="noopener">auto mode</a> — classifier-gated — not bypass.</li><li><b>The <code>Stop</code> hook block cap.</b> Claude Code overrides a Stop hook after it blocks <b>eight times in a row</b> without progress. Your script must parse <code>stop_hook_active</code> from the JSON input and exit early when it is <code>true</code>, or you will hit the cap. Raise it with <code>CLAUDE_CODE_STOP_HOOK_BLOCK_CAP</code> if a hook legitimately needs more iterations to converge.</li><li><b>A turn or time clause in the condition.</b> "…or stop after 20 turns." Claude reports progress against it each turn and the evaluator judges it from the conversation.</li><li><b>The kill switches.</b> <code>CLAUDE_CODE_DISABLE_CRON=1</code> disables the scheduler and <code>/loop</code> entirely. <code>/goal</code> is unavailable when <code>disableAllHooks</code> is true or <code>allowManagedHooksOnly</code> is set in managed settings — and it tells you why rather than silently doing nothing.</li></ul>',
     code:C('#!/bin/bash',
            'INPUT=$(cat)',
            'if [ "$(echo "$INPUT" | jq -r \'.stop_hook_active\')" = "true" ]; then',
            '  exit 0   # already triggered a continuation — let Claude stop',
            'fi',
            '# ... your real check here; exit 2 to keep Claude working')},

    {h:'Rolling your own: prompt and agent hooks',
     p:'<p>When <code>/goal</code>’s single session-scoped condition is not enough, write the Stop hook yourself. Two non-shell hook types exist for judgment calls:</p><ul><li><code>type: "prompt"</code> — a single LLM call (Haiku by default; override with <code>model</code>). Returns <code>{"ok": true|false, "reason": "..."}</code>. On <code>Stop</code>, <code>ok: false</code> feeds the reason back so Claude keeps working — unless it also sets <code>"impossible": true</code>, which allows the stop. This is exactly what <code>/goal</code> is built on.</li><li><code>type: "agent"</code> — spawns a subagent that can read files and run commands before deciding. Use it when the hook input alone is not enough to judge. <b>Experimental.</b> 60-second default timeout, up to 50 tool-use turns, no <code>continueOnBlock</code> field.</li></ul>',
     code:C('{ "hooks": { "Stop": [{ "hooks": [{',
            '  "type": "agent",',
            '  "prompt": "Verify that all unit tests pass. Run the suite and check results. $ARGUMENTS",',
            '  "timeout": 120',
            '}]}]}}'),
     p2:'<p>Unlike <code>/goal</code>, a hook in your settings file applies to every session in its scope — which is what you want once a completion standard is a team rule rather than a one-off.</p>'}
  ],
  lab:{title:'Make a goal fail, then make it converge',
    steps:[
      'Set a deliberately unverifiable goal: <code>/goal the auth module is clean</code>. Watch it churn. Press <kbd>Ctrl+O</kbd> and read the evaluator’s reason each turn.',
      '<code>/goal clear</code>. Rewrite it with a stated check, a constraint, and a turn bound — the resolving example above is the template.',
      'Restart in auto mode (<code>claude --permission-mode auto</code>) and set the rewritten goal. Compare how far it gets before needing you.',
      'Run <code>/goal</code> with no arguments mid-run and read the status: turns evaluated, token spend, latest reason.',
      'Now <code>/loop 5m check whether CI passed on the current branch</code>. Note the job ID it confirms.',
      'Stop it with <kbd>Esc</kbd>, then run the same prompt with <b>no interval</b>. Watch Claude pick a delay and print its reason — and see whether it reaches for the Monitor tool instead of polling.',
      'Write a <code>.claude/loop.md</code> for your repo, then run bare <code>/loop</code>. Edit the file mid-run and confirm the next iteration picks it up.',
      'Write the <code>stop_hook_active</code> guard above as a real Stop hook. Then <b>remove the guard</b> and let it block eight times to see the cap warning.',
      'Schedule two one-shots five minutes out: one at <code>:00</code> and one at a minute like <code>:03</code>. Compare actual fire times against jitter.'],
    verify:'You can state, for any waiting task, whether you want <code>/goal</code>, <code>/loop</code>, a Stop hook, or a channel — and every autonomous thing you start has a bound on it.'},
  gotchas:[
    {s:'trap',t:'The goal evaluator cannot run anything',d:'It reads the conversation. It does not call tools, read files, or execute commands. A condition Claude’s own output cannot demonstrate will never resolve — it just burns turns. Always name the check that produces the evidence.'},
    {s:'trap',t:'/loop with a user-only skill runs nothing',d:'<code>/loop 30m /verify</code> does not run verification. <code>/verify</code> is <code>disable-model-invocation: true</code>, so it arrives as plain text. Same for built-in commands, <code>skillOverrides</code>-withheld skills, and MCP prompts.'},
    {s:'trap',t:'Stop hooks are overridden after 8 consecutive blocks',d:'Parse <code>stop_hook_active</code> and exit 0 when it is true. Otherwise Claude keeps working, hits the cap, and the turn ends with a warning. Raise it with <code>CLAUDE_CODE_STOP_HOOK_BLOCK_CAP</code> only if convergence genuinely needs more.'},
    {s:'trap',t:'Scheduled tasks are session-scoped and expire in 7 days',d:'They fire only while Claude Code is running and idle. <code>/clear</code> wipes them; <code>--resume</code> restores unexpired ones. Recurring tasks self-delete after 7 days. For durable scheduling, use cloud routines, Desktop scheduled tasks, or GitHub Actions.'},
    {s:'cost',t:'Jitter means your 9am job is not a 9am job',d:'Up to 30 minutes late for recurring tasks. Pick a minute that is not <code>:00</code> or <code>:30</code> when timing matters.'},
    {s:'trap',t:'ANTHROPIC_DEFAULT_HAIKU_MODEL is not scoped to /goal',d:'Setting it changes the small fast model <b>everywhere</b> — the <code>haiku</code> alias resolves to it, and background work like conversation summarization runs on it too.'},
    {s:'trap',t:'A goal does not change your permission mode',d:'In Manual mode an unattended goal stalls on the first tool prompt. Pair it with auto mode. Not with <code>--dangerously-skip-permissions</code>, which offers no protection against prompt injection while running unattended.'},
    {s:'cost',t:'A headless goal looks stuck',d:'<code>claude -p "/goal ..."</code> prints nothing until the whole run ends. Add <code>--output-format stream-json --verbose</code> to see each message as the loop runs. <kbd>Ctrl+C</kbd> to interrupt.'},
    {s:'trap',t:'Symlinked .claude directories break scheduling',d:'The task list lives in the project’s <code>.claude</code> directory. Scheduling fails with an error when that directory, or the task file inside it, is a symlink.'},
    {s:'stale',t:'/goal and /loop are not files in .claude/commands/',d:'A widely circulated write-up describes them as custom slash commands you author as markdown. They are not. <code>/goal</code> is a built-in command wrapping a session-scoped prompt-based <code>Stop</code> hook; <code>/loop</code> is a bundled skill backed by the cron tools. What you <i>can</i> author is <code>.claude/loop.md</code>, which replaces the default prompt for bare <code>/loop</code> only.'}
  ],
  quiz:[
    {q:'Pick between <code>/goal</code>, <code>/loop</code>, and a Stop hook in one question.',a:'<b>What starts the next turn?</b> The previous turn finishing → <code>/goal</code> (session-scoped, model-evaluated) or a Stop hook (settings-scoped, your logic). A time interval elapsing → <code>/loop</code>. An external event arriving → a channel.'},
    {q:'What can the <code>/goal</code> evaluator actually inspect?',a:'Only the conversation. It does not call tools, run commands, or read files. Write conditions whose proof lands in the transcript — name the command and the expected result.'},
    {q:'What are the three verdicts, and what happens on each?',a:'<b>Not yet met</b> — Claude keeps working, reason becomes next-turn guidance. <b>Met</b> — goal cleared, achieved entry. <b>Impossible</b> — goal cleared, failed entry, no action needed from you.'},
    {q:'How many times can a Stop hook block before Claude Code overrides it?',a:'Eight consecutive times without progress. Guard with <code>stop_hook_active</code>; raise the cap with <code>CLAUDE_CODE_STOP_HOOK_BLOCK_CAP</code>.'},
    {q:'You scheduled a recurring task for <code>0 9 * * *</code>. When does it actually fire, and for how many days?',a:'Anywhere from 9:00 to 9:30 local — deterministic jitter derived from the task ID, up to 30 minutes for recurring tasks. It expires 7 days after creation: one final fire, then self-delete. Use <code>3 9 * * *</code> if timing matters.'},
    {q:'Does <code>/loop 30m /verify</code> run your tests every 30 minutes?',a:'No. <code>/verify</code> is <code>disable-model-invocation: true</code>, so a scheduled fire delivers it as plain text. Only skills Claude may self-invoke actually execute.'},
    {q:'What does <code>/goal</code> turn out to be, mechanically?',a:'A session-scoped <b>prompt-based <code>Stop</code> hook</b>. Writing the hook yourself in settings.json gets you the same evaluation loop, applied to every session in that scope.'}
  ],
  docs:[['Keep Claude working toward a goal','https://code.claude.com/docs/en/goal'],['Run prompts on a schedule','https://code.claude.com/docs/en/scheduled-tasks'],['Push events into a session with channels','https://code.claude.com/docs/en/channels'],['Configure auto mode','https://code.claude.com/docs/en/auto-mode-config'],['Automate work with routines','https://code.claude.com/docs/en/routines']]
},

{
  id:'p8', n:'09', title:'External capability (MCP)', layer:'soft', layerLabel:'Soft',
  time:'2 h', pre:'Phase 03',
  objective:'Add real external capability without paying a context tax on every turn — and pair every server with the knowledge of how to use it correctly.',
  concepts:[
    {h:'Adding and scoping servers',
     code:C('claude mcp add <name> -- <command> [args]     # stdio',
            'claude mcp add --transport http <name> <url>  # remote',
            '',
            '/mcp                       # status, per-server context cost, OAuth',
            '/mcp disable <name>        # drop its definitions from context',
            '/mcp reconnect <name>',
            '',
            '# scope precedence: local > project > user'),
     p:'<p>MCP tools appear alongside built-ins and are addressed as <code>mcp__&lt;server&gt;__&lt;tool&gt;</code> in permission rules — so <code>deny: ["mcp__github"]</code> removes a whole server and <code>mcp__*</code> removes them all.</p>'},
    {h:'Tool search changes the old cost calculus',
     p:'<p>MCP tool definitions are <b>deferred by default</b>. Only tool names consume context until Claude actually uses one, at which point the schema is fetched. The old advice — "too many servers bloat your baseline" — is now only partly true. Check the real number with <code>/mcp</code> rather than guessing.</p><p>The place it still bites: <b>subagents inherit every definition from the parent</b>, which can fill a worker\u2019s window before its first turn.</p>'},
    {h:'Pair every server with a skill',
     p:'<p>An MCP server gives Claude the ability to call your database. It does not give Claude your schema, your query conventions, which tables are safe to touch, or what a good result looks like. That is a skill.</p><ul><li><b>MCP</b> — the connection and the verbs</li><li><b>Skill</b> — the nouns, the conventions, the standards, the worked examples</li></ul><p>This pairing is the highest-leverage MCP practice and the one most often skipped.</p>'},
    {h:'Scoping a server to one worker',
     code:C('---',
            'name: pr-triager',
            'description: Triage open PRs and label them',
            'mcpServers:',
            '  - github                       # by name, from your existing config',
            '  - internal-tracker:            # or inline',
            '      type: stdio',
            '      command: npx',
            '      args: ["-y", "@acme/tracker-mcp"]',
            'disallowedTools: mcp__*          # then re-allow via tools: if you want a tight surface',
            '---'),
     p:'<p>Note: <code>mcpServers</code> and per-agent <code>hooks</code> are <b>ignored for plugin subagents</b>.</p>'}
  ],
  lab:{title:'Measure, then teach',
    steps:[
      'Run <code>/context</code> and <code>/mcp</code>. Record the baseline.',
      'Add one server you actually need. Re-run both. Record the delta.',
      'Use a tool from it once, then re-run <code>/context</code> — observe the schema loading on demand.',
      'Write a companion skill: what this server is for, which tools to prefer, the output format your team expects, and one worked example.',
      'Spawn a subagent that does not need the server. Note its startup context. Then <code>/mcp disable</code> and spawn again. Compare.'],
    verify:'You have a per-server context number, and every server you keep has a skill next to it.'},
  gotchas:[
    {s:'cost',t:'Subagents inherit every MCP definition',d:'Disable unused servers before spawning workers, or scope with per-agent <code>mcpServers:</code>.'},
    {s:'trap',t:'Auth and network boundaries are yours',d:'A remote MCP server is a network dependency with credentials. Prefer remote for shared team tools, local (stdio) for anything holding secrets or high privilege.'},
    {s:'trap',t:'Some MCP tools always prompt',d:'Tools marked <code>requiresUserInteraction</code>, and connector tools your organization set to <code>ask</code>, are never auto-approved — not by an allow rule, not by <code>bypassPermissions</code>, not by a hook <code>allow</code>.'}
  ],
  quiz:[
    {q:'What is the MCP scope precedence?',a:'local &gt; project &gt; user. Servers override by name.'},
    {q:'Why pair an MCP server with a skill?',a:'MCP supplies the capability; the skill supplies the knowledge of how to use it correctly — schema, conventions, output format, worked examples.'},
    {q:'Where does MCP context cost still hurt after tool search?',a:'Subagents, which inherit every tool definition from the parent and can fill their window before the first turn.'}
  ],
  docs:[['Connect Claude Code to tools via MCP','https://code.claude.com/docs/en/mcp'],['MCP quickstart','https://code.claude.com/docs/en/mcp-quickstart']]
},

{
  id:'p9', n:'10', title:'Package and distribute', layer:'scale', layerLabel:'Scale',
  time:'2 h', pre:'Phases 03, 05, 06',
  objective:'Make one repo\u2019s hard-won setup reproducible in the next twenty, without copy-pasting a <code>.claude/</code> directory ever again.',
  concepts:[
    {h:'What a plugin is',
     p:'<p>A plugin bundles <b>skills, hooks, subagents, and MCP servers</b> into one installable unit. Plugin skills are namespaced (<code>/my-plugin:review</code>) so multiple plugins coexist without collisions. Reach for one the moment a second repository needs the same setup.</p>',
     code:C('/plugin                  # manage plugins; the installed tab groups plugins and MCPs by scope',
            '/reload-plugins          # apply pending changes without restarting',
            '',
            '# distribution: a marketplace is a hosted collection of plugins')},
    {h:'How everything layers when you install one',
     table:{head:['Feature','How multiple sources combine'],rows:[
       ['CLAUDE.md','<b>Additive.</b> Every level contributes; Claude reconciles conflicts by judgment'],
       ['Skills','<b>Override by name.</b> managed &gt; user &gt; project. Plugin skills are namespaced instead'],
       ['Subagents','<b>Override by name.</b> managed &gt; CLI flag &gt; project &gt; user &gt; plugin'],
       ['MCP servers','<b>Override by name.</b> local &gt; project &gt; user'],
       ['Hooks','<b>Merge.</b> All registered hooks fire for matching events, from every source']]}},
    {h:'The build-it-over-time triggers',
     p:'<p>You do not configure everything up front. Each feature has a recognizable trigger:</p>',
     table:{head:['When this happens','Add'],rows:[
       ['Claude gets a convention wrong twice','A line in CLAUDE.md'],
       ['You keep typing the same prompt to start a task','A user-invocable skill'],
       ['You paste the same playbook a third time','A skill'],
       ['You keep copying data from a browser tab','An MCP server'],
       ['A side task floods your conversation with output','A subagent'],
       ['You want something to happen every time, without asking','A hook'],
       ['A second repository needs the same setup','A plugin']]},
     p:'<p>The same triggers tell you when to <i>update</i> what you have. A recurring review comment is a CLAUDE.md edit, not a one-off correction in chat.</p>'}
  ],
  lab:{title:'Ship your setup',
    steps:[
      'Take the <code>.claude/</code> directory you have built across Phases 02–08.',
      'Package it as a plugin: skills, hooks, the reviewer subagent, and any MCP server definitions.',
      'Install it in a different repository and run <code>/plugin</code> to confirm scope grouping.',
      'Confirm the namespacing: your skill should be <code>/&lt;plugin&gt;:&lt;skill&gt;</code>.',
      'Deliberately create a name collision with a project-level subagent and confirm the project version wins.'],
    verify:'A fresh clone of any repo gets your full setup with one install, and you know which layer wins in a collision.'},
  gotchas:[
    {s:'trap',t:'Plugin subagents ignore several frontmatter fields',d:'<code>permissionMode</code>, <code>mcpServers</code>, and <code>hooks</code> are ignored for plugin subagents. Configure those at the project or user level instead.'},
    {s:'cost',t:'Plugins are the lowest-priority source',d:'For both skills and subagents. A project definition with the same name silently wins — which is usually what you want, but check when a plugin "stops working".'}
  ],
  quiz:[
    {q:'Which four things can a plugin bundle?',a:'Skills, hooks, subagents, and MCP servers.'},
    {q:'Which features override by name, and which merge?',a:'Skills, subagents, and MCP servers override by name. Hooks merge — every registered hook fires. CLAUDE.md files are additive.'},
    {q:'What is the subagent precedence chain?',a:'managed &gt; CLI <code>--agents</code> flag &gt; project &gt; user &gt; plugin.'}
  ],
  docs:[['Create plugins','https://code.claude.com/docs/en/plugins'],['Plugin marketplaces','https://code.claude.com/docs/en/plugin-marketplaces'],['Extend Claude Code','https://code.claude.com/docs/en/features-overview']]
},

{
  id:'p10', n:'11', title:'The hardened repo', layer:'meta', layerLabel:'Capstone',
  time:'Half a day', pre:'All phases',
  objective:'Assemble everything into one repository where the soft layer is small, the hard layer is proven, and verification is something the agent runs rather than something it claims.',
  concepts:[
    {h:'Three invariants, restated with teeth',
     p:'<ol><li><b>Determinism over instruction.</b> Hooks, permission rules, and the sandbox supersede CLAUDE.md and skill text — and they are evaluated in that order, before the permission mode is even consulted. If a rule matters, it is not prose.</li><li><b>Context hygiene.</b> Progressive disclosure (skills), path scoping (rules), and isolation (subagents), plus aggressive <code>/clear</code>. Degradation starts well before the limit.</li><li><b>Non-bypassable verification.</b> Give the agent runnable checks. Prefer a <code>Stop</code> hook or a dedicated reviewer subagent over the model\u2019s own "looks good".</li></ol>'},
    {h:'The finished layout',
     code:C('your-repo/',
            '├── CLAUDE.md                   # < 200 lines. Always-true facts only',
            '├── .claude/',
            '│   ├── settings.json           # permissions, sandbox, hooks — committed',
            '│   ├── settings.local.json     # skillOverrides, claudeMdExcludes — gitignored',
            '│   ├── rules/',
            '│   │   ├── api.md              # paths: ["src/api/**/*.ts"]',
            '│   │   ├── frontend.md         # paths: ["src/ui/**/*.tsx"]',
            '│   │   └── testing.md          # paths: ["**/*.test.ts"]',
            '│   ├── skills/',
            '│   │   ├── ship/SKILL.md       # disable-model-invocation, allowed-tools',
            '│   │   ├── conventions/SKILL.md',
            '│   │   └── deep-research/SKILL.md   # context: fork, agent: Explore',
            '│   ├── agents/',
            '│   │   └── reviewer.md         # read-only tools, fixed output contract',
            '│   └── hooks/',
            '│       ├── guard.sh            # PreToolUse, exit 2',
            '│       └── gate.sh             # Stop, exit 2 unless checks pass',
            '└── CLAUDE.local.md             # gitignored, personal')},
    {h:'Ship checklist',
     p:'<ul><li>Root CLAUDE.md under 200 lines; everything file-specific moved to <code>paths:</code>-scoped rules</li><li><code>/context</code> memory files are a small fraction of the window</li><li>Deny rules cover secrets, destructive commands, and network egress you did not sanction</li><li>Sandbox on, with an explicit filesystem and domain boundary</li><li>At least one <code>PreToolUse</code> hook doing logic a glob cannot express, verified to <code>exit 2</code></li><li>A <code>Stop</code> hook or reviewer subagent gating "done"</li><li>Every side-effect skill has <code>disable-model-invocation: true</code></li><li>Every MCP server has a companion skill</li><li>The whole thing is a plugin</li><li>Every autonomous mechanism you use is bounded: a turn clause on goals, a <code>stop_hook_active</code> guard on Stop hooks, and an interval you would be happy to forget about</li><li>You have tested it under <code>--dangerously-skip-permissions</code> and the deny rules still held</li></ul>'},
    {h:'What is deliberately out of scope here',
     p:'<p>This path stops at the CLI power user. The next horizons, each with its own docs: the <b>Agent SDK</b> for building your own agents (agent loop, custom tools, structured outputs, session persistence, hosting); <b>headless <code>-p</code> mode</b> beyond the <code>/goal</code> use in Phase 08; <b>GitHub Actions and GitLab CI</b>; <b>Claude Code on the web</b> and cloud routines for durable scheduling; and <b>enterprise deployment</b> — managed settings, gateways, Bedrock/Vertex/Foundry, analytics, zero data retention.</p>'}
  ],
  lab:{title:'Build it for real',
    steps:[
      'Take one repository you work in weekly.',
      'Work the ship checklist above, top to bottom.',
      'Then hand the repo to a colleague and have them run Claude Code in it cold, without you explaining anything.',
      'Watch what they hit. Every stumble is a missing line in CLAUDE.md, a missing rule, or a missing hook.'],
    verify:'Someone else got productive in your repo, with Claude, without asking you a question.'},
  gotchas:[
    {s:'ok',t:'Configuration is a response to evidence, not a project',d:'Every entry should trace back to a specific thing that went wrong twice. A configuration you wrote speculatively is a configuration you will not maintain.'},
    {s:'cost',t:'Audit quarterly',d:'Stale and conflicting instructions are worse than no instructions — conflicts resolve arbitrarily. <code>/doctor</code> will propose trims.'}
  ],
  quiz:[
    {q:'State the determinism invariant precisely.',a:'Hooks, permission rules, and the sandbox supersede CLAUDE.md and skill text — and hooks are evaluated <i>first</i>, before deny rules and before the permission mode, so a hook deny survives <code>--dangerously-skip-permissions</code>.'},
    {q:'What is the one test that proves your hard layer works?',a:'Run the session with <code>--dangerously-skip-permissions</code> and confirm your deny rules and <code>PreToolUse</code> hooks still block.'}
  ],
  docs:[['Best practices','https://code.claude.com/docs/en/best-practices'],['Security','https://code.claude.com/docs/en/security'],['Choose a sandbox environment','https://code.claude.com/docs/en/sandbox-environments']]
},

{
  id:'pV', n:'12', title:'A vault as substrate', layer:'meta', layerLabel:'Case study',
  time:'3–4 h', pre:'Phases 03, 04, 05, 09, 11',
  objective:'Transfer the whole stack to a target that is <b>not a codebase</b> — a large Obsidian vault — and find out which controls carry over unchanged, which need rewriting, and where the blast radius is genuinely worse than in a git repo.',
  concepts:[
    {h:'Why a vault is the interesting test',
     p:'<p>Every phase before this one leaned, somewhere, on the fact that code tells you when you broke it. <code>npm test</code> exits non-zero. The compiler complains. CI goes red. Phase 01’s verification surface, Phase 08’s goal conditions, Phase 11’s "give the agent runnable checks" — all of it assumes a target with an opinion about its own correctness.</p><p>A vault has none. It is plain markdown files on disk: no build step, no test suite, no linter that knows what a good note is. An agent that silently rewrites two hundred notes produces zero failing anything.</p><p>That makes it the right place to find out which of your controls were real and which were borrowed from the toolchain.</p><p><b>Before anything else in this phase: <code>git init</code> the vault.</b> It is the single highest-value action here, and it is the substitute for the test suite you no longer have.</p>'},

    {h:'Three ways to connect, and what each costs',
     table:{head:['Approach','How','What you get','What it costs'],rows:[
       ['<b>Filesystem</b>','Point Claude Code at the vault folder','Full built-in tools. Grep and Glob work. Obsidian need not be running','The coarsest permission surface — every file is a file'],
       ['<b>File-based MCP</b>','<code>npx -y obsidian-mcp /path/to/vault</code> (StevenStavrakis). No plugin','Vault-shaped tools: notes, tags, not raw paths','Another tool surface to scope, and its README says testing is not thorough'],
       ['<b>REST-backed MCP</b>','Local REST API plugin + <code>OBSIDIAN_API_KEY</code>','Live app state: run commands, open files in the UI, use the app’s own search','Obsidian must be running, and the key is full read/write on your notes']]},
     p:'<p>There is a fourth option most write-ups miss: the <b>Local REST API plugin serves MCP itself</b>, at <code>https://127.0.0.1:27124/mcp/</code> over Streamable HTTP with the same bearer token. A separate bridge server is optional. HTTP on <code>27123</code> is available if you enable it; the HTTPS certificate is self-signed, so you either trust it from <code>/obsidian-local-rest-api.crt</code> or skip verification for <code>127.0.0.1</code>.</p>'},

    {h:'The npm collision — Phase 09 with teeth',
     table:{head:['Package','Author','Architecture','Needs the plugin?'],rows:[
       ['<code>obsidian-mcp</code>','StevenStavrakis','<b>File-based</b> — reads the vault directory','No'],
       ['<code>obsidian-mcp-server</code>','cyanheads','<b>REST-backed</b> — talks to the plugin','<b>Yes</b>, plus an API key'],
       ['<code>mcp-obsidian</code>','MarkusPfundstein','REST-backed, Python via <code>uvx</code>','Yes, plus an API key']]},
     p:'<p>Three names within one word of each other, three different architectures, three different prerequisite sets. Install the wrong one and you get a server that cannot connect and an error that does not explain why.</p><p>The generalizable rule, which is really a Phase 09 rule: <b>the name of an MCP server tells you nothing about its transport, its prerequisites, or its blast radius.</b> Read the README before you install, every time. This is the same discipline as reading a repo’s skills before running Claude Code in it (Phase 03) — you are granting capability to code you did not write.</p>'},

    {h:'Defense in depth, three independent layers',
     p:'<p>Phase 04 said use permission rules and the sandbox together because they fail differently. A vault adds a third layer above both, and the point is that none of them depends on the others.</p><ul><li><b>At the server.</b> <code>obsidian-mcp-server</code> exposes <code>OBSIDIAN_READ_PATHS</code> and <code>OBSIDIAN_WRITE_PATHS</code>. Scope there first: what the server cannot reach, Claude cannot ask for, and no prompt injection can talk it into.</li><li><b>At Claude Code.</b> Deny rules on the same paths anyway, plus the ones the server does not know about.</li><li><b>At the OS.</b> The sandbox filesystem boundary, which holds even if a Bash command goes somewhere unexpected.</li></ul>',
     code:C('// .claude/settings.json',
            '{ "permissions": {',
            '    "deny": [',
            '      "Read(./.obsidian/**)",      // plugin config — holds API keys and tokens',
            '      "Read(./Personal/**)",',
            '      "Edit(./Archive/**)",',
            '      "Read(./**/*.env)"',
            '    ],',
            '    "ask": ["Bash(git push *)"]',
            '} }'),
     p2:'<p>Two things people miss. <b><code>.obsidian/</code> is a secrets directory</b> — plugin configuration lives there, including the Local REST API key itself, so an agent reading the vault can read the credential that grants it write access. And <b>the API key belongs in the environment</b>, not in a committed <code>.mcp.json</code>.</p><p>Then start read-only. A retrieval agent needs zero write tools:</p>',
     code2:C('---',
             'name: vault-researcher',
             'description: Answer questions from the vault. Read-only.',
             'tools: Read, Grep, Glob',
             'disallowedTools: Write, Edit',
             'model: sonnet',
             '---',
             '',
             'Answer from the vault only. Cite every claim as [[note name]].',
             'If the vault does not contain the answer, say so. Do not infer.')},

    {h:'The knowledge gap MCP does not close',
     p:'<p>Connecting the vault gives Claude the ability to write a file. It does not give Claude <b>Obsidian Flavored Markdown</b>, <code>.base</code> YAML, or JSON Canvas. That gap is exactly what Phase 09 said to fill with a skill — and there is a reference implementation worth reading whether or not you use Obsidian.</p><p><code>kepano/obsidian-skills</code>, from Obsidian’s own CEO, ships five skills following the Agent Skills spec and targeting Claude Code, Codex, and OpenCode:</p><ul><li><code>obsidian-markdown</code> — wikilinks, embeds, callouts, properties</li><li><code>obsidian-bases</code> — <code>.base</code> files with views, filters, formulas, summaries</li><li><code>json-canvas</code> — <code>.canvas</code> nodes, edges, groups</li><li><code>obsidian-cli</code> — driving vaults from the command line</li><li><code>defuddle</code> — clean markdown out of web pages, to cut token cost</li></ul><p>Note the Phase 03 constraint at work: because these follow the portable Agent Skills spec, they use only the six fields that validate outside Claude Code — <code>name</code>, <code>description</code>, <code>license</code>, <code>compatibility</code>, <code>metadata</code>, <code>allowed-tools</code>. No <code>argument-hint</code>, no <code>context: fork</code>. That is the tax on portability, and it is a good worked example of when to pay it.</p><p>It is also distributed as a marketplace plugin, which is Phase 10 arriving exactly where the docs said it would: a second target needed the same setup.</p>'},

    {h:'Provenance is a hook, not a convention',
     p:'<p>Here is the failure mode that makes this case study worth doing. Agent-written notes sit in the vault next to human-written ones. Your retrieval layer indexes and embeds all of them equally. A month later a search returns an unreviewed AI paraphrase, and it looks exactly as authoritative as the note you wrote by hand. It then becomes the source for the next generated note. <b>Nothing fails. The corpus just quietly degrades.</b></p><p>Writing "always mark AI-generated notes" in CLAUDE.md will not hold, for the reason Phase 02 gave: CLAUDE.md is context, not enforcement. This is a hook.</p>',
     code:C('#!/bin/bash',
            '# .claude/hooks/stamp.sh  —  PostToolUse, matcher: Edit|Write',
            'input=$(cat)',
            'path=$(jq -r \'.tool_input.file_path // empty\' <<<"$input")',
            '',
            '[[ "$path" == *.md ]] || exit 0',
            '[[ "$path" == *"/vault/"* ]] || exit 0',
            '',
            '# stamp, or re-invalidate a note that was previously reviewed',
            'if head -1 "$path" | grep -q \'^---$\'; then',
            '  python3 - "$path" <<\'PY\'',
            'import sys, re, datetime',
            'p = sys.argv[1]; s = open(p).read()',
            'end = s.index("\\n---", 3) + 1',
            'fm, body = s[4:end], s[end:]',
            'fm = re.sub(r"^reviewed:.*$", "reviewed: false", fm, flags=re.M)',
            'if "reviewed:" not in fm:',
            '    fm += "generated_by: claude-code\\nreviewed: false\\n"',
            'fm = re.sub(r"^modified:.*$", "", fm, flags=re.M).strip()',
            'fm += "\\nmodified: " + datetime.date.today().isoformat()',
            'open(p, "w").write("---\\n" + fm + "\\n" + body)',
            'PY',
            'fi',
            'exit 0'),
     p2:'<p>Then close the loop with a <code>Stop</code> hook that refuses to finish while anything in your permanent folder carries <code>reviewed: false</code> — with the Phase 08 <code>stop_hook_active</code> guard, so it cannot loop past the eight-block cap. Promotion out of <code>inbox/</code> stays a human decision. The agent generates candidates; you accept them.</p>'},

    {h:'Verification with no test suite',
     p:'<p><code>git diff</code> <b>is</b> your test suite. That is not a metaphor — it is the only mechanical signal you have about whether the agent did what it said.</p><ul><li><b>One sync engine, always.</b> obsidian-git alongside iCloud, Dropbox, or Syncthing produces <code>.md.conflict</code> files and non-deterministic state. Pick one, and pause it during bulk agent writes.</li><li><b>Rewrite your goal conditions.</b> Phase 08 taught you to name the check that produces the evidence. Here there are no exit codes to point at, so point at the diff instead.</li><li><b>The reviewer subagent replaces the linter.</b> Read-only tools, a fixed output contract, run against the diff.</li></ul>',
     code:C('# does not port to a vault — nothing produces this evidence',
            '/goal all tests pass and lint is clean',
            '',
            '# ports — every clause is visible in the transcript',
            '/goal every note created this session lives under inbox/ and carries a',
            '  reviewed: false property. Prove it with "git status --porcelain"',
            '  showing only inbox/ paths, and "grep -L \'reviewed:\' inbox/*.md"',
            '  returning nothing. Do not modify any file outside inbox/.',
            '  Report progress each turn and stop after 15 turns.')},

    {h:'Funnel every write through one door',
     p:'<p>Vault corruption almost never comes from one agent. It comes from three write paths — a capture bot, a research agent, a browser extension — landing in the same folder with different conventions and no shared gate.</p><p>The fix is the Phase 09 principle applied to writes instead of tools: <b>narrow the surface, then enforce at the narrow point.</b></p><ul><li>One <code>inbox/</code> folder. Every automated write lands there and nowhere else.</li><li>One sync engine on that folder.</li><li>One provenance stamp, applied by the hook, regardless of which pipeline wrote the file.</li><li>Promotion out of <code>inbox/</code> is the only path into the indexed permanent set, and it is manual.</li></ul><p>Deny rules make this real rather than aspirational: <code>"Edit(./Permanent/**)"</code> in deny means no pipeline can skip the gate, including the one you write next month and forget about.</p>'},

    {h:'What transferred and what did not',
     table:{head:['Control','Transfers?','Notes'],rows:[
       ['Deny rules and sandbox','<b>Unchanged</b>','And they matter more — no compiler catches a bad write'],
       ['<code>PreToolUse</code> hooks','<b>Unchanged</b>','Same evaluation order, same exit-2 semantics'],
       ['Subagent isolation','<b>Unchanged</b>','A large vault is the archetypal case. Never read it in the main window'],
       ['Skills','<b>Unchanged</b>, and more necessary','File formats are not general knowledge the way a popular framework is'],
       ['<code>/context</code> discipline','<b>Unchanged</b>','Measure before and after connecting each server'],
       ['Tests, build, lint','<b>Does not transfer</b>','Substitute: git diff + a read-only reviewer + provenance gates'],
       ['<code>/goal</code> conditions','<b>Need rewriting</b>','No exit codes to point at. Point at the diff'],
       ['Checkpoints','<b>Partial</b>','<code>/rewind</code> covers session edits; a backgrounded forked skill’s writes are outside it. Git is the real net']]},
     p:'<p>The two rows that say "does not transfer" are the lesson. Everything you built in the hard layer — Phases 04 and 05 — moved across untouched, because it never depended on the target being code. Everything in the verification layer had to be rebuilt, because it did.</p><p>That is a useful thing to know before you point an agent at any target that cannot tell you when you broke it: a database, a CMS, a design system, a wiki, an ops runbook.</p>'}
  ],
  lab:{title:'Point an agent at a vault without regretting it',
    steps:[
      '<code>git init</code> a <b>copy</b> of a vault. Never the live one on a first run. Commit it clean.',
      'Connect it three ways in turn — filesystem, <code>npx -y obsidian-mcp &lt;path&gt;</code>, and the Local REST API plugin’s built-in MCP endpoint. Record <code>/context</code> cost and the tool surface each gives you.',
      'Write the deny rules above, including <code>Read(./.obsidian/**)</code>. Verify they hold under <code>--dangerously-skip-permissions</code>.',
      'If you are using <code>obsidian-mcp-server</code>, set <code>OBSIDIAN_READ_PATHS</code> and <code>OBSIDIAN_WRITE_PATHS</code> too, and confirm the server refuses a path the deny rules would also have caught. Two independent layers, verified independently.',
      'Read the five SKILL.md files in <code>kepano/obsidian-skills</code>. Note which frontmatter fields they use and which they avoid, and why (Phase 03).',
      'Install the provenance <code>PostToolUse</code> hook. Have an agent write five notes. Confirm all five carry <code>reviewed: false</code>.',
      '<b>Break it deliberately:</b> remove the hook, have it write five more, then try to tell the two batches apart from the vault alone. That is what an unguarded month looks like.',

      'Build the read-only <code>vault-researcher</code> subagent and have it report which notes changed and whether each carries provenance. Compare its answer to <code>git diff --stat</code>.'],
    verify:'You can hand an agent a vault and state, before it runs, exactly what it can reach, what it will stamp, and how you will undo it.'},
  gotchas:[
    {s:'trap',t:'<code>.obsidian/</code> is a secrets directory',d:'Plugin configuration lives there, including the Local REST API key. An agent with read access to the vault can read the credential that grants it write access to the vault. Deny it explicitly — it is not obvious from the folder name.'},
    {s:'trap',t:'obsidian-mcp and obsidian-mcp-server are different products',d:'One is file-based and needs no plugin; the other is REST-backed and needs the plugin plus an API key. Also <code>mcp-obsidian</code>, which is a third thing. Read the README before installing any MCP server — the name carries no information about prerequisites or blast radius.'},
    {s:'trap',t:'Two sync engines produce .md.conflict files',d:'obsidian-git alongside iCloud, Dropbox, or Syncthing on the same folder is non-deterministic state. Pick one and pause it during bulk agent writes.'},
    {s:'trap',t:'Unreviewed AI notes get indexed as authoritative',d:'They are chunked, embedded, and returned by retrieval exactly like human-written notes, then become the source for the next generated note. Nothing fails; the corpus degrades. Provenance frontmatter plus a review gate is the only thing that stops it, and it has to be a hook.'},
    {s:'trap',t:'REST-backed servers need Obsidian actually running',d:'Filesystem access and file-based MCP do not care. If your automation fires on a schedule (Phase 08) and the app is closed, a REST-backed server fails and a file-based one does not.'},
    {s:'cost',t:'A large vault is the archetypal subagent case',d:'Reading thousands of notes in the main window is exactly the failure Phase 06 exists to prevent. Delegate retrieval; keep the summary.'},
    {s:'trap',t:'Backgrounded forked-skill writes are outside /rewind',d:'Phase 03 flagged this. On a vault it matters more, because there is no failing test to tell you it happened. Git is the real undo.'},
    {s:'stale',t:'Third-party version numbers age in weeks',d:'This phase deliberately asserts only what was verified against the source repositories: transports, prerequisites, environment variables, and the skill names. Pinned versions and plugin-ecosystem rankings from any guide, including a good one, should be treated as of its publication date and re-checked.'},
    {s:'ok',t:'This phase is not an Obsidian tutorial',d:'It teaches Claude Code against a target that is not code. Nothing here requires you to adopt Obsidian, and everything here transfers to a CMS, a wiki, a runbook repo, or a database — any target with no opinion about its own correctness.'}
  ],
  quiz:[
    {q:'Which of your controls stop working when the target is not code?',a:'Only the verification layer. Tests, build, and lint have no analogue, so <code>/goal</code> conditions and Stop-hook checks must be rebuilt around <code>git diff</code>, provenance properties, and a read-only reviewer subagent. Deny rules, sandbox, <code>PreToolUse</code> hooks, subagent isolation, and skills all transfer untouched.'},
    {q:'What is the first thing you do before pointing an agent at a vault?',a:'<code>git init</code> and commit. It is the substitute for the test suite you do not have — mtime, diff, and rollback. On a first run, do it to a copy.'},
    {q:'Why is <code>Read(./.obsidian/**)</code> a deny rule and not a nice-to-have?',a:'That directory holds plugin configuration, including the Local REST API key. An agent that can read the vault can otherwise read the credential granting it write access to the vault.'},
    {q:'You installed <code>obsidian-mcp</code> and it will not connect to your Local REST API plugin. Why?',a:'It is the file-based server (StevenStavrakis) and does not talk to the plugin at all — it reads the vault directory. You wanted <code>obsidian-mcp-server</code> (cyanheads) or <code>mcp-obsidian</code> (MarkusPfundstein), both REST-backed and both requiring <code>OBSIDIAN_API_KEY</code>.'},
    {q:'Why does "always mark AI-generated notes" belong in a hook rather than CLAUDE.md?',a:'CLAUDE.md is context, not enforcement — Phase 02. A missed stamp has no symptom: the note is indexed and returned as authoritative like any other. A <code>PostToolUse</code> hook on <code>Edit|Write</code> makes the stamp unconditional, and it can re-invalidate <code>reviewed</code> on every agent edit.'},
    {q:'Give a <code>/goal</code> condition that works on a vault.',a:'One whose proof is a command whose output lands in the transcript: "<code>git status --porcelain</code> shows only <code>inbox/</code> paths and <code>grep -L \'reviewed:\' inbox/*.md</code> returns nothing." Not "the notes are good" — the evaluator reads the conversation and cannot run anything.'},
    {q:'Where do three write pipelines into one vault go wrong, and what is the fix?',a:'Different conventions, no shared gate, and conflicts when more than one sync engine touches the folder. Funnel all of them into one <code>inbox/</code> with one sync engine and one hook-applied provenance stamp, and make promotion out of <code>inbox/</code> manual — enforced by <code>Edit(./Permanent/**)</code> in deny.'}
