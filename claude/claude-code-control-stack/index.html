   {c:'Compound bash commands evade naive string matchers.',f:'Correct. Docs call out prefix-matching limits explicitly and point to <code>PreToolUse</code> hooks for logic patterns cannot express.'},
   {c:'Subagent context isolation is the point; design the return contract.',f:'Correct. The parent receives the summary and metadata only.'},
   {c:'Pair every MCP connection with a skill that teaches how to use it.',f:'Correct, and it is the documented "Skill + MCP" pattern.'},
   {c:'Determinism over instruct; context hygiene; non-bypassable verification.',f:'All three invariants map cleanly onto how the docs describe the system.'}
 ]},
 {label:'Stale or incomplete', tag:'stale', items:[
   {c:'Permission modes: <code>default</code>, <code>acceptEdits</code>, <code>bypassPermissions</code>, <code>plan</code>.',f:'<b>Two missing, and they are the important ones.</b> The full set is <code>default</code> (alias <code>manual</code>), <code>acceptEdits</code>, <code>plan</code>, <code>auto</code>, <code>dontAsk</code>, <code>bypassPermissions</code>. <code>auto</code> uses a safety classifier and is the documented answer to prompt fatigue — the thing his "start restrictive, expand via allowlists" advice is actually reaching for. <code>dontAsk</code> converts prompts to denials for headless runs.'},
   {c:'Nesting "up to several levels"; concurrency has "practical limits".',f:'Both are exact numbers: depth <b>3</b> (<code>CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH</code>), <b>20</b> concurrent (<code>CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS</code>). At the depth limit the Agent tool is removed.'},
   {c:'Critical hook events: <code>PreToolUse</code>, <code>PostToolUse</code>, <code>UserPromptSubmit</code>, <code>Stop</code>, <code>SubagentStop</code>, <code>PreCompact</code>.',f:'That is roughly a fifth of the current set. Notably missing: <code>PermissionRequest</code> (which ignores exit 2 entirely), <code>PostToolUseFailure</code>, <code>PostToolBatch</code>, <code>SubagentStart</code>, <code>TaskCreated</code> / <code>TaskCompleted</code> / <code>TeammateIdle</code> (the team quality gates), <code>Elicitation</code>, <code>MessageDisplay</code>, <code>InstructionsLoaded</code>, <code>WorktreeCreate</code> / <code>WorktreeRemove</code>, <code>PostCompact</code>, <code>CwdChanged</code>, <code>FileChanged</code>, <code>DirectoryAdded</code>, <code>ConfigChange</code>, <code>Setup</code>, <code>SessionEnd</code>, <code>StopFailure</code>.'},
   {c:'"Prefer exit-2 + stderr so the model receives the reason."',f:'Right advice, missing the trap that costs people real incidents: <b><code>exit 1</code> does not block.</b> Any non-zero code other than 2 is a non-blocking error and the action proceeds. <code>WorktreeCreate</code> is the sole exception.'},
   {c:'"Custom commands have largely merged into Skills."',f:'Understated — <code>.claude/commands/</code> no longer appears in the current documentation at all. Skills are the mechanism: a skill in <code>.claude/skills/&lt;name&gt;/SKILL.md</code> is invoked as <code>/&lt;name&gt;</code>, and the name comes from the directory, not the <code>name:</code> field. <span class="unv">Whether legacy <code>.claude/commands/</code> files still load is not stated in current docs — unverified.</span>'},
   {c:'MCP: "tool definitions consume context; too many servers bloat the baseline."',f:'Partly superseded. MCP tool definitions are now <b>deferred by default</b> via tool search — only names cost context until first use. Where it still bites: subagents inherit every definition from the parent and can fill their window before turn one.'},
   {c:'Effort framed as a general lever analogous to model variants.',f:'Right instinct, no specifics. The actual scale is <code>low</code> / <code>medium</code> / <code>high</code> / <code>xhigh</code> / <code>max</code>, plus <code>ultracode</code> (a Claude Code setting, not a model level). Default is <code>high</code>. <code>max</code> and <code>ultracode</code> are session-only. <code>CLAUDE_CODE_EFFORT_LEVEL</code> beats everything.'}
 ]},
 {label:'Wrong', tag:'wrong', items:[
   {c:'Skill frontmatter includes <code>when_to_use</code>.',f:'No such field. It is <code>description</code>. Worth fixing because it is the field that drives auto-invocation — writing it under the wrong key means it silently does nothing. (Outside Claude Code, only six fields validate at all: <code>name</code>, <code>description</code>, <code>license</code>, <code>compatibility</code>, <code>metadata</code>, <code>allowed-tools</code>.)'},
   {c:'"Subagents inherit or restrict tools; zero-tool configs fail to launch."',f:'The inheritance half is right — subagents inherit from the parent pool, filtered twice (always: <code>Agent</code> at depth limit, <code>AskUserQuestion</code>, <code>EndConversation</code>, <code>EnterPlanMode</code>, <code>ExitPlanMode</code>, <code>ScheduleWakeup</code>, <code>TaskOutput</code>, <code>WaitForMcpServers</code>, <code>Workflow</code>; and for background agents, a further reduction to a fixed built-in list). <span class="unv">The zero-tool launch failure is not documented — unverified.</span>'},
   {c:'"Reliability drops inside some subagent/MCP/pipe paths."',f:'<span class="unv">Not supported by current docs — unverified as stated.</span> Docs describe hooks working <i>for</i> subagents, including per-subagent <code>hooks:</code> frontmatter. The documented reliability caveats are different and more specific: a timed-out hook renders no decision and the call proceeds; a hook whose path does not exist fails non-blocking. His conclusion still stands — put truly non-bypassable rules below the agent — but for these reasons, not that one.'},
   {c:'"Stack them (<code>/skill1 /skill2 args</code>)."',f:'<span class="unv">Not documented — unverified.</span> Skills do compose in the sense that invoked content accumulates in the session, but the chained-invocation syntax is not in the reference.'}
 ]},
 {label:'Missing entirely', tag:'gap', items:[
   {c:'<code>.claude/rules/</code> with <code>paths:</code> frontmatter',f:'The single biggest omission. His CLAUDE.md advice is "keep it under 200 lines and move procedures to skills" — but the mechanism that actually solves per-directory and per-language rules is path-scoped rules, which load only when Claude touches matching files. He mentions "path-scoped rules" in one clause without naming the directory or the frontmatter.'},
   {c:'Auto memory',f:'Claude writes its own notes to <code>~/.claude/projects/&lt;project&gt;/memory/</code>, on by default, and the first 200 lines of <code>MEMORY.md</code> load every session. It is a second always-on context source his map does not account for at all.'},
   {c:'Agent teams',f:'A whole coordination layer above subagents: shared task list, file-locked claiming, direct teammate messaging, plan-approval gating, and three dedicated hook events. Experimental and off by default (<code>CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1</code>), but it changes the "isolated workers" picture — and while enabled, a <i>named</i> subagent silently launches as a teammate.'},
   {c:'Forks (<code>/subtask</code>)',f:'A third worker type between "same context" and "fresh context": full parent conversation, same system prompt, tools, and model, shared prompt cache, cannot nest. Often the right answer when a plain subagent lacks context and inline work would bloat the window.'},
   {c:'Plugins and marketplaces',f:'The distribution layer. Bundles skills, hooks, subagents, and MCP servers into one installable, namespaced unit — the answer to "a second repo needs this setup".'},
   {c:'Checkpointing and <code>/rewind</code>',f:'Every prompt is a checkpoint; files are snapshotted before each change. Restore code, conversation, or both — plus partial compaction via Summarize-from-here / Summarize-up-to-here.'},
   {c:'The sandbox as a distinct layer',f:'He folds it into "Permissions + Sandbox". It is a separate OS-level enforcement mechanism with its own filesystem and network configuration, its own modes, and specific interactions with ask rules and plan mode.'},
   {c:'The layering rules',f:'How multiple sources combine differs per feature: CLAUDE.md is additive, hooks merge, and skills / subagents / MCP servers override by name with different precedence chains. This is the cause of most "it stopped working after I installed X".'},
   {c:'Compaction survival',f:'Project-root CLAUDE.md is re-read and re-injected after <code>/compact</code>. Nested CLAUDE.md files and path-scoped rules are not. Skills get a 5k-per / 25k-total re-attachment budget. This explains most mid-session behavior drift.'},
   {c:'<code>/context</code>',f:'The measuring instrument. Every claim about context hygiene is unfalsifiable without it.'}
 ]}
 ]
};

/* ============================================================
   Control Stack — app
   ============================================================ */
const $  = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; };
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

/* ---- storage: never load-bearing ---- */
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem('ccstack')||'{}'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem('ccstack',JSON.stringify(v)); }catch(e){} }
};
let mem = {};
try { mem = JSON.parse(localStorage.getItem('ccstack')||'{}'); } catch(e){ mem = {}; }
let state = mem;

const doneLab  = id => !!state['lab:'+id];
const doneQ    = (id,i) => !!state['q:'+id+':'+i];
const phaseDone = p => doneLab(p.id) && p.quiz.every((_,i)=>doneQ(p.id,i));
const phasePart = p => doneLab(p.id) || p.quiz.some((_,i)=>doneQ(p.id,i));

/* ---- theme ---- */
(function(){
  let t=null; try{ t=localStorage.getItem('ccstack-theme'); }catch(e){}
  if(t) document.documentElement.setAttribute('data-theme',t);
  $('#theme').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const next = isDark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('ccstack-theme',next); }catch(e){}
  });
})();

/* ---- routing ---- */
let mode='learn', current=PHASES[0].id;

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  render();
}
document.querySelectorAll('.modes button').forEach(b=>b.addEventListener('click',()=>{ $('#q').value=''; setMode(b.dataset.mode); }));
$('#reset').addEventListener('click',()=>{
  if(!confirm('Clear all phase progress?')) return;
  state={}; store.set(state); render(); buildRail();
});

/* ---- rail ---- */
function buildRail(){
  const nav=$('#pnav'); nav.innerHTML='';
  PHASES.forEach(p=>{
    const a=el('a',p.id===current&&mode==='learn'?'on':'');
    a.href='#'+p.id;
    const cls = phaseDone(p)?'tick done':(phasePart(p)?'tick part':'tick');
    a.innerHTML='<span class="n">'+p.n+'</span><span>'+p.title+'</span><span class="'+cls+'">✓</span>';
    a.addEventListener('click',e=>{ e.preventDefault(); current=p.id; if(mode!=='learn') setMode('learn'); else render(); buildRail(); window.scrollTo({top:0,behavior:'smooth'}); });
    nav.appendChild(a);
  });
}

/* ---- render pieces ---- */
function codeBlock(src){
  const w=el('div','codewrap');
  const pre=el('pre','',  '<code>'+esc(src)+'</code>');
  const btn=el('button','copy','copy');
  btn.addEventListener('click',()=>{
    navigator.clipboard.writeText(src).then(()=>{
      btn.textContent='copied'; btn.classList.add('done');
      setTimeout(()=>{ btn.textContent='copy'; btn.classList.remove('done'); },1400);
    }).catch(()=>{ btn.textContent='select it'; });
  });
  w.appendChild(pre); w.appendChild(btn);
  return w;
}
function tableBlock(t){
  const w=el('div','tablewrap');
  let h='<table><thead><tr>'+t.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  h+=t.rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  h+='</tbody></table>';
  w.innerHTML=h;
  return w;
}
function sec(label,count){
  const h=el('h2','sec',label+(count!=null?' <span class="cnt">'+count+'</span>':''));
  return h;
}

/* ---- learn view ---- */
function renderPhase(p){
  const v=$('#view'); v.innerHTML='';

  // progress strip
  const totalUnits = PHASES.reduce((a,x)=>a+1+x.quiz.length,0);
  const doneUnits  = PHASES.reduce((a,x)=>a+(doneLab(x.id)?1:0)+x.quiz.filter((_,i)=>doneQ(x.id,i)).length,0);
  const pct = Math.round(doneUnits/totalUnits*100);
  const pr=el('div','prog');
  pr.innerHTML='<div class="top"><span class="lbl">Path progress</span><span class="pct">'+pct+'%</span></div>'+
    '<div class="bar">'+PHASES.map(x=>'<i class="'+(phaseDone(x)?'done':(phasePart(x)?'part':''))+'"></i>').join('')+'</div>';
  v.appendChild(pr);

  const head=el('div');
  head.innerHTML='<div class="eyebrow">Phase '+p.n+' · '+p.layerLabel+' layer</div><h1 class="ptitle">'+p.title+'</h1>'+
    '<div class="meta"><span class="chip '+(p.layer==='meta'?'meta2':p.layer)+'">'+p.layerLabel+'</span>'+
    '<span class="chip">'+p.time+'</span><span class="chip">prereq: '+p.pre+'</span></div>';
  v.appendChild(head);
  v.appendChild(el('div','objective',p.objective));

  v.appendChild(sec('Concepts',p.concepts.length));
  p.concepts.forEach(c=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',c.h));
    if(c.p) d.insertAdjacentHTML('beforeend',c.p);
    if(c.table) d.appendChild(tableBlock(c.table));
    if(c.code) d.appendChild(codeBlock(c.code));
    if(c.p2) d.insertAdjacentHTML('beforeend',c.p2);
    if(c.code2) d.appendChild(codeBlock(c.code2));
    v.appendChild(d);
  });

  v.appendChild(sec('Lab'));
  const lab=el('div','lab');
  lab.innerHTML='<h3>'+p.lab.title+'</h3><ol>'+p.lab.steps.map(s=>'<li>'+s+'</li>').join('')+'</ol>'+
    '<p style="margin:14px 0 0"><b>Done when:</b> '+p.lab.verify+'</p>';
  const dl=el('div','done-line');
  const cb=el('input'); cb.type='checkbox'; cb.id='lab-'+p.id; cb.checked=doneLab(p.id);
  cb.addEventListener('change',()=>{ state['lab:'+p.id]=cb.checked; store.set(state); buildRail(); renderPhase(p); });
  const lb=el('label'); lb.htmlFor=cb.id; lb.appendChild(cb); lb.appendChild(document.createTextNode('Lab complete'));
  dl.appendChild(lb); lab.appendChild(dl);
  v.appendChild(lab);

  v.appendChild(sec('Gotchas',p.gotchas.length));
  p.gotchas.forEach(g=>{
    const d=el('div','gotcha');
    d.innerHTML='<span class="sev '+g.s+'">'+g.s+'</span><span><b>'+g.t+'</b>'+g.d+'</span>';
    v.appendChild(d);
  });

  v.appendChild(sec('Checkpoint',p.quiz.length));
  p.quiz.forEach((q,i)=>{
    const d=el('details','qa');
    d.innerHTML='<summary>'+q.q+'</summary><div class="ans">'+q.a+
      '<div class="done-line" style="border-top-color:var(--line)"><label style="color:var(--muted)">'+
      '<input type="checkbox" '+(doneQ(p.id,i)?'checked':'')+'> I could answer this without looking</label></div></div>';
    d.querySelector('input').addEventListener('change',e=>{
      state['q:'+p.id+':'+i]=e.target.checked; store.set(state); buildRail();
      const strip=$('.prog'); if(strip) renderPhase(p);
    });
    v.appendChild(d);
  });

  if(p.docs&&p.docs.length){
    v.appendChild(sec('Source docs'));
    const dd=el('div','docs');
    dd.innerHTML=p.docs.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' ↗</a>').join('');
    v.appendChild(dd);
  }

  const idx=PHASES.indexOf(p);
  const navd=el('div','done-line'); navd.style.borderTop='1px solid var(--line)'; navd.style.marginTop='40px';
  if(idx>0){ const b=el('button','btn','← '+PHASES[idx-1].title); b.onclick=()=>{current=PHASES[idx-1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  if(idx<PHASES.length-1){ const b=el('button','btn prime',PHASES[idx+1].title+' →'); b.onclick=()=>{current=PHASES[idx+1].id;render();buildRail();scrollTo({top:0})}; navd.appendChild(b); }
  v.appendChild(navd);
}

/* ---- reference view ---- */
function renderRef(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Reference</div><h1 class="ptitle">Lookup and decisions</h1>'+
    '<p class="lede">Tables you will come back to, and the branching questions that pick a primitive for you. Everything here is verified against the Claude Code documentation as of August 2026.</p>';

  v.appendChild(sec('Decision trees',TREES.length));
  TREES.forEach(t=>{
    v.appendChild(el('h3','',t.title));
    const wrap=el('div','tree');
    t.rows.forEach(r=>{
      const b=el('div','branch');
      b.innerHTML='<span class="cond">'+r[0]+'</span><span class="arr">→</span><span class="res">'+r[1]+'<em>'+r[2]+'</em></span>';
      wrap.appendChild(b);
    });
    v.appendChild(wrap);
  });

  v.appendChild(sec('Tables',REF.length));
  REF.forEach(r=>{
    const d=el('div','concept');
    d.appendChild(el('h3','',r.title));
    if(r.note) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin:2px 0 0">'+r.note+'</p>');
    d.appendChild(tableBlock(r));
    if(r.foot) d.insertAdjacentHTML('beforeend','<p class="cap" style="margin-top:8px">'+r.foot+'</p>');
    v.appendChild(d);
  });
}

/* ---- drill view ---- */
let deck=[], di=0, revealed=false;
function buildDeck(){
  deck=[];
  PHASES.forEach(p=>p.quiz.forEach(q=>deck.push({q:q.q,a:q.a,src:'Phase '+p.n+' · '+p.title,pid:p.id})));
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  di=0; revealed=false;
}
function renderDrill(){
  const v=$('#view'); v.innerHTML='';
  if(!deck.length) buildDeck();
  v.innerHTML='<div class="eyebrow">Drill</div><h1 class="ptitle">Recall, not recognition</h1>'+
    '<p class="lede">'+deck.length+' cards drawn from every phase checkpoint. Answer out loud before you flip — the gap between "that looks familiar" and "I can state it" is the entire point.</p>';
  const c=deck[di];
  const card=el('div','flash');
  card.innerHTML='<div class="fsrc">'+c.src+'</div><div class="fq">'+c.q+'</div>'+
    '<div class="fa'+(revealed?'':' hide')+'">'+c.a+'</div>';
  v.appendChild(card);
  const btns=el('div','fbtns');
  const flip=el('button','btn prime',revealed?'Hide answer':'Reveal answer');
  flip.onclick=()=>{ revealed=!revealed; renderDrill(); };
  const next=el('button','btn','Next card →');
  next.onclick=()=>{ di=(di+1)%deck.length; revealed=false; renderDrill(); };
  const goto=el('button','btn','Go to phase');
  goto.onclick=()=>{ current=c.pid; setMode('learn'); buildRail(); scrollTo({top:0}); };
  const shuf=el('button','btn','Shuffle');
  shuf.onclick=()=>{ buildDeck(); renderDrill(); };
  btns.appendChild(flip); btns.appendChild(next); btns.appendChild(goto); btns.appendChild(shuf);
  btns.appendChild(el('span','counter',(di+1)+' / '+deck.length));
  v.appendChild(btns);
  v.appendChild(el('p','cap','Keyboard: <kbd>space</kbd> flip · <kbd>→</kbd> next'));
}

/* ---- audit view ---- */
function renderAudit(){
  const v=$('#view'); v.innerHTML='';
  v.innerHTML='<div class="eyebrow">Audit</div><h1 class="ptitle">The source map, checked</h1>'+
    '<p class="lede">'+AUDIT.intro+'</p>';
  AUDIT.groups.forEach(g=>{
    v.appendChild(sec(g.label,g.items.length));
    g.items.forEach(it=>{
      const d=el('div','verdict');
      d.innerHTML='<span class="vtag '+g.tag+'">'+g.tag+'</span><span><span class="claim">'+it.c+'</span><span class="fix">'+it.f+'</span></span>';
      v.appendChild(d);
    });
  });
  v.insertAdjacentHTML('beforeend','<hr class="hr"><p class="cap" style="margin-top:18px">Verified against code.claude.com/docs and the project’s synced docs mirror, August 2026. Claims I could not confirm are marked <span class="unv">unverified</span> rather than restated as fact.</p>');
}

/* ---- search ---- */
function buildIndex(){
  const ix=[];
  PHASES.forEach(p=>{
    ix.push({t:'Phase '+p.n+': '+p.title,k:'phase',body:p.objective+' '+p.concepts.map(c=>c.h).join(' '),go:()=>{current=p.id;setMode('learn');buildRail();}});
    p.concepts.forEach(c=>ix.push({t:c.h,k:'Phase '+p.n,body:(c.p||'')+(c.p2||'')+(c.code||'')+(c.code2||''),go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.gotchas.forEach(g=>ix.push({t:g.t,k:'gotcha · Phase '+p.n,body:g.d,go:()=>{current=p.id;setMode('learn');buildRail();}}));
    p.quiz.forEach(q=>ix.push({t:q.q,k:'checkpoint · Phase '+p.n,body:q.a,go:()=>{current=p.id;setMode('learn');buildRail();}}));
  });
  REF.forEach(r=>ix.push({t:r.title,k:'reference table',body:(r.note||'')+' '+r.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  TREES.forEach(t=>ix.push({t:t.title,k:'decision tree',body:t.rows.map(x=>x.join(' ')).join(' '),go:()=>setMode('ref')}));
  AUDIT.groups.forEach(g=>g.items.forEach(i=>ix.push({t:i.c.replace(/<[^>]+>/g,''),k:'audit · '+g.label,body:i.f,go:()=>setMode('audit')})));
  return ix;
}
let INDEX=[];
function renderSearch(term){
  const v=$('#view'); v.innerHTML='';
  const t=term.toLowerCase();
  const hits=INDEX.filter(x=>(x.t+' '+x.body).toLowerCase().replace(/<[^>]+>/g,'').includes(t)).slice(0,40);
  v.innerHTML='<div class="eyebrow">Search</div><h1 class="ptitle">'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(term)+'”</h1>';
  if(!hits.length){ v.appendChild(el('p','empty','Nothing matched. Try a config key, a command, or a frontmatter field.')); return; }
  const w=el('div','hits');
  hits.forEach(h=>{
    const a=el('a','hit'); a.href='#';
    a.innerHTML='<small>'+h.k+'</small><b>'+h.t+'</b>';
    a.addEventListener('click',e=>{ e.preventDefault(); $('#q').value=''; h.go(); scrollTo({top:0}); });
    w.appendChild(a);
  });
  v.appendChild(w);
}

/* ---- main render ---- */
function render(){
  const term=$('#q').value.trim();
  if(term.length>1){ renderSearch(term); return; }
  if(mode==='learn') renderPhase(PHASES.find(p=>p.id===current));
  else if(mode==='ref') renderRef();
  else if(mode==='drill') renderDrill();
  else renderAudit();
}

$('#q').addEventListener('input',render);
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
  if(e.key==='Escape'&&document.activeElement===$('#q')){ $('#q').value=''; $('#q').blur(); render(); }
  if(mode==='drill'&&document.activeElement!==$('#q')){
    if(e.key===' '){ e.preventDefault(); revealed=!revealed; renderDrill(); }
    if(e.key==='ArrowRight'){ di=(di+1)%deck.length; revealed=false; renderDrill(); }
  }
});

INDEX=buildIndex();
buildRail();
render();

</script>
